<!DOCTYPE html>
<html lang="en">
<head><meta name="robots" content="noai, noimageai, noarchive"><meta name="googlebot" content="noarchive">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bloons TD 6 Field Guide</title>
<meta name="description" content="Bloons TD 6 guide: every tower and upgrade with costs per difficulty, heroes, Paragons, bloons, the 140-round table, CHIMPS and Impoppable how-tos, Monkey Knowledge, bosses, Odyssey and Contested Territory.">
<meta name="theme-color" content="#0b1a33">
<meta property="og:title" content="Bloons TD 6 Field Guide">
<meta property="og:description" content="Every tower, upgrade, hero and round, with how-tos for CHIMPS, Impoppable, bosses and events. Built from the community wiki and record data.">
<meta property="og:image" content="card.jpg">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="assets/fonts/fredoka.css">
<style>
:root{
  --bg:#0b1a33;--bg2:#0e2246;--panel:#132a52;--panel2:#183463;--well:#0a1730;--line:rgba(150,200,255,.13);--line2:rgba(150,200,255,.25);
  --text:#f2f6ff;--muted:#b0c3e0;--dim:#8da2c4;
  --blue:#2f9bff;--blue2:#1a6fd4;--blue3:#0f4c99;--yellow:#ffd23f;--yellow2:#e6a700;--brown:#a8672f;--brown2:#6f4220;--red:#ec4a3f;--green:#5cc84a;--purple:#ab7cf0;--orange:#ff9d2e;
  --Primary:#3fa7ff;--Military:#5cc84a;--Magic:#b182f5;--Support:#ffb02e;
  --tS:#ec4a3f;--tA:#ff9d2e;--tB:#ffd23f;--tC:#5cc84a;--tD:#3fa7ff;
  --head:"Fredoka","Baloo 2","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --body:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --r:16px;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;min-height:100vh;color:var(--text);font:17px/1.6 var(--body);
  background:radial-gradient(1200px 600px at 90% -10%,rgba(47,155,255,.22),transparent 60%),radial-gradient(900px 600px at -10% 110%,rgba(168,103,47,.18),transparent 60%),
  radial-gradient(circle at 20px 20px,rgba(255,255,255,.035) 2px,transparent 3px) 0 0/44px 44px,var(--bg);background-attachment:fixed}
a{color:var(--yellow)}
button{font:inherit;color:inherit}
h1,h2,h3,h4{font-family:var(--head);font-weight:600;margin:0 0 .4em;line-height:1.15;letter-spacing:.01em}
h1,h2{color:#fff;text-shadow:0 2px 0 #071430,2px 0 0 #071430,-2px 0 0 #071430,0 -2px 0 #071430,0 5px 0 rgba(0,0,0,.35)}
h2{font-size:clamp(1.6rem,2.6vw,2.2rem)}
h3{font-size:1.22rem}
.shell{display:grid;grid-template-columns:290px minmax(0,1fr);min-height:100vh}
aside{position:sticky;top:0;height:100vh;overflow:auto;padding:16px 14px 40px;border-right:3px solid var(--brown2);
  background:linear-gradient(180deg,#0f2550,#0a1a38)}
.brand{display:flex;gap:10px;align-items:center;text-decoration:none;color:var(--text);padding:6px 6px 10px}
.brand .mk{width:44px;height:50px;flex:none;position:relative}
.brand .mk::before{content:"";position:absolute;left:4px;top:0;width:36px;height:42px;border-radius:50% 50% 48% 48%/55% 55% 45% 45%;background:radial-gradient(circle at 32% 28%,#ff9a8f 0 18%,#ec4a3f 19% 100%);box-shadow:inset -4px -5px 0 rgba(0,0,0,.18),0 3px 0 #7a1e18}
.brand .mk::after{content:"";position:absolute;left:18px;top:40px;border:4px solid transparent;border-top:7px solid #c93a30}
.brand b{display:block;font:600 1.45rem/1 var(--head);color:#fff;text-shadow:0 2px 0 #071430,2px 0 0 #071430,-2px 0 0 #071430,0 -2px 0 #071430}
.brand small{display:block;margin-top:4px;color:var(--yellow);font:600 .8rem var(--head);letter-spacing:.14em;text-transform:uppercase}
#checked{font-size:.82rem;color:var(--muted);margin:4px 4px 12px;line-height:1.45}
#checked a{color:var(--yellow)}
.search{position:relative}
.search input{width:100%;padding:11px 12px 11px 38px;border-radius:14px;border:2px solid var(--line2);background:#071430;color:var(--text);font:inherit;font-size:1rem;outline:none}
.search input:focus{border-color:var(--yellow);box-shadow:0 0 0 3px rgba(255,210,63,.2)}
.search svg{position:absolute;left:13px;top:14px;opacity:.7}
.results{position:absolute;left:0;right:0;top:50px;background:#102650;border:2px solid var(--line2);border-radius:14px;max-height:62vh;overflow:auto;z-index:40;display:none;box-shadow:0 18px 40px rgba(0,0,0,.5)}
.results.on{display:block}
.results div{padding:8px 12px;cursor:pointer;font-size:.95rem;display:flex;align-items:center;gap:9px}
.results div img{width:28px;height:28px;object-fit:contain;flex:none}
.results div i{margin-left:auto;font-style:normal;color:var(--dim);font-size:.8rem;text-align:right}
.results div:hover,.results div.sel{background:rgba(47,155,255,.18)}
.results .none{color:var(--muted);cursor:default}
.diff{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:12px 0 4px;background:#071430;border-radius:12px;padding:4px;border:2px solid var(--line)}
.diff button{border:0;background:transparent;border-radius:9px;padding:6px 2px;cursor:pointer;font:600 .82rem var(--head);color:var(--muted)}
.diff button.on{background:linear-gradient(#ffe27a,#ffc515);color:#3a2604;box-shadow:0 2px 0 #b98400}
.difflab{font-size:.78rem;color:var(--dim);margin:8px 4px 0}
nav{margin-top:10px;display:flex;flex-direction:column;gap:2px}
nav .grp{font:600 .78rem var(--head);letter-spacing:.14em;color:#ffe9b0;margin:14px 0 5px;text-transform:uppercase;padding:4px 10px;border-radius:8px;
  background:linear-gradient(180deg,#9b5f2b,#6f4220);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 2px 0 #4a2a12}
nav a{display:flex;gap:10px;align-items:center;padding:7px 10px;border-radius:10px;color:var(--text);text-decoration:none;font-size:.97rem}
nav a:hover{background:rgba(47,155,255,.14)}
nav a.on{background:linear-gradient(90deg,rgba(47,155,255,.35),rgba(47,155,255,.08));box-shadow:inset 4px 0 0 var(--yellow)}
nav a .n{margin-left:auto;font-size:.78rem;color:var(--dim)}
main{min-width:0;padding:24px clamp(14px,2.6vw,40px) 90px}
.topbar{display:none}
.card,.tile,.glass{background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,0)),var(--panel);border:2px solid var(--line2);border-radius:var(--r);box-shadow:0 4px 0 #06122a}
.card{padding:16px 18px;min-width:0}
.card p{margin:.35em 0}
.hero{position:relative;overflow:hidden;border-radius:22px;padding:clamp(20px,4vw,44px);margin-bottom:22px;isolation:isolate;min-height:300px;display:flex;flex-direction:column;justify-content:flex-end;border:3px solid #071430;box-shadow:0 6px 0 #06122a}
.hero .art{position:absolute;inset:0;z-index:-2;background:url("card.jpg") center 30%/cover no-repeat}
.hero::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(0deg,rgba(8,20,45,.97) 10%,rgba(8,20,45,.6) 55%,rgba(8,20,45,.15)),linear-gradient(90deg,rgba(8,20,45,.85),transparent 75%)}
.hero .k{display:inline-block;align-self:flex-start;font:600 .85rem var(--head);letter-spacing:.12em;text-transform:uppercase;color:#3a2604;background:linear-gradient(#ffe27a,#ffc515);padding:4px 12px;border-radius:999px;box-shadow:0 2px 0 #b98400}
.hero h1{font-size:clamp(2.6rem,7vw,4.8rem);margin:.15em 0 .1em}
.hero p{max-width:900px;color:#e2ecff;font-size:1.08rem;margin:0}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:14px;text-decoration:none;font:600 1rem var(--head);color:#fff;background:linear-gradient(#55b6ff,#1f80e6);border:0;border-bottom:4px solid #0f4c99;cursor:pointer;text-shadow:0 1px 0 rgba(0,0,0,.35)}
.btn.y{background:linear-gradient(#ffe27a,#ffc515);color:#3a2604;border-bottom-color:#b98400;text-shadow:none}
.btn.g{background:linear-gradient(#7fdc6c,#3fa52f);border-bottom-color:#2a6e1f}
.btn:active{transform:translateY(2px);border-bottom-width:2px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr))}
.grid.wide{grid-template-columns:repeat(auto-fill,minmax(min(100%,360px),1fr))}
.grid.three{grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.grid.two{grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr))}
.sec{margin:30px 0 12px}
.sec p{margin:.25em 0 0;color:var(--muted)}
.muted{color:var(--muted)}.small{font-size:.9rem}.tiny{font-size:.82rem}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 10px;border-radius:999px;font-size:.82rem;border:2px solid var(--line2);background:#0a1a38;color:#dfe9ff;white-space:nowrap}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.pill.y{background:linear-gradient(#ffe27a,#ffc515);color:#3a2604;border-color:#e6a700;font-weight:700}
.pill.adv{border-color:rgba(255,157,46,.6);color:#ffc98a}
.pill.meta{border-color:rgba(236,74,63,.7);color:#ffb2ab}
.pill.ok{border-color:rgba(92,200,74,.7);color:#b9f0ad}
.pill.soon{border-color:rgba(80,170,255,.8);color:#bfe0ff}
.cat{--c:var(--blue)}
.cat-Primary{--c:var(--Primary)}.cat-Military{--c:var(--Military)}.cat-Magic{--c:var(--Magic)}.cat-Support{--c:var(--Support)}
.pill.catp{border-color:var(--c);color:var(--c)}
.note{border-left:5px solid var(--yellow);background:rgba(255,210,63,.08);padding:11px 15px;border-radius:0 14px 14px 0;color:#e8efff;margin:12px 0}
.note.blue{border-left-color:var(--blue);background:rgba(47,155,255,.08)}
.note.warn{border-left-color:var(--red);background:rgba(236,74,63,.09)}
.tier{display:inline-grid;place-items:center;min-width:30px;height:30px;border-radius:10px;font:700 1rem var(--head);color:#14110c;flex:none;padding:0 6px;box-shadow:0 2px 0 rgba(0,0,0,.35)}
.tS{background:var(--tS)}.tA{background:var(--tA)}.tB{background:var(--tB)}.tC{background:var(--tC)}.tD{background:var(--tD)}
/* tiles */
.tgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.tile{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 8px 10px;cursor:pointer;text-align:center;line-height:1.25;text-decoration:none;color:var(--text);border-top:5px solid var(--c,var(--line2));transition:transform .12s,border-color .12s}
.tile:hover{transform:translateY(-2px);border-color:var(--c,var(--yellow))}
.tile img{width:84px;height:84px;object-fit:contain;filter:drop-shadow(0 4px 6px rgba(0,0,0,.5))}
.tile b{font:600 1.02rem var(--head)}
.tile .sub{color:var(--muted);font-size:.84rem}
.tile .cost{color:var(--yellow);font-weight:700;font-size:.92rem}
.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0 14px}
.tabs button{padding:7px 15px;border-radius:12px;border:0;border-bottom:3px solid #071430;background:#17305d;cursor:pointer;font:600 .95rem var(--head);color:#dfe9ff}
.tabs button.on{background:linear-gradient(#55b6ff,#1f80e6);border-bottom-color:#0f4c99;color:#fff}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:6px 0 14px}
.filters input{background:#071430;color:var(--text);border:2px solid var(--line2);border-radius:12px;padding:9px 12px;font:inherit;font-size:1rem;min-width:min(100%,260px)}
.tablewrap{overflow-x:auto;border:2px solid var(--line2);border-radius:var(--r);background:rgba(10,23,48,.75)}
table{width:100%;border-collapse:collapse;font-size:.93rem}
th,td{padding:8px 11px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{background:#17305d;font:600 .85rem var(--head);letter-spacing:.04em;color:var(--yellow);white-space:nowrap;position:sticky;top:0}
td.l{cursor:pointer;color:var(--yellow)}
tr:hover td{background:rgba(47,155,255,.06)}
tr.mark td{background:rgba(255,210,63,.07)}
tr.endm td{border-bottom:3px solid var(--yellow)}
.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.chip{display:inline-flex;align-items:center;gap:7px;padding:4px 10px 4px 4px;border-radius:12px;background:#0a1a38;border:2px solid var(--line);cursor:pointer;font-size:.9rem;text-decoration:none;color:var(--text);margin:2px 4px 2px 0;max-width:100%}
.chip:hover{border-color:var(--yellow)}
.chip img{width:34px;height:34px;object-fit:contain;flex:none}
.chip i{font-style:normal;font-size:.8rem;color:var(--muted)}
.chip span{min-width:0;overflow-wrap:anywhere}
.bl{display:inline-flex;align-items:center;gap:4px;padding:1px 8px 1px 3px;border-radius:999px;background:#0a1a38;border:1px solid var(--line);font-size:.85rem;margin:2px 3px 2px 0;white-space:nowrap}
.bl img{width:20px;height:22px;object-fit:contain}
/* tower page */
.thead{display:grid;grid-template-columns:180px 1fr;gap:22px;align-items:start}
.thead .big{width:100%;aspect-ratio:1;object-fit:contain;background:radial-gradient(circle at 50% 40%,rgba(47,155,255,.35),rgba(10,23,48,.2) 70%);border-radius:24px;border:3px solid #071430;box-shadow:0 5px 0 #06122a;padding:10px}
.statrow{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0}
.stat{padding:9px 14px;min-width:104px;background:#0a1a38;border:2px solid var(--line2);border-radius:14px}
.stat b{display:block;font:600 1.35rem var(--head);color:var(--yellow)}
.stat span{font-size:.8rem;color:var(--muted)}
.path{padding:12px}
.path h3{display:flex;align-items:center;gap:8px}
.path h3 .pn{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--c);color:#071430;font-size:1rem;box-shadow:0 2px 0 rgba(0,0,0,.4)}
.up{display:grid;grid-template-columns:56px 1fr;gap:10px;padding:9px 6px;border-top:1px solid var(--line)}
.up:first-of-type{border-top:0}
.up img{width:56px;height:56px;object-fit:contain;background:#0a1a38;border-radius:12px;border:2px solid var(--line2)}
.up b{font:600 1.03rem var(--head)}
.up .t{display:inline-block;font:600 .74rem var(--head);color:#071430;background:var(--c);border-radius:6px;padding:0 6px;margin-right:6px;vertical-align:2px}
.up .c{color:var(--yellow);font-weight:700;white-space:nowrap}
.up .d{font-size:.92rem;color:#d7e3fa;margin:3px 0}
.up details{font-size:.85rem;color:var(--muted)}
.up summary{cursor:pointer;color:var(--blue);list-style:none}
.up summary::-webkit-details-marker{display:none}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:3px 14px;font-size:.9rem;margin:8px 0}
.kv dt{color:var(--muted)}.kv dd{margin:0}
/* steps */
.steps{counter-reset:s;list-style:none;padding:0;margin:12px 0;display:flex;flex-direction:column;gap:9px}
.steps li{position:relative;padding:12px 16px 12px 62px}
.steps li::before{counter-increment:s;content:counter(s);position:absolute;left:14px;top:10px;width:32px;height:37px;border-radius:50% 50% 47% 47%/55% 55% 45% 45%;
  background:radial-gradient(circle at 32% 28%,#ff9a8f 0 16%,#ec4a3f 17% 100%);color:#fff;display:grid;place-items:center;font:700 1rem var(--head);text-shadow:0 1px 0 #7a1e18;box-shadow:inset -3px -4px 0 rgba(0,0,0,.18),0 2px 0 #7a1e18}
.steps li::after{content:"";position:absolute;left:27px;top:46px;border:3px solid transparent;border-top:5px solid #c93a30}
.steps .st{display:block}
.src{font-size:.82rem;color:var(--dim);margin-top:5px;display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.src a{color:var(--dim)}
.srcbtn{background:none;border:1px solid var(--line2);border-radius:8px;color:var(--muted);font-size:.78rem;padding:1px 8px;cursor:pointer}
.srcbox{display:none;font-size:.85rem;color:var(--muted);margin-top:6px;background:#0a1a38;border-radius:10px;padding:8px 10px}
.srcbox.on{display:block}
.srcbox .quote{display:block;margin-top:5px;color:#d7e3fa;font-style:italic}
/* modal */
.modal{position:fixed;inset:0;background:rgba(3,9,22,.72);display:none;align-items:center;justify-content:center;z-index:60;padding:14px}
.modal.on{display:flex}
.modal .box{background:linear-gradient(180deg,#19366a,#10264d);border:3px solid #071430;border-radius:22px;max-width:680px;width:100%;max-height:90vh;overflow:auto;padding:22px;position:relative;box-shadow:0 8px 0 #06122a,0 30px 70px rgba(0,0,0,.6)}
.modal .box.wide{max-width:980px}
.modal .x{position:absolute;right:10px;top:8px;width:38px;height:38px;border-radius:50%;border:0;background:linear-gradient(#ff7d72,#d63a30);color:#fff;font:700 1.3rem var(--head);cursor:pointer;box-shadow:0 3px 0 #7a1e18}
.ic-head{display:flex;gap:14px;align-items:center;margin-bottom:8px;padding-right:40px}
.ic-head img{width:96px;height:96px;object-fit:contain;flex:none;background:#0a1a38;border-radius:18px;padding:6px;border:2px solid var(--line2)}
.isec{border-top:1px solid var(--line);padding-top:10px;margin-top:10px}
.isec h4{font:600 .82rem var(--head);letter-spacing:.12em;text-transform:uppercase;color:var(--yellow);margin:0 0 4px}
.lk{color:var(--yellow);cursor:pointer;text-decoration:underline;text-decoration-color:rgba(255,210,63,.45)}
.vid{display:flex;gap:12px;align-items:center;padding:12px;cursor:pointer;color:var(--text)}
.vid .play{flex:none;width:58px;height:58px;border-radius:18px;display:grid;place-items:center;background:linear-gradient(#ff7d72,#d63a30);box-shadow:0 3px 0 #7a1e18}
.vid b{display:block;font-size:.97rem;line-height:1.3}
.trow{display:grid;grid-template-columns:76px 1fr;border-radius:var(--r);overflow:clip;margin-bottom:10px;border:2px solid var(--line2);background:var(--panel);box-shadow:0 4px 0 #06122a}
.trow .lab{font:700 2.4rem var(--head);color:#14110c;text-align:center;padding:10px 4px}
.trow .labin{position:sticky;top:12px;display:flex;flex-direction:column;align-items:center;gap:2px}
.trow .lab small{font:700 .86rem/1.2 var(--body)}
.trow .its{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:6px;padding:10px;align-content:start}
.trow .its .chip{margin:0}
.live{border-top:5px solid var(--green)}
.live.ended{border-top-color:var(--dim);opacity:.62}
.chg{display:grid;gap:8px;align-items:start;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));margin-top:8px}
.chg details{background:#0a1a38;border:2px solid var(--line);border-radius:12px;padding:6px 10px}
.chg summary{cursor:pointer;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chg summary img{width:34px;height:34px;object-fit:contain}
.chg ul{margin:4px 0 6px;padding-left:20px;font-size:.88rem}
.chg .at{font-size:.82rem;color:var(--yellow);margin-top:6px}
.pill.buff{border-color:rgba(92,200,74,.7);color:#b9f0ad}.pill.nerf{border-color:rgba(236,74,63,.7);color:#ffb2ab}
.pairline{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;padding:6px 0;border-top:1px solid var(--line)}
.pairline .plus{font:700 1.1rem var(--head);color:var(--yellow)}
footer{margin-top:44px;color:var(--dim);font-size:.85rem;border-top:2px dashed var(--line2);padding-top:14px}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
::selection{background:var(--yellow);color:#3a2604}
*{scrollbar-color:rgba(255,210,63,.45) transparent}
@media (max-width:980px){
  .shell{grid-template-columns:1fr}
  aside{position:fixed;inset:0 auto 0 0;width:min(320px,88vw);z-index:50;transform:translateX(-104%);transition:transform .2s}
  aside.open{transform:none;box-shadow:20px 0 50px rgba(0,0,0,.5)}
  .topbar{display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:30;padding:9px 14px;background:rgba(11,26,51,.95);border-bottom:3px solid var(--brown2)}
  .topbar button{background:linear-gradient(#55b6ff,#1f80e6);border:0;border-bottom:3px solid #0f4c99;border-radius:12px;padding:6px 12px;cursor:pointer;font:600 .95rem var(--head);color:#fff}
  .topbar b{font:600 1.1rem var(--head)}
  main{padding:14px 12px 80px}
  .thead{grid-template-columns:1fr}
  .thead .big{max-width:150px}
  .tgrid{grid-template-columns:repeat(auto-fill,minmax(112px,1fr))}
  .tile img{width:64px;height:64px}
  .tgrid.maps{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:8px}
  .tgrid.maps .tile{padding:6px 6px 8px}.tgrid.maps .tile b{font-size:.92rem}
  table{font-size:.86rem}
  th,td{padding:7px 8px}

<script src="data/btd6.js?v=2026-11-19-457819"></script>
<script>
(function(){
'use strict';
const D=window.BTD||{towers:[],paragons:[],heroes:[],bloons:[],bosses:[],rounds:[],maps:[],mk:[],powers:[],howto:{sections:[],tables:[]},meta:{counts:{}},pairs:[],pairs_by_diff:{},diffplan:[],index:{},live:{},videos:{},dmg:{cols:[],rows:[]},sources:[]};
// large parts one page needs (hero levels, per-upgrade stats, the tier list) load from their own file when that page opens
const PARTS=Object.create(null),LOADING=Object.create(null);
function mergePart(n,p){if(n==='levels')D.heroes.forEach(h=>{h.levels=p[h.slug]||[];});else if(n==='stats')D.towers.forEach(t=>{const st=p[t.slug]||[];t.paths.forEach((r,i)=>r.forEach((u,j)=>{if(u)u.stats=(st[i]||[])[j]||null;}));});else if(n==='solo')D.solo=p;else if(n==='changes')D.changes=p;PARTS[n]=true;}
function need(n){if(PARTS[n])return true;const got=(window.BTD_PART||{})[n];if(got){mergePart(n,got);return true;}
 if(!LOADING[n]){LOADING[n]=true;const sc=document.createElement('script');sc.src='data/btd6-'+n+'.js?v=2026-11-19-457819';sc.onload=()=>{const g=(window.BTD_PART||{})[n];if(g){mergePart(n,g);render(false);}};sc.onerror=()=>{main.insertAdjacentHTML('afterbegin','<p class="note warn">Could not load data/btd6-'+esc(n)+'.js.</p>');};document.head.appendChild(sc);}
 return false;}
const LOADMSG='<p class="muted">Loading...</p>';
const $=s=>document.querySelector(s), main=$('#main');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const n0=x=>x==null?'-':Number(x).toLocaleString('en-US',{maximumFractionDigits:1});
const money=x=>x==null?'-':'$'+n0(x);
const pct=x=>x==null?'-':Math.round(x*100)+'%';
const M=D.meta||{};
const dict=pairs=>Object.assign(Object.create(null),Object.fromEntries(pairs));
const TB=dict(D.towers.map(t=>[t.slug,t])), HB=dict(D.heroes.map(h=>[h.slug,h])), PB=dict(D.paragons.map(p=>[p.slug,p]));
const BB=dict(D.bloons.map(b=>[b.slug,b])), BOSS=dict(D.bosses.map(b=>[b.slug,b])), MAPB=dict(D.maps.map(m=>[m.slug,m]));
const MKB=dict(D.mk.map(k=>[k.slug,k])), POW=dict(D.powers.map(p=>[p.slug,p]));
const UP=Object.create(null); D.towers.forEach(t=>t.paths.forEach(r=>r.forEach(u=>{if(u)UP[u.name]={t,u};})));
const NAMES=Object.create(null);
D.towers.forEach(t=>NAMES[t.name]={go:'tower/'+t.slug});
Object.keys(UP).forEach(n=>NAMES[n]={go:'tower/'+UP[n].t.slug,hl:n});
D.paragons.forEach(p=>NAMES[p.name]={par:p.slug});
D.heroes.forEach(h=>NAMES[h.name]={go:'hero/'+h.slug});
D.bloons.forEach(b=>NAMES[b.name]={bloon:b.slug});
D.bosses.forEach(b=>NAMES[b.name]={boss:b.slug});
D.maps.forEach(m=>{if(!NAMES[m.name])NAMES[m.name]={map:m.slug};});
D.mk.forEach(k=>{if(!NAMES[k.name])NAMES[k.name]={mk:k.slug};});
D.powers.forEach(p=>{if(!NAMES[p.name])NAMES[p.name]={power:p.slug};});
const DIFFS=['Easy','Medium','Hard','Impoppable'];
let DI=1; try{const s=localStorage.getItem('btd6.diff');if(s!==null&&+s>=0&&+s<4)DI=+s;}catch(e){}
const cost=a=>a?money(a[DI]):'-';
const IMG_ERR="this.style.visibility='hidden'";
const img=(src,alt,cls)=>src?`<img class="${cls||''}" src="${esc(src)}" alt="${esc(alt||'')}" loading="lazy" onerror="${IMG_ERR}">`:'';
const tierB=t=>t?`<span class="tier t${t}">${t}</span>`:'';
const howtos=(D.howto&&D.howto.sections)||[];
const HT=dict(howtos.map(s=>[s.id,s]));

// links to a card from any name
function refAttrs(r){if(!r)return '';if(r.go)return `href="#${esc(r.go)}"`+(r.hl?` data-hl="${esc(r.hl)}"`:'');const k=['par','bloon','boss','map','mk','power'].find(k=>r[k]);return k?`href="#" data-${k}="${esc(r[k])}"`:'';}
function nameLink(n,label){const r=NAMES[n];return r?`<a class="lk" ${refAttrs(r)}>${esc(label||n)}</a>`:esc(label||n);}
function prose(t){return esc(t).replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g,(m,n,l)=>nameLink(n.replace(/&#39;/g,"'"),l));}
function entImg(ref){if(!ref)return '';if(ref.kind==='hero')return (HB[ref.slug]||{}).img;if(ref.kind==='paragon')return (PB[ref.paragon]||{}).img||(TB[ref.tower]||{}).img;if(ref.kind==='base')return (TB[ref.tower]||{}).img;const u=UP[ref.name];return u?u.u.img:'';}
function entHref(ref){if(!ref)return '';if(ref.kind==='hero')return `href="#hero/${esc(ref.slug)}"`;if(ref.kind==='paragon')return `href="#" data-par="${esc(ref.paragon||'')}"`;return `href="#tower/${esc(ref.tower)}"`+(ref.kind==='upgrade'?` data-hl="${esc(ref.name)}"`:'');}
// record names come in BTD6 Index spelling ("Moab Domination"); a matched card shows the game's own name
function entChip(label,ref,sub){if(ref&&ref.name)label=ref.name;return ref?`<a class="chip" ${entHref(ref)}>${img(entImg(ref),'')}<span>${esc(label)}${sub?`<br><i>${sub}</i>`:''}</span></a>`:`<span class="chip">${esc(label)}${sub?` <i>${sub}</i>`:''}</span>`;}

// header line
const V=M.version;
$('#checked').innerHTML=`Game version <b>${esc(V)}</b> (${esc(M.version_date)}). Last checked against <a href="https://www.bloonswiki.com/" target="_blank" rel="noopener">Blooncyclopedia</a>, <a href="https://data.ninjakiwi.com/" target="_blank" rel="noopener">Ninja Kiwi Open Data</a> and <a href="https://btd6index.win/" target="_blank" rel="noopener">BTD6 Index</a> on ${esc(M.pulled)}.`;
function diffHtml(){return DIFFS.map((d,i)=>`<button data-di="${i}" class="${i===DI?'on':''}" aria-pressed="${i===DI}">${d==='Impoppable'?'Impop.':d}</button>`).join('');}
$('#diff').innerHTML=diffHtml();

// navigation
const C=M.counts||{};
const NAV=[
 ['Start',[['home','Home'],['start','Start here / come back'],['live','Events at build time']]],
 ['How to play well',howtos.filter(s=>s.id!=='comeback').map(s=>[s.id,s.title.replace(/^How to /,'').replace(/^./,c=>c.toUpperCase())])],
 ['Reference',[['towers','Towers & upgrades',C.towers],['paragons','Paragons',C.paragons],['heroes','Heroes',C.heroes],['bloons','Bloons',C.bloons],['bosses','Boss Bloons',C.bosses],['rounds','Rounds 1-140',C.rounds],['maps','Maps',C.maps],['mk','Monkey Knowledge',C.mk],['powers','Powers',C.powers],['modes','Modes & difficulties']]],
 ['Builds & ratings',[['tiers','Tier list (records)'],['builds','Builds & crosspaths']]],
 ['More',[['videos','Videos'],['sources','Sources & method']]],
];
function navHtml(cur){return NAV.map(([g,l])=>`<div class="grp">${g}</div>`+l.map(([id,t,n])=>`<a href="#${id}" class="${cur===id?'on':''}">${esc(t)}${n?`<span class="n">${n}</span>`:''}</a>`).join('')).join('');}

const R=Object.create(null);
// ---------- home
R.home=()=>{const L=D.live||{};
 return `<section class="hero"><div class="art"></div><span class="k">Version ${esc(V)} · checked ${esc(M.pulled)}</span><h1>Bloons TD 6</h1>
 <p>Every tower and all ${C.upgrades} upgrades with prices on your difficulty, ${C.heroes} heroes, ${C.paragons} Paragons, the 140-round threat table, and step-by-step how-tos for CHIMPS, Impoppable, Monkey Knowledge, bosses, Odyssey and Contested Territory. Updated ${esc(M.pulled)}.</p>
 <div class="btns"><a class="btn y" href="#start">Start here</a><a class="btn" href="#towers">Towers</a><a class="btn" href="#rounds">Rounds</a><a class="btn g" href="#chimps">Beat CHIMPS</a></div></section>
 <div class="filters"><input id="homeq" type="search" placeholder="Search: tower, hero, round 63..." aria-label="Search the guide" style="flex:1"></div>
 <div class="grid">${[['start','Start here / come back after a break','What changed, then a path through the guide.'],['early','Rounds 1 to 40','Camo by 24, lead by 28, the MOAB on 40.'],['chimps','Beat CHIMPS','The rules, the plan and the rounds that end runs.'],['towers','Towers & upgrades',`${C.towers} towers, ${C.upgrades} upgrades, costs and stats.`],['rounds','Rounds table','RBE, cash and new threats for rounds 1 to 140.'],['tiers','Tier list (records)','Which single towers have carried CHIMPS on the most maps.'],['builds','Builds & crosspaths','2-tower CHIMPS pairs by map difficulty.'],['mk','Monkey Knowledge',`All ${C.mk} nodes by tree.`],['live','Events at build time',`Boss, Odyssey, race and CT running or announced on ${M.pulled}.`]].map(([r,t,s])=>`<a class="card" href="#${r}" style="text-decoration:none;color:inherit"><h3>${esc(t)}</h3><p class="muted small">${esc(s)}</p><span class="lk small">Open</span></a>`).join('')}</div>
 ${liveStrip()}`;};
function liveStrip(head=true){const L=D.live||{};const it=[];
 const cls=e=>e.ended?'card live ended':e.upcoming?'card live upcoming':'card live',endp=e=>e.ended?'<span class="pill meta">Ended</span> ':e.upcoming?'<span class="pill soon">Upcoming</span> ':'';
 if(L.boss)it.push(`<div class="${cls(L.boss)}"><h3>Boss: ${esc(L.boss.name)}</h3><p class="small muted">${endp(L.boss)}${esc(L.boss.start)} to ${esc(L.boss.end)} · ${esc(L.boss.scoring||'')}</p>${BOSS[L.boss.type]?`<a class="lk small" href="#" data-boss="${esc(L.boss.type)}">Boss card</a>`:''}</div>`);
 if(L.odyssey)it.push(`<div class="${cls(L.odyssey)}"><h3>Odyssey: ${esc(L.odyssey.name)}</h3><p class="small muted">${endp(L.odyssey)}${esc(L.odyssey.start)} to ${esc(L.odyssey.end)}</p><a class="lk small" href="#live">Crew limits</a></div>`);
 if(L.race)it.push(`<div class="${cls(L.race)}"><h3>Race: ${esc(L.race.name)}</h3><p class="small muted">${endp(L.race)}${esc(L.race.start)} to ${esc(L.race.end)}</p></div>`);
 if(L.ct)it.push(`<div class="${cls(L.ct)}"><h3>Contested Territory</h3><p class="small muted">${endp(L.ct)}${esc(L.ct.start)} to ${esc(L.ct.end)}</p><a class="lk small" href="#ct">How to play it</a></div>`);
 return it.length?(head?`<div class="sec"><h2>Events at build time (${esc(M.pulled)})</h2><p>From Ninja Kiwi Open Data: the events running or announced when the data was pulled. Upcoming ones had not started yet. Events change weekly, so these may have ended; rebuild the guide to refresh.</p></div>`:'')+`<div class="grid">${it.join('')}</div>`:'';}

// ---------- start here
function changesBlock(){if(!need('changes'))return LOADMSG;const V_=(D.changes||[]).slice().reverse();if(!V_.length)return '';
 const majors=[...new Set(V_.map(c=>c.v.split('.')[0]))];
 const it=x=>`<li><span class="pill ${x.k||''}">${x.k==='buff'?'Buff':x.k==='nerf'?'Nerf':'Change'}</span> ${esc(x.t)}${x.sub&&x.sub.length?`<ul>${x.sub.map(it).join('')}</ul>`:''}</li>`;
 const ent=e=>{const pic=e.kind==='tower'?(TB[e.slug]||{}).img:(HB[e.slug]||{}).img;const href=e.kind==='tower'?'#tower/'+e.slug:'#hero/'+e.slug;
  return `<details><summary>${img(pic,'')}<b>${esc(e.name)}</b>${e.buffs?`<span class="pill buff">${e.buffs} buff${e.buffs>1?'s':''}</span>`:''}${e.nerfs?`<span class="pill nerf">${e.nerfs} nerf${e.nerfs>1?'s':''}</span>`:''}${e.other?`<span class="pill">${e.other} other change${e.other>1?'s':''}</span>`:''}</summary>${e.rows.map(r=>`<div class="at">${esc(r.at)}</div><ul>${r.items.map(it).join('')}</ul>`).join('')}<p class="tiny"><a class="lk" href="${esc(href)}">${esc(e.name)} card</a></p></details>`;};
 const none=V_.filter(c=>!c.entries.length).map(c=>c.v);
 return `<div class="sec"><h2>Tower and hero changes in versions ${majors[majors.length-1]} to ${majors[0]}</h2><p>Every tower and hero change listed on the wiki's patch-note pages, marked buff or nerf as the wiki marks it. Tap a name for the exact numbers. Paragon, power, map and mode changes are on the linked pages.</p></div>
 ${V_.filter(c=>c.entries.length).map(c=>`<div class="card" style="margin-bottom:10px"><h3>Version ${esc(c.v)}${c.date?` <span class="tiny muted">released ${esc(c.date)}</span>`:''}</h3><p class="tiny muted" style="margin:0">${c.entries.length} towers and heroes changed · <a href="${esc(c.url)}" target="_blank" rel="noopener">wiki patch notes</a> (page edited ${esc(c.edited)})</p><div class="chg">${c.entries.map(ent).join('')}</div></div>`).join('')}
 ${none.length?`<p class="small muted">No tower or hero changes listed on the wiki for ${none.map(esc).join(', ')}.</p>`:''}`;}
R.start=()=>{const s=HT.comeback;const ups=M.updates||[];
 return `<div class="sec"><span class="pill y">Start here</span><h2 style="margin-top:8px">Coming back after a break</h2><p>Read the update list, then follow the steps, then the path below.</p></div>
 <div class="grid two"><div class="card"><h3>Recent updates</h3><div class="tablewrap"><table><thead><tr><th>Version</th><th>Released (Steam)</th></tr></thead><tbody>${ups.map(u=>`<tr><td>${esc(u.v)}</td><td>${esc(u.date)}</td></tr>`).join('')}</tbody></table></div><p class="tiny muted">From the update table on Blooncyclopedia. The tower and hero changes are listed below; full patch notes: <a href="https://www.bloonswiki.com/Update_history:Bloons_TD_6" target="_blank" rel="noopener">update history</a>.</p></div>
 <div class="card"><h3>Your path through this guide</h3><ol class="small">${[['early','Rounds 1 to 40'],['late','Set up for the late game'],['farming','Make extra cash in a game'],['mkhow','Spend Monkey Knowledge'],['hard','Clear a map up to the black border'],['impoppable','Beat Impoppable'],['chimps','Beat CHIMPS'],['boss','Beat a Boss event'],['odyssey','Play an Odyssey'],['ct','Play Contested Territory']].map(([r,t])=>`<li><a class="lk" href="#${r}">${t}</a></li>`).join('')}</ol>
 <p class="small muted">Look things up in <a class="lk" href="#towers">Towers</a>, <a class="lk" href="#rounds">Rounds</a> and <a class="lk" href="#bloons">Bloons</a> as you go.</p></div></div>
 ${addedSince()}
 ${changesBlock()}
 ${s?howtoBody(s):''}`;};
function addedSince(){const maj=v=>parseInt(String(v||'').split('.')[0],10);const top=maj(V);if(!top)return '';
 const items=[];
 D.towers.forEach(t=>items.push({v:t.since,k:'Tower',h:`<a class="chip" href="#tower/${esc(t.slug)}">${img(t.img,'')}<span>${esc(t.name)}<br><i>Tower</i></span></a>`}));
 D.paragons.forEach(p=>items.push({v:p.since,k:'Paragon',h:`<a class="chip" href="#" data-par="${esc(p.slug)}">${img(p.img,'')}<span>${esc(p.name)}<br><i>Paragon</i></span></a>`}));
 D.maps.forEach(m=>items.push({v:m.since,k:'Map',h:`<a class="chip" href="#" data-map="${esc(m.slug)}">${img(m.img,'')}<span>${esc(m.name)}<br><i>${esc(m.diff)} map</i></span></a>`}));
 D.bosses.forEach(b=>items.push({v:b.since,k:'Boss',h:`<a class="chip" href="#bosses">${img(b.img,'')}<span>${esc(b.name)}<br><i>Boss</i></span></a>`}));
 D.powers.forEach(p=>items.push({v:p.since,k:'Power',h:`<a class="chip" href="#powers">${img(p.img,'')}<span>${esc(p.name)}<br><i>Power</i></span></a>`}));
 D.mk.forEach(k=>items.push({v:k.since,k:'MK',h:`<a class="chip" href="#" data-mk="${esc(k.slug)}">${img(k.img,'')}<span>${esc(k.name)}<br><i>Monkey Knowledge</i></span></a>`}));
 const rows=[];for(let v=top;v>top-6;v--){const L=items.filter(i=>maj(i.v)===v);if(L.length)rows.push(`<div class="card" style="margin-bottom:10px"><h3>Version ${v}</h3><div>${L.map(i=>i.h).join('')}</div></div>`);}
 return rows.length?`<div class="sec"><h2>What was added in the last updates</h2><p>Everything in this guide's data that the wiki marks as introduced in versions ${top-5} to ${top}. Tower and hero balance changes are listed in the next section.</p></div>${rows.join('')}`:'';}

// ---------- how-to pages
function srcLine(st,i){const srcs=st.src||[];
 const tags=(st.advice?'<span class="pill adv" title="A community strategy tip, not a rule of the game">Community tip</span>':'')+(st.meta==='no recent source'?'<span class="pill meta" title="A which-tower-to-use claim without two recent agreeing sources">No recent source</span>':st.meta==='dated'?'<span class="pill ok">2 dated sources</span>':'');
 return `<div class="src">${tags}<button class="srcbtn" data-src="${i}" aria-expanded="false">Source</button></div><div class="srcbox" id="src${i}">${srcs.map(s=>`<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title)}</a> (Blooncyclopedia${s.edited?', page edited '+esc(s.edited):''})`).join('<br>')}${(st.quote||[]).length?`<span class="quote">The page says: ${st.quote.map(q=>'"'+esc(q)+'"').join(' ... ')}</span>`:''}${st.evidence&&st.evidence.pairs&&st.evidence.pairs.length?'<br>BTD6 Index 2 Towers CHIMPS: '+st.evidence.pairs.map(p=>`${esc(p.a)} + ${esc(p.b)} on ${p.maps} maps (newest ${esc(p.latest)})`).join('; '):''}</div>`;}
let SRCN=0;
// every ranked row counted from record runs carries this label: 2+ completions in the last 60 days, or "No recent source"
function recPill(p){return p.label==='2 recent records'?'<span class="pill ok" title="2 or more BTD6 Index completions in the last 60 days">2 recent records</span>':'<span class="pill meta" title="Fewer than 2 completions in the last 60 days: record history, not the current meta">No recent source</span>';}
function pairChip(p){return `<div class="pairline">${entChip((p.ra&&p.ra.name)||p.a,p.ra,esc(p.xa))}<span class="plus">+</span>${entChip((p.rb&&p.rb.name)||p.b,p.rb,esc(p.xb))}<span class="tiny muted">${p.n} win${p.n===1?'':'s'}${p.maps&&p.maps.length?' on '+p.maps.map(esc).join(', '):''} · newest ${esc(p.latest)}</span>${recPill(p)}</div>`;}
function diffPlan(note){const P=D.diffplan||[];if(!P.length)return '';const cut=M.meta_cut;
 return `<div class="sec"><h2>By map difficulty</h2>${note?`<p>${prose(note)}</p>`:''}<p class="small">Map facts: Blooncyclopedia map table and BTD6 Index map notes. Wins: BTD6 Index 2 Towers CHIMPS (two towers, a hero counts as one) and Least Cost CHIMPS, pulled ${esc(M.pulled)}. "Recent" = since ${esc(cut)}.</p></div>
 <div class="grid two">${P.map(d=>`<div class="card dplan"><h3><span class="pill y">${esc(d.diff)}</span> ${d.maps} maps</h3>
 <dl class="kv"><dt>Shortest path</dt><dd>median ${n0(d.short_median)}, shortest ${n0(d.short_min)} <span class="tiny muted">(the wiki map table's path length)</span></dd><dt>Several entrances</dt><dd>${d.multi} of ${d.maps} maps</dd><dt>Line-of-sight blockers</dt><dd>${d.los} of ${d.maps} maps</dd><dt>Removable objects</dt><dd>${d.removables} of ${d.maps} maps</dd><dt>Water</dt><dd>${d.water} of ${d.maps} maps</dd>
 <dt>Cheapest CHIMPS win</dt><dd>${d.lcc_min?`<b>${money(d.lcc_min.money)}</b> on ${nameLink(d.lcc_min.map)} (${esc(d.lcc_min.date)}); median of the ${d.lcc_n} map records ${money(d.lcc_median)}`:'none recorded'}</dd></dl>
 <h4 class="tiny" style="margin:10px 0 4px;color:var(--yellow);letter-spacing:.1em;text-transform:uppercase">2-tower pairs that won here recently</h4>

function howtoBody(s){

 if(s.check)h+=`<p class="note blue"><b>Check:</b> ${prose(s.check)}</p>`;
 if(s.diffplan)h+='<!--plan-->';
 if(s.why){const W={rounds:['rounds','Rounds table'],towers:['towers','Towers & upgrades'],mk:['mk','Monkey Knowledge list'],modes:['modes','Modes & difficulties'],builds:['builds','Builds & crosspaths'],maps:['maps','Maps'],paragons:['paragons','Paragons'],bosses:['bosses','Boss Bloons'],bloons:['bloons','Bloons table'],live:['live','Events at build time']}[s.why];if(W)h+=`<p class="small muted">See also: <a class="lk" href="#${W[0]}">${W[1]}</a></p>`;}
 const vt={early:'start',late:'rounds',farming:'farming',mkhow:'mk',hard:'blackborder',impoppable:'impoppable',chimps:'chimps',paragon:'paragon',boss:'bosses',odyssey:'odyssey',ct:'ct',comeback:'update',threats:'rounds',mapdiff:'blackborder',mm:'farming'}[s.id];
 const vs=(D.videos[vt]||[]);
 if(vs.length)h+=`<div class="sec"><h3>Watch</h3><p class="small">Recent videos found by a YouTube search (titles checked, not the full video).</p></div><div class="grid wide">${vs.map(vidCard).join('')}</div>`;
 if(s.diffplan)h=h.replace('<!--plan-->',diffPlan(s.plan_note));
 if(s.id==='threats')h+=`<p style="margin-top:14px"><a class="btn" href="#bloons">Open the Bloons table</a></p>`;
 return h;}

D.bosses.forEach(b=>IDX.push({t:b.name,k:'Boss Bloon',boss:b.slug,img:b.img,x:b.title}));
D.maps.forEach(m=>IDX.push({t:m.name,k:'Map · '+m.diff,map:m.slug,img:m.img,x:''}));

D.powers.forEach(p=>IDX.push({t:p.name,k:'Power',power:p.slug,img:p.img,x:p.desc}));
D.rounds.forEach(r=>IDX.push({t:'Round '+r.n,k:'Round',go:'rounds',round:r.n,x:r.g.map(g=>g.b).join(' ')+' '+(r.why||'')}));

howtos.forEach(s=>IDX.push({t:s.title,k:'How-to',go:s.id==='comeback'?'start':s.id,x:(s.steps||[]).map(p=>p.t).join(' ')}));
const norm=s=>String(s).toLowerCase().normalize('NFKD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9 ]/g,'');
let hits=[],sel=0,activeQ=null;
function doSearch(q,box){const r=box||$('#res');q=norm(q).trim();if(!q){r.classList.remove('on');return;}
 const words=q.split(/\s+/);
 hits=IDX.map(e=>{const t=norm(e.t),x=norm(e.x);let sc=0;if(t===q)sc=100;else if(t.startsWith(q))sc=60;else if(t.includes(q))sc=40;else if(words.every(w=>t.includes(w)||x.includes(w)))sc=10;if(sc&&e.k==='Round'&&sc<60)sc=5;return [sc,e];}).filter(a=>a[0]>0).sort((a,b)=>b[0]-a[0]||a[1].t.length-b[1].t.length).slice(0,14).map(a=>a[1]);
 sel=0;r.innerHTML=hits.length?hits.map((e,i)=>`<div class="${i===0?'sel':''}" data-i="${i}" role="option">${e.img?img(e.img,''):''}<span>${esc(e.t)}</span><i>${esc(e.k)}</i></div>`).join(''):'<div class="none">No match. Try a tower, upgrade, hero, map or "round 63".</div>';r.classList.add('on');}
function goHit(e){if(!e)return;document.querySelectorAll('.results').forEach(x=>x.classList.remove('on'));$('#q').value='';$('#q').blur();$('#side').classList.remove('open');
 if(e.par)openModal(paragonCard(e.par));else if(e.bloon)openModal(bloonCard(e.bloon));else if(e.boss){location.hash='bosses';}else if(e.map)openModal(mapCard(e.map));else if(e.mk){MKT=MKB[e.mk].cat;location.hash==='#mk'?render():location.hash='mk';}else if(e.power){location.hash='powers';}
 else if(e.round){const n=e.round;RR=n<=40?'1-40':n<=80?'41-80':n<=100?'81-100':'101-140';RKEY=false;PENDING_ROUND=n;if(location.hash==='#rounds')render();else location.hash='rounds';}
 else{if(e.hl)PENDING_HL=e.hl;if(location.hash==='#'+e.go)render();else location.hash=e.go;}}
let PENDING_HL=null,PENDING_ROUND=null;
$('#q').addEventListener('input',e=>doSearch(e.target.value));
function keyNav(e,box){const r=box;if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();if(!hits.length)return;sel=(sel+(e.key==='ArrowDown'?1:hits.length-1))%hits.length;[...r.children].forEach((c,i)=>c.classList.toggle('sel',i===sel));}else if(e.key==='Enter'){goHit(hits[sel]);}else if(e.key==='Escape'){r.classList.remove('on');}}
$('#q').addEventListener('keydown',e=>keyNav(e,$('#res')));
document.addEventListener('mousedown',e=>{const d=e.target.closest('.results [data-i]');if(d){e.preventDefault();goHit(hits[+d.dataset.i]);}});
document.addEventListener('click',e=>{if(!e.target.closest('.search')&&!e.target.closest('#homeres')&&e.target.id!=='homeq')document.querySelectorAll('.results').forEach(x=>x.classList.remove('on'));});

// ---------- modal
let lastFocus=null;
function openModal(html,wide){lastFocus=document.activeElement;$('#mbody').innerHTML=html;$('#modal .box').classList.toggle('wide',!!wide);$('#modal').classList.add('on');$('#modal .box').scrollTop=0;$('#modal .x').focus();}
function closeModal(){if(!$('#modal').classList.contains('on'))return;$('#modal').classList.remove('on');$('#mbody').innerHTML='';if(lastFocus&&lastFocus.focus)lastFocus.focus();}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal'||e.target.closest('.x'))closeModal();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('.vid')){e.preventDefault();playVideo(e.target.dataset.vid,e.target.dataset.title);}});
function playVideo(id,title){openModal(`<h3 style="margin-right:44px">${esc(title)}</h3><div style="position:relative;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:#000"><iframe src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(id)}?autoplay=1&rel=0" title="${esc(title)}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen style="position:absolute;inset:0;width:100%;height:100%;border:0"></iframe></div><p class="small"><a href="https://www.youtube.com/watch?v=${encodeURIComponent(id)}" target="_blank" rel="noopener">Open on YouTube</a> <span class="muted">(needs internet)</span></p>`,true);}

// ---------- clicks + routing
document.addEventListener('click',e=>{
 const a=e.target.closest('[data-par],[data-bloon],[data-boss],[data-map],[data-mk],[data-power]');
 if(a){e.preventDefault();const d=a.dataset;if(d.par)openModal(paragonCard(d.par));else if(d.bloon)openModal(bloonCard(d.bloon));else if(d.map)openModal(mapCard(d.map));
  else if(d.boss){closeModal();location.hash='bosses';}else if(d.mk){MKT=(MKB[d.mk]||{}).cat||MKT;closeModal();if(location.hash==='#mk')render(false);else location.hash='mk';}else if(d.power){closeModal();location.hash='powers';}return;}
 const hl=e.target.closest('a[data-hl]');if(hl){PENDING_HL=hl.dataset.hl;if(hl.getAttribute('href')===location.hash){e.preventDefault();render();}}
 const v=e.target.closest('[data-vid]');if(v){playVideo(v.dataset.vid,v.dataset.title);return;}
 const g=e.target.closest('[data-go]');if(g){location.hash=g.dataset.go;return;}
 const sb=e.target.closest('.srcbtn');if(sb){const box=document.getElementById('src'+sb.dataset.src);if(box){box.classList.toggle('on');sb.setAttribute('aria-expanded',box.classList.contains('on'));}return;}
 const di=e.target.closest('#diff button');if(di){DI=+di.dataset.di;try{localStorage.setItem('btd6.diff',DI);}catch(err){}$('#diff').innerHTML=diffHtml();render(false);return;}
 const b=e.target.closest('.tabs[data-set] button');if(b){const set=b.parentNode.dataset.set,val=b.dataset.v;
  if(set==='TCAT')TCAT=val;else if(set==='RR')RR=val;else if(set==='RKEY')RKEY=val==='1';else if(set==='MD')MD=val;else if(set==='MKT')MKT=val;else if(set==='TK')TK=val;else if(set==='TSORT')TSORT=val;else if(set==='BD')BD=val;render(false);}
});
function keepFocus(id,fn){const el=document.getElementById(id);const pos=el?el.selectionStart:0;fn();const n=document.getElementById(id);if(n){n.focus();n.setSelectionRange(pos,pos);}}
main.addEventListener('input',e=>{const id=e.target.id;
 if(id==='tq')keepFocus(id,()=>{TQ=e.target.value.toLowerCase();render(false);});
 else if(id==='mq')keepFocus(id,()=>{MQ=e.target.value.toLowerCase();render(false);});
 else if(id==='homeq'){let box=$('#homeres');if(!box){box=document.createElement('div');box.className='results';box.id='homeres';box.style.position='relative';box.style.top='0';e.target.parentNode.after(box);}doSearch(e.target.value,box);}});
main.addEventListener('keydown',e=>{if(e.target.id==='homeq'){const box=$('#homeres');if(box)keyNav(e,box);}});
$('#menuBtn').addEventListener('click',()=>$('#side').classList.toggle('open'));
$('#nav').addEventListener('click',e=>{if(e.target.closest('a'))$('#side').classList.remove('open');});

function render(top=true){let h;try{h=decodeURIComponent(location.hash.slice(1))||'home';}catch(e){h='home';}const [r,arg]=h.split('/');
 const own=typeof R[r]==='function';const f=own?R[r]:R.home;let cur=own?r:'home';
 if(r==='tower')cur='towers';if(r==='hero')cur='heroes';
 SRCN=0;
 try{main.innerHTML=f(arg)+`<footer>${$('#checked').innerHTML}<br>Fan-made guide, not affiliated with Ninja Kiwi · <a href="#sources">Sources &amp; method</a></footer>`;}
 catch(err){main.innerHTML=`<p class="note warn">This section failed to draw: ${esc(err.message)}. <a href="#home">Home</a></p>`;console.error(err);}
 $('#nav').innerHTML=navHtml(cur);
 const title=r==='tower'&&TB[arg]?TB[arg].name:r==='hero'&&HB[arg]?HB[arg].name:(HT[r]||{}).title;
 document.title=(title?title+' · ':'')+'Bloons TD 6 Field Guide';
 if(PENDING_HL){const el=[...document.querySelectorAll('.up[data-up]')].find(x=>x.dataset.up===PENDING_HL);PENDING_HL=null;if(el){el.style.background='rgba(255,210,63,.16)';el.style.borderRadius='12px';el.scrollIntoView({block:'center'});return;}}
 if(PENDING_ROUND){const el=document.getElementById('r'+PENDING_ROUND);PENDING_ROUND=null;if(el){el.classList.add('mark');el.scrollIntoView({block:'center'});return;}}
 if(top)window.scrollTo(0,0);}
window.addEventListener('hashchange',()=>{closeModal();render();});
render();
if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(()=>{});}
})();
</script>
</body>
</html>
