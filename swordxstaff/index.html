rt at level 1"]},{"t":"Rerolling if you play with friends.","src":["prydwen-beginner-guide"],"q":["If you want to play with friends, rerolling is not worth it"]},{"t":"Extra dungeon entries you can't clear to at least an A rank.","src":["prydwen-tips-and-tricks"],"q":["we advise against using extra entries if you can’t get at least an A-rating"]},{"t":"Buying gear at the Auction House early (level 40): gear is replaced fast.","src":["prydwen-tips-and-tricks"],"q":["don’t be in a rush to buy anything there. Gear is replaced really fast at this stage","Level 40 - Auction House unlocks"]},{"t":"Overspending on Battle Essence or Treats in the Cart; prioritise Wood and Stone, then Chrono Sand and Raw Ore.","src":["prydwen-tips-and-tricks","prydwen-beginner-guide"],"q":["never overspend resources on Battle Essence or Treats","Wood and Stone are necessary to upgrade everything"]},{"t":"Spreading pet materials. Get one pet per role going first.","src":["prydwen-tips-and-tricks"],"q":["Don’t spread your Pet upgrade mats too thin"]},{"t":"Splitting relic investment across elements before your main element is done.","src":["prydwen-tips-and-tricks","packsify"],"q":["should match the element of your class","splitting affinity across two elements costs serious damage output"]},{"t":"Big summon packs, selector bundles, the 7-Day Prayer and random chests.","src":["roonby-packs","beatcop-packs"],"q":["Large summon packs and expensive selector bundles often cost too much","the worst value in the entire shop"]},{"t":"Sitting on old dungeon shards: they can't be sold once the next dungeon opens.","src":["prydwen-daily-dungeons"],"q":["Do not sit on old shards"]},{"t":"Mysterious NPC items other than the Primal Forge (Packsify).","src":["packsify"],"q":["Buy only the Primal Forge. Nothing else"]}],"events":{"rows":[["Nov 4","\"Official launch\" announced by Boltray (Inven Global). Pre-registration is open; event rewards are priced in won and the entry hashtag is Korean, so this is likely the Korean launch.","Unverified for Global servers. Keep a Dawnium and premium-currency reserve until you know what it adds.",["inven-launch"],["will officially launch on November 4","In-game rewards worth a total of 3 million won","#쏘미더커마"],"unverified"],["Oct 16 - Nov 10","\"Show~ Me the Customization\" poster event (raffle for coupons and monthly passes)","Enter if your region is eligible (shared via Naver Lounge, Discord, X and others).",["inven-launch"],["The event runs from 10:00 AM on the 16th to 11:59:59 PM on November 10"],""],["Jul 27 - Aug 9, 2026","Luo Tianyi collab: Yan He free via the Ensemble Puzzle; Luo Tianyi from the Harmony Wheel","Over. Pattern: finish the free companion route first, then the exchange shop (Mythic Relic Selection Chest first).",["topuplist-luotianyi"],["the collaboration period as July 27 through August 9","You can unlock Yan He for free by completing the Ensemble Puzzle","Mythic Relic Selection Chest","ends on August 9, 2026"],"lowtrust"],["Jun 2 - 15, 2026","KonoSuba collab: Megumin, Darkness, Aqua from the Arcane Wheel (50 event currency a spin); a male MC companion on login day 7","Over. Each companion needed 150 fragments; about 180 spins for all three (Narcosis).",["narcosis-konosuba"],["Event listed as June 2 to June 15, 2026","7 consecutive days gives a free male MC companion on day 7","Each companion needs 150 fragments to unlock","50 event currency per spin","about 180 spins","guarantee all three"],"lowtrust"]],"pattern":{"t":"Both collabs so far (June 2 to June 15, and July 27 through August 9) paired a free login or puzzle reward with a paid wheel. Never miss a collab login day, and put event currency into one target. No future collab is announced on any page checked.","src":["narcosis-konosuba","topuplist-luotianyi"],"q":["Event listed as June 2 to June 15, 2026","the collaboration period as July 27 through August 9","7 consecutive days gives a free male MC companion on day 7","You can unlock Yan He for free by completing the Ensemble Puzzle"],"own":true},"seasons":[{"t":"Seasons are expansions: new tier, regions, companions, gear and bosses. Season 1 lasts about 1.5 months, later ones 2-3 months.","src":["prydwen-beginner-guide"],"q":["Expect it to last about 1.5 months, while the following Seasons will hover around 2-3 months each"]},{"t":"At a season reset, levels above the seasonal floor drop back (account level, skills, pets, relic slots above +10, gear slots and gear level). The floor starts at account level 100 and rises by 30 each season (130, 160...).","src":["prydwen-beginner-guide"],"q":["The first one is at Acc lvl 100, but season 2 pushes the floor to Acc lvl 130, season 3 pushes it to 160","any Relic Slot upgraded beyond +10","This floor goes up by 30 (Relics’ threshold for Season buff is always 10% of the Account level’s threshold) with every new Season"]},{"t":"Kept through resets: every skill, pet and relic you own (with dupes and aptitudes), permanent food buffs, companion affinity and guild buffs.","src":["prydwen-beginner-guide"],"q":["everything that is a one-time buff or is acquired through the Gachas is not reset"]},{"t":"Season-end Seasonal Score pays Primostars for permanent buffs. Bank resources before the flip (see Save and spend).","src":["prydwen-beginner-guide","eog-s2"],"q":["a Seasonal Score is given to you at the end of each Season","the smartest move is to stop spending and start banking"]}],"codes_note":{"t":"Gift codes from mobi.gg's list (latest code added Oct 13, 2026). Codes expire fast and some need a minimum level; mobi.gg checks them by hand.","src":["mobi-codes"],"q":["Latest Sword x Staff code added on October 13, 2026","sometimes you need to reach a certain in-game level"]},"codes":[["VIGARD","Free rewards"],["SYLVIA","Free rewards"],["AETHYRIS","Free rewards"],["4dp5ZGM4c","Free rewards"],["VEGGIE","Free rewards"],["Summer","Free rewards"],["X8C3J61N","Free rewards"],["G25W0D4S","Free rewards"],["THEGAMETHEORIST","Free rewards; 1 Fruit of Destiny, 20 Rare Auroral Insignias, 1 Stellatie"],["9B1L3T7H","Free rewards"],["R62V8F0J","Free rewards"],["5MZ41Q9C","Free rewards"],["D38N7P2X","Free rewards"],["7U9S2K5G","Free rewards"],["Chomosuke","30 Chomosuke fragments"],["SXSDCTHANKS","40 Rare Auroral Insignias, 3 Fruits of Destiny, 180 Dawnium"],["SXSCREATOR","1 Fruit of Destiny, 20 rare auroral insignia, 1 Stellatie"],["SXSAMBASSADOR","1 Fruit of Destiny, 20 Rare Auroral Insignias, 1 Stellatie"],["SXSPARTNER","1 Fruit of Destiny, 20 Rare Auroral Insignias, 1 Stellatie"],["SXSREDDIT","180 Dawnium"],["SXSFBTHANKS","40 rare auroral insignia, 3 fruits of destiny, 180 Dawnium"],["VANOSSTEAM","1 Fruit of Destiny, 20 rare Auroral Insignias, 1 Stellatie"],["CARBOTANIMATIONS","1 Fruit of Destiny, 20 Rare Auroral Insignias, 1 Stellatie"],["SS000","100 stones, 300 raw ores, 300 grains of chronic sand, 1,000 combat essences"],["SS888","100 Leaves of Abundance, 1 Fruit of Destiny, 25 Stamina Points"],["ZJ888","2 Legendary Aurora Badges, 10 Epic Aurora Badges, 20 Rare Aurora Badges"],["ZJ999","2 Jelly Bean Pals, 3 honey-glazed roasts, 50 green rice balls"],["SS999","not listed"],["ZJ777","not listed"],["SS777","not listed"]],"code_rows":31,"latest_code":["HOTPOT","Free rewards","October 13, 2026"]},"open":[["Game version","No source states a client version number; this guide checks content dates instead (Prydwen's newest class guide is dated 10 September 2026).",["prydwen-templar"],["Last updated: 10/September/2026"]],["Nov 4 launch","Inven Global reports an official launch on November 4; rewards are priced in won, which suggests Korea. What it changes for existing Global servers is not published.",["inven-launch"],["will officially launch on November 4","In-game rewards worth a total of 3 million won"]],["Premium banner currency","Prydwen: Covenite (not buyable with Dawnium). Narcosis: Dawnium. Check the banner's cost in game.",["prydwen-gacha","narcosis-gacha"],["Covenite cannot be exchanged for using Dawnium","Advanced/Rate-Up: uses Dawnium"]],["Luminium","Prydwen: paid currency for the Trading House. Narcosis: relic gacha currency.",["prydwen-beginner-guide","narcosis-gacha"],["they usually cost Paid Currency (Luminium)","Relic Gacha: uses Luminium"]],["Pity details","Prydwen 10/30/70 pull guarantees vs Narcosis (Epic every 10, better Epic rates from 30, Legendary at 70) and roughly 50 to 80 pulls on its progression page. The 70-pull Legendary and the 200-pull selector agree.",["prydwen-gacha","narcosis-gacha","narcosis-progress"],["Every 10 pulls guarantees a Rare skill or better","Every 30 pulls guarantees an Epic skill or better","Every 70 pulls guarantees a Legendary skill","guaranteed Epic every 10 pulls","roughly 50 to 80 pulls, depending on the banner, for a guaranteed legendary skill","the 200 accumulated pulls on the Standard Banner, giving a Legendary T1 Skill selector box"]],["Tier 2 gate","Class level 18 vs Cinder Ridge level 44 / day 4 vs Guimu Village. Probably more than one condition.",["prydwen-tips-and-tricks","prydwen-classes-and-roles","bs-beginner"],["you need to reach level 18 of the T1 class","Once you reach Cinder Ridge at level 44 (Day 4 after server creation)","reach Guimu Village in the Verdantglade region"]],["Tier 5 gate","Level and day not published; Prydwen's Templar guide only names the region (Aethryis).",["prydwen-templar"],["In the land of Aethryis"]],["PvP modes","Solo Arena and 3v3 Tournament vs 1v1, 2v2 and 4v4. Rewards not published.",["prydwen-beginner-guide","prydwen-classes-and-roles"],["there is a Solo Arena, but also a 3v3 Tournament mode","in all formats, 1vs1, 2vs2, and 4vs4"]],["Guild wars","Prydwen lists guild wars as a feature; rules not published.",["prydwen-beginner-guide"],["and even guild wars"]],["Radiant Stars","Named by BlueStacks as a currency to save; what it buys is not explained.",["bs-tips"],["Luminium, Radiant Stars, and Skill Shard Vouchers"]],["Real-money prices","None of the pack guides lists prices; they vary by region.",["roonby-packs"],["The first pack most players should consider is the beginner $1 bundle"]]],"intro":{"daily":{"t":"Ticks are saved in this browser only. The daily list clears at midnight on this device's clock and the weekly list each calendar week; the game's own reset time is not published in the sources checked. Prydwen expects 15-30 minutes a day once the early rush is over, more during events.","src":["prydwen-beginner-guide"],"q":["expect the game to take up a lot of time early on with all its content unlocking and few restrictions limiting the player, afterwards shortening to anywhere between 15-30 minutes to multiple hours daily, depending on the events"]},"skills":{"t":"Everything in Prydwen's skill database (last updated 05 June 2026), with Prydwen's per-class tier and the builds that use each. Click a name for its card.","src":["prydwen-skills"],"q":["Last updated: 05/June/2026"]},"codes_latest":{"t":"mobi.gg's newest code is shown first; then every code its list marks Active. Codes expire fast and some need a minimum level.","src":["mobi-codes"],"q":["Latest Sword x Staff code added on","sometimes you need to reach a certain in-game level"]},"picker_rules":[{"t":"Anchor builds are Prydwen's: Mage AoE and single target (premium), Sorcerer builds, Archmage builds, Sage generalist and situational damage, Arcanist AoE and single target.","src":["prydwen-mage","prydwen-sorcerer","prydwen-archmage","prydwen-sage","prydwen-arcanist"],"q":["## Area of Effect (Premium)","## Single Target (Premium)","## Generalist DPS","## Situational DPS","## AoE"],"own":true},{"t":"Exploration fills empty slots with AoE skills, bosses with single-target skills. Every Tier 1 Mage technique has a fixed role from Prydwen's Mage guide (its AoE, Single Target and Situational lists) or, for the four it does not list, from Prydwen's skill database wording; higher-tier skills use that database wording.","src":["prydwen-mage","prydwen-skills-db"],"q":["## AoE Skills","## Single Target Skills","## Situational Skills","Deals Water DMG once to 1 enemy within 4 grids"],"own":true},{"t":"Among candidates, the better Prydwen grade wins (T0-T0.5, then T1-T2, then T3, then T4-T5); inside a grade band, a skill from your current class's own list goes first, then more hits on one target. Prydwen: more hits mean more Unstable Aura procs.","src":["prydwen-mage","prydwen-tierlist-db"],"q":["when evaluating single-target abilities, the more hits the better","TIER 3|Archmage|T0|Meteoric Flames|Radiant Sear, Rapid Cast"],"own":true},{"t":"Water Assault counts 3 hits, its hit count on large enemies; a chain such as Lightning Chain counts 1, because it hits each enemy once.","src":["prydwen-mage","prydwen-skills-db"],"q":["Water Assault : Doesn’t appear as a single target skill at first glance, but very much is one when you factor in the fact that large enemies are hit by it 3 times","The effect then chains to 1 random enemy within 4 grids of the target, up to 9 times. Each enemy can only be hit once by the chain effect"]},{"t":"If no owned skill of the role is left, the slot takes your best other damage skill, then a situational skill, then a summon, and labels it **fills empty slot**. Heal and buff skills are never picked.","src":[],"q":[],"own":true},{"t":"Charms: anchor charms you own first. If you lack an anchor charm but own the one Prydwen says it improves on (Gale Shield for Void Bubble, Unstable Aura for Lightning Mystery), that one takes the slot. Then grade order; Wind's Whisper and Heart of Flame win ties as Prydwen's named stand-ins.","src":["prydwen-sorcerer","prydwen-mage"],"q":["Void Bubble - Better version of Gale Shield","Lightning Mystery - It deals better damage and has a better chance to trigger","it is usually used if you’re missing either Mana Surge or Gale Shield"]},{"t":"Water to Ice is only picked with a Water technique in the loadout; Flaming Path is left out of boss loadouts because only enemies that walk through the fire take damage.","src":["prydwen-mage"],"q":["only works on Water element spells","if enemies don’t walk through the Fire, they won't take damage"]},{"t":"If you keep dying before your techniques fire, swap a charm for Tough Soul (HP), as in mobi.gg's beginner build.","src":["mobi-mage"],"q":["ensuring your survival with Tough Soul"]}]},"power":{"lead":{"t":"Where an F2P account's resources go first, in order. Each step is a source's rule; the order is this guide's reading of them.","src":[],"q":[],"own":true},"steps":[{"t":"Push map exploration and activate every Goddess Statue.","src":["bs-tips"],"q":["pushing exploration should be your highest priority","Activating these structures is critical because they grant permanent multiplier boosts"],"note":"BlueStacks calls exploration your highest priority; statues are permanent multipliers."},{"t":"Level skill slots and gear slots evenly.","src":["prydwen-tips-and-tricks"],"q":["Level Skill and Gear slots equally","This changes at higher account levels, where Gear gives way more Power"],"note":"Prydwen: this changes later in a season, when gear gives far more power."},{"t":"Upgrade gear slots in +5/+10 increments in your class's order: Duelist and Sorcerer Weapon > Off-hand > Shoes > Armor/Helmet; Knight Weapon/Shoes > Off-hand > Helmet/Armor; Sage Armor > Weapon > Off-hand > Helmet/Shoes.","src":["prydwen-beginner-guide"],"q":["upgrade your gear in +5/10 increments","Duelists and Sorcerers = Weapon > Off-hand > Shoes > Armor/Helmet","Knight = Weapon/Shoes (Shoes are best for counter/buff builds, co-op and PVP, Weapon is mostly for ATK-scaling builds) > Off-hand > Helmet/Armor","Sage = Armor > Weapon > Off-hand > Helmet/Shoes"],"note":"Prydwen gives no Tier 1 Mage order; this guide uses the Sorcerer order for a Tier 1 Mage."},{"t":"Put Cart upgrades into Wood and Stone first.","src":["prydwen-beginner-guide"],"q":["Wood and Stone are necessary to upgrade everything, so make them your highest priority"]},{"t":"Upgrade a core of four to six Purple or Gold relics, and level your main element's relic slots evenly.","src":["bs-beginner","prydwen-beginner-guide"],"q":["focus on upgrading a small core of four to six Purple or Gold relics","it’s important to level up equally all the Slots of your “main” Elements"]},{"t":"Fantomon: push one primary pet to level fifty first (BlueStacks), then raise one pet of each role, because roles use different upgrade materials (Prydwen).","src":["bs-tips","prydwen-tips-and-tricks"],"q":["Pick a single primary Fantomon that matches your main loadout and pour all your resources into leveling it straight to fifty","focus first on 1 Pet of each Role, as they use different resources"]},{"t":"Companions: at level 39, spend saved gifts evenly; then focus one companion per gift type, Crit givers for damage classes and Block givers for Knights (Prydwen).","src":["prydwen-tips-and-tricks","prydwen-beginner-guide","mobi-companions"],"q":["You can level them equally using the Gifts you gathered so far","make sure to focus on one Companion of each gift type in the future, focusing on those who give Crit or Block","Level 39 - Companions unlock","prioritize Crit-giving Companions for DPS Classes, and Block-giving ones for Knights","select one Companion for each Gift type and stick to them until level 50/70","upgrade all companions equally up to level 20","the chosen companions should then be upgraded equally up to level 70"],"note":"Prydwen's beginner guide says to stick with one per gift type until level 50/70; mobi.gg says to level every companion equally to 20 first, then only class-matching ones, equally to 70. This guide follows Prydwen."},{"t":"Pull in this banner order: Advanced/Rate-Up > Standard = Relic > Fantomon > Affection.","src":["narcosis-gacha"],"q":["S Advanced/Rate-Up; A Standard Banner and Relic Gacha; B Fantomon; C Affection Token"],"note":"Narcosis, lower trust."},{"t":"Later in each season, move upgrades toward gear: most of your Total Power comes from gear.","src":["prydwen-beginner-guide"],"q":["most of your Total Power (TP) comes from Gear","Gear and Gear slot upgrades become way more relevant in terms of power boost in the later parts of each season"]}],"rank":[{"t":"**Total Power (TP)**: Prydwen says most of it comes from gear, and that leveling skill and gear slots evenly gives the bigger power gain early.","src":["prydwen-beginner-guide","prydwen-tips-and-tricks"],"q":["most of your Total Power (TP) comes from Gear","Level Skill and Gear slots equally . You get a bigger power gain that way"]},{"t":"**Progression leaderboards** track how far you push the story; Prydwen says Duelists and Knights usually top them because they push stages under a big power deficit.","src":["prydwen-classes-and-roles"],"q":["you will often see those two classes at the top of the progression leaderboards"]},{"t":"**Arena** ranks reset weekly, and Packsify says rankings lock by power as the week goes on: fight early in the week.","src":["packsify"],"q":["PvP in Sword x Staff operates on a weekly reset cycle","Rankings lock by power differential as the week progresses"]},{"t":"**Guild Boss** has its own leaderboard; Packsify says boss damage depends on how many strong players your guild has.","src":["packsify"],"q":["sitting at the top of every Guild Boss leaderboard and PvP ranking reset","Guild Boss damage scaling depends on how many whales are active in the guild"]},{"t":"**Seasonal Score** at the end of each season sums up your progress and pays Primostars for permanent buffs.","src":["prydwen-beginner-guide"],"q":["a Seasonal Score is given to you at the end of each Season, representing your overall progress"]}],"open":["Which leaderboards exist on your server and how each one is ranked: no checked page lists them all.","Leaderboard reward tables (Arena, Guild Boss, progression)."]}},"builds":[{"src":["prydwen-mage"],"cls":"Mage","label":"Single target (premium)","mode":"boss","pkey":"Mage/Single Target (Premium)","tech":["Water Assault","Flame Jet","Tempest Sphere","Wind's Delight"],"charm":["Unstable Aura","Gale Shield","Water to Ice","Mana Surge"],"note":"","updated":"01/September/2026","line":"mage","tier":1,"warn":[],"id":"b0"},{"src":["prydwen-mage"],"cls":"Mage","label":"AoE (premium)","mode":"explore","pkey":"Mage/Area of Effect (Premium)","tech":["Water Assault","Fireball","Blazing Fire Ring","Wind's Delight"],"charm":["Unstable Aura","Gale Shield","Water to Ice","Mana Surge"],"note":"","updated":"01/September/2026","line":"mage","tier":1,"warn":[],"id":"b1"},{"src":["prydwen-sorcerer"],"cls":"Sorcerer","label":"General / AoE","mode":"explore","pkey":"Sorcerer/Build 1","tech":["Water Assault","Frosty Nova","Light of Dawn","Lightning Chain"],"charm":["Lightning Mystery","Void Bubble","Mana Surge","Water to Ice"],"note":"You can replace Void Bubble with any other offensive Charm if you’re doing content where you’re not afraid of dying (Dragon, Dungeons, etc.).","updated":"01/September/2026","line":"sorcerer","tier":2,"warn":[],"id":"b2"},{"src":["prydwen-sorcerer","allclash-sorcerer"],"cls":"Sorcerer","label":"Single target","mode":"boss","pkey":"Sorcerer/Build 2","tech":["Water Assault","Light of Dawn","Tempest Sphere","Wind's Delight"],"charm":["Lightning Mystery","Void Bubble","Mana Surge","Water to Ice"],"note":"You can replace Void Bubble with any other offensive or utility Charm if you’re doing content where you’re not afraid of dying (Dragon, Dungeons, etc.). For example, with Wind's Shadow that works on co-op bosses, especially those who are Wind-weak. This Charm only triggers when you deal Wind damage using Tech, so with a lot of Sorcerers who spam Wind Tech, the boss moves will be delayed by a lot, making the turn longer (a turn means everyone must do their actions, but since the Boss’s action is delayed, it technically prolongs the turn).","updated":"01/September/2026","line":"sorcerer","tier":2,"warn":[],"also":["Single target / bosses"],"id":"b3"},{"src":["prydwen-sage"],"cls":"Sage","label":"Generalist damage","mode":"explore","pkey":"Sage/Generalist DPS","tech":["Flame Wolf Summon","Weakening Hex","Dark Bullet","Shadow Impact"],"charm":["Gale Shield","Mana Surge","Shadow Erosion","Soul Impact"],"note":"Use this build whenever you need a damage-focused build, and there are enemies present who can quickly kill any Treantlings you summon. If you’re against an enemy who won’t kill summoned Treantlings too fast, the damage it outputs is incredibly high and definitely worth running so long as it can stay alive.","updated":"01/September/2026","line":"sage","tier":2,"warn":[],"id":"b4"},{"src":["prydwen-sage"],"cls":"Sage","label":"Situational damage (Treantling)","mode":"general","pkey":"Sage/Situational DPS","tech":["Flame Wolf Summon","Treantling Summon","Dark Bullet","Shadow Impact"],"charm":["Gale Shield","Mana Surge","Shadow Erosion","Soul Impact"],"note":"As stated in the Generalist build, this is the build you use against enemies who cannot kill Treantlings fast.","updated":"01/September/2026","line":"sage","tier":2,"warn":[],"id":"b5"},{"src":["prydwen-sage"],"cls":"Sage","label":"Healer","mode":"heal","pkey":"Sage/Healing Build","tech":["Void Blessing","Healing Touch","Radiant Restoration","FLEX"],"charm":["Resurrection","Healing Mastery","FLEX","FLEX"],"note":"In dungeons, when you’re responsible for the healing role, you’ll need to run this healing build. You can choose to slot in either more survivability abilities into the flex slots or your choice of damage or debuff abilities. If you feel like your team doesn’t need much healing, it is possible to cut back further on the amount of healing abilities you can use to run even more damage, survival, or debuffing abilities. Pushing this to the extreme, it’s possible to drop Healing Touch , Resurrection , and Void Blessing . In encounters where only group healing is needed, like the Guild Boss, this can be a viable consideration.","updated":"01/September/2026","line":"sage","tier":2,"warn":[],"id":"b6"},{"src":["prydwen-duelist","bs-builds"],"cls":"Duelist","label":"Safe damage + defense","mode":"explore","pkey":"Duelist/Build 1","tech":["Flame Aura","Whirlwind Slash","Sunset Sword","Flash Dash"],"charm":["Block Awareness","Indomitable Will","Blade of Lament","Counter Blade"],"note":"A safe option featuring both damage and defense. In case you are fighting against a mixed group (Boss + Minions), just replace Whirlwind Slash with Heavy Impact . Still, when you push higher, you will need to go even more ham, which means replacing some defense tools with attack tools.","updated":"01/September/2026","line":"duelist","tier":2,"warn":[],"also":["AoE"],"id":"b7"},{"src":["prydwen-duelist","bs-builds"],"cls":"Duelist","label":"Single target (also PvP)","mode":"boss","pkey":"Duelist/Build 2","tech":["Leap Attack","Flame Aura","Heavy Impact","Flash Dash"],"charm":["Block Awareness","Indomitable Will","Blade of Lament","Insightful Eye"],"note":"The Flash Dash can be replaced with either Lion Combo or Edge Strike ; do your math. This works in PVP too.","updated":"01/September/2026","line":"duelist","tier":2,"warn":[],"also":["Single target"],"id":"b8"},{"src":["prydwen-duelist"],"cls":"Duelist","label":"Co-op boss (hit and run)","mode":"boss","pkey":"Duelist/Build 3","tech":["Leap Attack","Flame Aura","Diving Gale","Phantom Assault"],"charm":["Blazing Clash","Strength Rules","Crit Mastery","Insightful Eye"],"note":"As a Melee character, you will block or be blocked by other Melee players from dealing damage to the Boss. This means you need to deal damage from afar or go in and out quickly. Forget our words if you fight the Boss solo, it’s a different case. Darkness Descends is an alternative option for Leap Attack if there are 4+ players that bring it.","updated":"01/September/2026","line":"duelist","tier":2,"warn":[],"id":"b9"},{"src":["prydwen-knight","bs-builds"],"cls":"Knight","label":"Dungeon tank","mode":"group","pkey":"Knight/Build 1","tech":["Valor Surge","Heart of Challenge","Luminous Shield","Guardian Ring"],"charm":["Iron Fortress","Block Awareness","Rebound","Ripple Impact"],"note":"Your job is to soak up damage and keep your team alive. Most of your damage here comes from counters. You can replace Guardian Ring with an AOE skill like Mountain Collapse. If you are acting too slowly, consider replacing ripple impact with Feline Dance.","updated":"01/September/2026","line":"knight","tier":2,"warn":[],"also":["General dungeon"],"id":"b10"},{"src":["prydwen-knight"],"cls":"Knight","label":"Glass cannon (bosses + adds)","mode":"boss","pkey":"Knight/Build 2","tech":["Guardian Ring","Frostbite Blossom","Heart of Challenge","Ricocheting Shield"],"charm":["Ripple Impact","Defensive Assault","Pursuit of Victory","Rebound"],"note":"This build works best with Aegiswing, but is workable with Armopi. It is best at stages with bosses and adds. Overall its more of a Glass Cannon build that can suffer without proper investment","updated":"01/September/2026","line":"knight","tier":2,"warn":[],"id":"b11"},{"src":["prydwen-knight"],"cls":"Knight","label":"Story push / many enemies","mode":"explore","pkey":"Knight/Build 3","tech":["Guardian Ring","Luminous Shield","Whirlwind Slash","Mountain Collapse"],"charm":["Rebound","Counter Blade","Block Awareness","Iron Fortress"],"note":"This build works best with Aegiswing, but is workable with Armopi. It's good for pushing story and stages with lots of enemies.","updated":"01/September/2026","line":"knight","tier":2,"warn":[],"id":"b12"},{"src":["prydwen-archmage","bs-builds"],"cls":"Archmage","label":"AoE + mixed groups","mode":"explore","pkey":"Archmage/Build 1","tech":["Divine Wrath","Howling Hurricane","Meteoric Flames","Lightning Chain"],"charm":["Rapid Cast","Void Bubble","Mana Surge","Radiant Sear"],"note":"This setup should deliver the best outcome for AoE cleaning, and against mix groups too (Boss - Minions). For the charm, consider replacing Mana Surge with either Repelling Wind , Lightning Mystery , or Elemental Harmony . Just find out which charm works the best for you.","updated":"01/September/2026","line":"sorcerer","tier":3,"warn":[],"also":["AoE"],"id":"b13"},{"src":["prydwen-archmage","bs-builds"],"cls":"Archmage","label":"Single target (also PvP without Divine Wrath)","mode":"boss","pkey":"Archmage/Build 2","tech":["Divine Wrath","Howling Hurricane","Meteoric Flames","Wind's Delight"],"charm":["Rapid Cast","Void Bubble","Mana Surge","Radiant Sear"],"note":"It doesn’t change much compared to the AoE build, but you can replace Divine Wrath with Tempest Sphere to trigger Radiant Sear more. You can also use this setup (without Divine Wrath ) in PVP, though you don't have much to bring there.","updated":"01/September/2026","line":"sorcerer","tier":3,"warn":[],"also":["Single target"],"id":"b14"},{"src":["prydwen-arcanist","allclash-arcanist","bs-builds"],"cls":"Arcanist","label":"Single target","mode":"boss","pkey":"Arcanist/Single Target","tech":["Mana Blast","Dark Bullet","Abyssal Hand","Shadow of Termination"],"charm":["Shadow Vengeance","Night's Blessing","Shadow Erosion","Linked Misfortune"],"note":"","updated":"01/September/2026","line":"sage","tier":3,"warn":[],"also":["Bosses","Single target"],"id":"b15"},{"src":["prydwen-arcanist","allclash-arcanist"],"cls":"Arcanist","label":"AoE","mode":"explore","pkey":"Arcanist/AoE","tech":["Mana Blast","Dark Bullet","Abyssal Hand","Shadow Impact"],"charm":["Shadow Vengeance","Night's Blessing","Shadow Erosion","Linked Misfortune"],"note":"","updated":"01/September/2026","line":"sage","tier":3,"warn":[],"also":["AoE"],"id":"b16"},{"src":["prydwen-arcanist"],"cls":"Arcanist","label":"Healer","mode":"heal","pkey":"Arcanist/Healing Build","tech":["Void Blessing","Waterling Summon","Radiant Restoration","Frenzy Totem"],"charm":["Resurrection","Healing Mastery","Overhealing","FLEX"],"note":"","updated":"01/September/2026","line":"sage","tier":3,"warn":[],"id":"b17"},{"src":["prydwen-berserker"],"cls":"Berserker","label":"Build 1","mode":"general","pkey":"Berserker/Build 1","tech":["Hunter's Judgment","Sunset Sword","Eclipse Slash","Lion Combo"],"charm":["Insightful Eye","Blade of Judgment","Blade Siphon","Indomitable Will"],"note":"You can use Blade of Lament instead of Blade Siphon if your Crit Rate isn’t good enough to trigger it consistently. Also, if you’re not worried about dying, you can replace Indomitable Will with a more offensive Charm.","updated":"01/September/2026","line":"duelist","tier":3,"warn":[],"id":"b18"},{"src":["prydwen-berserker"],"cls":"Berserker","label":"Build 2","mode":"general","pkey":"Berserker/Build 2","tech":["Flame Aura","Sunset Sword","Eclipse Slash","Lion Combo"],"charm":["Insightful Eye","Blade of Judgment","Blazing Clash","Crit Mastery"],"note":"","updated":"01/September/2026","line":"duelist","tier":3,"warn":[],"id":"b19"},{"src":["prydwen-berserker"],"cls":"Berserker","label":"Build 3 (PvP swap noted)","mode":"pvp","pkey":"Berserker/Build 3","tech":["Darkness Descends","Lion Combo","Eclipse Slash","Sunset Sword"],"charm":["Insightful Eye","Blade of Judgment","Frame of Battles","Indomitable Will"],"note":"For 2vs2 and 4vs4 PVP, you can replace Lion Combo with Hunter's Judgment to group enemies and get them closer.","updated":"01/September/2026","line":"duelist","tier":3,"warn":[],"id":"b20"},{"src":["prydwen-paladin"],"cls":"Paladin","label":"Party support tank","mode":"group","pkey":"Paladin/Build 1","tech":["Valor Surge","Heart of Challenge","Luminous Shield","Desperate Protection"],"charm":["Iron Fortress","Block Mastery","Block Awareness","Stone Skin"],"note":"Some changes from our Knight build, we replace a more ‘selfish’ skill with extra party safety. If your survival is not an issue, replace Luminous Shield with Lunarwater Threads for extra damage and utility. Overall, unless you are carrying a lower-level Dungeon, you are not gonna contribute as much to damage, so it’s fine to maximize your defense with charms: if your team dies, it’s your fault, and dead party members won’t contribute to damage!","updated":"01/September/2026","line":"knight","tier":3,"warn":[],"id":"b21"},{"src":["prydwen-paladin"],"cls":"Paladin","label":"Water damage","mode":"general","pkey":"Paladin/Build 2","tech":["Guardian Ring","Lunarwater Threads","Frostbite Blossom","Heart of Challenge"],"charm":["Ripple Impact","Defensive Assault","Pursuit of Victory","Insightful Eye"],"note":"Compared to our Knight days, we now have a wide skill that also deals Water damage, so Ricocheting Shield can be dropped. However, it can be used in stages with single-target bosses. Insightful Eye is great for adding some consistency to the damage we deal. If you die too much, consider running a reflect build or adding a more defensive option like Potential Rebirth .","updated":"01/September/2026","line":"knight","tier":3,"warn":[],"id":"b22"},{"src":["prydwen-paladin"],"cls":"Paladin","label":"Star Shattering Slash","mode":"boss","pkey":"Paladin/Build 3","tech":["Luminous Shield","Forceful Charge","Star Shattering Slash","Heart of Challenge"],"charm":["Rebound","Counter Blade","Block Mastery","Block Awareness"],"note":"Armopi can work better than Aegiswing here. Can and should replace Luminous Shield with Valor Surge to increase damage as soon as surviving becomes less of a concern. In AoE-heavy stages, Star Shattering Slash can be replaced with another AoE. Forceful Charge helps push enemies away if you have to kite, Lunarwater Threads helps pull enemies if they tend to hit with ranged skills.","updated":"01/September/2026","line":"knight","tier":3,"warn":[],"id":"b23"},{"src":["prydwen-destroyer","allclash-destroyer"],"cls":"Destroyer","label":"Boss + mobs (core)","mode":"explore","pkey":"Destroyer/Build 1","tech":["Formation Breaker","Howling Hurricane","Meteoric Flames","Wind Blade Spiral"],"charm":["Rapid Cast","Void Bubble","Cyclone Lament","Radiant Sear"],"note":"The core of Destroyer is still Radiant Sear , but you can pair it with Cyclone Lament for the extra damage, considering you use 2 Wind techs here and Laceration can stack. This setup does just fine when you meet the boss + some mobs are set up too. Formation Breaker may look underwhelming against low-defense enemies, but this tech is actually the goat when you fight high-deficit enemies. It should be used in every build, even in later tiers. Note for strong players: Since you tend to overpower the challenge, you can drop Void Bubble or any defense tool and go for more offensive charms.","updated":"01/September/2026","line":"sorcerer","tier":4,"warn":[],"also":["Season 2 entry build"],"id":"b24"},{"src":["prydwen-destroyer","allclash-destroyer"],"cls":"Destroyer","label":"Boss","mode":"boss","pkey":"Destroyer/Build 2","tech":["Formation Breaker","Divine Wrath","Wind Blade Spiral","Thunder of Judgment"],"charm":["Rapid Cast","Void Bubble","Mana Surge","Radiant Sear"],"note":"Wind Blade Spiral can be replaced with Tempest Sphere . For any boss that’s smaller than 3x3 size, you can consider dropping Divine Wrath for Meteoric Flames . Mana Surge can be replaced with Overload Protection for some extra protection. Sometimes you only need a bit more to push ahead.","updated":"01/September/2026","line":"sorcerer","tier":4,"warn":[],"also":["Bosses"],"id":"b25"},{"src":["prydwen-destroyer","allclash-destroyer"],"cls":"Destroyer","label":"Fire horde","mode":"explore","pkey":"Destroyer/Build 3","tech":["Formation Breaker","Fiery Star Trail","Fireball","Meteoric Flames"],"charm":["Rapid Cast","Void Bubble","Explosive Spirit","Fiery Burst"],"note":"This setup works best when you fight a horde of mobs. The core damage is Fiery Burst ; all 4 tech just exist to trigger or support it.","updated":"01/September/2026","line":"sorcerer","tier":4,"warn":[],"also":["Mob waves"],"id":"b26"},{"src":["prydwen-destroyer"],"cls":"Destroyer","label":"Water freeze (weaker)","mode":"general","pkey":"Destroyer/Build 4","tech":["Flowing Doom","Water Assault","Frosty Nova","Ice Spike"],"charm":["Rapid Cast","Void Bubble","Shattering Ice","Water to Ice"],"note":"It may do something when you fight a moderate size of mobs (because horde size nothing beats Fire build). Also, you can replace Ice Spike with Aqua Vortex and put it in the first slot to increase the chance to freeze enemies. This build is weaker on bosses because bosses can only be frozen once their white gauge has been worn out.","updated":"01/September/2026","line":"sorcerer","tier":4,"warn":[],"id":"b27"},{"src":["prydwen-dominator","allclash-dominator"],"cls":"Dominator","label":"Erosion / single target","mode":"boss","pkey":"Dominator/Build 1","tech":["Dark Bullet","Dark Starburst","Chaos Rune","Shadow of Termination"],"charm":["Shadow Vengeance","Night's Blessing","Shadow Erosion","Linked Misfortune"],"note":"Dark Starburst and Chaos Rune deal good damage without having to rely on Erosion stacks, which makes the damage output less RNG and also makes the lack of Effect Hit Rate a bit more forgiving, at the cost of lowering the damage ceiling you can achieve. Conversely, if you can reach High Effect Hit Rate, you can swap the Chaos Rune for another Erosion skill like Mana Blast . You can also add in the Frenzy Totem and use the Soul Pact Resonance instead of Shadow Vengeance or Night's Blessing , depending on the rarity of your skills and your overall stats.","updated":"01/September/2026","line":"sage","tier":4,"warn":[],"also":["Erosion"],"id":"b28"},{"src":["prydwen-dominator"],"cls":"Dominator","label":"AoE (Tier 3 build)","mode":"explore","pkey":"Dominator/Build 2","tech":["Mana Blast","Dark Bullet","Abyssal Hand","Shadow Impact"],"charm":["Shadow Vengeance","Night's Blessing","Shadow Erosion","Linked Misfortune"],"note":"Dominator doesn’t get any new AoE Technique or Charm, so you have no choice but to use your old AoE build for the entirety of T4.","updated":"01/September/2026","line":"sage","tier":4,"warn":[],"id":"b29"},{"src":["prydwen-dominator"],"cls":"Dominator","label":"Healer","mode":"heal","pkey":"Dominator/Build 3","tech":["Waterling Summon","Rejuvenating Rain","Radiant Restoration","Frenzy Totem"],"charm":["Phantom Light","Healing Mastery","Overhealing","FLEX"],"note":"Use Healing Touch instead of the Frenzy Totem if you need more Healing. Last Charm slot depends on your experience: If you die early in the fights, use Shadow Vengeance . If your allies die quickly, use Resurrection instead. If you don’t need any extra survival tools, Mantra of Blessings is the way to go. If you die early in the fights, use Shadow Vengeance . If your allies die quickly, use Resurrection instead. If you don’t need any extra survival tools, Mantra of Blessings is the way to go.","updated":"01/September/2026","line":"sage","tier":4,"warn":[],"id":"b30"},{"src":["prydwen-conqueror","allclash-conqueror","bs-builds"],"cls":"Conqueror","label":"Balanced","mode":"general","pkey":"Conqueror/Build 1","tech":["Flash Fire","Flame Aura","Flickering Blade","Blade Storm"],"charm":["Insightful Eye","Piercing Assault","Tactical Adaptation","Indomitable Will"],"note":"Flame Aura can be replaced by Darkness Descends if you want more mobility and need the Dispel - also a better option in PVP. Once you get enough Crit Rate from the new gear, you can drop Insightful Eye and replace it with a more offensive Charm - for example, with Soul Breaker . This will happen quite soon because S2 gear offers much higher Crit Rate values than S1 gear. Just keep in mind that S2 enemies have 18% Crit Res by default, so you need to reach 118% Crit Rate if you want to have 100% Crit Rate in PVE content. This will happen quite soon because S2 gear offers much higher Crit Rate values than S1 gear. Just keep in mind that S2 enemies have 18% Crit Res by default, so you need to reach 118% Crit Rate if you want to have 100% Crit Rate in PVE content. If you’re strong enough and not dying on the stage/dungeon, replace Indomitable Will with another offensive Charm. For this spot, Soul Splash works really well thanks to Flickering Blade . Always keep Indomitable Will for PVP.","updated":"01/September/2026","line":"duelist","tier":4,"warn":[],"also":["Balanced","General"],"id":"b31"},{"src":["prydwen-conqueror","allclash-conqueror"],"cls":"Conqueror","label":"High crit","mode":"general","pkey":"Conqueror/Build 2","tech":["Flame Aura","Blade Storm","Flash Fire","Flickering Blade"],"charm":["Insightful Eye","Piercing Assault","Tactical Adaptation","Blazing Clash"],"note":"Once you get enough Crit Rate from the new gear, you can drop Insightful Eye and replace it with a more offensive Charm - with the best option being Crit Mastery for the Dragon . This will happen quite soon because S2 gear offers much higher Crit Rate values than S1 gear. Just keep in mind that S2 enemies have 18% Crit Res by default, so you need to reach 118% Crit Rate if you want to have 100% Crit Rate in PVE content. This will happen quite soon because S2 gear offers much higher Crit Rate values than S1 gear. Just keep in mind that S2 enemies have 18% Crit Res by default, so you need to reach 118% Crit Rate if you want to have 100% Crit Rate in PVE content.","updated":"01/September/2026","line":"duelist","tier":4,"warn":[],"also":["High crit (aim 118% Crit Rate)"],"id":"b32"},{"src":["prydwen-guardian","allclash-guardian","bs-builds"],"cls":"Guardian","label":"Support tank","mode":"group","pkey":"Guardian/Build 1","tech":["Valor Surge","Heart of Challenge","Luminous Shield","Desperate Protection"],"charm":["Iron Will","Holy Aegis","Block Awareness","Soul Protection"],"note":"This is a more support-oriented build, aiming to keep your team alive more. If you find yourself needing more Taunting power, remove Valor Surge for Hamper Strike . If your team still dies, maybe try slotting in Iron Fortress , but it remains mostly a PvP charm, like Oath of Vigil . Mix and match with damage-oriented builds if you think you need some extra damage, depending on your gear, power, and stage. For example, you can replace Desperate Protection with Swirling Blade if you want more damage or Star Shattering Slash .","updated":"01/September/2026","line":"knight","tier":4,"warn":[],"also":["Keep the team alive","Support dungeon"],"id":"b33"},{"src":["prydwen-guardian","allclash-guardian","bs-builds"],"cls":"Guardian","label":"Water AoE","mode":"explore","pkey":"Guardian/Build 2","tech":["Swirling Blade","Lunarwater Threads","Seismic Tide","Raging Maelstrom"],"charm":["Frigid Aura","Defensive Assault","Frigid Glint","Potential Rebirth"],"note":"Our water-based build is finally more offensive, allowing us to get faster cold stacking on the enemy. This is mostly for AoE fights, but it has decent ST damage. As this build is more offensive, charms may be repurposed depending on the goal. Potential Rebirth gives a second chance, a highly invested Blade of Lament could provide strong lifesteal, Pursuit of Victory can still be helpful, and so on. As you get more crit from companions, gear, and everything else, Insightful Eye starts to fade away.","updated":"01/September/2026","line":"knight","tier":4,"warn":[],"also":["AoE","Offensive Water"],"id":"b34"},{"src":["prydwen-guardian","allclash-guardian"],"cls":"Guardian","label":"All-purpose support (Dragon, Chaos, Guild Boss)","mode":"group","pkey":"Guardian/Build 3","tech":["Valor Surge","Leap Attack","Holy Purification","Lunarwater Threads"],"charm":["Frigid Aura","Frigid Glint","Iron Fortress","Oath of Vigil"],"note":"An all-purpose support build that can work in Dragon, Chaos, and Guild Bosses. Tinker with it as you see fit, adding more survival charms or more damage. For example, if no dispel is needed, you can remove Holy Purification . Lunarwater Threads can be replaced with Seismic Tide for more consistent Cold stacking. Make sure you are also changing your pet to support your team. Kels (with Manifestation) is an amazing Def Down + Dispel choice, Chomusuke still works, Nyxarchon remains solid to Amplify damage, and for the Guild Boss, you can also bring Terragon if the team needs more DMG Reduction.","updated":"01/September/2026","line":"knight","tier":4,"warn":[],"also":["Boss damage"],"id":"b35"},{"src":["prydwen-guardian","allclash-guardian"],"cls":"Guardian","label":"Tank and spank","mode":"general","pkey":"Guardian/Build 4","tech":["Desperate Protection","Luminous Shield","Forceful Charge","Star Shattering Slash"],"charm":["Rebound","Holy Aegis","Block Mastery","Block Awareness"],"note":"Our good old ‘Tank&Spank’ from S1. This build is actually the most flexible out there since you can remove Luminous Shield for Guardian Ring for more shielding, add Valor Surge for more damage, and so on. If you think your block is enough, you can replace Block Awareness with more offensive options like Eye for an Eye . If you just need to live a bit longer, a higher ascension Potential Rebirth can be clutch. If you run Pandarial , this build can change a lot. You can drop Luminous Shield for Light Sword Array and play more aggressively, but make sure to replace some of your charms to get more defense there.","updated":"01/September/2026","line":"knight","tier":4,"warn":[],"also":["Reflect tank"],"id":"b36"},{"src":["prydwen-magister","bs-builds"],"cls":"Magister","label":"Wind AoE","mode":"explore","pkey":"Magister/Build 1","tech":["Formation Breaker","Wind Blade Spiral","Storm Rhapsody","Howling Hurricane"],"charm":["Radiant Warp","Thunder Judgment","Cyclone Lament","Radiant Sear"],"note":"For Magister, Radiant Sear is no longer the top 1 damage contributor anymore but it still provides too much to drop off. If somehow you need extra protection with Overload Protection or Vital Rhythm , please swap it with Thunder Judgment . Formation Breaker may look underwhelming against low-defense enemies, but this tech is actually the goat when you fight high-deficit enemies. It should be used in every build, even in later tiers.","updated":"01/September/2026","line":"sorcerer","tier":5,"warn":[],"also":["Wind AoE"],"id":"b37"},{"src":["prydwen-magister"],"cls":"Magister","label":"Single target","mode":"boss","pkey":"Magister/Build 2","tech":["Formation Breaker","Divine Wrath","Twin Gale","Thunder of Judgment"],"charm":["Radiant Warp","Thunderbolt Mark","Mana Surge","Radiant Sear"],"note":"There’s not much improvement in ST for T5 Mage. A few modifications you can try are: Meteoric Flames instead of Divine Wrath or Twin Gale (against high Wind res enemies or boss never move). Fire Blast instead of Twin Gale (Fire Blast is stronger than Twin Gale if it’s 1 rarity higher. Same rarity always goes Twin Gale). Cyclone Lament instead of Thunderbolt Mark . This is when you run a lot of Wind tech.","updated":"01/September/2026","line":"sorcerer","tier":5,"warn":[],"id":"b38"},{"src":["prydwen-magister","bs-builds"],"cls":"Magister","label":"Fire AoE","mode":"explore","pkey":"Magister/Build 3","tech":["Formation Breaker","Fiery Star Trail","Crimson Whirl","Meteoric Flames"],"charm":["Radiant Warp","Ember Flare","Explosive Spirit","Fiery Burst"],"note":"In case you already have a high Crit Chance from Gear, Relics etc. Consider dropping Explosive Spirit for Raging Wildfire (Tier 2 Sorcerer), and dropping Meteoric Flames for Blast Spirit .","updated":"01/September/2026","line":"sorcerer","tier":5,"warn":[],"also":["Fire AoE"],"id":"b39"},{"src":["prydwen-magister"],"cls":"Magister","label":"Single target kiting","mode":"boss","pkey":"Magister/Build 4","tech":["Formation Breaker","Wind Blade Spiral","Twin Gale","Thunder of Judgment"],"charm":["Radiant Warp","Thunder Judgment","Vital Rhythm","Cyclone Lament"],"note":"This build focuses a lot on high single-target damage and kiting with Twin Gale + Radiant Warp . Vital Rhythm is pretty cool because it will give you 5 stacks of Cheating Death, which will be further enhanced if you run Panda (it heals). Just move around while waiting for the enemy to be damaged by Laceration and Thunder Judgment .","updated":"01/September/2026","line":"sorcerer","tier":5,"warn":[],"id":"b40"},{"src":["prydwen-prophet"],"cls":"Prophet","label":"Single target (summon)","mode":"boss","pkey":"Prophet/Build 1","tech":["Thalasson Summon","Desperate Shadow","Hexed Blast","Soul Reap"],"charm":["Shadowy Current","Shadow Vengeance","Mana Surge","Soul Pact Resonance"],"note":"Fairly expensive to get going with all the T5 skills; if your Summon doesn’t get popped very early in fights, this will be your typical ST setup. You can replace the Thalasson Summon with the Frenzy Totem ; it will survive better, but you’ll lose a bit of damage output. The other 3 Techniques are core to the build. Shadow Vengeance is still a must-have for any player who can’t survive without it. You may replace it with Ring of Omen if you don’t need extra survivability. Shadowy Current is a better Night's Blessing , but which to use is on a case-by-case basis, depending on your account. Pick the one with the higher buff value for ST. In PVP, you’ll want the Frenzy Totem by default, and your goal will be to maximize your damage during the Shadow Vengeance window. Can also replace Mana Surge by Ring of Omen if your targets have high Eff Res. Kill before you die, simple enough.","updated":"04/September/2026","line":"sage","tier":5,"warn":[],"id":"b41"},{"src":["prydwen-prophet"],"cls":"Prophet","label":"Erosion (long fights)","mode":"boss","pkey":"Prophet/Build 2","tech":["Desperate Shadow","Dark Starburst","Hexed Blast","Shadow of Termination"],"charm":["Ring of Omen","Mana Surge","Linked Misfortune","Shadow Erosion"],"note":"Erosion is still a viable build for the longer fights, namely Hieromon and the Chaos Boss. Its use in Conquest compared to Direct Damage depends on your own account, how long you survive, the buffs you receive, etc. All the Techniques here are core to the build, with Desperate Shadow having more wiggle room (it is used for the debuffs it applies, synergizing with Blast but also improving overall damage if lucky). Ring of Omen , Linked Misfortune and Shadow Erosion are all core Charms; removing them is not recommended. This leaves only 1 flex slot. Either use Mana Surge or your best damage buff if you’re satisfied with your Crit, or look for the usual survival tools if you need them (you shouldn’t need them in the content this build is designed for, but don’t forget those charms exist for a reason).","updated":"04/September/2026","line":"sage","tier":5,"warn":[],"id":"b42"},{"src":["prydwen-prophet"],"cls":"Prophet","label":"AoE","mode":"explore","pkey":"Prophet/Build 3","tech":["Thalasson Summon","Abyssal Hand","Desperate Shadow","Hexed Blast"],"charm":["Soul Pact Resonance","Night's Blessing","Shadowy Current","Mana Surge"],"note":"Compared to the old AoE build, we only keep Abyssal Hand for its direct damage and debuff potential. The rest are our new AoEs and the best DPS summon we can use to benefit from Soul Pact Resonance . Alternatively, the summon can be changed to any other summon depending on your needs at the time (more ATK, healing, tanking, etc.). Shadow Vengeance can be used instead of Night's Blessing or Mana Surge (depends on your own stats).","updated":"04/September/2026","line":"sage","tier":5,"warn":[],"id":"b43"},{"src":["prydwen-prophet"],"cls":"Prophet","label":"Healer","mode":"heal","pkey":"Prophet/Build 4","tech":["Rejuvenating Rain","Radiant Rhythm","Radiant Restoration","Waterling Summon"],"charm":["Phantom Light","Healing Mastery","Overhealing","FLEX"],"note":"Slot in Void Blessing as your First Technique if your max HP is high (mostly for spenders). Frenzy Totem can still be used; it’s up to you to determine which skill is the least useful in your current situation (if you need Burst healing, Rejuvenating Rain isn’t that useful; if your Waterling Summon dies very fast, you can replace it, etc.). If you can’t reliably use the Radiant Rhythm + Overhealing combo for whatever reason, you may replace both with any other Heal or Buff Technique and any Survival Charm listed below, or even Ring of Omen if your team has any Debuff-reliant builds, or simply for the Vulnerability if your team takes too long to clear. The last Charm slot depends on your experience: If you die early in the fights, use Shadow Vengeance . If your allies die quickly, use Resurrection instead. If you don’t need any extra survival tools, Mantra of Blessings is the way to go.","updated":"04/September/2026","line":"sage","tier":5,"warn":[],"id":"b44"},{"src":["prydwen-ravager"],"cls":"Ravager","label":"Build 1","mode":"general","pkey":"Ravager/Build 1","tech":["Night Curse","Solaris Storm","Soul Piercer","Flickering Blade"],"charm":["Piercing Assault","Tactical Adaptation","Blade of Lament","Indomitable Will"],"note":"If you aren’t close to dying, replace Indomitable Will with Soulfire Protection or Insightful Eye (only if you need the Crit Rate).","updated":"04/September/2026","line":"duelist","tier":5,"warn":[],"id":"b45"},{"src":["prydwen-ravager"],"cls":"Ravager","label":"Build 2","mode":"general","pkey":"Ravager/Build 2","tech":["Flame Aura","Solaris Storm","Eclipse Slash","Flickering Blade"],"charm":["Piercing Assault","Tactical Adaptation","Blade of Judgment","Insightful Eye"],"note":"Replace Insightful Eye with Crit Mastery if you have enough Crit Rate from other places already. Flame Aura can be replaced with Sunset Sword - it depends on which is higher rarity that does better, but test both just to be sure. If you do, move Sunset Sword to the end of the list.","updated":"04/September/2026","line":"duelist","tier":5,"warn":[],"id":"b46"},{"src":["prydwen-ravager"],"cls":"Ravager","label":"Build 3","mode":"general","pkey":"Ravager/Build 3","tech":["Shattering Dance","Sunset Sword","Flickering Blade","Blade Storm"],"charm":["Piercing Assault","Tactical Adaptation","Soulfire Protection","Indomitable Will"],"note":"","updated":"04/September/2026","line":"duelist","tier":5,"warn":[],"id":"b47"},{"src":["prydwen-templar"],"cls":"Templar","label":"Pandarial tank","mode":"group","pkey":"Templar/Build 1","tech":["Valor Surge","Heart of Challenge","Lunarwater Threads","Hamper Strike"],"charm":["Iron Will","Block Mastery","Block Awareness","Soul Protection"],"note":"This is a build using our friend Pandarial that we hope you picked up! You can drop Block Awareness if you have enough Block Rate and add Rebound for some damage, Oath of Vigil for more damage soaking or anything that fits your current build and stats.","updated":"10/September/2026","line":"knight","tier":5,"warn":[],"id":"b48"},{"src":["prydwen-templar"],"cls":"Templar","label":"Water (Chaos Invasion, solo)","mode":"general","pkey":"Templar/Build 2","tech":["Swirling Blade","Lunarwater Threads","Seismic Tide","Raging Maelstrom"],"charm":["Frigid Aura","Defensive Assault","Frigid Glint","Sacred Rhythm"],"note":"This is a strong build for Chaos Invasion and solo content, capitalizing on the extra damage from being shielded and quick cold stacking. For AoE content, you can run Lunarwater Threads and remove Sacred Rhythm for Blade of Lament (more sustain) or Pursuit of Victory . For chaos, you can replace Lunarwater Threads with Frostbite Blossom .","updated":"10/September/2026","line":"knight","tier":5,"warn":[],"id":"b49"},{"src":["prydwen-templar"],"cls":"Templar","label":"Flexible","mode":"general","pkey":"Templar/Build 3","tech":["Valor Surge","Swirling Blade","Star Shattering Slash","Iron Slashes"],"charm":["Defensive Assault","Block Mastery","Block Awareness","Soul Protection"],"note":"The build is very flexible and will depend mostly on your investment on gear and current skills. If your crit rate is high enough you can switch Valor Surge for Boiling Bloodlust . If your Block Rate is fine (always check Block Rate vs enemy Accuracy), you can drop Block Awareness for Sacred Rhythm or Physical Mastery (if running Iron Slashes and Star Shattering Slash ) if you want more damage or rebound. If your Iron Slashes is low, consider replacing it with Light Sword Array .","updated":"10/September/2026","line":"knight","tier":5,"warn":[],"id":"b50"},{"src":["prydwen-templar"],"cls":"Templar","label":"Light AoE","mode":"explore","pkey":"Templar/Build 4","tech":["Light Sword Array","Phantom Blade","Dawnburst","Sacred Shine"],"charm":["Soul Protection","Defensive Assault","Holy Restoration","Healing Shift"],"note":"Light build offers good AoE damage but lacks the sustain Water build brings. Will not really shine until T6, but it’s fun to test around a new playstyle, especially as you get more dupes on the newer skills. Highly flexible depending on stage needs - can drop Sacred Shine for example to add in Hamper Strike and remove one of the charms for Iron Will to enjoy a dmg reduction effect.","updated":"10/September/2026","line":"knight","tier":5,"warn":[],"id":"b51"},{"src":["mobi-mage","allclash-mage"],"cls":"Mage","label":"Single target / bosses","mode":"boss","tech":["Wind's Delight","Tempest Sphere","Flame Jet","Water Shot"],"charm":["Elemental Mystery","Unstable Aura","Mana Surge","Gale Shield"],"note":"mobi.gg's boss build.","updated":"","line":"mage","tier":1,"warn":[],"also":["Single target"],"id":"b52"},{"src":["mobi-mage"],"cls":"Mage","label":"AoE / exploration","mode":"explore","tech":["Cyclone","Water Assault","Blazing Fire Ring","Fireball"],"charm":["Elemental Mystery","Unstable Aura","Mana Surge","Gale Shield"],"note":"mobi.gg's exploration build.","updated":"","line":"mage","tier":1,"warn":[],"id":"b53"},{"src":["mobi-mage"],"cls":"Mage","label":"Beginner (AoE and single target)","mode":"general","tech":["Cyclone","Ice Spike","Fireball","Iron Thorn"],"charm":["Unstable Aura","Elemental Mystery","Elemental Body","Tough Soul"],"note":"Tough Soul for survival; the other three boost magic damage.","updated":"","line":"mage","tier":1,"warn":[],"id":"b54"},{"src":["mobi-mage"],"cls":"Mage","label":"Healing (co-op)","mode":"heal","tech":["Stonechief Summon","Void Blessing","Iron Thorn","Healing Touch"],"charm":["Flaming Path","Tough Soul","Elemental Body","Gale Shield"],"note":"Co-op healer; Stonechief limits damage taken.","updated":"","line":"mage","tier":1,"warn":[],"id":"b55"},{"src":["mobi-sage","allclash-sage"],"cls":"Sage","label":"PvE AoE (Erosion)","mode":"explore","tech":["Flame Wolf Summon","Weakening Hex","Dark Bullet","Shadow Impact"],"charm":["Insight","Elemental Mystery","Shadow Erosion","Soul Impact"],"note":"","updated":"","line":"sage","tier":2,"warn":[],"also":["AoE"],"id":"b56"},{"src":["mobi-sage","allclash-sage"],"cls":"Sage","label":"Healer (co-op)","mode":"heal","tech":["Void Blessing","Healing Touch","Radiant Restoration","Iron Thorn"],"charm":["Resurrection","Healing Mastery","Tough Soul","Gale Shield"],"note":"","updated":"","line":"sage","tier":2,"warn":[],"also":["Healer"],"id":"b57"},{"src":["mobi-sage"],"cls":"Sage","label":"PvP (healer)","mode":"pvp","tech":["Void Blessing","Healing Touch","Radiant Restoration","Dark Bullet"],"charm":["Unstable Aura","Tough Soul","Healing Mastery","Resurrection"],"note":"","updated":"","line":"sage","tier":2,"warn":[],"id":"b58"},{"src":["mobi-sage"],"cls":"Sage","label":"Erosion","mode":"boss","tech":["Weakening Hex","Dark Bullet","Shadow Impact","Treantling Summon"],"charm":["Curse Resonance","Shadow Erosion","Elemental Mystery","Insight"],"note":"Curse Resonance adds damage per debuff on the target.","updated":"","line":"sage","tier":2,"warn":[],"id":"b59"},{"src":["mobi-duelist"],"cls":"Duelist","label":"Single target / bosses","mode":"boss","tech":["Heavy Impact","Edge Strike","Lion Combo","Phantom Assault"],"charm":["Block Awareness","Counter Blade","Indomitable Will","Strength Rules"],"note":"","updated":"","line":"duelist","tier":2,"warn":[],"id":"b60"},{"src":["mobi-duelist"],"cls":"Duelist","label":"AoE / exploration","mode":"explore","tech":["Flame Aura","Whirlwind Slash","Mountain Collapse","Sunset Sword"],"charm":["Block Awareness","Counter Blade ss Descends","Fire Slash"],"charm":["Indomitable Will","Blazing Clash","Crit Mastery","Frame of Battles"],"note":"","updated":"","line":"duelist","tier":2,"warn":[],"id":"b85"},{"src":["bs-class"],"cls":"Knight","label":"Early defensive","mode":"group","tech":["Heart of Challenge","Ricocheting Shield","Valor Surge","Guardian Ring"],"charm":["Rebound","Eye for an Eye","Defensive Assault","Ripple Impact"],"note":"","updated":"","line":"knight","tier":2,"warn":[],"id":"b86"},{"src":["bs-builds"],"cls":"Arcanist","label":"Healer","mode":"heal","tech":["Void Blessing","Waterling Summon","Radiant Restoration","Frenzy Totem"],"charm":["Resurrection","Healing Mastery","Overhealing"],"note":"BlueStacks lists only Resurrection, Healing Mastery and Overhealing.","updated":"","line":"sage","tier":3,"warn":[],"id":"b87"}],"skills":[{"name":"Aberrancy","type":"Charm","class":"Dominator","desc":"When taking DMG, if the attacker is affected by ailment or debuff, reduces DMG taken by the caster.","cooldown":null,"ptier":[{"tab":"Tier 4","cls":"Dominator","rank":"T2"}],"verdict":"Good filler (Prydwen T2 for Dominator)","element":[],"hits":1,"hits_how":"default 1"},{"name":"Abyssal Hand","type":"Technique","class":"Arcanist","desc":"Selects a grid within 3 grids of the caster. Deals Dark DMG once to all enemies within 2 grids of the target grid, with a 50% base chance to inflict Slow 1 for 2 turns.","cooldown":1,"ptier":[{"tab":"Tier 3","cls":"Arcanist","rank":"T1"}],"used":["b15","b16","b29","b43","b82"],"verdict":"Strong (Prydwen T1 for Arcanist)","element":["Dark"],"hits":1,"hits_how":"default 1"},{"name":"Air Break","type":"Technique","class":"Ravager","desc":"Attacks 1 enemy within 1 grid of the caster, dealing Physical Doom DMG once, with an 80% base chance to inflict Armor Break 2 for 2 turns. (Prioritizes large targets)","cooldown":1,"verdict":"Not rated, and not in any published build checked","element":["Physical"],"hits":1,"hits_how":"default 1"},{"name":"Aqua Vortex","type const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function md(t){ // **bold**, [[Skill]] links
  return esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\[\[(.+?)\]\]/g,(m,n)=>{n=n.replace(/&#39;/g,"'");return skLink(n)});
}
function skLink(n){
  if(SK[n])return `<a class="sk" href="#skill/${encodeURIComponent(n)}" data-sk="${esc(n)}">${esc(n)}</a>`;
  if(PETS[n])return `<a class="sk" href="#pet/${encodeURIComponent(n)}" data-pet="${esc(n)}">${esc(n)}</a>`;
  return esc(n);
}
function chips(src){
  if(!src||!src.length)return '';
  return '<span class="chips">'+src.map(id=>{const s=SRC[id];if(!s)return '';const low=s.trust==='low';
    return `<a class="src${low?' low':''}" href="${esc(s.url)}" target="_blank" rel="noopener" title="${esc(s.name)}${low?' (lower-trust site)':''}${s.via&&s.via.includes('webfetch')?' (read via WebFetch summary)':''}">${esc(short(s))}</a>`}).join('')+'</span>';
}
function short(s){const n=s.name;const m=n.match(/^(Prydwen|BlueStacks|mobi\.gg|AllClash|Pocket Tactics|EOG\.GG|Inven Global|Narcosis|allthings\.how|Roonby|Beatcop|Packsify|Topuplist)/);
  if(!m)return n; const rest=n.slice(m[0].length).replace(/^[:\s]+/,'').replace(/ build$| guide$/i,'');return rest?`${m[0]} · ${rest}`:m[0];}
function line(f){
  return md(f.t)+(f.own?'<span class="own" title="This guide\'s reasoning from the cited sources">Guide\'s pick</span>':'')+chips(f.src)+(f.warn?`<span class="warn">Unverified: ${esc(f.warn)}</span>`:'');
}
const cell=f=>md(f.t)+(f.own?'':chips(f.src));
const lines=a=>'<ul class="lines">'+a.map(f=>`<li>${line(f)}</li>`).join('')+'</ul>';
const steps=a=>'<ol class="steps">'+a.map(f=>`<li>${line(f)}${f.note?`<span class="why">${md(f.note)}</span>`:''}</li>`).join('')+'</ol>';
function table(cols,rows,cls=''){
  return `<div class="tablewrap"><table class="stack ${cls}"><thead><tr>${cols.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>'<tr>'+r.map((c,i)=>`<td data-label="${esc(cols[i]||'')}">${c}</td>`).join('')+'</tr>').join('')}</tbody></table></div>`;
}

const PK=D.picker;const ROLE={aoe:'AoE',st:'single target',summon:'summon',support:'support',situational:'situational'};
const PKS=PK.skills;
function pkTier(){const id=store.get('sxs-pktier','mage1');return PK.tiers.find(t=>t.id===id)||PK.tiers[0]}
function pool(tier,type){return Object.values(PKS).filter(s=>s.type===type&&tier.classes.includes(s.cls)).sort((a,b)=>a.ct-b.ct||a.r-b.r||a.name.localeCompare(b.name))}
R.picker=()=>{const tier=pkTier();return `<h2>My loadout picker</h2>
<p>Pick your class tier, then tick the techniques and charms you own. The picker starts from Prydwen's published build for that tier (one for exploration, one for bosses), keeps every skill of it you own, and fills each missing slot with your best owned skill of the same role. Your ticks are saved in this browser.</p>
<div class="filters"><select id="pkTier" aria-label="Class tier">${PK.tiers.map(t=>`<option value="${t.id}"${t.id===tier.id?' selected':''}>${esc(t.label)}</option>`).join('')}</select>
<button class="btn pri" id="pkPreset">Starter Mage (lvl 20) preset</button><button class="btn" id="pkAll">Tick all</button><button class="btn" id="pkNone">Clear</button></div>
<h3>Techniques you own</h3><div class="owned" id="pkTech">${pool(tier,'Technique').map(t=>ownBox('t',t)).join('')}</div>
<h3>Charms you own</h3><div class="owned" id="pkCharm">${pool(tier,'Charm').map(t=>ownBox('c',t)).join('')}</div>
<div class="grid" id="pkOut"></div>
<h3>Your skills, rated</h3><p class="meta">Every skill you ticked for this tier, with Prydwen's tier (for the skill's own class), allthings.how's tier where it rates the skill, and how many published builds use it.</p><div id="pkRated"></div>
<h3>Target builds once you pull the missing skills</h3><div id="pkMiss"></div><div class="grid" id="pkTargets"></div>
<h3>How the picker decides</h3>${lines(C.intro.picker_rules)}`};
function ownBox(k,t){return `<label><input type="checkbox" data-k="${k}" value="${esc(t.name)}"> ${esc(t.name)} <span class="r">${esc(t.cls)} · ${t.rank?'Prydwen '+esc(t.rank):'unrated'}</span></label>`}
function pkState(){return store.get('sxs-owned',null)}
function pkSave(o){store.set('sxs-owned',o)}
const band=r=>r<=1?0:r<=3?1:r===4?2:r<=6?3:4; // T0-T0.5 | T1-T2 | T3 | T4-T5 ("Weak: replace when you can") | unrated
const rankKey=(a,b)=>band(a.r)-band(b.r)||b.ct-a.ct||a.r-b.r||b.hits-a.hits||a.name.localeCompare(b.name);
const grade=c=>c.rank?`Prydwen ${c.rank} (Tier ${c.ct} list)`:'not on Prydwen\'s list';
function pickLoadouts(tier,ownT,ownC){
  const out={};
  for(const mode of ['explore','boss']){
    const anchor=BUILD[tier.anchors[mode]],role=mode==='explore'?'aoe':'st';
    const avail=pool(tier,'Technique').filter(s=>ownT.has(s.name));
    const used=new Set(),tech=[];
    for(const n of anchor.tech){if(n==='FLEX')continue;
      if(ownT.has(n)&&PKS[n]&&tier.classes.includes(PKS[n].cls)){used.add(n);tech.push({name:n,how:'anchor',why:`in Prydwen's ${anchor.cls} ${anchor.label} build`});continue}
      const pre=PK.supersedes[n];if(pre&&ownT.has(pre)&&!used.has(pre)&&PKS[pre]&&tier.classes.includes(PKS[pre].cls)){used.add(pre);tech.push({name:pre,how:'predecessor',why:`stands in for ${n} (not owned): Prydwen calls ${n} the newer version of it`})}}
    const free=()=>avail.filter(s=>!used.has(s.name));
    while(tech.length<4){
      let c=free().filter(s=>s.roles.includes(role)&&!s.roles.includes('support')&&!s.roles.includes('summon')&&!s.roles.includes('situational')).sort(rankKey)[0],how='role';
      const dmg=s=>!s.roles.includes('support')&&!s.roles.includes('summon')&&!s.roles.includes('situational');
      if(!c){c=free().filter(dmg).sort(rankKey)[0];how='fill'}
      if(!c){c=free().filter(s=>s.roles.includes('situational')).sort(rankKey)[0];how='situational'}
      if(!c){c=free().filter(s=>s.roles.includes('summon')).sort(rankKey)[0];how='fill'}
      if(!c)break;
      used.add(c.name);
      const rl=c.roles.map(r=>ROLE[r]).join(' + ');
      tech.push({name:c.name,how,why:how==='role'?`best owned ${ROLE[role]} skill · ${grade(c)} · ${rl}${c.hits>1?' · '+c.hits+' hits per target':''}`:how==='situational'?`fills empty slot with a situational skill (Prydwen: try when stuck) · ${grade(c)}`:`fills empty slot (no ${ROLE[role]} skill left) · ${rl} · ${grade(c)}`});
    }
    const chosenWater=tech.some(t=>PKS[t.name]&&(PKS[t.name].el||[]).includes('Water'));
    const ok=c=>{if(PK.supersedes[c.name]===undefined){const by=Object.keys(PK.supersedes).find(k=>PK.supersedes[k]===c.name);if(by&&ownC.has(by)&&tier.classes.includes((PKS[by]||{}).cls))return false}
      if(c.name==='Water to Ice'&&!chosenWater)return false;if(c.name==='Flaming Path'&&mode==='boss')return false;return true};
    const cav=pool(tier,'Charm').filter(s=>ownC.has(s.name)&&ok(s));
    const charms=[];const cu=new Set();
    for(const n of anchor.charm){const s=PKS[n];if(n==='FLEX')continue;
      if(s&&ownC.has(n)&&tier.classes.includes(s.cls)&&ok(s)){cu.add(n);charms.push({name:n,why:`in Prydwen's ${anchor.cls} ${anchor.label} build`});continue}
      const pre=PK.supersedes[n],ps=PKS[pre];if(pre&&ps&&ownC.has(pre)&&!cu.has(pre)&&tier.classes.includes(ps.cls)){cu.add(pre);charms.push({name:pre,how:'predecessor',why:`stands in for ${n} (not owned): Prydwen calls ${n} the newer version of it`})}}
    const ck=(a,b)=>{const sa=PK.standin.indexOf(a.name),sb=PK.standin.indexOf(b.name);return band(a.r)-band(b.r)||b.ct-a.ct||a.r-b.r||(sa<0?9:sa)-(sb<0?9:sb)||a.name.localeCompare(b.name)};
    for(const c of cav.filter(c=>!cu.has(c.name)).sort(ck)){if(charms.length>=4)break;charms.push({name:c.name,why:`best owned charm · ${grade(c)}${PK.standin.includes(c.name)?' · Prydwen stand-in':''}`})}
    out[mode]={tech,charms,anchor};
  }
  return out;
}
function drawPicker(){
  const tier=pkTier();
  let st=pkState();if(!st)st={t:PK.preset.tech,c:PK.preset.charm};
  const ownT=new Set(st.t),ownC=new Set(st.c);
  document.querySelectorAll('#pkTech input,#pkCharm input').forEach(i=>{i.checked=(i.dataset.k==='t'?ownT:ownC).has(i.value);i.parentNode.classList.toggle('on',i.checked)});
  const L=pickLoadouts(tier,ownT,ownC);
  const card=(title,m)=>`<div class="result" data-mode="${m}"><h4>${title}</h4><div class="meta">Anchor: ${esc(L[m].anchor.cls)} · ${esc(L[m].anchor.label)}</div>${m==='boss'&&pkTier().boss_note?`<span class="warn" id="pkBossNote">${esc(pkTier().boss_note)}</span>`:''}<b class="meta">Techniques</b><ol class="pk-t">${L[m].tech.map(t=>`<li data-name="${esc(t.name)}" data-how="${t.how}">${skLink(t.name)}<span class="why">${esc(t.why)}</span></li>`).join('')||'<li class="meta">Tick some techniques</li>'}</ol>
   <b class="meta">Charms</b><ol class="pk-c">${L[m].charms.map(c=>`<li data-name="${esc(c.name)}" data-how="${c.how||''}">${skLink(c.name)}<span class="why">${esc(c.why)}</span></li>`).join('')||'<li class="meta">Tick some charms</li>'}</ol><span class="own">Guide's pick from your skills</span></div>`;
  $('#pkOut').innerHTML=card('Exploration (story, waves, dungeons)','explore')+card('Bosses (single target)','boss');
  const own=new Set([...ownT,...ownC]);
  const mine=[...own].map(n=>SK[n]).filter(s=>s&&PKS[s.name]&&tier.classes.includes(PKS[s.name].cls));
  $('#pkRated').innerHTML=table(['Skill','Type','Class','Prydwen','allthings.how','Builds','Verdict'],mine.sort((a,b)=>a.type.localeCompare(b.type)||PKS[a.name].r-PKS[b.name].r).map(s=>[skLink(s.name),esc(s.type),esc(s.class),tierB(PKS[s.name].rank),tierB(s.atier),String((s.used||[]).length),esc(s.verdict)]))+'<p>'+chips(['prydwen-tierlist-db','allthings-tier'])+'</p>';
  const tg=D.builds.filter(b=>tier.classes.includes(b.cls)&&b.cls===tier.classes[tier.classes.length-1]&&b.mode!=='heal');
  const miss={};tg.forEach(b=>[...b.tech,...b.charm].forEach(n=>{if(!own.has(n)&&n!=='FLEX')miss[n]=(miss[n]||0)+1}));
  const top=Object.entries(miss).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0])).slice(0,6);
  $('#pkMiss').innerHTML=top.length?`<p>Missing skills that appear in the most published ${esc(tier.label)} builds: ${top.map(([n,k])=>`${skLink(n)} (${k})`).join(', ')}.<span class="own">Counted from the builds below</span></p>`:'<p>You own everything these builds use.</p>';
  $('#pkTargets').innerHTML=tg.map(b=>buildCard(b,{own})).join('');
}

$('#dlgX').onclick=()=>$('#dlg').close();

let INDEX=null;
const MODEWORDS={explore:'aoe exploration waves dungeons',boss:'boss single target',general:'general',heal:'healer healing support',group:'group party tank support',pvp:'pvp arena'};
const KEYWORDS={power:'power priority leaderboard leaderboards rank ranking investment invest upgrade order total power',events:'gift code codes redeem coupon collab collaboration events launch',buy:'money pay spend packs monthly card',daily:'daily checklist routine todo',save:'dawnium save spend hoard',banners:'pity gacha rates banner pulls summon',picker:'loadout picker my skills',pvp:'pvp arena tournament',guild:'guild war boss',unlocks:'unlock level when'};
function buildIndex(){
  INDEX=[];
  for(const g of SECTIONS)for(const [id,title] of g[1]){const html=R[id]();const tmp=document.createElement('div');tmp.innerHTML=html;INDEX.push({k:'sec',id,title,sub:g[0],text:tmp.textContent.toLowerCase(),kw:(KEYWORDS[id]||'')+' '+title.toLowerCase()})}
  D.skills.forEach(s=>INDEX.push({k:'skill',id:s.name,title:s.name,sub:`${s.type} · ${s.class}`,text:(s.name+' '+s.desc).toLowerCase()}));
  Object.keys(PETS).forEach(p=>INDEX.push({k:'pet',id:p,title:p,sub:'Fantomon',text:(p+' '+PETS[p][4]).toLowerCase()}));
  D.builds.forEach(b=>INDEX.push({k:'build',id:b.id,title:`${b.cls} · ${b.label}`,sub:`Build · ${b.mode}`,text:(b.cls+' build builds loadout '+b.mode+' '+(MODEWORDS[b.mode]||'')+' '+b.label+' '+b.tech.join(' ')+' '+b.charm.join(' ')).toLowerCase()}));
}
function search(q){
  q=q.trim().toLowerCase();const box=$('#results');if(!q){box.hidden=true;return}
  if(!INDEX)buildIndex();
  const words=q.split(/\s+/);
  const hits=INDEX.map(it=>{let sc=0;const t=it.title.toLowerCase();if(t===q)sc+=100;if(t.startsWith(q))sc+=40;if(t.includes(q))sc+=20;if(words.every(w=>it.text.includes(w)))sc+=5+(it.k==='sec'?0:2);if(it.kw&&words.every(w=>it.kw.includes(w)))sc+=60;return [sc,it]}).filter(x=>x[0]>0).sort((a,b)=>b[0]-a[0]).slice(0,14);
  box.innerHTML=hits.length?hits.map(([,it],i)=>`<a href="${it.k==='sec'?'#'+it.id:it.k==='skill'?'#skill/'+encodeURIComponent(it.id):it.k==='pet'?'#pet/'+encodeURIComponent(it.id):'#builds'}" data-goto="${it.k==='build'?it.id:''}" class="${i?'':'sel'}">${esc(it.title)}<small>${esc(it.sub)}</small></a>`).join(''):'<a><small>No match</small></a>';
  box.hidden=false;
}
$('#q').addEventListener('input',e=>search(e.target.value));
$('#q').addEventListener('keydown',e=>{if(e.key==='Enter'){const a=$('#results a.sel');if(a&&a.getAttribute('href')){a.click()}}if(e.key==='Escape'){$('#results').hidden=true}});
document.addEventListener('click',e=>{if(!e.target.closest('.search'))$('#results').hidden=true});

let current='';
function show(id,opts={}){
  if(!R[id])id='home';
  if(id!==current){
    $('#main').innerHTML=R[id]()+`<p class="foot">Fan-made guide. Not affiliated with Boltray Games. Last checked ${esc(D.checked)}; game version ${esc(D.version)}.</p>`;
    current=id;
    document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('on',a.dataset.id===id));
    document.title=(id==='home'?'':TITLES[id]+' · ')+'Sword x Staff Guide';
    after(id);
    if(!opts.keepScroll)window.scrollTo(0,0);
  }
  document.body.classList.remove('menu');
}
function after(id){
  if(id==='builds'){['#fLine','#fMode','#fText'].forEach(s=>$(s).addEventListener('input',drawBuilds));const pre=store.get('sxs-bfilter',null);drawBuilds();}
  if(id==='techniques'||id==='charms'){const t=id==='techniques'?'Technique':'Charm';['#sText','#sCls','#sUsed'].forEach(s=>$(s).addEventListener('input',()=>drawSkills(t)));drawSkills(t)}
  if(id==='daily'){drawChecks();document.querySelectorAll('.check input').forEach(i=>i.addEventListener('change',()=>{const k=i.dataset.k==='d'?'sxs-daily-'+todayKey():'sxs-weekly-'+weekKey();const st=store.get(k,{});st[i.closest('li').dataset.id]=i.checked;store.set(k,st);drawChecks()}));
    $('#resetChk').onclick=()=>{store.set('sxs-daily-'+todayKey(),{});drawChecks()}}
  if(id==='picker'){drawPicker();
    const save=()=>{const st=pkState()||{t:PK.preset.tech,c:PK.preset.charm};const vis=new Set([...document.querySelectorAll('#pkTech input,#pkCharm input')].map(x=>x.value));
      const t=st.t.filter(n=>!vis.has(n)).concat([...document.querySelectorAll('#pkTech input:checked')].map(x=>x.value)),c=st.c.filter(n=>!vis.has(n)).concat([...document.querySelectorAll('#pkCharm input:checked')].map(x=>x.value));pkSave({t,c});drawPicker()};
    document.querySelectorAll('#pkTech input,#pkCharm input').forEach(i=>i.addEventListener('change',save));
    $('#pkTier').onchange=e=>{store.set('sxs-pktier',e.target.value);current='';show('picker',{keepScroll:true})};
    $('#pkPreset').onclick=()=>{pkSave({t:PK.preset.tech,c:PK.preset.charm});drawPicker()};
    $('#pkAll').onclick=()=>{const tier=pkTier();const st=pkState()||{t:[],c:[]};pkSave({t:[...new Set(st.t.concat(pool(tier,'Technique').map(x=>x.name)))],c:[...new Set(st.c.concat(pool(tier,'Charm').map(x=>x.name)))]});drawPicker()};
    $('#pkNone').onclick=()=>{pkSave({t:[],c:[]});drawPicker()};}
}
function route(){
  $('#results').hidden=true;
  const dl=$('#dlg');if(dl.open)dl.close();
  const h=decodeURIComponent(location.hash.slice(1));
  if(h.startsWith('skill/')){if(!current)show('techniques');skillCard(h.slice(6));return}
  if(h.startsWith('pet/')){if(!current)show('pets');petCard(h.slice(4));return}
  show(h||'home');
}
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-goto]');
  if(g&&g.dataset.goto){e.preventDefault();$('#dlg').open&&$('#dlg').close();$('#results').hidden=true;location.hash='builds';show('builds');const el=document.getElementById(g.dataset.goto);if(el){el.scrollIntoView({block:'center'});el.style.outline='2px solid var(--acc)'}return}
  const f=e.target.closest('[data-filter]');if(f){setTimeout(()=>{const s=$('#fLine');if(s){s.value=f.dataset.filter;drawBuilds()}},0)}
  if(e.target.closest('#results a')){$('#results').hidden=true;$('#q').value=''}
});
$('#menuBtn').onclick=()=>document.body.classList.toggle('menu');
window.addEventListener('hashchange',route);
$('#checked').textContent=`Last checked against ${D.against} on ${D.checked}, game version ${D.version}.`;
nav();route();
if(location.protocol==='https:'&&'serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{})}
</script>
</body>
