k Premium Banner"]},{"t":"Hold Elemental relic pulls until you know your element.","src":["prydwen-tips-and-tricks"],"q":["save up your Elemental Relic pulls"]},{"t":"Hold Summon Crystals for a 60-crystal Mythic Fantomon (Prydwen's Sorcerer pick: Nyxarchon). Prydwen says that takes about 500 pet pulls on average.","src":["prydwen-sorcerer","bs-fantomon"],"q":["you will have 60 hearts to redeem a Mythic Fantomon. Go for this one: Nyxarchon","When you have enough pull (on average, 500 pulls), you will have 60 hearts to redeem a Mythic Fantomon","Aegiswing and Nyxarchon each cost 60 Summon Crystals"]},{"t":"Hold Destiny Fruit: BlueStacks says to stockpile three hundred for a future event.","src":["bs-tips"],"q":["stockpile three hundred of them"]},{"t":"Grand Treasure Hunt: save the event currency one week and spend it the next, to reach the Level 5 relics.","src":["prydwen-tips-and-tricks"],"q":["save for 1 week, then spend it in another - this way you can buy the Relics and other great stuff locked behind Level 5"]},{"t":"Don't hold Tier 1 pulls: you must pull until your class is level 18.","src":["prydwen-tips-and-tricks"],"q":["you must pull skills until you fulfill the condition to advance to the next tier","you need to reach level 18 of the T1 class"]}],"dawnium":[["Material Realms (Raw Ore / Chrono Sand / etc.)","2/2/2/2: two extra attempts per realm, one number per realm (stamina guide and tips). The tips page also mentions 1-2 Material Dungeon refreshes a day as the way to get Battle Essence and Treats instead of upgrading them in the Cart.","Cost is incremental: 60, 60, 100, 100, 150, 150, 200, 200, 250, 300",["prydwen-stamina-and-dawnium-usage","prydwen-tips-and-tricks"],["Material Realms You can farm all of the resources you need for account progression and the cart. Free to Play players should do 2/2/2/2 extra attempts","Use 2/2/2/2 daily attempts at the material dungeons if you’re F2P","Cost is incremental: 60, 60, 100, 100, 150, 150, 200, 200, 250, 300","you can buy them with Rolla and use 1-2 refreshes of the Material Dungeon with Dawnium every day"]],["Daily Dungeon extra runs (main gear source)","Both extra runs, once you can reach at least an A rank","100, then 150",["prydwen-daily-dungeons","prydwen-tips-and-tricks"],["Running the dungeon for an additional 2 times costs 100 and 150 Dawnium","we advise against using extra entries if you can’t get at least an A-rating"]],["Daily shop refreshes","At least 3 a day; buy discounted material-realm items and Destiny Fruit","Rolla or Dawnium",["prydwen-stamina-and-dawnium-usage"],["it’s recommended to do at least 3 refreshes per day","Getting the discounted material realm resources is heavily recommended"]],["Arena extra fights (for exchange-shop currency)","Optional","Cost is incremental: 10, 15, 20, 30, 40, 60, 80, 100",["prydwen-stamina-and-dawnium-usage"],["Cost is incremental: 10, 15, 20, 30, 40, 60, 80, 100"]],["Map merchants / Legendary Destiny Fruit vendors","Keep a reserve; Prydwen says Legendary offers are generally worth it","Varies",["prydwen-stamina-and-dawnium-usage","prydwen-tips-and-tricks"],["always keep some Dawnium on you in case a merchant spawns on the map","It’s generally worth it to buy the Legendary offers"]]],"dawnium_conflict":[{"t":"Prydwen: Dawnium is meant to be spent daily on the sinks above, and the Premium banner uses Covenite, which Dawnium cannot buy.","src":["prydwen-beginner-guide","prydwen-gacha"],"q":["you’re highly incentivized to spend some every day","Covenite cannot be exchanged for using Dawnium"]},{"t":"Narcosis (lower trust): save Dawnium in weeks 1-2, then spend it on the rate-up banner only for skills your build needs.","src":["narcosis-gacha"],"q":["weeks 1-2 focus on the Standard Banner and save Dawnium","weeks 2-6 add Advanced Banner pulls for needed skills"]},{"t":"This guide follows Prydwen for the daily sinks and keeps a reserve for merchants and season flips. If your Premium banner turns out to cost Dawnium, use Narcosis's rule for that banner.","src":["prydwen-beginner-guide","narcosis-gacha"],"q":["you’re highly incentivized to spend some every day","save Dawnium"],"own":true}],"pull_rules":[{"t":"Always 10-pull: Narcosis lists single pulls as a common mistake.","src":["narcosis-progress"],"q":["Pulling singles instead of saving for 10-pulls"]},{"t":"Use mileage selectors: the 200-pull Standard selector and the 50-pull Premium shard selector.","src":["prydwen-gacha"],"q":["the 200 accumulated pulls on the Standard Banner","every 50 pulls on the Premium Banner gives a selector ticket"]},{"t":"On the Premium banner, pull for one element: relics give only a 10 to 15 percent elemental boost per element, so splitting costs damage (Packsify, lower trust).","src":["packsify"],"q":["Relics only grant 10 to 15 percent elemental boost per element"]}],"phases":[["Weeks 1-2","Standard banner with Stellatie, aiming for the 200-pull selector","Dawnium (Narcosis)",["weeks 1-2 focus on the Standard Banner and save Dawnium","can reach the 200-pull selector"]],["Weeks 2-6","Premium / rate-up pulls only for skills your build uses; relics toward the 50% region milestone","Everything else",["weeks 2-6 add Advanced Banner pulls for needed skills and work toward relic region milestones","collecting 50% of a region's relics unlocks milestone rewards"]],["Week 6+","Premium for build refinement, full relic sets, spare Summon Crystals on Fantomon","Premium currency between useful banners",["6+ weeks prioritize Advanced Banner, completing relic sets, and Fantomons"]]],"phases_src":["narcosis-gacha"],"season":[{"t":"Before a season flips, bank: stop spending Material Realm tools, sell old shards, hoard Stamina past dailies, and stop claiming Bed EXP 36 hours before launch (turn off Quick Claim).","src":["eog-s2"],"q":["Start saving your Material Realm Tools","Sell your shards","Hoard Stamina","36 hours before launch, stop claiming EXP from your Bed","Turn off Quick Claim on your Bed"]},{"t":"One day before: stop claiming dungeon rewards and bank both extra dungeon attempts (unused runs stack up to six). Claim Seasonal Rewards, spend all Primo Stars, do your relic pulls.","src":["eog-s2"],"q":["One day before launch, stop claiming your dungeon rewards","Unused runs stack up to six","Spend all of your Primo Stars in the Astral Pact","Do your Relic Pulls"]},{"t":"Daily Dungeon shards from an older dungeon can only be dismantled once a new dungeon opens: sell them first.","src":["prydwen-daily-dungeons"],"q":["whenever a new dungeon unlocks, previous dungeon shards can only be dismantled and can no longer be sold"]}]},"buy":{"lead":{"t":"You don't need to spend to progress; the order below is for if you do. If you spend $5-15 a month, the Monthly Card is the one purchase every pack guide ranks near the top.","src":["roonby-packs","beatcop-packs","packsify"],"q":["For players spending around $5 to $15 monthly, this should be one of the highest priorities","1 Monthly Card","Monthly Card first"]},"rows":[["$1 Beginner / New Player pack","Buy first",{"t":"Listed first: \"the best early purchase\"; starter sword and staff that carry you to about the second island","src":["roonby-packs"],"q":["The $1 Starter Pack is the Best Early Purchase","even help until the second island","If you only plan to buy one thing in Sword x Staff, this starter pack is easily the safest choice"]},{"t":"#3 (S tier)","src":["beatcop-packs"],"q":["3. **New Player Pack** (S-Tier)"]},null],["Monthly Card","Buy",{"t":"Listed second: \"best long-term value\" for light spenders","src":["roonby-packs"],"q":["Monthly Card Gives the Best Long-Term Value"]},{"t":"#1 (S tier)","src":["beatcop-packs"],"q":["1. **Monthly Card** (S-Tier)"]},{"t":"First: \"Monthly Card first\"","src":["packsify"],"q":["Monthly Card first, Month Fund second, Weekly Card third"]}],["Growth Fund / Month Fund","Buy",{"t":"Growth packs: strong but prices climb fast; pick one or two","src":["roonby-packs"],"q":["Growth Packs Are Strong but Can Get Expensive Fast","pick only one or two growth packs"]},{"t":"#2 Growth Fund (Dawnium, Auroral Badges, Destiny Fruit)","src":["beatcop-packs"],"q":["2. **Growth Fund** (S-Tier)","Growth Fund (Dawnium, Auroral Badges, Destiny Fruit at level milestones)"]},{"t":"Second: Month Fund","src":["packsify"],"q":["Monthly Card first, Month Fund second"]}],["Official website voucher bonus","Only if you were buying anyway",{"t":"Extra rewards (cosmetics, helmets, skins) during voucher events","src":["roonby-packs"],"q":["Buying Through the Official Website Can Give Extra Rewards","cosmetics, helmets, skins"]},null,null],["Temporal Crystal packs","Optional",{"t":"\"Usually worth watching\"; Temporal Crystals are hard to get","src":["roonby-packs"],"q":["Temporal Crystal Packs Are Usually Worth Watching"]},null,null],["Battle Pass","Only if you play daily",{"t":"Great only if you log in daily and finish it","src":["roonby-packs"],"q":["Battle Pass is Great if You Play Regularly","if you do not play daily, the Battle Pass becomes less efficient"]},null,null],["Weekly pack / card","Buy",null,{"t":"#4 (A tier)","src":["beatcop-packs"],"q":["4. **Weekly Pack** (A-Tier)"]},{"t":"Third: Weekly Card","src":["packsify"],"q":["Weekly Card third"]}],["Daily Dawnium pack","Only if you spend a little every day",null,{"t":"#5 (A tier): for spending a tiny amount each day","src":["beatcop-packs"],"q":["5. **Daily Dawnium Pack** (A-Tier)","spend a tiny amount each day"]},null],["Destiny Fruit bundle","Optional",null,{"t":"#6 (A tier): one of the most impactful combat-power resources, mid-to-late game","src":["beatcop-packs"],"q":["6. **Destiny Fruit Bundle** (A-Tier)","especially in the mid-to-late game"]},null],["Stellatie pack","Skip",null,{"t":"#7 (B tier): Stellatie can be farmed through gameplay","src":["beatcop-packs"],"q":["7. **Stellatie Pack** (B-Tier)","Stellatie can be farmed through gameplay"]},null],["Auroral Badge bundle","Only if a class transfer is coming",null,{"t":"#8 (B tier): can wait until you actually need it","src":["beatcop-packs"],"q":["8. **Auroral Badge Bundle** (B-Tier)","this pack can wait until you actually need it","Useful near level 100 for class transfers"]},null],["Equipment packs","Skip",null,{"t":"#9 (B tier): inconsistent value","src":["beatcop-packs"],"q":["9. **Equipment Packs** (B-Tier)","The inconsistency"]},null],["Premium Gem packs","Skip",null,{"t":"#10 (C tier and lower): only if you need Dawnium immediately","src":["beatcop-packs"],"q":["10. **Premium Gem Packs** (C-Tier and lower)","The only scenario where these make sense is if you need Dawnium immediately"]},null],["$1-5 event and pop-up packs","Only if cheap ($1-5) and you need the contents",{"t":"Relics, tickets, Withering Potions, drill and dungeon keys","src":["roonby-packs"],"q":["Withering Potions","Drill materials","Dungeon keys","The $1 and $5 event packs often provide"]},{"t":"Limited event bundles: #11, C tier and lower","src":["beatcop-packs"],"q":["11. **Limited Event Bundles** (C-Tier and lower)"]},{"t":"Last, only when you need the contents","src":["packsify"],"q":["event pop-up packs last and only when the specific contents are genuinely needed"]}],["Cosmetic-only packs","Skip",null,{"t":"#12 (C tier and lower): bottom of the list on value","src":["beatcop-packs"],"q":["12. **Cosmetic-Only Packs** (C-Tier and lower)","cosmetic packs rank at the bottom of the list"]},null],["Big summon packs, selector bundles, 7-Day Prayer, random chests","Skip",{"t":"Avoid: poor value; the 7-Day Prayer's monthly cost gets very high","src":["roonby-packs"],"q":["Large summon packs and expensive selector bundles often cost too much","the 7-Day Prayer"]},{"t":"Random chests: #13, worst value in the shop","src":["beatcop-packs"],"q":["13. **Random Chest Packs**","worst value in the entire shop"]},null]],"src":["roonby-packs","beatcop-packs","packsify"],"note":{"t":"Packsify sells top-ups and writes for players spending $500+ a month. None of these pack pages lists prices, which vary by region: check the in-game shop.","src":["packsify"],"q":["already spending $500+ per month"]},"free":[{"t":"Auction House: selling well-rolled gear is a big F2P income; Prydwen saw 20-40 pulls' worth of currency for one good piece.","src":["prydwen-beginner-guide"],"q":["Sometimes you can even get 20-40 skill pulls worth of currency for a single, well-rolled gear piece"]},{"t":"Arena: an early-week push earns daily Dawnium from your rank for the rest of the week (Packsify).","src":["packsify"],"q":["earns free daily Dawnium rewards for the rest of the week"]},{"t":"Gift codes give Dawnium, Fruit of Destiny and Auroral Insignias (list in Events and codes).","src":["mobi-codes"],"q":["SXSDCTHANKS | 40 Rare Auroral Insignias, 3 Fruits of Destiny, 180 Dawnium"]}]},"classtree":[["Sorcerer line","Mage","Sorcerer","Archmage","Destroyer","Magister","Ranged AoE damage; very squishy","Accuracy; CRIT Rate > Accuracy > CRIT DMG",["SORCERER Role: Ranged DPS Damage types: Wind, Fire, Light, Water Class Stat: Accuracy Stat Focus: CRIT Rate > Accuracy > CRIT DMG","Mage -> Sorcerer -> Archmage -> Destroyer","How to build your Magister (T5)","Role: Ranged DPS","Class Stat: Accuracy","Stat Focus: CRIT Rate > Accuracy > CRIT DMG","Squishy. Very squishy","in group PVP, their AoE damage makes them great again"]],["Sage line","Mage","Sage","Arcanist","Dominator","Prophet","Healer, summoner or damage-over-time (Dark)","Higher base stats; Effect Hit Rate >= Accuracy > CRIT Rate > CRIT DMG",["SAGE Role: Healer / DoT DPS Damage types: Dark Class Stat: Higher base stats, CRIT Res, and Healing Boost Stat Focus: Effect Hit Rate >= Accuracy > CRIT Rate > CRIT DMG","Mage -> Sage -> Arcanist -> Dominator","How to build your Prophet (T5)","Role: Healer / DoT DPS","Damage types: Dark","Class Stat: Higher base stats","Stat Focus: Effect Hit Rate >= Accuracy > CRIT Rate > CRIT DMG","a Summoner"]],["Duelist line","Warrior","Duelist","Berserker","Conqueror","Ravager","Melee damage with lifesteal","CRIT Rate; CRIT Rate > CRIT DMG > Accuracy > Block",["DUELIST Role: Melee DPS Damage types: Physical, Dark, Fire Class Stat: CRIT Rate Stat Focus: CRIT Rate > CRIT DMG > Accuracy > Block","Warrior -> Duelist -> Berserker -> Conqueror","How to build your Ravager (T5)","Role: Melee DPS","Class Stat: CRIT Rate","Stat Focus: CRIT Rate > CRIT DMG > Accuracy > Block","Lifesteal"]],["Knight line","Warrior","Knight","Paladin","Guardian","Templar","Tank: taunt, shields, counters","Block; Block >>> Accuracy > CRIT Rate",["KNIGHT Role: Tank Damage types: Physical, Light, Water Class Stat: Block Stat Focus: Block >>> Accuracy > CRIT Rate","Warrior -> Knight -> Paladin -> Guardian","How to build your Templar (T5)","Role: Tank","Class Stat: Block","Stat Focus: Block >>> Accuracy > CRIT Rate","Taunt","Shields","Counterattacks"]]],"classnotes":[{"t":"Tier 5 lines: Prydwen's Magister guide calls it \"T5 Mage\". Prophet, Ravager and Templar are placed on the Sage, Duelist and Knight lines from the skills their Prydwen builds share with the Tier 4 class (for example, Ravager keeps Flickering Blade from Conqueror).","src":["prydwen-magister","prydwen-ravager"],"q":["T5 Mage further enhances 2 builds","Night Curse | Solaris Storm | Soul Piercer | Flickering Blade"],"warn":"Line placement for Prophet, Ravager and Templar is inferred from shared skills."},{"t":"Timeline from server creation, not from when you start: Tier 1 day 1-4, Tier 2 day 4-12, Tier 3 day 12-47, Tier 4 from day 47 (Season 2).","src":["prydwen-classes-and-roles","bs-class"],"q":["Tier 1: Day 1 > Day 4","Tier 2: Day 4 > Day 12","Tier 3: Day 12 > Day 47","Tier 4: Day 47 onwards","Promotions unlock on a fixed schedule based on when your server was created"]},{"t":"Tiers 1-3 pass quickly. Prydwen says the real game starts with Season 2 and Tier 4, so don't stress over early class strength.","src":["prydwen-classes-and-roles"],"q":["The ‘real’ game begins when Season 2 starts, as it introduces Tier 4 classes"]},{"t":"Changing class: the plain switch restarts the new class at level 1 with no skills (avoid it). The conversion turns all your pulled skills into the new class's, lets you pick one of three loadouts and keeps your level. It needs level 100 and works once a week for free (Dawnium for more).","src":["prydwen-classes-and-roles","bs-class"],"q":["The new class you switched to will start at level 1","all previously pulled skills are converted into skills used by your new class","pick one of three available ‘loadouts’","you need to reach level 100 before you can actually use it"]},{"t":"Sorcerer line: the most consistent class across tiers and the king of Tier 2 dungeons, but it dies easily and often replays story stages for good RNG.","src":["prydwen-classes-and-roles"],"q":["Very consistent class across all Tiers","At Tier 2, Sorcerers are the kings of Dungeons","you often have to repeat stages a lot to get the right RNG to pass it"]},{"t":"Duelist line: the most popular class (often 50-70% of a server) and the best at pushing story, but it swings between top and bottom from tier to tier. Prydwen calls Tier 4 \"the Duelist Tier\" and says everyone else is better at Tier 5.","src":["prydwen-classes-and-roles","prydwen-ravager"],"q":["usually, Duelists take more than 50-70% of the whole server’s population","Tier 4 is generally known as the Duelist Tier","at T5 everyone else is better than you"]},{"t":"Knight line: a must-have in Dungeons and Raids and strong in PvP, but the least F2P-friendly class because it needs heavy Block investment.","src":["prydwen-classes-and-roles","bs-class"],"q":["A must-have in any party content (Dungeons/Raids)","Knights struggle the most when you’re a pure F2P","Knight is the least free to play friendly class in the game"]},{"t":"Sage line: every party needs one (the only class that heals and revives), but it struggles solo because damage over time is slow. Tier 3's Shadow Termination makes it a PvP threat.","src":["prydwen-classes-and-roles"],"q":["Every party needs a Sage in Dungeons/Raids","Struggles to progress in stages due to the nature of delayed damage via DoT","they become a PVP menace for the first time"]},{"t":"Prydwen notes the Chinese version is already at Tier 7, so more tiers will come to Global.","src":["prydwen-classes-and-roles"],"q":["the current Tier available in the Chinese version of the game is Tier 7"]}],"tiers":{"cols":["Class","Pocket Tactics F2P","Pocket Tactics spender","BlueStacks","allthings.how F2P","allthings.how paid"],"src":["pockettactics-tier","bs-tier","allthings-tier"],"notes":[{"t":"Pocket Tactics (updated Sep 12, 2026) puts Destroyer, Dominator and Conqueror on top for both F2P and spenders. It notes generally that some classes benefit from heavy investment in gear and prayers; it gives no reason for any single class.","src":["pockettactics-tier"],"q":["Updated: Sep 12, 2026","some classes that benefit from heavy investment into specific gear and prayers"]},{"t":"BlueStacks (Sep 01, 2026) calls Sorcerer \"the strongest Tier 2 class in the game\" and says Sage \"becomes effectively mandatory in party content\".","src":["bs-tier"],"q":["Sorcerer is the strongest Tier 2 class in the game","It becomes effectively mandatory in party content","Sep 01, 2026"]},{"t":"mobi.gg and BlueStacks both name Duelist the best F2P class; BlueStacks adds that Sorcerer is \"perfectly viable\" for F2P thanks to its consistency.","src":["mobi-tier","bs-class"],"q":["We’re talking about the Duelist","Duelist is the strongest free to play pick overall","Sorcerer is also perfectly viable for F2P players"]},{"t":"AllClash: the Duelist path performs best with low investment; Sage/Arcanist is best when fully built, which needs spending.","src":["allclash-all"],"q":["the Duelist path is the best performing with low investment and the Sage/Arcanist is the best when having all well-built"]},{"t":"allthings.how's list (May 2026) is from before Tier 3 and only rates Tier 1-2 classes.","src":["allthings-tier"],"q":["Sword x Staff tier list (May 2026)"],"own":true}],"pick":[{"t":"**Mage players on F2P: take Sorcerer at Tier 2.** It is the consistent damage line, the best Tier 2 dungeon class, and its Tier 4 form (Destroyer) tops Pocket Tactics' F2P list.","src":["prydwen-classes-and-roles","bs-tier","pockettactics-tier"],"q":["Very consistent class across all Tiers","Sorcerer is the strongest Tier 2 class in the game","SS | Conqueror, Dominator, Destroyer"],"own":true},{"t":"Take Sage instead if you will be your guild's healer or plan to spend. Every party needs one, and Pocket Tactics rates Sage C for F2P but A for spenders.","src":["prydwen-classes-and-roles","pockettactics-tier"],"q":["Every party needs a Sage in Dungeons/Raids","C | Mage, Warrior, Sage","A | Sage, Duelist, Guardian"],"own":true}],"rows":[["Conqueror","SS","SSS","A","",""],["Destroyer","SS","SSS","S","",""],["Dominator","SS","SSS","S","",""],["Archmage","S","S","A","",""],["Berserker","S","S","S","",""],["Paladin","S","not listed","B","",""],["Arcanist","A","S","S","",""],["Duelist","A","A","A","S","A"],["Guardian","A","A","B","",""],["Knight","B","B","B","A","B"],["Sorcerer","B","B","S","B","A"],["Mage","C","C","A","C","C"],["Sage","C","A","A","C","S"],["Warrior","C","C","A","C","C"]]},"mage":[{"id":"t1","title":"Mage (Tier 1): from the start to Cinder Ridge","gate":{"t":"From the start until your class is level 18 and Cinder Ridge (level 44, server day 4) opens.","src":["prydwen-tips-and-tricks","prydwen-classes-and-roles"],"q":["you need to reach level 18 of the T1 class","Once you reach Cinder Ridge at level 44 (Day 4 after server creation)"]},"lines":[{"t":"Mage Tier 1 damage comes from multi-hit spells plus [[Unstable Aura]]: every hit can trigger an extra hit, so for single targets more hits per cast is better.","src":["prydwen-mage"],"q":["Mage’s T1 spells all rely on multi-hit components plus the Unstable Aura to be effective","when evaluating single-target abilities, the more hits the better"]},{"t":"AoE skills: [[Cyclone]] (groups enemies, low damage), [[Fireball]] (F2P average nuke), [[Blazing Fire Ring]] (the better Fireball, but you must walk into range).","src":["prydwen-mage"],"q":["Cyclone : Deals lower than average damage but gathers enemies on use","Fireball : A F2P average damage","Blazing Fire Ring : The better Fireball"]},{"t":"Single-target skills: [[Flame Jet]] (3 hits), [[Tempest Sphere]] (5 hits, out-damages Flame Jet once Unstable Aura procs count), [[Wind's Delight]] (7 hits, also AoE), [[Water Assault]] (hits large enemies 3 times and medium ones twice; also strong AoE).","src":["prydwen-mage"],"q":["hits 3 times in a line-based AoE","hits 5 times instead of 3","hits 7 times instead of 5","large enemies are hit by it 3 times and medium enemies are hit 2 times"]},{"t":"Situational: [[Iron Thorn]] (chance to root melee enemies) and [[Stonechief Summon]] (terrible damage, but draws hits away from you). Try them when stuck.","src":["prydwen-mage"],"q":["has a chance to Root targets","This skill deals terrible damage"]},{"t":"Charms: [[Unstable Aura]] is the go-to enabler; [[Mana Surge]] gives Crit Rate; [[Gale Shield]] is a must-have defensive tool; [[Elemental Mystery]] gives Elemental Mastery. [[Water to Ice]] is worth it only with Water Assault. [[Wind's Whisper]] (better) or [[Heart of Flame]] stand in for a missing Mana Surge or Gale Shield.","src":["prydwen-mage"],"q":["Unstable Aura : The go-to enabler for Mage at T1","Mana Surge : Provides tons of Crit Rate","Gale Shield : One of Mage’s best defensive tools in T1 and a must-have","Elemental Mystery : Provides a good chunk of Elemental Mastery","This Charm is usually only worth using if you have Water Assault","is usually the better choice in most cases over Heart of Flame"]},{"t":"Gear in the first two regions: picking by higher Total Power is fine (Prydwen); gear is replaced fast. BlueStacks says to judge by secondary stats rather than Power; that matters more later.","src":["prydwen-beginner-guide","bs-builds"],"q":["In the first 2 Regions, however, it’s okay to pick the Equipment that gives you the higher Total Power (TP)","Do not blindly replace a piece of gear just because it has a lower Power score"]},{"t":"No Fantomon yet (they unlock at level 50-51). mobi.gg says to skip pet and companion investment while you are a Tier 1 Mage.","src":["mobi-mage","bs-fantomon","prydwen-tips-and-tricks"],"q":["We can't recommend Fantomon or Companions for the Sword x Staff Mage build","unlock at account level 50","Level 51 - Fantomons"]}]},{"id":"t2","title":"Sorcerer (Tier 2): Cinder Ridge to Aqualis","gate":{"t":"Cinder Ridge, level 44, server day 4.","src":["prydwen-classes-and-roles"],"q":["Once you reach Cinder Ridge at level 44 (Day 4 after server creation)","Once you reach Aqualis at level 82"]},"lines":[{"t":"You deal damage with all four elements and trigger extra damage with [[Lightning Mystery]] and [[Unstable Aura]]; Sorcerers shine in Dungeons. Cherry-pick the best skills of every element rather than going mono-element.","src":["prydwen-sorcerer"],"q":["triggering additional damage via Charms - Lightning Mystery and Unstable Aura","using all 4 elements","cherry-picking the best skills out of all elements"]},{"t":"Key new skills: [[Light of Dawn]] (\"Best T2 Tech\"), [[Lightning Chain]] (low damage but usable every turn and moves you), [[Frosty Nova]] (3x3 with a Freeze chance), [[Fiery Star Trail]] (two hits; pair with Flaming Path). [[Void Bubble]] replaces Gale Shield.","src":["prydwen-sorcerer"],"q":["Best T2 Tech","you can use this Tech every turn, and it moves you around a lot","Frosty Nova - Mediocre damage but decent AoE (3x3)","Fiery Star Trail - It has an exact amount of modifier of Blazing Fire Ring , but it deals 2 instances of damage","Better version of Gale Shield"]},{"t":"Stats at Tier 2: Elemental Mastery and ATK% first. Crit is not worth investing in yet because gear crit values are too low.","src":["prydwen-classes-and-roles","bs-class"],"q":["focus on generic Elemental Mastery and ATK% early on. CRIT at this tier isn’t honestly worth investing in","Crit stats are not worth heavy investment yet"]},{"t":"Pull on the Premium banner for the Tier 2 skills in the builds below. Light of Dawn and Void Bubble are Prydwen's top-rated (T0) Sorcerer technique and charm.","src":["prydwen-tierlist-db"],"q":["TIER 2|Sorcerer|T0|Light of Dawn|Void Bubble"]},{"t":"Gear upgrade order for Sorcerers: Weapon > Off-hand > Shoes > Armor/Helmet, in +5/+10 increments.","src":["prydwen-beginner-guide"],"q":["Duelists and Sorcerers = Weapon > Off-hand > Shoes > Armor/Helmet","upgrade your gear in +5/10 increments"]},{"t":"Pets from level 50: [[Armopi]] early for survival; [[Zeioletus]] or [[Sylvaerie]] where you won't die (Dragon, Guild Raids, Dungeons); save the 60 hearts (Summon Crystals) for [[Nyxarchon]].","src":["prydwen-sorcerer"],"q":["you will have 60 hearts to redeem a Mythic Fantomon. Go for this one: Nyxarchon","Armopi : It gives you a bit of DEF","Zeioletus : Provides you with additional damage burst every turn","Sylvaerie : Gives you basically a permanent ATK and SPD buff","Nyxarchon : The Dark Fantomon that debuffs enemies with max -30% def","Starting level 50, you will be able to summon pets","you will have 60 hearts"]},{"t":"Relic elements for the Sorcerer line: Light is a must, then Fire, then Wind > Water > Dark.","src":["prydwen-sorcerer"],"q":["Light : Must","Other elements can be prioritized as Wind > Water > Dark"]}]},{"id":"t3","title":"Archmage (Tier 3): Aqualis to Loong Haven","gate":{"t":"Aqualis, level 82, server day 12.","src":["prydwen-classes-and-roles"],"q":["Once you reach Aqualis at level 82 (day 12 after server creation)","Once you reach Loong Haven at level 106"]},"lines":[{"t":"[[Rapid Cast]] lets your techniques fire one turn sooner, which matters a lot for a squishy Mage; Prydwen calls it very hard to replace up to Tier 4.","src":["prydwen-archmage","bs-builds"],"q":["Very hard to replace this charm, at least up to tier 4","allows your first Technique to be used one turn earlier"]},{"t":"[[Radiant Sear]] is the strongest damage charm at this tier (and the next); [[Divine Wrath]] is the best single-target skill against giant bosses but unreliable on small groups; [[Howling Hurricane]] has a huge AoE; [[Meteoric Flames]] replaces Flaming Path.","src":["prydwen-archmage"],"q":["The strongest charm in terms of damage at this tier","It’s definitely the strongest single-target skill against giant bosses","The problem starts rising when you try to land this skill on a sm","It deals very good damage, and has a super big AoE","It’s about time we forget the Flaming Path completely"]},{"t":"Stats from here: Staff and Codex Elemental Mastery > ATK > Crit > Speed > Effect Hit Rate; Boots Elemental Mastery > ATK > Speed; Helmet and Chest DEF first. Best substats: Speed, Crit Rate%, Crit Damage%.","src":["prydwen-archmage"],"q":["Staff Elemental Mastery > ATK > Crit > Speed > Effect Hit Rate Codex Elemental Mastery > ATK > Crit > Speed > Effect Hit Rate","Boots Elemental Mastery > ATK > Speed","Helmet DEF >= Physical Res = Elemental Res > HP > Effect Res Chest DEF >= Physical Res = Elemental Res > HP","Best Stats Speed Crit Rate% Crit Damage%"]},{"t":"BlueStacks lists the same Archmage stats (Elemental Mastery, ATK, Crit, Speed) without an order.","src":["bs-builds"],"q":["Archmage prioritizes Elemental Mastery, ATK, Crit, and Speed"]}]},{"id":"t4","title":"Destroyer (Tier 4): Loong Haven, Season 2","gate":{"t":"Loong Haven, level 106, server day 47. Season 2 starts with it.","src":["prydwen-classes-and-roles","bs-class"],"q":["Once you reach Loong Haven at level 106 (day 47 after server creation)","Season 2 begins around day 47 alongside Tier 4"]},"lines":[{"t":"[[Formation Breaker]] buffs allies' ATK and can advance their turns; Prydwen calls it \"the goat\" against high-deficit enemies and says to use it in every build from here on.","src":["prydwen-destroyer"],"q":["this tech is actually the goat when you fight high-deficit enemies. It should be used in every build, even in later tiers"]},{"t":"Prydwen's other note on it: equip it \"When you are being carried by whales\". Its ATK buff scales on your own ATK, which is \"meme compared to them\", but the 50% chance to speed up their turns still helps.","src":["prydwen-destroyer"],"q":["When you are being carried by whales, equip this one","which is meme compared to them, but it has 50% to accelerate their actions"]},{"t":"[[Wind Blade Spiral]] is a faster-cooldown Howling Hurricane; [[Thunder of Judgment]] is Destroyer's highest single-target damage; the Fire build lives on [[Fiery Burst]] + [[Explosive Spirit]]. The Water/Freeze build is \"kinda lackluster\".","src":["prydwen-destroyer"],"q":["It’s technically a smaller Howling Hurricane, but cooldown faster","Highest single target damage of Destroyer","One of the two core charms for the Fire build","kinda lackluster"]},{"t":"AllClash agrees freeze \"is not reliable anymore\" in Season 2 and calls its Destroyer setup the entry-level Season 2 build.","src":["allclash-destroyer"],"q":["freeze is not reliable anymore","this is probably the entry-level S2 build"]},{"t":"Stats shift: Staff and Codex Elemental Mastery > Crit > ATK; Boots Elemental Mastery > Speed > ATK. %ATK, %Speed, %HP and %DEF become \"extremely underwhelming\" because they scale on a small base.","src":["prydwen-destroyer"],"q":["Staff Elemental Mastery > Crit > ATK > Speed > Effect Hit Rate Codex Elemental Mastery > Crit > ATK > Speed > Effect Hit Rate","Boots Elemental Mastery > Speed > ATK","This makes all %ATK, %Spd, %HP and %Def extremely underwhelming"]},{"t":"Gems open in Season 2: two per gear piece at gear level 130. Prydwen's gem list, read top to bottom, starts with Obsidian (for its damage buff), then Amethyst (for Crit Rate); Mages work toward at least 120% Crit Rate to guarantee crits against stronger enemies.","src":["prydwen-destroyer"],"q":["you can infuse 2 Gems per gear once your gear reaches level 130","Priority is top-to-bottom","Obsidian: ATK doesn’t matter, but the damage buff is great Amethyst: Crit rate is good","at least 120% crit to guarantee 100% crit"]},{"t":"From Season 2 you can transfer good gear substats to a new seasonal piece (the old piece is destroyed). Lock pieces with great substats.","src":["prydwen-destroyer"],"q":["Starting S2, it will be possible to transfer gear substats"]}]},{"id":"t5","title":"Magister (Tier 5): Season 3","gate":{"t":"Gate not published in the sources checked. Prydwen's Tier 5 guides are dated September 2026.","src":["prydwen-magister"],"q":["Last updated: 01/September/2026"],"warn":"Tier 5 unlock level and day are not published."},"lines":[{"t":"Two builds get stronger: Wind (ranged, kites better, superior) and Fire (carries if you are far ahead). Single target stays weak.","src":["prydwen-magister"],"q":["with Wind becoming way more superior due to being ranged","T5 Mage further enhances 2 builds","you still suck at Single Target"]},{"t":"[[Radiant Warp]] replaces Void Bubble: 50% chance to teleport away when hit. [[Thunder Judgment]] (a charm, not the Tier 4 technique) hits enemies near you whenever they cast.","src":["prydwen-magister"],"q":["Say goodbye to Void Bubble or Overload Protection because you will use this charm instead","In case you feel deja vu with the T4 skill, it’s not","This charm will deal damage to enemies near you whenever they use a Tech","Mage will have a 50% chance to teleport away"]},{"t":"BlueStacks lists the same Wind and Fire Magister builds as Prydwen.","src":["bs-builds","prydwen-magister"],"q":["For a Wind AoE Magister build","Formation Breaker | Wind Blade Spiral | Storm Rhapsody | Howling Hurricane"]},{"t":"Pet: Prydwen recommends [[Pandarial]] most of the time because it is easy to use; [[Nyxarchon]] suits a glass cannon; [[Aegiswing]] is the lowest priority because it only provides survival.","src":["prydwen-magister"],"q":["We recommend Pandarial most of the time because it’s very easy to use","Nyxarchon : The Dark Fantomon that debuffs enemies with max -30% def, and also deals good damage itself. Very suitable for a glass cannon","Aegiswing : This one is the lowest in priority because it only provides survival"]},{"t":"Magister stats: Staff and Codex Elemental Mastery > Crit > ATK > Speed > Effect Hit Rate; Boots Elemental Mastery > Speed > ATK; Helmet and Chest DEF first (the same as Destroyer).","src":["prydwen-magister"],"q":["Staff Elemental Mastery > Crit > ATK > Speed > Effect Hit Rate Codex Elemental Mastery > Crit > ATK > Speed > Effect Hit Rate Helmet DEF >= Physical Res = Elemental Res > HP > Effect Res Chest DEF >= Physical Res = Elemental Res > HP Boots Elemental Mastery > Speed > ATK"]}]}],"stats":{"sources":[["Prydwen class guide","Sorcerer stat focus: CRIT Rate > Accuracy > CRIT DMG. At Tier 2, Elemental Mastery and ATK% first; crit not worth it yet.",["prydwen-classes-and-roles"],["SORCERER Role: Ranged DPS Damage types: Wind, Fire, Light, Water Class Stat: Accuracy Stat Focus: CRIT Rate > Accuracy > CRIT DMG","focus on generic Elemental Mastery and ATK% early on"]],["Prydwen Sorcerer/Archmage","Staff and Codex: Elemental Mastery > ATK > Crit > Speed > Effect Hit Rate. Best substats Speed, Crit Rate%, Crit Damage%. Mages have high Crit by nature.",["prydwen-sorcerer","prydwen-archmage"],["Staff Elemental Mastery > ATK > Crit > Speed > Effect Hit Rate Codex Elemental Mastery > ATK > Crit > Speed > Effect Hit Rate","For Mage, they have high Crit in nature"]],["Prydwen Destroyer/Magister","Staff and Codex: Elemental Mastery > Crit > ATK. Work toward 120% Crit Rate.",["prydwen-destroyer","prydwen-magister"],["Staff Elemental Mastery > Crit > ATK > Speed > Effect Hit Rate Codex Elemental Mastery > Crit > ATK > Speed > Effect Hit Rate","at least 120% crit to guarantee 100% crit"]],["BlueStacks class guide","Sorcerer: Crit Rate, then Accuracy, then Crit Damage. Tier 2: Elemental Mastery and ATK% on Mage classes; crit values on gear too low.",["bs-class"],["with a priority of Crit Rate, then Accuracy, then Crit Damage","generic Elemental Mastery and Attack percentage on Mage classes"]],["BlueStacks builds","Archmage: Elemental Mastery, ATK, Crit and Speed (no order given).",["bs-builds"],["Archmage prioritizes Elemental Mastery, ATK, Crit, and Speed"]],["Narcosis Sorcerer (lower trust)","Crit Rate targets 40-50% early, 60-70% Sorcerer, 75-85% Archmage. Below about 40% Crit Rate, ATK beats Crit DMG; above about 50%, Crit DMG beats ATK. Gems: Amethyst (Crit Rate) first, then Obsidian (Crit DMG).",["narcosis-sorcerer"],["early (Mage) 40-50%","mid (Sorcerer) 60-70%","endgame (Archmage) 75-85%","below about 40% Crit Rate, ATK contributes more than Crit DMG","above about 50%, Crit DMG is more valuable","Socket Crit Rate gems first, then Crit DMG"]]],"rule":[{"t":"**Tier 1-2 gear:** take Elemental Mastery and ATK%. Crit rolls on gear are too small to matter yet (Prydwen, BlueStacks).","src":["prydwen-classes-and-roles","bs-class"],"q":["CRIT at this tier isn’t honestly worth investing in","Crit stats are not worth heavy investment yet"],"own":true},{"t":"**Tier 3 gear:** Staff and Codex Elemental Mastery > ATK > Crit; substats Speed, Crit Rate%, Crit DMG% (Prydwen).","src":["prydwen-archmage"],"q":["Staff Elemental Mastery > ATK > Crit > Speed > Effect Hit Rate Codex Elemental Mastery > ATK > Crit > Speed > Effect Hit Rate","Best Stats Speed Crit Rate% Crit Damage%"],"own":true},{"t":"**Tier 4+ gear and gems:** Crit moves above ATK; aim for 120% Crit Rate; gems Obsidian then Amethyst (Prydwen).","src":["prydwen-destroyer"],"q":["Elemental Mastery > Crit > ATK > Speed > Effect Hit Rate","at least 120% crit to guarantee 100% crit"],"own":true},{"t":"Why the crit advice differs: Narcosis compares ATK with **Crit DMG** (not Crit Rate). Crit DMG is weak until your Crit Rate is high, which matches Prydwen putting Crit later on gear. Prydwen adds that Mages have high Crit by nature, so a Crit focus works better for them than for other classes; it is just scarce on early gear.","src":["prydwen-sorcerer","narcosis-sorcerer","prydwen-archmage"],"q":["For Mage, they have high Crit in nature","below about 40% Crit Rate, ATK contributes more than Crit DMG","Elemental Mastery > ATK > Crit"],"own":true},{"t":"Gems do not exist until Season 2 (two sockets per piece at gear level 130), so the Narcosis gem order only applies from Tier 4. Prydwen's order there is Obsidian (damage buff) before Amethyst (Crit Rate).","src":["prydwen-destroyer","narcosis-sorcerer"],"q":["in season 2, you can infuse 2 Gems per gear once your gear reaches level 130","T10 Amethyst = Crit Rate"],"own":true}],"relics":[{"t":"Relics are collection-based: every relic you own gives its stats even unequipped, and full sets give bonuses. Equipping adds a small bonus.","src":["prydwen-beginner-guide"],"q":["Relics’ buffs and sets are collection-based"]},{"t":"Relic slot levels are shared per element: unequipped relics use the lowest slot level of their element, so level your main element's slots evenly.","src":["prydwen-beginner-guide"],"q":["The levels of unequipped Relics are also adjusted to be the same as the lowest Slot level of the corresponding Elemen"]},{"t":"Elemental Affinity (from relics of an element) raises that element's damage: focus your class's element first.","src":["prydwen-beginner-guide","prydwen-tips-and-tricks"],"q":["Elemental Affinity is improved by getting/upgrading Relics of each Element","should match the element of your class"]},{"t":"Narcosis (lower trust): collecting 50% of a region's relics unlocks milestone rewards; duplicates turn into shards that upgrade the relic.","src":["narcosis-gacha"],"q":["collecting 50% of a region's relics unlocks milestone rewards","duplicates become shards"]},{"t":"Upgrade a core of four to six Purple or Gold relics instead of many (BlueStacks, Packsify).","src":["bs-beginner","packsify"],"q":["focus on upgrading a small core of four to six Purple or Gold relics","Focus relic upgrades on four to six Purple or Gold relics"]},{"t":"Relic slots above +10 drop back to +10 at each new season.","src":["prydwen-beginner-guide"],"q":["any Relic Slot upgraded beyond +10 eventually goes back down to +10"]},{"t":"Mage-line showcase relics (Prydwen, up to Aqualis): Light — Luminous Edict, Crown of Unbinding, Thunder Wraith; Fire — Everburn Throne (Mythic), Crimson Agate; Wind — Fate's Grand Banner, Wind Pouch (Mythic); Water — Mirror of Reflection, Nymph's Swordhilt (Mythic). Destiny Fruit in the listed map section raises each one's drop rate.","src":["prydwen-archmage"],"q":["Luminous Edict (SPD - Legendary - Light Affinity)","Everburn Throne (ATK - Mythic - Fire Affinity)","Fate’s Grand Banner (Elemental Mastery - Legendary - Wind Affinity)","Nymph’s Swordhilt (%Crit - Mythic - Water Affinity)"]}],"gear":[{"t":"Upgrading gear upgrades the **slot**, so a new item keeps the level. Slots need Raw Ore and Rolla, plus Refined Ore every 5 levels.","src":["prydwen-beginner-guide"],"q":["When you “upgrade” an Equipment, what you’re actually upgrading is the Slot it belongs to","Refined Ore for every 5 levels"]},{"t":"Daily Dungeons are the main gear source. Your end-chest rank depends on how far you get, not which nodes you pick, so path toward the boss.","src":["prydwen-daily-dungeons"],"q":["Daily Dungeons are the main source of Gear and Gear Shards","is determined by how far you reach in the dungeon, not which nodes you choose"]},{"t":"100 dungeon shards craft a gear piece of your choice; equip the Lucky Statue relic (Grand Treasure Hunt) before dungeon runs for 2x rating rewards.","src":["prydwen-daily-dungeons"],"q":["To craft Gear items of your choice, you need 100 shards","It provides 2x rating rewards"]}]},"gearlines":[{"line":"Duelist line (Duelist, Berserker, Conqueror, Ravager)","lines":[{"t":"Duelist (Tier 2) Sword and Gauntlets: Physical Mastery > Elemental Mastery > Speed > Crit > Accuracy. Boots: Physical Mastery > Elemental Mastery > Speed. Helmet and Chest: DEF first.","src":["prydwen-duelist"],"q":["Sword Physical Mastery > Elemental Mastery > Speed > Crit > Accuracy Gauntlets Physical Mastery > Elemental Mastery > Speed > Crit > Accuracy","Boots Physical Mastery > Elemental Mastery > Speed","Helmet DEF >= Physical Res = Elemental Res > HP > Effect Res Chest DEF >= Physical Res = Elemental Res > HP"]},{"t":"Duelist best substats: Speed, Crit Rate%, Crit Damage%. Duelists have the highest base Speed, and more Speed lets them reach their third turn while an opponent is on its second.","src":["prydwen-duelist"],"q":["Best Stats Speed Crit Rate% Crit Damage%","Duelist has the highest Speed in nature","so you can do turn 3 when your opponent is only at turn 2"]},{"t":"Berserker (Tier 3) Sword, Gauntlets and Boots: Physical Mastery > ATK > SPD. Best substats: Crit Rate%, Crit DMG%, technique damage to debuffed targets.","src":["prydwen-berserker"],"q":["Sword Physical Mastery > ATK > SPD Gauntlets Physical Mastery > ATK > SPD Helmet DEF >= Physical Res = Elemental Res > HP Chest DEF >= Physical Res = Elemental Res > HP Boots Physical Mastery > ATK > SPD","Crit Rate% Crit DMG% Technique DMG dealt to targets with Debuffs"]},{"t":"Conqueror (Tier 4) Sword, Gauntlets and Boots: ATK >= Elemental Mastery > SPD; Physical Mastery becomes undesirable. Best substats: Crit Rate%, Crit DMG%.","src":["prydwen-conqueror"],"q":["Sword ATK >= Elemental Mastery > SPD Gauntlets ATK >= Elemental Mastery > SPD Helmet DEF >= Physical Res = Elemental Res > HP Chest DEF >= Physical Res = Elemental Res > HP Boots ATK >= Elemental Mastery > SPD","Best Stats Crit Rate% Crit DMG%","Undesirable Stats Crit RES % Effect RES Healing Boost% Physical Mastery"]},{"t":"Conqueror gems (Season 2, per gear slot in Prydwen's order): Obsidian > Amethyst >= Ruby; Obsidian > Amethyst >= Citrine; Amethyst > Citrine; Moonstone > Beryl = Sapphire; Citrine > Beryl = Sapphire. Obsidian is rare: Prydwen suggests F2P sell it on the market.","src":["prydwen-conqueror"],"q":["Obsidian (Black) > Amethyst (Purple) >= Ruby (Red)","Obsidian (Black) > Amethyst (Purple) >= Citrine (Yellow)","Amethyst (Purple) > Citrine (Yellow)","Moonstone (White) > Beryl (Green) = Sapphire (Blue)","Citrine (Yellow) > Beryl (Green) = Sapphire (Blue)","it’s better to just sell your Obsidians on the Market"]},{"t":"Ravager (Tier 5) Sword, Gauntlets and Boots: Elemental Mastery > ATK > SPD; Physical Mastery is undesirable. Best substats: Crit Rate%, Crit DMG%.","src":["prydwen-ravager"],"q":["Sword Elemental Mastery > ATK > SPD Gauntlets Elemental Mastery > ATK > SPD Helmet DEF >= Physical Res = Elemental Res > HP Chest DEF >= Physical Res = Elemental Res > HP Boots Elemental Mastery > ATK > SPD","Best Stats Crit Rate% Crit DMG%","Undesirable Stats Crit RES % Effect RES Healing Boost% Physical Mastery"]},{"t":"Relic elements: Fire (for Flame Aura) and Dark if you are preparing for Tier 4.","src":["prydwen-duelist"],"q":["Fire : Very solid thanks to Flame Aura","Darkness : You focus on this elemental if you are preparing for T4"]}]},{"line":"Knight line (Knight, Paladin, Guardian, Templar)","lines":[{"t":"Knight and Paladin Sword: Speed > ATK > Physical Mastery. Shield: DEF > HP > Physical Res = Elemental Res. Boots: SPD > ATK > Elemental Mastery = Physical Mastery. A tank must act first to refresh buffs and taunt.","src":["prydwen-knight","prydwen-paladin"],"q":["Sword Speed > ATK > Physical Mastery Shield DEF > HP > Physical Res = Elemental Res > Anything else","Boots SPD > ATK > Elemental mastery = Physical Mastery","we rate Speed highly since a Tank must act first to refresh buffs/taunt the enemy"]},{"t":"Best substats: Block Rate% and DEF%. Paladin: Elemental Mastery matters more (about 40 points per 1% elemental damage), good for Water builds.","src":["prydwen-knight","prydwen-paladin"],"q":["Best Stats Block Rate% DEF%","with every 40 points or so improving your Elemental damage by 1%"]},{"t":"Power targets Prydwen names: 180k for Hard mode of the second dungeon (Mecha Summit) as a Knight; 580k CP for hard mode of the first seasonal dungeon as a Paladin.","src":["prydwen-knight","prydwen-paladin"],"q":["reach 180k Power as soon as possible, the entry requirement for the Hard mode of the Second Dungeon, Mecha Summit","reach 580k CP as soon as possible, since it will unlock hard mode in the first seasonal dungeon"]},{"t":"Guardian (Tier 4) Sword: Speed > ATK > Physical Mastery > Elemental Mastery. Gems: Obsidian > Amethyst >= Ruby; Moonstone > Sapphire > Citrine; Amethyst > Citrine; Moonstone > Beryl = Sapphire; Sapphire > Citrine > Beryl.","src":["prydwen-guardian"],"q":["Sword Speed > ATK > Physical Mastery > Elemental mastery","Obsidian (Black) > Amethyst (Purple) >= Ruby (Red)","Moonstone (White) > Sapphire (Blue) > Citrine (Yellow)","Amethyst (Purple) > Citrine (Yellow)","Moonstone (White) > Beryl (Green) = Sapphire (Blue)","Sapphire (Blue)>Citrine (Yellow) > Beryl (Green)"]},{"t":"Templar (Tier 5) Sword: Speed > ATK > Elemental ATK > Physical ATK. Shield: Block > DEF > HP > Physical Res = Elemental Res. Boots: SPD > ATK = Elemental mastery > Physical Mastery/Eff Hit Rate. Best substats: Block Rate + Block Efficiency, and Auto-protect on the weapon from Season 3.","src":["prydwen-templar"],"q":["Sword Speed > ATK > Elemental ATK>Physical ATK Shield Block>DEF > HP > Physical Res = Elemental Res > Anything else","Boots SPD > ATK= Elemental mastery>Physical Mastery/Eff Hit Rate","Block Rate + Block Efficiency Auto-protect (Only on weapon, starting from S3)"]},{"t":"Relic elements: Water and Light. Knight top picks include Genesis Dew (5% Block Rate) and Nymph's Sword Hilt (5% Crit Rate).","src":["prydwen-knight"],"q":["For the Knight classes, those are usually Water and Light","Genesis Dew provides 5% block rate","Nymph’s Sword Hilt (5% Crit Rate)"]}]},{"line":"Sage line (Sage, Arcanist, Dominator, Prophet)","lines":[{"t":"Sage (Tier 2) damage build — Staff and Orb: Elemental Mastery > Effect Hit Rate >= ATK > SPD; Boots: Elemental Mastery > ATK > SPD. Healer build — Staff and Orb: SPD > Effect Hit Rate > Elemental Mastery > ATK; Boots: SPD > Elemental Mastery > ATK; Helmet and Chest: HP first.","src":["prydwen-sage"],"q":["Staff - DPS | Staff - Healer Elemental Mastery > Effect Hit Rate >= ATK > SPD | SPD > Effect Hit Rate > Elemental Mastery > ATK Orb - DPS | Orb - Healer Elemental Mastery > Effect Hit Rate >= ATK > SPD | SPD > Effect Hit Rate > Elemental Mastery > ATK","Boots - DPS | Boots - Healer Elemental Mastery > ATK > SPD | SPD > Elemental Mastery > ATK","HP > DEF >= Physical Res = Elemental Res"]},{"t":"Best substats: damage Sage Crit Rate% and Crit Damage%; healer Healing Boost%.","src":["prydwen-sage"],"q":["Crit Rate% Crit Damage% | Healing Boost%"]},{"t":"Arcanist and Dominator damage builds put Effect Hit Rate first on Staff and Orb (Effect Hit Rate >= Elemental Mastery >= ATK > SPD) so damage-over-time lands on bosses.","src":["prydwen-arcanist","prydwen-dominator"],"q":["Staff - DPS | Staff - Healer Effect Hit Rate >= Elemental Mastery >= ATK > SPD | SPD > Effect Hit Rate > Elemental Mastery > ATK Orb - DPS | Orb - Healer Effect Hit Rate >= Elemental Mastery >= ATK > SPD","Effect Hit Rate becoming far more valuable"]},{"t":"Dominator gems — healer: Amethyst on the weapon, Amber on off-hand, helmet and boots (Citrine if you run out), Moonstone on armor. Damage: Obsidian on weapon and off-hand (Amethyst second), Citrine on helmet, Moonstone on armor, Amethyst on boots.","src":["prydwen-dominator"],"q":["Amethyst gems are recommended for the Weapon slot","You want Amber gems in every applicable slot, which are Off-hand, Helmet, and Boots","Obsidian gems are used for the Weapon and Off-hand, with Amethyst gems being the 2nd option","If you run out of Amber gems, your 2nd best option is the Citrine gems","Citrine gems are used for the Helmet slot","Moonstones are used for the Armor","Amethyst gems are preferred over Rubies for the Boots"]},{"t":"Prophet (Tier 5) damage build — Staff and Orb: Effect Hit Rate >= Elemental Mastery >= ATK > SPD; Boots: Elemental Mastery > ATK > SPD. Healer build — Staff and Orb: SPD > Effect Hit Rate > Elemental Mastery > ATK; Boots: SPD > Elemental Mastery > ATK. Prydwen: the main stats don't really change from Dominator.","src":["prydwen-prophet"],"q":["Staff - DPS | Staff - Healer Effect Hit Rate >= Elemental Mastery >= ATK > SPD | SPD > Effect Hit Rate > Elemental Mastery > ATK Orb - DPS | Orb - Healer Effect Hit Rate >= Elemental Mastery >= ATK > SPD | SPD > Effect Hit Rate > Elemental Mastery > ATK","Boots - DPS | Boots - Healer Elemental Mastery > ATK > SPD | SPD > Elemental Mastery > ATK","Even though Prophet plays very differently from Dominator, the main stats don’t really change"]},{"t":"Relics to chase: Nymph's Sword Hilt (Crit Rate), Phantomfire Chain (Effect Hit Rate), and Pinnacle Radiance (Crit DMG, the Cinder Ridge Mythic of choice).","src":["prydwen-sage"],"q":["Nyph’s Sword Hilt : This Relic is hard to get","Phantomfire Chain : Picking up Effect Hit Rate on relics","This is the go-to mythic relic of choice for Cinder Ridge"]}]}],"pets":{"rows":[["Pandarial","Cuts every technique's cooldown by one turn at battle start and boosts damage all fight (BlueStacks).",["cuts the cooldown of every Technique by one turn at the start of battle and grants a damage boost that lasts the whole fight"]],["Nyxarchon","After damaging techniques, Dark AoE damage plus a 10% Defense Reduction stack (up to 30% total Defense Reduction) (BlueStacks).",["applying a 10% Defense Reduction stack","for 30% total Defense Reduction"]],["Aegiswing","Guardian Angel for three turns at battle start; when it ends you restore 50% of lost HP (BlueStacks).",["grants Guardian Angel for three turns at the start of battle","your character restores 50% of osis-tier2"],"q":["They struggle in PVP at that tier, too","thanks to the new passive, they become a PVP menace for the first time","In this configuration, the Sage will play the role of Healer. Void Blessing , Healing Touch and Radiant Restoration are the three main healing techniques. Dark Bullet will do the damage","PvP Sages should invest in HP and Resilience"]},{"t":"Duelist: \"the king of Tier 2 PvP\" (BlueStacks); only Knights reliably counter it. Narcosis favours Crit Damage over Crit Rate in short duels.","src":["bs-tier","bs-class","narcosis-tier2"],"q":["Duelist is the king of Tier 2 PvP","where only Knights reliably counter it","For PvP, Crit Damage over Crit Rate because duels are short"]},{"t":"Knight/Paladin: strong in every PvP format; Paladin's Star Shattering Slash (3-turn cooldown) usually one-shots in PvP.","src":["prydwen-classes-and-roles"],"q":["they’re also a menace in PVP - in all formats","the skill is so strong that it usually kills anyone in PVP","it has a hefty cooldown of 3 turns"]},{"t":"Pets for PvP: [[Pandarial]] and [[Aegiswing]], with [[Kels]] as the alternative (BlueStacks).","src":["bs-fantomon"],"q":["PvP | Pandarial, Aegiswing | Kels"]}],"open":["Exact Arena and 3v3 Tournament reward tables by rank.","Whether the 2v2 and 4v4 formats Prydwen mentions are separate modes or the Tournament.","Ticket count and refill rate (Packsify says 20 saved tickets; no other source confirms)."]},"guild":{"lines":[{"t":"Guilds unlock at level 15. Join an active one immediately.","src":["prydwen-beginner-guide","prydwen-tips-and-tricks"],"q":["Guilds unlock once your character reaches level 15","Join a Guild as soon as you unlock it"]},{"t":"Features: guild boss, guild shop and guild wars; daily donations; AFK-farm resources on a floating island; guild talents (bought by the leader with guild currency) give passive stats to everyone.","src":["prydwen-beginner-guide"],"q":["gaining access to features like the guild boss, shop, and even guild wars"
