  const rows=D.skills.filter(s=>s.type===type&&(!c||s.class===c)&&(!u||(s.used||[]).length)&&(!t||(s.name+' '+s.desc).toLowerCase().includes(t)));
  $('#sCount').textContent=`${rows.length} shown`;
  $('#sTable tbody').innerHTML=rows.map(s=>{const pt=(s.ptier||[])[0];return `<tr><td>${skLink(s.name)}</td><td>${esc(s.class)}</td><td>${pt?tierB(pt.rank):''}</td><td>${(s.used||[]).length||''}</td><td>${esc(s.desc)}${s.cooldown!=null?` <span class="meta">CD ${s.cooldown}</span>`:''}</td></tr>`}).join('');
}

R.pvp=()=>{const P=C.pvp;return `<h2>PvP</h2><p>PvP is auto-battle too: you win with your loadout and stats.</p>
<div class="box conflict"><b>Formats: sources differ.</b>${lines(P.formats)}</div><h3>How to climb</h3>${steps(P.how)}<h3>By class</h3>${lines(P.class)}
<div class="box open"><b>Not published anywhere checked:</b><ul>${P.open.map(o=>`<li>${esc(o)}</li>`).join('')}</ul></div>`};

R.guild=()=>{const G=C.guild;return `<h2>Guild and guild war</h2>${lines(G.lines)}<h3>Your role in group content</h3>${lines(G.roles)}
<h3>Guild war</h3><p>Prydwen lists guild wars as a guild feature${chips(G.war_src)}, but no source checked explains how they work. Open questions:</p>
<div class="box open"><ul>${G.war_open.map(o=>`<li>${esc(o)}</li>`).join('')}</ul></div>
<p>Until rules are published: keep a dedicated PvP loadout, bring your guild the role it lacks (Knight or Sage), and raise power through statues, relics and gear, which lift every mode.<span class="own">Guide's pick</span></p>`};

function todayKey(){const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}
function weekKey(){const d=new Date();const j=new Date(d.getFullYear(),0,1);return d.getFullYear()+'-w'+Math.ceil(((d-j)/864e5+j.getDay()+1)/7)}
R.daily=()=>`<h2>Daily and weekly checklist</h2><p>Ticks are saved in this browser only and reset each day (weekly list: each week). Prydwen expects 15-30 minutes a day once early content is done, more during events.${chips(['prydwen-beginner-guide'])}</p>
<div class="progress"><i id="dProg"></i></div><div class="meta" id="dCount"></div>
<h3>Every day</h3><ul class="check" id="dList">${C.daily.map(r=>chk('d',r)).join('')}</ul>
<h3>Every week</h3><ul class="check" id="wList">${C.weekly.map(r=>chk('w',r)).join('')}</ul><button class="btn" id="resetChk">Clear today's ticks</button>`;
function chk(p,r){return `<li data-id="${esc(r[0])}"><input type="checkbox" id="c-${esc(r[0])}" data-k="${p}"><label for="c-${esc(r[0])}"><span class="t">${esc(r[1])}</span>${chips(r[2])}</label></li>`}
function drawChecks(){
  const ds=store.get('sxs-daily-'+todayKey(),{}),ws=store.get('sxs-weekly-'+weekKey(),{});
  document.querySelectorAll('.check li').forEach(li=>{const id=li.dataset.id,inp=li.querySelector('input'),st=inp.dataset.k==='d'?ds:ws;inp.checked=!!st[id];li.classList.toggle('done',inp.checked)});
  const n=C.daily.length,k=C.daily.filter(r=>ds[r[0]]).length;$('#dProg').style.width=(100*k/n)+'%';$('#dCount').textContent=`${k} of ${n} daily tasks done`;
}

R.skip=()=>`<h2>What to skip</h2><p>Common mistakes the sources warn about.</p>${lines(C.skip)}`;

R.events=()=>{const E=C.events;return `<h2>Events, seasons and codes</h2>
${table(['When','Event','F2P takeaway','Sources'],E.rows.map(r=>[`<b>${esc(r[0])}</b>${r[5]==='unverified'?'<br><span class="warn">Unverified</span>':''}${r[5]==='lowtrust'?'<br><span class="meta">lower-trust source</span>':''}`,esc(r[1]),esc(r[2]),chips(r[3])]))}
<div class="box">${line(E.pattern)}</div><h3>How seasons work</h3>${lines(E.seasons)}
<h3>Gift codes</h3>${lines([E.codes_note])}${table(['Code','Reward (as listed)'],E.codes.map(r=>[`<code>${esc(r[0])}</code>`,esc(r[1])]))}`};

R.open=()=>`<h2>Open questions</h2><p>Things no checked source publishes, or where sources conflict and nothing settles it. Check these in game.</p>
${table(['Topic','Status'],C.open.map(r=>[`<b>${esc(r[0])}</b>`,esc(r[1])]))}`;

R.sources=()=>`<h2>Sources</h2><p>Every page this guide cites, cached with its fetch date. Higher-trust sites are build databases and major outlets; lower-trust sites are affiliate or top-up sellers and are cross-checked where possible. Pages that block direct download were read through a summarising fetch and are marked.</p>
${table(['Source','Trust','Fetched','Note'],D.sources.map(s=>[`<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.name)}</a>`,s.trust==='high'?'Higher':'<span style="color:var(--gold)">Lower</span>',esc(s.fetched||''),s.via&&s.via.includes('webfetch')?'Read via WebFetch summary (site returns 403)':(s.via&&s.via.includes('parse')?'Parsed from the site':'')]))}`;

/* ------------------------------------------------------------------ loadout picker */
const PK=D.picker;const ROLE={aoe:'AoE',st:'single target',cc:'crowd control',support:'support'};
R.picker=()=>`<h2>My loadout picker (Mage, Tier 1)</h2>
<p>Tick the techniques and charms you own. The picker builds an <b>Exploration</b> loadout (AoE, AoE, crowd control, single target) and a <b>Boss</b> loadout (four single-target picks) from them, ranked by Prydwen's Mage tier list. Your ticks are saved in this browser.</p>
<div class="filters"><button class="btn pri" id="pkPreset">Starter Mage (lvl 20) preset</button><button class="btn" id="pkAll">Tick all</button><button class="btn" id="pkNone">Clear</button></div>
<h3>Techniques you own</h3><div class="owned" id="pkTech">${PK.tech.map(t=>ownBox('t',t)).join('')}</div>
<h3>Charms you own</h3><div class="owned" id="pkCharm">${PK.charm.map(t=>ownBox('c',t)).join('')}</div>
<div class="grid" id="pkOut"></div>
<h3>Your skills, rated</h3><p class="meta">Every skill you ticked, with Prydwen's Mage tier, allthings.how's tier (where it rates the skill) and how many published builds use it.</p><div id="pkRated"></div>
<h3>Target builds once you pull the missing skills</h3><div id="pkMiss"></div><div class="grid" id="pkTargets"></div>
<h3>How the picker decides</h3><ul class="lines">
<li>Technique roles come from Prydwen's Mage guide (its AoE and single-target sections) and from each skill's description (Freeze or Immobilize chance = crowd control; heals and summons = support, never auto-picked for damage).${chips(['prydwen-mage','prydwen-skills-db'])}</li>
<li>Within a role, the higher Prydwen Mage tier wins (T0 best). Ties go to more hits per cast: Prydwen says more hits means more Unstable Aura procs.${chips(['prydwen-tierlist-db','prydwen-mage'])}</li>
<li>Charms rank by Prydwen's Mage tier. On a tie, Wind's Whisper then Heart of Flame win, because Prydwen names them as the stand-ins for a missing Mana Surge or Gale Shield. Water to Ice drops to last without Water Assault; Flaming Path drops to last for bosses.${chips(['prydwen-mage'])}</li>
<li>If you keep dying before your techniques fire, swap a charm for Tough Soul (HP), as in mobi.gg's beginner build.${chips(['mobi-mage'])}</li></ul>`;
function ownBox(k,t){return `<label><input type="checkbox" data-k="${k}" value="${esc(t.name)}"> ${esc(t.name)} <span class="r">${t.rank?'Prydwen '+esc(t.rank):'unrated'}</span></label>`}
function pkState(){return store.get('sxs-owned',null)}
function pkSave(o){store.set('sxs-owned',o)}
function pickLoadouts(ownT,ownC){
  const T=PK.tech.filter(t=>ownT.has(t.name)),Cc=PK.charm.filter(c=>ownC.has(c.name));
  const rankT=(a,b)=>a.r-b.r||b.hits-a.hits||a.name.localeCompare(b.name);
  const out={};
  for(const mode of ['explore','boss']){
    const used=new Set(),tech=[];
    for(const role of PK.templates[mode]){
      let c=T.filter(t=>!used.has(t.name)&&t.roles.includes(role)).sort(rankT)[0];
      if(!c)c=T.filter(t=>!used.has(t.name)&&!t.roles.includes('support')).sort(rankT)[0];
      if(!c)c=T.filter(t=>!used.has(t.name)).sort(rankT)[0];
      if(c){used.add(c.name);tech.push({name:c.name,role,why:`Prydwen ${c.rank||'unrated'} · ${c.roles.map(r=>ROLE[r]).join(' + ')||'no role'}${c.hits>1?' · '+c.hits+' hits':''}`})}
    }
    const hasWA=tech.some(t=>t.name==='Water Assault');
    const key=c=>{let r=c.r;if(c.name==='Water to Ice'&&!hasWA)r=99;if(c.name==='Flaming Path'&&mode==='boss')r=99;const si=PK.standin.indexOf(c.name);return [r,si<0?9:si,c.name]};
    const charms=Cc.slice().sort((a,b)=>{const x=key(a),y=key(b);return x[0]-y[0]||x[1]-y[1]||x[2].localeCompare(y[2])}).slice(0,4)
      .map(c=>({name:c.name,why:`Prydwen ${c.rank||'unrated'}`+(PK.standin.includes(c.name)?' · Prydwen stand-in':'')}));
    out[mode]={tech,charms};
  }
  return out;
}
function drawPicker(){
  let st=pkState();if(!st)st={t:PK.preset.tech,c:PK.preset.charm};
  const ownT=new Set(st.t),ownC=new Set(st.c);
  document.querySelectorAll('#pkTech input,#pkCharm input').forEach(i=>{i.checked=(i.dataset.k==='t'?ownT:ownC).has(i.value);i.parentNode.classList.toggle('on',i.checked)});
  const L=pickLoadouts(ownT,ownC);
  const card=(title,m)=>`<div class="result" data-mode="${m}"><h4>${title}</h4><b class="meta">Techniques</b><ol class="pk-t">${L[m].tech.map(t=>`<li data-name="${esc(t.name)}">${skLink(t.name)}<span class="why">${esc(ROLE[t.role])} slot · ${esc(t.why)}</span></li>`).join('')||'<li class="meta">Tick some techniques</li>'}</ol>
   <b class="meta">Charms</b><ol class="pk-c">${L[m].charms.map(c=>`<li data-name="${esc(c.name)}">${skLink(c.name)}<span class="why">${esc(c.why)}</span></li>`).join('')||'<li class="meta">Tick some charms</li>'}</ol><span class="own">Guide's pick from your skills</span></div>`;
  $('#pkOut').innerHTML=card('Exploration (story, waves, dungeons)','explore')+card('Bosses (single target)','boss');
  const own=new Set([...ownT,...ownC]);
  $('#pkRated').innerHTML=table(['Skill','Type','Prydwen (Mage)','allthings.how','Builds','Verdict'],[...ownT,...ownC].map(n=>SK[n]).filter(Boolean).sort((a,b)=>a.type.localeCompare(b.type)||((a.ptier||[{}])[0].rank||'T9').localeCompare((b.ptier||[{}])[0].rank||'T9')).map(s=>[skLink(s.name),esc(s.type),tierB(((s.ptier||[]).find(p=>p.cls==='Mage')||{}).rank),tierB(s.atier),String((s.used||[]).length),esc(s.verdict)]))+'<p>'+chips(['prydwen-tierlist-db','allthings-tier'])+'</p>';
  const tg=PK.targets.map(id=>BUILD[id]);
  const miss={};tg.forEach(b=>[...b.tech,...b.charm].forEach(n=>{if(!own.has(n)&&n!=='FLEX')miss[n]=(miss[n]||0)+1}));
  const top=Object.entries(miss).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0])).slice(0,6);
  $('#pkMiss').innerHTML=top.length?`<p>Missing skills that appear in the most published Mage builds: ${top.map(([n,k])=>`${skLink(n)} (${k})`).join(', ')}.<span class="own">Counted from the builds below</span></p>`:'<p>You own everything the published Mage builds use.</p>';
  $('#pkTargets').innerHTML=tg.map(b=>buildCard(b,{own})).join('');
}

/* ------------------------------------------------------------------ cards, search, routing */
function skillCard(n){
  const s=SK[n];if(!s)return;
  const used=(s.used||[]).map(id=>BUILD[id]);
  $('#dlgIn').innerHTML=`<h3 style="margin-top:0">${esc(s.name)}</h3><div class="kv"><b>Type</b><span>${esc(s.type)}</span><b>Class</b><span>${esc(s.class)}</span>
  ${s.element&&s.element.length?`<b>Damage</b><span>${esc(s.element.join(', '))}</span>`:''}${s.cooldown!=null?`<b>Cooldown</b><span>${s.cooldown} turn(s)</span>`:''}
  <b>Prydwen tier</b><span>${(s.ptier||[]).map(p=>`${tierB(p.rank)} ${esc(p.cls)} (${esc(p.tab)})`).join(' ')||'Not on the list'}</span>
  ${s.atier?`<b>allthings.how</b><span>${tierB(s.atier)} (May 2026)</span>`:''}<b>Verdict</b><span>${esc(s.verdict)}</span></div>
  <p>${esc(s.desc)}${chips(['prydwen-skills-db'])}</p>
  <h4>Builds that use it (${used.length})</h4>${used.length?'<ul>'+used.map(b=>`<li><a href="#builds" data-goto="${b.id}">${esc(b.cls)} · ${esc(b.label)}</a> <span class="meta">${esc(b.mode)}</span>${chips(b.src)}</li>`).join('')+'</ul>':'<p class="meta">None of the published builds checked use it.</p>'}`;
  openDlg();
}
function petCard(n){const r=PETS[n];if(!r)return;$('#dlgIn').innerHTML=`<h3 style="margin-top:0">${esc(n)}</h3><div class="kv"><b>BlueStacks</b><span>${tierB(r[1])||'—'}</span><b>mobi.gg</b><span>${tierB(r[2])||'—'}</span><b>allthings.how</b><span>${tierB(r[3])||'—'}</span></div><p>${esc(r[4])}${chips(['bs-fantomon','mobi-fantomon'])}</p><p><a href="#pets">All Fantomon →</a></p>`;openDlg();}
function openDlg(){const d=$('#dlg');try{d.open?0:d.showModal()}catch(e){d.setAttribute('open','')}}
$('#dlgX').onclick=()=>$('#dlg').close();
$('#dlg').addEventListener('click',e=>{if(e.target.id==='dlg')$('#dlg').close()});

let INDEX=null;
function buildIndex(){
  INDEX=[];
  for(const g of SECTIONS)for(const [id,title] of g[1]){const html=R[id]();const tmp=document.createElement('div');tmp.innerHTML=html;INDEX.push({k:'sec',id,title,sub:g[0],text:tmp.textContent.toLowerCase()})}
  D.skills.forEach(s=>INDEX.push({k:'skill',id:s.name,title:s.name,sub:`${s.type} · ${s.class}`,text:(s.name+' '+s.desc).toLowerCase()}));
  Object.keys(PETS).forEach(p=>INDEX.push({k:'pet',id:p,title:p,sub:'Fantomon',text:(p+' '+PETS[p][4]).toLowerCase()}));
  D.builds.forEach(b=>INDEX.push({k:'build',id:b.id,title:`${b.cls} · ${b.label}`,sub:'Build',text:(b.cls+' '+b.label+' '+b.tech.join(' ')+' '+b.charm.join(' ')).toLowerCase()}));
}
function search(q){
  q=q.trim().toLowerCase();const box=$('#results');if(!q){box.hidden=true;return}
  if(!INDEX)buildIndex();
  const words=q.split(/\s+/);
  const hits=INDEX.map(it=>{let sc=0;const t=it.title.toLowerCase();if(t===q)sc+=100;if(t.startsWith(q))sc+=40;if(t.includes(q))sc+=20;if(words.every(w=>it.text.includes(w)))sc+=5+(it.k==='sec'?0:2);return [sc,it]}).filter(x=>x[0]>0).sort((a,b)=>b[0]-a[0]).slice(0,14);
  box.innerHTML=hits.length?hits.map(([,it],i)=>`<a href="${it.k==='sec'?'#'+it.id:it.k==='skill'?'#skill/'+encodeURIComponent(it.id):it.k==='pet'?'#pet/'+encodeURIComponent(it.id):'#builds'}" data-goto="${it.k==='build'?it.id:''}" class="${i?'':'sel'}">${esc(it.title)}<small>${esc(it.sub)}</small></a>`).join(''):'<a><small>No match</small></a>';
  box.hidden=false;
}
$('#q').addEventListener('input',e=>search(e.target.value));
$('#q').addEventListener('keydown',e=>{if(e.key==='Enter'){const a=$('#results a.sel');if(a&&a.getAttribute('href')){a.click()}}if(e.key==='Escape'){$('#results').hidden=true}});
document.addEventListener('click',e=>{if(!e.target.closest('.search'))$('#results').hidden=true});

function nav(){
  $('#nav').innerHTML=SECTIONS.map(g=>`<div class="grp">${esc(g[0])}</div>`+g[1].map(([id,t])=>`<a href="#${id}" data-id="${id}">${esc(t)}</a>`).join('')).join('');
}
let current='';
function show(id,opts={}){
  if(!R[id])id='home';
  if(id!==current){
    $('#main').innerHTML=R[id]()+`<p class="foot">Fan-made guide. Not affiliated with Boltray Games. Last checked ${esc(D.checked)}; game version ${esc(D.version)}.</p>`;
    current=id;
    document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('on',a.dataset.id===id));
    document.title=(id==='home'?'':TITLES[id]+' · ')+'Sword x Staff Guide';
    after(id);
    if(!opts.keepScroll)window.scrollTo(0,0);
  }
  document.body.classList.remove('menu');
}
function after(id){
  if(id==='builds'){['#fLine','#fMode','#fText'].forEach(s=>$(s).addEventListener('input',drawBuilds));const pre=store.get('sxs-bfilter',null);drawBuilds();}
  if(id==='techniques'||id==='charms'){const t=id==='techniques'?'Technique':'Charm';['#sText','#sCls','#sUsed'].forEach(s=>$(s).addEventListener('input',()=>drawSkills(t)));drawSkills(t)}
  if(id==='daily'){drawChecks();document.querySelectorAll('.check input').forEach(i=>i.addEventListener('change',()=>{const k=i.dataset.k==='d'?'sxs-daily-'+todayKey():'sxs-weekly-'+weekKey();const st=store.get(k,{});st[i.closest('li').dataset.id]=i.checked;store.set(k,st);drawChecks()}));
    $('#resetChk').onclick=()=>{store.set('sxs-daily-'+todayKey(),{});drawChecks()}}
  if(id==='picker'){drawPicker();
    document.querySelectorAll('#pkTech input,#pkCharm input').forEach(i=>i.addEventListener('change',()=>{const t=[...document.querySelectorAll('#pkTech input:checked')].map(x=>x.value),c=[...document.querySelectorAll('#pkCharm input:checked')].map(x=>x.value);pkSave({t,c});drawPicker()}));
    $('#pkPreset').onclick=()=>{pkSave({t:PK.preset.tech,c:PK.preset.charm});drawPicker()};
    $('#pkAll').onclick=()=>{pkSave({t:PK.tech.map(x=>x.name),c:PK.charm.map(x=>x.name)});drawPicker()};
    $('#pkNone').onclick=()=>{pkSave({t:[],c:[]});drawPicker()};}
}
function route(){
  $('#results').hidden=true;
  const h=decodeURIComponent(location.hash.slice(1));
  if(h.startsWith('skill/')){if(!current)show('techniques');skillCard(h.slice(6));return}
  if(h.startsWith('pet/')){if(!current)show('pets');petCard(h.slice(4));return}
  show(h||'home');
}
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-goto]');
  if(g&&g.dataset.goto){e.preventDefault();$('#dlg').open&&$('#dlg').close();$('#results').hidden=true;location.hash='builds';show('builds');const el=document.getElementById(g.dataset.goto);if(el){el.scrollIntoView({block:'center'});el.style.outline='2px solid var(--acc)'}return}
  const f=e.target.closest('[data-filter]');if(f){setTimeout(()=>{const s=$('#fLine');if(s){s.value=f.dataset.filter;drawBuilds()}},0)}
  if(e.target.closest('#results a')){$('#results').hidden=true;$('#q').value=''}
});
$('#menuBtn').onclick=()=>document.body.classList.toggle('menu');
window.addEventListener('hashchange',route);
$('#checked').textContent=`Last checked against ${D.against} on ${D.checked}, game version ${D.version}.`;
nav();route();
if(location.protocol==='https:'&&'serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{})}
</script>
</body>
</html>
