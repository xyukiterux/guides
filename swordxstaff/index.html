<title>Sword x Staff Guide</title>

<style>
:root{
  --ink:#19202b;--panel:#242d3b;--panel-2:#2b3545;--well:#161c26;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.14);
  --paper:#ece6dc;--muted:#a39e95;--ai:#7c9be0;--matcha:#8fbf8a;--gold:#e3b35c;--beni:#e06b5a;--sakura:#f0a9c0;
  --acc:#a08fd0;--acc-ink:#1a1530;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --r:12px;
}
*{box-sizing:border-box}
html{background:var(--ink)}
body{margin:0;background:radial-gradient(1100px 600px at 85% -10%,rgba(160,143,208,.13),transparent 60%),var(--ink);color:var(--paper);font:15.5px/1.6 var(--sans)}
a{color:var(--ai)}
h1,h2,h3,h4{font-family:var(--serif);font-weight:600;line-height:1.2;margin:0 0 .45em;letter-spacing:.005em}
h2{font-size:1.75rem}h3{font-size:1.2rem;margin-top:1.4em}h4{font-size:1.02rem;margin-top:1em}
button{font:inherit;color:inherit;cursor:pointer}
.shell{display:grid;grid-template-columns:270px minmax(0,1fr);min-height:100vh}
aside{position:sticky;top:0;height:100vh;overflow:auto;background:var(--well);border-right:1px solid var(--line);padding:18px 14px 40px}
.brand{display:flex;gap:10px;align-items:center;color:var(--paper);text-decoration:none}
.brand b{font-family:var(--serif);font-size:1.2rem;display:block}
.brand small{color:var(--acc);letter-spacing:.18em;font-size:.66rem;text-transform:uppercase}
.checked{font-size:.74rem;color:var(--muted);margin:10px 0 12px;line-height:1.45}
.search{position:relative}
.search input{width:100%;padding:10px 12px 10px 34px;border-radius:10px;border:1px solid var(--line2);background:var(--panel);color:var(--paper);font:inherit;outline:none}
.search input:focus{border-color:var(--acc)}
.search svg{position:absolute;left:10px;top:12px;opacity:.6}
.results{position:absolute;left:0;right:0;top:44px;z-index:30;background:var(--panel-2);border:1px solid var(--line2);border-radius:10px;max-height:60vh;overflow:auto;box-shadow:0 12px 30px rgba(0,0,0,.45)}
.results a{display:block;padding:8px 11px;color:var(--paper);text-decoration:none;border-bottom:1px solid var(--line);font-size:.9rem}
.results a:hover,.results a.sel{background:rgba(160,143,208,.18)}
.results a small{display:block;color:var(--muted);font-size:.74rem}
nav{margin-top:12px;display:flex;flex-direction:column;gap:1px}
nav .grp{font-size:.66rem;letter-spacing:.18em;color:var(--muted);margin:14px 8px 4px;text-transform:uppercase}
nav a{padding:7px 10px;border-radius:8px;color:var(--paper);text-decoration:none;font-size:.92rem}
nav a:hover{background:var(--panel)}
nav a.on{background:var(--acc);color:var(--acc-ink);font-weight:600}
main{min-width:0;padding:26px clamp(16px,3.2vw,52px) 90px}
.topbar{display:none}
.hero{border-radius:18px;padding:clamp(20px,4vw,40px);margin-bottom:20px;border:1px solid var(--line2);
  background:linear-gradient(135deg,rgba(160,143,208,.22),transparent 60%),linear-gradient(315deg,rgba(124,155,224,.12),transparent 55%),var(--panel)}
.hero .k{color:var(--acc);letter-spacing:.2em;font-size:.72rem;text-transform:uppercase;font-weight:700}
.hero h1{font-size:clamp(2.1rem,5.4vw,3.4rem);margin:.15em 0 .25em}
.hero p{max-width:760px;color:#d8d2c8;font-size:1.04rem;margin:.4em 0}
.lastcheck{display:inline-block;margin-top:8px;padding:6px 10px;border-radius:8px;background:rgba(0,0,0,.25);border:1px solid var(--line2);font-size:.8rem;color:#d8d2c8}
p{max-width:110ch}
.lines{list-style:none;padding:0;margin:.4em 0 1em;display:flex;flex-direction:column;gap:8px;max-width:110ch}
.lines li{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 13px}
ol.steps{padding-left:0;list-style:none;counter-reset:s;max-width:110ch;margin:.4em 0 1.2em}
ol.steps li{counter-increment:s;position:relative;padding:9px 13px 9px 46px;background:var(--panel);border:1px solid var(--line);border-radius:10px;margin:7px 0}
ol.steps li::before{content:counter(s);position:absolute;left:11px;top:9px;width:24px;height:24px;border-radius:50%;background:var(--acc);color:var(--acc-ink);display:grid;place-items:center;font-weight:700;font-size:.82rem}
.need{color:var(--muted);font-style:italic;margin:.2em 0 .8em}
.buy-cards{display:none}
@media (max-width:600px){.tablewrap table.stack{min-width:0}#sTable td:last-child{min-width:0}table.stack thead{display:none}table.stack tr{display:block;border-bottom:1px solid var(--line2);padding:6px 0}table.stack td{display:block;border:0;padding:4px 10px}table.stack td:empty{display:none}table.stack td::before{content:attr(data-label);display:block;font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}}.buy-cards .card{margin:8px 0}.buy-cards .bsrc{margin-top:6px;font-size:.9rem}
@media (max-width:600px){.buy-cards{display:block}.buy-table{display:none}}
ol.steps .why{display:block;font-size:.84rem;color:var(--muted);margin-top:3px}
.chips{display:inline-flex;flex-wrap:wrap;gap:4px;margin-left:6px;vertical-align:baseline}
.src{font-size:.68rem;padding:1px 7px;border-radius:999px;border:1px solid rgba(124,155,224,.45);color:var(--ai);text-decoration:none;white-space:nowrap}
.src.low{border-color:rgba(227,179,92,.45);color:var(--gold)}
.own{font-size:.68rem;padding:1px 7px;border-radius:999px;background:rgba(143,191,138,.16);color:var(--matcha);border:1px solid rgba(143,191,138,.4);white-space:nowrap;margin-left:6px}
.warn{display:block;margin-top:5px;font-size:.8rem;color:var(--gold)}
.box{border-radius:12px;padding:12px 15px;margin:12px 0;border:1px solid var(--line2);background:var(--panel-2);max-width:110ch}
.box.conflict{border-color:rgba(227,179,92,.5);background:rgba(227,179,92,.07)}
.box.conflict>b:first-child{color:var(--gold)}
.box.open{border-color:rgba(224,107,90,.45);background:rgba(224,107,90,.07)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);margin:10px 0 16px;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--panel-2);font-weight:600;white-space:nowrap;position:sticky;top:0}
tr:hover td{background:rgba(255,255,255,.02)}
td .src{font-size:.64rem}
.tier{display:inline-grid;place-items:center;min-width:30px;height:22px;padding:0 6px;border-radius:6px;font-weight:700;font-size:.78rem;color:#151515;background:#777}
.tSSS,.tSS{background:#f0a9c0}.tS{background:#e06b5a}.tA{background:#e3b35c}.tB{background:#8fbf8a}.tC{background:#7c9be0}
.tT0{background:#f0a9c0}.tT05{background:#e06b5a}.tT1{background:#e3b35c}.tT2{background:#8fbf8a}.tT3{background:#7c9be0}.tT4{background:#8a8f99}
.sk{color:var(--sakura);text-decoration:none;border-bottom:1px dotted rgba(240,169,192,.5);cursor:pointer}
.sk:hover{color:#fff}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:13px 15px;min-width:0}
.card h4{margin:0 0 4px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.card .meta{font-size:.76rem;color:var(--muted)}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0}
.slots div{background:var(--well);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:.82rem;min-height:32px}
.slots .lab{grid-column:1/-1;font-size:.66rem;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;background:none;border:0;padding:4px 0 0;min-height:0}
.mode{font-size:.66rem;padding:2px 8px;border-radius:999px;background:var(--well);border:1px solid var(--line2);color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0 14px}
.filters input,.filters select{background:var(--well);color:var(--paper);border:1px solid var(--line2);border-radius:8px;padding:7px 10px;font:inherit;font-size:.88rem}
.btn{background:var(--panel-2);border:1px solid var(--line2);border-radius:999px;padding:7px 14px;font-size:.88rem}
.btn:hover{border-color:var(--acc)}
.btn.pri{background:var(--acc);color:var(--acc-ink);border-color:var(--acc);font-weight:600}
.owned{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:6px;margin:6px 0 14px}
.owned label{display:flex;gap:8px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 9px;font-size:.88rem;cursor:pointer}
.owned label.on{border-color:var(--acc);background:rgba(160,143,208,.12)}
.owned input{accent-color:var(--acc);width:17px;height:17px}
.owned .r{margin-left:auto;font-size:.7rem;color:var(--muted)}
.result{background:linear-gradient(135deg,rgba(160,143,208,.14),transparent 70%),var(--panel);border:1px solid rgba(160,143,208,.4);border-radius:14px;padding:14px 16px}
.result ol{margin:6px 0 0;padding-left:22px}
.result li{margin:4px 0}
.result .why{display:block;font-size:.78rem;color:var(--muted)}
.check{list-style:none;padding:0;margin:6px 0 14px;max-width:110ch}
.check li{display:flex;gap:10px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin:6px 0}
.check input{accent-color:var(--matcha);width:19px;height:19px;margin-top:2px;flex:none}
.check li.done{opacity:.55}
.check li.done span.t{text-decoration:line-through}
.progress{height:8px;border-radius:999px;background:var(--well);overflow:hidden;margin:6px 0 4px;max-width:520px}
.progress i{display:block;height:100%;background:var(--matcha);width:0;transition:width .25s}
dialog{border:1px solid var(--line2);border-radius:16px;background:var(--panel);color:var(--paper);max-width:min(640px,94vw);width:100%;padding:0}
dialog::backdrop{background:rgba(8,10,14,.7)}
dialog .in{padding:18px 20px 20px}
dialog .x{position:absolute;right:10px;top:8px;background:none;border:0;font-size:1.5rem;color:var(--muted)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:.88rem;margin:10px 0}
.kv b{color:var(--muted);font-weight:500}
.foot{margin-top:40px;color:var(--muted);font-size:.78rem;max-width:110ch}
.cards-nav{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));margin:14px 0}
.cards-nav a{display:block;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-decoration:none;color:var(--paper)}
.cards-nav a:hover{border-color:var(--acc)}
.cards-nav a small{display:block;color:var(--muted);font-size:.8rem;margin-top:3px}
.stage{border-left:3px solid var(--acc);padding-left:14px;margin:22px 0}
@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  aside{position:fixed;inset:0 auto 0 0;width:min(86vw,320px);transform:translateX(-102%);transition:transform .2s;z-index:50;box-shadow:0 0 40px rgba(0,0,0,.6)}
  body.menu aside{transform:none}
  .topbar{display:flex;gap:10px;align-items:center;position:sticky;top:0;z-index:40;background:rgba(22,28,38,.96);border-bottom:1px solid var(--line);padding:10px 16px}
  .topbar b{font-family:var(--serif)}
  main{padding:16px 16px 80px}
  table{font-size:.82rem}
  .tablewrap table{min-width:600px}
  #sTable td:last-child{min-width:240px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<script>
const D={"checked":"2026-10-19","version":"not published","against":"Prydwen, BlueStacks, mobi.gg, AllClash, Pocket Tactics, EOG.GG, Inven Global and lower-trust guide sites","content":{"home":{"lead":"Sword x Staff (Boltray Games, iOS and Android) is an idle RPG with auto-battle: you never steer your character in a fight, in PvE or PvP. This guide is for a free-to-play account that wants to stay near the top of its server.","lead_src":["prydwen-beginner-guide"],"lead_q":["The game features auto-battling and no manual control of your character during fights , in PVE and in PVP"],"rules":[{"t":"**Pull skills on Tier 1 until your class is level 18.** Skill pulls are how you level the class, and you cannot advance to Tier 2 until it is level 18. After that, you can save pulls.","src":["prydwen-tips-and-tricks"],"q":["you must pull skills until you fulfill the condition to advance to the next tier, and only after that can you save pulls","you need to reach level 18 of the T1 class"]},{"t":"**Save Luminium, Radiant Stars and Skill Shard Vouchers for the pink Premium banner** that opens at Cinder Ridge (BlueStacks; Prydwen says the Premium banner costs Covenite).","src":["bs-tips","prydwen-gacha"],"q":["save every single bit of your Luminium, Radiant Stars, and Skill Shard Vouchers until you finally reach the Cinder Ridge region","Covenite, the currency used for the Premium Gacha"]},{"t":"**Spend some Dawnium every day** on the extra dungeon and material runs (see Save and spend). Prydwen says the game pushes you to; Narcosis says to bank it. Both views are shown in Save and spend.","src":["prydwen-beginner-guide","narcosis-gacha"],"q":["you’re highly incentivized to spend some every day","save Dawnium"]},{"t":"**Build one element and one main build at a time.** Relic affinity, Fantomon materials and skill-slot levels all reward focus.","src":["prydwen-tips-and-tricks","packsify","bs-tips"],"q":["Unless you’re certain of the Element you want to focus on, save up your Elemental Relic pulls","commit to one element and finish it before touching a second","avoid spreading your upgrade materials thinly"]},{"t":"**Claim AFK rewards twice a day.** The idle reward cap is roughly 12 to 16 hours; hours past it are lost (one lower-trust source).","src":["narcosis-progress"],"q":["AFK reward cap: roughly 12 to 16 hours"]}],"how":[{"t":"New player: read How to start, then Save and spend, then the Mage line (or your class). Use the rest as reference.","src":[],"q":[],"own":true},{"t":"Every line shows its sources as small tags. Click a tag to open the page it came from. Lines marked **Guide's pick** are this guide's own reasoning from those sources.","src":[],"q":[],"own":true},{"t":"Where sources disagree, the guide shows each claim side by side instead of picking one silently. Check the in-game rates screen for anything about pulls.","src":[],"q":[],"own":true},{"t":"Balance changes with every new tier and season (roughly every 2 to 3 months), so recheck builds after each one.","src":["prydwen-classes-and-roles"],"q":["Roughly every 2-3 months, a new Tier is added to the game together with a new Season"]}]},"start":{"need":"You'll need: the game installed, about an hour for day 1, and a server your friends are on.","day1":[{"t":"Pick the server your friends or guild play on.","src":["prydwen-tips-and-tricks"],"q":["Guilds are per Server","Servers have a 5000 player cap"],"note":"Guilds are per server, and servers close at 5,000 players."},{"t":"Pick Mage or Warrior as the playstyle you enjoy.","src":["prydwen-classes-and-roles","bs-beginner"],"q":["Mages do progress slightly faster","The Warrior path utilizing the Sword is highly recommended for beginners","you can change your class at any time"],"note":"Mage clears stages slightly faster early but is squishy; Warrior is more forgiving. You can change class at any time."},{"t":"Finish the tutorial.","src":["prydwen-reroll-guide"],"q":["Follow the tutorial as it guides you"]},{"t":"Turn on 2x battle speed once you have lost to the Bear.","src":["prydwen-reroll-guide"],"q":["After losing to the Bear, you unlock x2 battle speed"]},{"t":"Claim every event tab.","src":["prydwen-reroll-guide"],"q":["go through all the various event tabs, the shop, the mail, and the codes to claim as many pulls as you can"]},{"t":"Claim your mail.","src":["prydwen-reroll-guide"],"q":["10 pulls from the mail"]},{"t":"Claim the daily login.","src":["prydwen-reroll-guide"],"q":["10 pulls from the daily login","you’ll get around 45 pulls + 10 pulls forcefully spent during the tutorial"],"note":"Prydwen counts about 45 pulls plus the 10 forced tutorial pulls before codes."},{"t":"Tap the box-shaped icon.","src":["mobi-codes"],"q":["Now click on the box-shaped icon"]},{"t":"Select **User Centre**.","src":["mobi-codes"],"q":["Select “User Centre”"]},{"t":"Select **Gift Codes**.","src":["mobi-codes"],"q":["Now, select “Gift Codes”"]},{"t":"Enter each code from the Events and codes section.","src":["mobi-codes"],"q":["Enter one of the Sword x Staff codes listed above"]},{"t":"Do 10-pulls on the Standard skill banner.","src":["narcosis-progress"],"q":["Pulling singles instead of saving for 10-pulls"],"note":"Narcosis lists single pulls as a common mistake."},{"t":"Open the My loadout picker and equip the setup it gives you.","src":[],"q":[],"own":true},{"t":"Save one loadout for exploration and one for bosses.","src":["prydwen-classes-and-roles"],"q":["up to seven different loadouts"],"note":"You get up to seven loadouts."},{"t":"Push the campaign and clear map fog.","src":["bs-tips"],"q":["Map progression is your true level in this game"]},{"t":"Activate every Goddess Statue you find.","src":["bs-tips"],"q":["permanent multiplier boosts to your offline idle income, experience gains, and base combat statistics"],"note":"Statues permanently raise idle income, EXP and combat stats."},{"t":"Upgrade skill **slots** and gear **slots** evenly.","src":["prydwen-tips-and-tricks","bs-beginner"],"q":["Level Skill and Gear slots equally","it instantly inherits that slot level"],"note":"A new skill or item inherits the slot's level."},{"t":"Spend Stamina on Rolla nodes.","src":["prydwen-tips-and-tricks"],"q":["The best way to use Stamina early on is on Rolla"],"note":"Rolla buys raw resources and daily-shop refreshes."}],"week1":[{"t":"At level 15, join an active guild.","src":["prydwen-tips-and-tricks","bs-tips"],"q":["Level 15 - Join a Guild as soon as you unlock it"]},{"t":"At level 18, refresh the Vendor Booth a few times.","src":["prydwen-tips-and-tricks"],"q":["Vendor Booth unlocks at level 18","even F2P should refresh it a few times"]},{"t":"Buy every material in the Vendor Booth.","src":["prydwen-tips-and-tricks"],"q":["buy every material there"]},{"t":"Keep pulling until your Tier 1 class reaches level 18.","src":["prydwen-tips-and-tricks"],"q":["you need to reach level 18 of the T1 class"],"note":"After that you can save pulls."},{"t":"On day 3, before bed, unlock the second continent (level 40).","src":["prydwen-tips-and-tricks"],"q":["On Day 3 , before going to sleep, try to unlock the second Continent (level 40 required)"]},{"t":"Clear the first zone of the second continent.","src":["prydwen-tips-and-tricks"],"q":["clear the first zone","more than triples your base EXP gain","The Level 19 Blessing Statue"],"note":"The level 19 Blessing Statue there more than triples base EXP."},{"t":"At level 39, spend the gifts you saved evenly across your companions; after that, focus one companion of each gift type (Crit or Block givers).","src":["prydwen-tips-and-tricks","mobi-companions"],"q":["Level 39 - Companions unlock","You can level them equally using the Gifts you gathered so far","make sure to focus on one Companion of each gift type in the future, focusing on those who give Crit or Block","Sword x Staff companions are essential for boosting your class stats . They are available from level 38"],"note":"mobi.gg says companions open at level 38."},{"t":"On day 4 (Cinder Ridge, level 44), promote to Tier 2.","src":["prydwen-classes-and-roles"],"q":["Once you reach Cinder Ridge at level 44 (Day 4 after server creation)"]},{"t":"Spend your saved currency on the pink Premium banner (BlueStacks; Prydwen says the Premium banner costs Covenite).","src":["bs-tips","prydwen-gacha"],"q":["Arriving here unlocks the pink Premium Banner","Covenite, the currency used for the Premium Gacha"]},{"t":"If a stage wall stops you, go back and open the zones you skipped.","src":["prydwen-tips-and-tricks"],"q":["go back to previous zones after a powerup"]},{"t":"On days 6-7, push every game mode.","src":["narcosis-progress"],"q":["Days 6-7: push all game modes"],"note":"From Narcosis's roadmap (lower trust)."},{"t":"Clear the stages you skipped.","src":["narcosis-progress"],"q":["clear missed stages"]},{"t":"Claim your achievements.","src":["narcosis-progress"],"q":["claim achievements"]}],"reroll":[{"t":"**Verdict: don't reroll if you play with friends.** Each server has limited capacity, so a reroll can strand you on a different server.","src":["prydwen-beginner-guide","prydwen-reroll-guide"],"q":["If you want to play with friends, rerolling is not worth it"]},{"t":"Solo players can reroll for a faster start: about 15-20 minutes per attempt. Aim for Water Assault or Gale Shield as a Mage; Heavy Impact, Mountain Collapse or Whirlwind Slash as a Warrior.","src":["prydwen-reroll-guide"],"q":["It takes about 15-20 minutes per reroll","Water Assault is the go-to recommendation for Mages","Heavy Impact is the highest ST Damage skill in T1"]},{"t":"The gap closes fast: you get hundreds of pulls in the first week either way. Narcosis puts it at 500-650+ for active players (unverified).","src":["prydwen-reroll-guide","narcosis-progress"],"q":["expect to be able to perform multiple hundreds of pulls within your first week of playing","Free pulls in the first week: 500 to 650 or more for active players"]}]},"unlocks":[["Guild","Level 15",["prydwen-beginner-guide","bs-tips"],["Guilds unlock once your character reaches level 15"],""],["Vendor Booth","Level 18",["prydwen-tips-and-tricks"],["Vendor Booth unlocks at level 18"],""],["Tier 2 class (Sorcerer / Sage / Duelist / Knight)","Conflict, see below",[],[],"conflict"],["Pink Premium skill banner","After your first Tier 2 class (Prydwen) / on reaching Cinder Ridge (BlueStacks)",["prydwen-gacha","bs-tips"],["The Premium Gacha first unlocks after reaching a T2 Class for the first time","Arriving here unlocks the pink Premium Banner"],""],["Relics","Account level 30",["prydwen-beginner-guide"],["Relics are unlocked at Account level 30"],""],["Companions","Level 39 (Prydwen) / level 38 (mobi.gg)",["prydwen-tips-and-tricks","mobi-companions"],["Level 39 - Companions unlock","Sword x Staff companions are essential for boosting your class stats . They are available from level 38"],""],["Second continent, Auction House","Level 40",["prydwen-tips-and-tricks"],["Level 40 - Auction House unlocks","second Continent (level 40 required)"],""],["Fantomon (pets)","Level 50 (BlueStacks, Prydwen gacha guide) / 51 (Prydwen tips)",["bs-fantomon","prydwen-gacha","prydwen-tips-and-tricks"],["Fantomons are pets that unlock at account level 50","This Banner unlocks after Account level 50","Level 51 - Fantomons (Pets) unlock"],""],["Tier 3 class (Archmage / Arcanist / Berserker / Paladin)","Aqualis, level 82, server day 12",["prydwen-classes-and-roles","bs-class"],["Once you reach Aqualis at level 82 (day 12 after server creation)"],""],["Class conversion (Prydwen's second method: keeps your level and skills)","Level 100; once a week free, more often for Dawnium",["prydwen-classes-and-roles","bs-class"],["There’s a catch, though, when it comes to the second method - you need to reach level 100 before you can actually use it","you can only use the second method once a week (for free"],""],["Tier 4 class (Destroyer / Dominator / Conqueror / Guardian) + Season 2","Loong Haven, level 106, server day 47",["prydwen-classes-and-roles","bs-class"],["Once you reach Loong Haven at level 106 (day 47 after server creation)"],""],["Adult Fantomon","Level 108",["eog-s2","bs-fantomon"],["Lv.108 Adult Fantomon"],""],["Tower (gem drops)","Level 116",["eog-s2"],["Lv.116 Tower Opens Gem drops"],""],["Second dungeon (first seasonal gear)","Level 130",["eog-s2"],["Lv.130 Second Dungeon First seasonal gear drops"],""],["Tier 5 class (Magister / Prophet / Ravager / Templar) + Season 3","Gate not published; Prydwen's Templar guide places it in the Aethryis region",["prydwen-templar"],["In the land of Aethryis"],""],["Saved loadouts","Up to seven",["prydwen-classes-and-roles","bs-tips"],["up to seven different loadouts"],""]],"tier2":[{"t":"Prydwen and BlueStacks: Cinder Ridge at level 44, day 4 after the server opened.","src":["prydwen-classes-and-roles","bs-class"],"q":["Once you reach Cinder Ridge at level 44 (Day 4 after server creation)","Tier 2 unlocks at Cinder Ridge, level 44, on Day 4"]},{"t":"Prydwen tips and mobi.gg: your Tier 1 class must be level 18 (mobi.gg adds: or total level 20).","src":["prydwen-tips-and-tricks","mobi-classes"],"q":["you need to reach level 18 of the T1 class","from class level 18 (or total level 20)"]},{"t":"BlueStacks beginner guide: at Guimu Village in the Verdantglade region.","src":["bs-beginner"],"q":["reach Guimu Village in the Verdantglade region, you will unlock your first major class advancement"]},{"t":"How they fit: the class-level rule and the server-day gate can both apply. If the promotion button is not live at class level 18, the Cinder Ridge / day-4 gate is the one holding you.","src":["prydwen-tips-and-tricks","prydwen-classes-and-roles"],"q":["you need to reach level 18 of the T1 class","Once you reach Cinder Ridge at level 44 (Day 4 after server creation)"],"own":true}],"currencies":[["Dawnium","The main currency: dungeon and material-run refreshes, the daily shop, Trading House, appearance changes, and pulls (100 Dawnium = 1 Stellatie).","Spend some every day on the daily sinks first (dungeon and material runs, shop refreshes); Prydwen lists pulls as a Dawnium use too.",["prydwen-beginner-guide","prydwen-gacha","prydwen-stamina-and-dawnium-usage"],["you will use premium currency for resources and daily tasks that will make your account stronger, as well as pulls","Dawnium, on the other hand, is the main currency of the game","at a rate of 100 Dawnium for 1 Stellatie","Dawnium’s never gonna give you up. You get a lot of it, but unlike most games, you’re highly incentivized to spend some every day"]],["Stellatie","Blue pull tickets for the Standard skill banner, from logins, events and gameplay.","Spend on Standard 10-pulls until your Tier 1 class is level 18 (Prydwen: pulling skills is how the class levels, and you cannot advance before that); then hold the rest until Cinder Ridge (BlueStacks calls spending Stellatie in the starting Verdantglade maps a trap, because those early skills soon go obsolete). The two fit: pull what Tier 1 needs, save the rest.",["prydwen-gacha","prydwen-tips-and-tricks","bs-beginner"],["Stellatie, the Blue “Pull Tickets”, are frequently awarded through logins, events, gameplay","Don’t be afraid to pull on skills on T1 - it’s the way to level your class, so you can advance to T2 and higher","you must pull skills until you fulfill the condition to advance to the next tier, and only after that can you save pulls","you need to reach level 18 of the T1 class","The biggest trap for a beginner is spending premium currencies like Luminium or premium Stellatie summoning orbs in the starting Verdantglade maps","draws from a massive pool of lower tier skills that quickly become obsolete"]],["Covenite","Premium skill banner currency. Cannot be bought with Dawnium; comes from events and Standard-banner mileage.","Spend on the Premium banner.",["prydwen-gacha","bs-beginner"],["Covenite cannot be exchanged for using Dawnium or any other resource","These Mileage rewards mostly grant Covenite, the currency used for the Premium Gacha"]],["Luminium","Conflict: Prydwen calls it paid currency used at the Trading/Auction House; Narcosis says it pulls on the Relic gacha.","Hold until Cinder Ridge, then the pink Premium banner (BlueStacks; Prydwen says the Premium banner costs Covenite).",["prydwen-beginner-guide","narcosis-gacha","bs-tips","prydwen-gacha"],["they usually cost Paid Currency (Luminium)","Relic Gacha: uses Luminium","save every single bit of your Luminium","Covenite, the currency used for the Premium Gacha"]],["Radiant Stars","Named by BlueStacks as a pull resource to hoard. No source says exactly what it buys.","Hold until Cinder Ridge.",["bs-tips"],["save every single bit of your Luminium, Radiant Stars, and Skill Shard Vouchers until you finally reach the Cinder Ridge region"]],["Skill Shard Vouchers","Free summons. The weekly Guild Boss drops them.","Hold until Cinder Ridge.",["bs-tips","packsify"],["Defeating the weekly Guild Boss provides rare Skill Shard Vouchers, giving you free summons","Skill Shard Vouchers that drop with every completed run","save every single bit of your Luminium, Radiant Stars, and Skill Shard Vouchers"]],["Auroral Cards (relic pull cards)","Relic gacha currency, Rare (blue) to Mythic (gold). 10 cards of one rarity summon once; 100 cards make a 10-pull.","Spend on each region's relic banner until 50-70% of its relics are owned once.",["prydwen-gacha"],["The currency to summon on these banners is called “Auroral Cards”","You need 10 cards of one rarity to summon once, and 100 cards for a full multi","remain on each Region’s banners until 50-70% of the Relics have been obtained at least once"]],["Summon Crystals","Fantomon gacha drop (every 10-pull gives at least 1). 60 buys a Mythic Fantomon in the shop.","Spend 60 on Nyxarchon in the shop (Prydwen's Sorcerer pick); BlueStacks lists Aegiswing at the same price.",["prydwen-gacha","bs-fantomon","prydwen-sorcerer"],["you will have 60 hearts to redeem a Mythic Fantomon. Go for this one: Nyxarchon","each multi guarantees at least 1 Summon Crystal","you need 60 Crystals to buy one","Aegiswing and Nyxarchon each cost 60 Summon Crystals in the shop","Summon Crystals are used to buy Mythic rarity Fantomons in the Shop, and you need 60 Crystals to buy one"]],["Affection tokens","Friendship banner currency from co-op content. Capped at 1,000 per week.","Spend on the Affection banner as you earn; farm a little every week rather than bingeing (weekly cap).",["prydwen-gacha"],["you cannot get more than 1000 tokens per week","it’s extremely inefficient to “binge” one week","using Affection tokens to pull for various resources and currencies"]],["Kingdom Shop Coins","Buy the items that clear thorns, rocks and coral blocking the map.","Spend on obstacle removal; obstacles cut passive farming.",["bs-tips","bs-tier"],["Kingdom Shop Coins are mainly used to purchase items that remove map obstacles like rocks, thorns, and coral reefs","Do not ignore these hazards, as they actively lower your passive farming efficiency"]],["Destiny Fruit (Fruit of Destiny)","Map explore item; the section of the map matters for relic drop rates and can spawn Legendary vendors.","Hold: buy it in the Treasury whenever offered and stockpile three hundred for a future event (BlueStacks).",["bs-tips","prydwen-tips-and-tricks"],["you will need to stockpile three hundred of them for a highly rewarding future event","When using Destiny Fruits, the section of the map you’re on actually matters","Keep an eye out for Destiny Fruits in the Treasury and buy them up whenever they appear, as you will need to stockpile three hundred of them"]],["Primostars","Season-end currency from your Seasonal Score; buys permanent buffs.","Spend them all in the Astral Pact before a season flips (EOG.GG).",["prydwen-beginner-guide","eog-s2"],["The Primostar is a unique currency that is only obtainable from the Seasonal Score","Spend all of your Primo Stars in the Astral Pact"]]],"banners":{"intro":{"t":"There are separate gachas for skills (Standard and Premium), relics, Fantomon (pets) and an Affection (friendship) banner.","src":["prydwen-gacha"],"q":["There are three main things you pull/summon for in Sword x Staff: Skills, Relics, and Fantomons"]},"standard":[{"t":"Standard skill banner rates: Legendary 1%, Epic 7%, Rare 22%, skill shards 70%.","src":["prydwen-gacha"],"q":["There’s a 1% chance to roll a Legendary skill, 7% chance to roll an Epic, and a 22% chance to roll a Rare","Skill Shards of all rarities account for the remaining 70%"]},{"t":"Pick the class pool with the dropdown; changing class does **not** reset your pity, and higher-tier skills are added to the pool without removing older ones.","src":["prydwen-gacha"],"q":["Changing Classes does not reset your pity","its skills are added to the pool without removing the previous Tiers"]},{"t":"Mileage: 200 total Standard pulls give a Legendary Tier 1 skill selector box.","src":["prydwen-gacha"],"q":["the 200 accumulated pulls on the Standard Banner, giving a Legendary T1 Skill selector box"]}],"premium":[{"t":"The pink Premium banner opens after your first Tier 2 class and pulls only skills of the class and tier you pick. Same rates as Standard.","src":["prydwen-gacha","bs-tips"],"q":["The Premium Gacha first unlocks after reaching a T2 Class for the first time","The Rates for each rarity are the same as the standard banner"]},{"t":"Every 50 Premium pulls give a selector for 30 shards of any unlocked skill. A new skill costs 10 shards (Rare), 30 (Epic) or 90 (Legendary).","src":["prydwen-gacha"],"q":["every 50 pulls on the Premium Banner gives a selector ticket that can be used to obtain 30 shards of any skill","10 shards for a Rare skill","30 shards for an Epic skill","90 shards for a Legendary skill"]},{"t":"Don't redeem those shard tickets on Tier 1-2 skills: early pulls are plentiful.","src":["prydwen-gacha"],"q":["It is currently not advised to redeem your tickets for T1/T2 skills"]},{"t":"Currency conflict: Prydwen says the Premium banner costs Covenite (not buyable with Dawnium); Narcosis calls it the Advanced/Rate-Up banner and says it costs Dawnium.","src":["prydwen-gacha","narcosis-gacha"],"q":["Unlike Stellatie, Covenite cannot be exchanged for using Dawnium","Advanced/Rate-Up: uses Dawnium"]}],"pity_rows":[{"label":"Every 10 pulls","cells":[{"t":"Rare or better","src":["prydwen-gacha"],"q":["Every 10 pulls guarantees a Rare skill or better"]},{"t":"Epic guaranteed","src":["narcosis-gacha"],"q":["guaranteed Epic every 10 pulls"]},null]},{"label":"30 pulls","cells":[{"t":"Epic or better","src":["prydwen-gacha"],"q":["Every 30 pulls guarantees an Epic skill or better"]},{"t":"Increased Epic rates start","src":["narcosis-gacha"],"q":["increased Epic rates starting at 30 pulls"]},null]},{"label":"70 pulls","cells":[{"t":"Legendary guaranteed","src":["prydwen-gacha"],"q":["Every 70 pulls guarantees a Legendary skill"]},{"t":"Legendary guaranteed","src":["narcosis-gacha"],"q":["guaranteed Legendary at 70 pulls"]},{"t":"Narcosis progression page (paraphrased from a summary): roughly 50 to 80 pulls, depending on the banner","src":["narcosis-progress"],"q":["roughly 50 to 80 pulls, depending on the banner"]}]},{"label":"200 pulls","cells":[{"t":"Legendary Tier 1 selector (mileage)","src":["prydwen-gacha"],"q":["the 200 accumulated pulls on the Standard Banner, giving a Legendary T1 Skill selector box"]},{"t":"Skill selector","src":["narcosis-gacha"],"q":["skill selector at 200 pulls"]},{"t":"BlueStacks beginner: pick a Legendary after two hundred pulls; Packsify calls it \"200-pull guaranteed Legendary pity\"","src":["bs-beginner","packsify"],"q":["select a guaranteed Legendary skill after two hundred pulls","The 200-pull guaranteed Legendary pity"]}]},{"label":"Pity reset","cells":[{"t":"Resets when you get that rarity; class changes and pool switches do not reset it","src":["prydwen-gacha"],"q":["The pity resets whenever you get a skill of the corresponding rarity","you can switch between them at any time without resetting your pity"]},{"t":"Not stated","src":[],"q":[],"own":true},null]}],"pity_src":["prydwen-gacha","narcosis-gacha","narcosis-progress","bs-beginner","packsify"],"pity_note":{"t":"Every source agrees on a guaranteed Legendary skill by pull 70 on the Standard banner, and a 200-pull selector. Check the banner's in-game rates screen before relying on the rest.","src":["prydwen-gacha","narcosis-gacha"],"q":["Every 70 pulls guarantees a Legendary skill","guaranteed Legendary at 70 pulls","the 200 accumulated pulls on the Standard Banner","skill selector at 200 pulls"],"own":true},"relic":[{"t":"Relic gacha (\"Aeonic Gacha\") rates by card colour: Rare cards 0.1% Legendary; Epic cards 0.1% Mythic; Legendary cards 1% Mythic and 12% Legendary; Mythic cards 15% Mythic. Each 10-pull guarantees at least one relic of the card's rarity.","src":["prydwen-gacha"],"q":["Rare Banner: 0.1% chance for a Legendary","Epic Banner: 0.1% chance for a Mythic","Legendary Banner: 1% chance for a Mythic","Mythic Banner: 15% chance for a Mythic","12% for a Legendary","At least 1 Rare guaranteed every 10 pulls"]},{"t":"Elemental relic banner: 3% Mythic, 12% Legendary, 85% Epic; a Legendary every 10 pulls and a Mythic every 40.","src":["prydwen-gacha"],"q":["Elemental Banner: 3% chance for a Mythic","12% chance for a Legendary","85% chance for an Epic","At least 1 Legendary guaranteed every 10 pulls, and at least 1 Mythic guaranteed every 40 pulls"]},{"t":"Save Elemental relic pulls until you know your main element.","src":["prydwen-tips-and-tricks"],"q":["save up your Elemental Relic pulls"]}],"pet_names":[["SSR (its pity line calls it Legendary)","0.8%; at least one every 80 pulls","Mythic (SSR)","0.8%",["There’s a 0.8% chance to roll an SSR Fantomon","At least 1 Legendary Fantomon is guaranteed every 80 pulls","Mythic (SSR) | 0.8%"]],["Epic","5%; at least one within 30 pulls","Legendary (SR)","5.0%
