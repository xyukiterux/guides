ondary slots | 50% each","Rest of your collection | 20% each","Your main stat slot and your combat Fantomon are two separate decisions"]},{"t":"Resonance: the lowest level among your four deployed pets applies to the whole collection, so level the four evenly (BlueStacks). Early on, push one primary to level 50 for its first big passive (BlueStacks tips).","src":["bs-fantomon","bs-tips"],"q":["The lowest level among your four deployed Fantomons becomes the resonance level applied across your whole collection","pour all your resources into leveling it straight to fifty"]},{"t":"Evolution (Materialization) needs level 108, Nimbuville unlocked and a Mythic duplicate.","src":["bs-fantomon"],"q":["To evolve, you need to reach level 108, unlock Nimbuville, and have the Fantomon at Mythic rarity"]},{"t":"Pets level with Basic Treats from the Idle Cart, the Daily Cart Shop (Rolla) and Guild Shop plants and animals.","src":["bs-fantomon"],"q":["Fantomons level using Basic Treats"]},{"t":"Prydwen tips: don't spread pet materials; first raise one pet of each role, since roles use different materials.","src":["prydwen-tips-and-tricks"],"q":["focus first on 1 Pet of each Role, as they use different resources"]}],"companions":[{"t":"Companions give passive stats and unlock at level 39 (Prydwen) or 38 (mobi.gg). Gifts raise affection; levels 20, 50, 70 and 100 give the bigger stats.","src":["prydwen-tips-and-tricks","mobi-companions","prydwen-beginner-guide"],"q":["Level 39 - Companions unlock","They are available from level 38","With lvl20, 50, 70, and 100 giving better Stats"]},{"t":"Prioritise Crit companions for damage classes and Block companions for Knights; pick one companion per gift type and stick with it to level 50-70.","src":["prydwen-beginner-guide"],"q":["prioritize Crit-giving Companions for DPS Classes, and Block-giving ones for Knights","select one Companion for each Gift type and stick to them until level 50/70"]},{"t":"mobi.gg's rule: level all companions equally to 20, then only those matching your class stats, equally to 70.","src":["mobi-companions"],"q":["upgrade all companions equally up to level 20"]},{"t":"Mage-line companions named by mobi.gg: Sorcerer — Megumin; Archmage — Akane, Hermes, Jiangwang, Mateo, Mio, Ophelia, Chief (Santa), Sylvia; Sage — Aqua.","src":["mobi-companions"],"q":["* Megumin","* Akane","* Sylvia","* Aqua"]}]},"pvp":{"formats":[{"t":"Prydwen's beginner guide: a Solo Arena and a 3v3 Tournament mode.","src":["prydwen-beginner-guide"],"q":["For PVP, there is a Solo Arena, but also a 3v3 Tournament mode"]},{"t":"Prydwen's class guide (and its Berserker build note) talk about 1vs1, 2vs2 and 4vs4 PvP.","src":["prydwen-classes-and-roles","prydwen-builds-db"],"q":["in all formats, 1vs1, 2vs2, and 4vs4","For 2vs2 and 4vs4 PVP"]},{"t":"Both may be true (different modes), but no page checked lists every PvP mode with its rewards. Check the in-game PvP menu.","src":[],"q":[],"own":true,"warn":"PvP mode list is not fully published."}],"how":[{"t":"Fight early in the week. Arena ranks reset weekly; Packsify says to use your saved tickets (it counts 20) on day one, before rankings \"lock by power differential\", and stop after.","src":["packsify"],"q":["PvP in Sword x Staff operates on a weekly reset cycle","dump all 20 saved Arena tickets on day one of the weekly reset","Rankings lock by power differential as the week progresses"]},{"t":"Your early rank pays free daily Dawnium for the rest of the week (Packsify).","src":["packsify"],"q":["earns free daily Dawnium rewards for the rest of the week"]},{"t":"Arena currency buys from the exchange shop, including [[Kels]], which can't be pulled from the tree. Extra fights cost 10, 15, 20, 30, 40, 60, 80, 100 Dawnium.","src":["prydwen-stamina-and-dawnium-usage","bs-fantomon"],"q":["the currency you can get from it is pretty useful for the exchange shop","It is only available through the Arena shop","Cost is incremental: 10, 15, 20, 30, 40, 60, 80, 100"]},{"t":"Keep a dedicated PvP loadout. You have 7 loadout slots.","src":["prydwen-classes-and-roles"],"q":["up to seven different loadouts"]},{"t":"For PvP, survival, Speed, control, taunts and defensive effects matter more than raw PvE damage (BlueStacks).","src":["bs-builds"],"q":["For PvP, survivability, Speed, control, Taunt, defensive effects, and positioning become much more important"]}],"class":[{"t":"Sorcerer line: struggles in 1v1 because it can't stay alive, but its AoE is great in group PvP. The Archmage single-target build (without Divine Wrath) also works in PvP.","src":["prydwen-classes-and-roles","prydwen-archmage"],"q":["in 1vs1, they struggle a lot because they simply can’t keep themselves alive, but in group PVP, their AoE damage makes them great again","You can also use this setup (without Divine Wrath ) in PVP"]},{"t":"Narcosis (lower trust): Accuracy is worth more in PvP than PvE for a Sorcerer; Lightning bursts key targets and Water/Ice freeze locks them.","src":["narcosis-sorcerer"],"q":["Accuracy matters more in PvP than PvE","Water/Ice freeze lockdown valuable in PvP"]},{"t":"Sage: weak in PvP at Tier 2, a menace from Tier 3 (Shadow form). mobi.gg's Sage PvP build plays as a healer with Dark Bullet damage. Narcosis: PvP Sages need HP and Resilience.","src":["prydwen-classes-and-roles","mobi-sage","narcosis-tier2"],"q":["They struggle in PVP at that tier, too","In this configuration, the Sage will play the role of Healer","PvP Sages should invest in HP and Resilience"]},{"t":"Duelist: \"the king of Tier 2 PvP\" (BlueStacks); only Knights reliably counter it. Narcosis favours Crit Damage over Crit Rate in short duels.","src":["bs-tier","bs-class","narcosis-tier2"],"q":["Duelist is the king of Tier 2 PvP","where only Knights reliably counter it","For PvP, Crit Damage over Crit Rate because duels are short"]},{"t":"Knight/Paladin: strong in every PvP format; Paladin's Star Shattering Slash (3-turn cooldown) usually one-shots in PvP.","src":["prydwen-classes-and-roles"],"q":["they’re also a menace in PVP - in all formats","the skill is so strong that it usually kills anyone in PVP"]},{"t":"Pets for PvP: [[Pandarial]] and [[Aegiswing]], with [[Kels]] as the alternative (BlueStacks).","src":["bs-fantomon"],"q":["PvP | Pandarial, Aegiswing | Kels"]}],"open":["Exact Arena and 3v3 Tournament reward tables by rank.","Whether the 2v2 and 4v4 formats Prydwen mentions are separate modes or the Tournament.","Ticket count and refill rate (Packsify says 20 saved tickets; no other source confirms)."]},"guild":{"lines":[{"t":"Guilds unlock at level 15. Join an active one immediately.","src":["prydwen-beginner-guide","prydwen-tips-and-tricks"],"q":["Guilds unlock once your character reaches level 15","Join a Guild as soon as you unlock it"]},{"t":"Features: guild boss, guild shop and guild wars; daily donations; AFK-farm resources on a floating island; guild talents (bought by the leader with guild currency) give passive stats to everyone.","src":["prydwen-beginner-guide"],"q":["gaining access to features like the guild boss, shop, and even guild wars","AFK farm resources on one of the floating islands","the guild leader will be able to use to level up guild talents"]},{"t":"Guilds also give collective stat buffs, donation rewards and the Guild Farm for pet materials. Set your production job to the Smelting Workshop early for crafting materials.","src":["bs-tips"],"q":["collective stat buffs, donation rewards, and the Guild Farm","Set your guild production assignment to the Smelting Workshop early"]},{"t":"The weekly Guild Boss drops Skill Shard Vouchers (free summons). Packsify says they drop on every completed run, so run every cycle whatever your damage rank.","src":["bs-tips","packsify"],"q":["Defeating the weekly Guild Boss provides rare Skill Shard Vouchers","Serious accounts should run Guild Boss every available cycle regardless of damage ranking"]},{"t":"Donations: one free donation, and another that costs Dawnium for F2P (Prydwen). Packsify counts 3 donations a day for F2P and 5 for spenders.","src":["prydwen-stamina-and-dawnium-usage","packsify"],"q":["you can donate to the guild, which you do for free, and another one that costs Dawnium","spenders can make 5 donations per day compared to the free-to-play cap of 3"]},{"t":"Guild farm-rate boost items last 24 hours but are expensive; not recommended for F2P. Spend Guild Coins in the guild shop.","src":["prydwen-stamina-and-dawnium-usage"],"q":["Items can also boost farm rates that last for 24 hours, but they’re pretty expensive","Don’t forget to use your Guild Coins in the shop"]},{"t":"Guild quality matters: Guild Boss damage depends on how many strong players are active, which caps everyone's voucher drops (Packsify).","src":["packsify"],"q":["Guild Boss damage scaling depends on how many whales are active in the guild"]},{"t":"Guild buffs are not reset at a new season.","src":["prydwen-beginner-guide"],"q":["Guild buffs are not reset"]}],"roles":[{"t":"Bring the role your guild lacks: Knights are a must-have in Dungeons (4 players) and Raids (6 players), and every party needs a Sage.","src":["prydwen-classes-and-roles"],"q":["what role they will fulfill in Dungeons (4-man content) and Raids (6-man content)","This makes Knights must-haves for all coop content","Every party needs a Sage"]},{"t":"For group content, keep a loadout with team shields or taunts for your role (BlueStacks).","src":["bs-tips"],"q":["save a slot for group guild content, packing team wide utility shields or taunts"]},{"t":"Sorcerer Tier 2 tip: [[Wind's Shadow]] delays Wind-weak co-op bosses when several Sorcerers spam Wind techniques (Prydwen).","src":["prydwen-sorcerer"],"q":["with Wind's Shadow that works on co-op bosses, especially those who are Wind-weak"]},{"t":"Guild Boss pets: [[Nyxarchon]] or [[Kels]] (BlueStacks); [[Terragon]] matters in Guild Boss fights where one boss threatens the team.","src":["bs-fantomon"],"q":["Guild Boss Support | Nyxarchon, Kels","becomes genuinely valuable in Guild Boss fights"]}],"war_open":["Guild war format, schedule and team size: Prydwen lists \"guild wars\" as a feature but no checked page explains how they work.","Guild war rewards and whether power or participation decides them.","Guild talent tree contents and costs.","Exact Guild Boss reset day and how damage maps to rewards."],"war_src":["prydwen-beginner-guide"],"war_q":["and even guild wars"]},"daily":[["afk1","Claim AFK rewards (morning)",["narcosis-progress"],["AFK collection recommended twice daily"],""],["wish","Free daily 10-pull at the Wish Goddess Statue",["bs-tips"],["claim your free daily ten roll on the Wish Goddess Statue every time you log in"],""],["quests","Finish daily quests and commissions",["narcosis-progress","prydwen-beginner-guide"],["do dailies every day"],""],["dungeon","Daily Dungeon: 2 free runs (+2 for 100 and 150 Dawnium if you can reach an A rank)",["prydwen-daily-dungeons"],["You can run this dungeon for free 2 times a day"],""],["realm","Material Realms: 2/2/2/2 extra attempts (F2P)",["prydwen-stamina-and-dawnium-usage"],["Free to Play players should do 2/2/2/2 extra attempts"],""],["shop","Daily shop: at least 3 refreshes; buy material-realm items and Destiny Fruit",["prydwen-stamina-and-dawnium-usage"],["it’s recommended to do at least 3 refreshes per day"],""],["vendor","Vendor Booth: refresh a few times, buy every material (from level 18)",["prydwen-tips-and-tricks"],["even F2P should refresh it a few times and buy every material there"],""],["stamina","Spend Stamina (cap 300) on Rolla nodes early so it never sits full",["prydwen-beginner-guide","prydwen-tips-and-tricks"],["You get a cap of 300 Stam","The best way to use Stamina early on is on Rolla"],""],["explore","Push one new map zone; activate Goddess Statues; answer Stone Tablet Quizzes",["bs-tips"],["Stone Tablet Quizzes"],""],["guild","Guild: donate, AFK on the floating island, hit the Guild Boss",["prydwen-beginner-guide"],["don’t forget to do daily donations, the boss raid and also to AFK farm resources"],""],["arena","Arena: use tickets early in the week (Packsify)",["packsify"],["day one of the weekly reset"],""],["companion","Companion booth: give daily gifts to your focus companions",["bs-beginner"],["giving daily gifts to your allies"],""],["animals","Home: tap the small animals for free resources and skill shards",["prydwen-tips-and-tricks"],["you can click on small Animals scattered around the base"],""],["tower","Tower: climb a floor (only from level 116, when the Tower opens)",["eog-s2"],["Lv.116 Tower Opens"],"116"],["upgrade","Upgrade one thing: a skill slot, your main relic element's slots, or your lead pet",["prydwen-tips-and-tricks"],["Level Skill and Gear slots equally"],""],["afk2","Claim AFK rewards (evening)",["narcosis-progress"],["AFK collection recommended twice daily"],""]],"weekly":[["w-guildboss","Guild Boss every cycle (Skill Shard Vouchers drop each run)",["packsify"],["Skill Shard Vouchers that drop with every completed run"],""],["w-arena","Arena push on reset day, then stop",["packsify"],["After the first day, stop fighting"],""],["w-convert","Class conversion available once a week (level 100+), if you need it",["prydwen-classes-and-roles"],["you can only use the second method once a week"],""],["w-affection","Affection tokens: earn some every week (1,000 cap)",["prydwen-gacha"],["you cannot get more than 1000 tokens per week"],""],["w-treasure","Grand Treasure Hunt: save one week, spend the next",["prydwen-tips-and-tricks"],["save for 1 week, then spend it in another"],""],["w-npc","After a Chaos Invasion, buy only the Primal Forge from the Mysterious NPC (Packsify)",["packsify"],["Buy only the Primal Forge"],""]],"skip":[{"t":"Single pulls spread across banners.","src":["narcosis-progress"],"q":["Pulling singles instead of saving for 10-pulls"]},{"t":"Spending saved Luminium, Radiant Stars or Skill Shard Vouchers before Cinder Ridge: early skills don't carry forward.","src":["bs-tips"],"q":["The early skills available during your initial class phase do not carry forward well into the late game"]},{"t":"Redeeming Premium shard selectors on Tier 1-2 skills.","src":["prydwen-gacha"],"q":["It is currently not advised to redeem your tickets for T1/T2 skills"]},{"t":"The plain class switch (restarts at level 1 with no skills). Wait for the level-100 conversion.","src":["prydwen-classes-and-roles","prydwen-tips-and-tricks"],"q":["The first method is something we advise against using","it's best to wait for level 100 before you do so"]},{"t":"Rerolling if you play with friends.","src":["prydwen-beginner-guide"],"q":["If you want to play with friends, rerolling is not worth it"]},{"t":"Extra dungeon entries you can't clear to at least an A rank.","src":["prydwen-tips-and-tricks"],"q":["we advise against using extra entries if you can’t get at least an A-rating"]},{"t":"Buying gear at the Auction House early (level 40): gear is replaced fast.","src":["prydwen-tips-and-tricks"],"q":["don’t be in a rush to buy anything there. Gear is replaced really fast at this stage"]},{"t":"Overspending on Battle Essence or Treats in the Cart; prioritise Wood and Stone, then Chrono Sand and Raw Ore.","src":["prydwen-tips-and-tricks","prydwen-beginner-guide"],"q":["never overspend resources on Battle Essence or Treats","Wood and Stone are necessary to upgrade everything"]},{"t":"Spreading pet materials. Get one pet per role going first.","src":["prydwen-tips-and-tricks"],"q":["Don’t spread your Pet upgrade mats too thin"]},{"t":"Splitting relic investment across elements before your main element is done.","src":["prydwen-tips-and-tricks","packsify"],"q":["should match the element of your class","splitting affinity across two elements costs serious damage output"]},{"t":"Big summon packs, selector bundles, the 7-Day Prayer and random chests.","src":["roonby-packs","beatcop-packs"],"q":["Large summon packs and expensive selector bundles often cost too much","the worst value in the entire shop"]},{"t":"Sitting on old dungeon shards: they can't be sold once the next dungeon opens.","src":["prydwen-daily-dungeons"],"q":["Do not sit on old shards"]},{"t":"Mysterious NPC items other than the Primal Forge (Packsify).","src":["packsify"],"q":["Buy only the Primal Forge. Nothing else"]}],"events":{"rows":[["Nov 4, 2026","\"Official launch\" announced by Boltray (Inven Global). Pre-registration is open; event rewards are priced in won and the entry hashtag is Korean, so this is likely the Korean launch.","Unverified for Global servers. Keep a Dawnium and premium-currency reserve until you know what it adds.",["inven-launch"],["will officially launch on November 4","In-game rewards worth a total of 3 million won","#쏘미더커마"],"unverified"],["Oct 16 - Nov 10, 2026","\"Show~ Me the Customization\" poster event (raffle for coupons and monthly passes)","Enter if your region is eligible (shared via Naver Lounge, Discord, X and others).",["inven-launch"],["The event runs from 10:00 AM on the 16th to 11:59:59 PM on November 10"],""],["Jul 27 - Aug 9, 2026","Luo Tianyi collab: Yan He free via the Ensemble Puzzle; Luo Tianyi from the Harmony Wheel","Over. Pattern: finish the free companion route first, then the exchange shop (Mythic Relic Selection Chest first).",["topuplist-luotianyi"],["the collaboration period as July 27 through August 9","You can unlock Yan He for free by completing the Ensemble Puzzle","Mythic Relic Selection Chest"],"lowtrust"],["Jun 2 - 15, 2026","KonoSuba collab: Megumin, Darkness, Aqua from the Arcane Wheel (50 event currency a spin); a male MC companion on login day 7","Over. Each companion needed 150 fragments; about 180 spins for all three (Narcosis).",["narcosis-konosuba"],["Event listed as June 2 to June 15, 2026","7 consecutive days gives a free male MC companion on day 7","Each companion needs 150 fragments to unlock"],"lowtrust"]],"pattern":{"t":"Collabs so far ran about two weeks with a free login or puzzle reward plus a paid wheel. Never miss a collab login day, and put event currency into one target. No future collab is announced on any page checked.","src":[],"q":[],"own":true},"seasons":[{"t":"Seasons are expansions: new tier, regions, companions, gear and bosses. Season 1 lasts about 1.5 months, later ones 2-3 months.","src":["prydwen-beginner-guide"],"q":["Expect it to last about 1.5 months, while the following Seasons will hover around 2-3 months each"]},{"t":"At a season reset, levels above the seasonal floor drop back (account level, skills, pets, relic slots above +10, gear slots and gear level). The floor starts at account level 100 and rises by 30 each season (130, 160...).","src":["prydwen-beginner-guide"],"q":["The first one is at Acc lvl 100, but season 2 pushes the floor to Acc lvl 130, season 3 pushes it to 160"]},{"t":"Kept through resets: every skill, pet and relic you own (with dupes and aptitudes), permanent food buffs, companion affinity and guild buffs.","src":["prydwen-beginner-guide"],"q":["everything that is a one-time buff or is acquired through the Gachas is not reset"]},{"t":"Season-end Seasonal Score pays Primostars for permanent buffs. Bank resources before the flip (see Save and spend).","src":["prydwen-beginner-guide","eog-s2"],"q":["a Seasonal Score is given to you at the end of each Season","the smartest move is to stop spending and start banking"]}],"codes_note":{"t":"Gift codes from mobi.gg's list (latest code added Oct 13, 2026). Codes expire fast and some need a minimum level; mobi.gg checks them by hand.","src":["mobi-codes"],"q":["Latest Sword x Staff code added on October 13, 2026","sometimes you need to reach a certain in-game level"]},"codes":[["HOTPOT","Free rewards"],["VIGARD","Free rewards"],["SYLVIA","Free rewards"],["AETHYRIS","Free rewards"],["VEGGIE","Free rewards"],["Chomosuke","30 Chomosuke fragments"],["SXSDCTHANKS","40 Rare Auroral Insignias, 3 Fruits of Destiny, 180 Dawnium"],["SXSFBTHANKS","40 rare auroral insignia, 3 fruits of destiny, 180 Dawnium"],["SXSREDDIT","180 Dawnium"],["SXSCREATOR","1 Fruit of Destiny, 20 rare auroral insignia, 1 Stellatie"],["SS000","100 stones, 300 raw ores, 300 grains of chronic sand, 1,000 combat essences"],["SS888","100 Leaves of Abundance, 1 Fruit of Destiny, 25 Stamina Points"],["ZJ888","2 Legendary Aurora Badges, 10 Epic Aurora Badges, 20 Rare Aurora Badges"],["ZJ999","2 Jelly Bean Pals, 3 honey-glazed roasts, 50 green rice balls"]]},"open":[["Game version","No source states a client version number; this guide checks content dates instead (Prydwen guides updated up to 10 Sep 2026)."],["Nov 4, 2026 launch","Inven Global reports an official launch on Nov 4; rewards in won suggest Korea. What it changes for existing Global servers is not published."],["Premium banner currency","Prydwen: Covenite (not buyable with Dawnium). Narcosis: Dawnium. Check the banner's cost in game."],["Luminium","Prydwen: paid currency for the Trading House. Narcosis: relic gacha currency."],["Pity details","Prydwen 10/30/70 vs Narcosis 10 (Epic)/30/70 and \"50 to 80\". The 70-pull Legendary and 200-pull selector agree."],["Tier 2 gate","Class level 18 vs Cinder Ridge level 44 / day 4 vs Guimu Village. Likely more than one condition."],["Tier 5 gate","Level and day not published."],["PvP modes","Solo Arena + 3v3 Tournament vs 1v1 / 2v2 / 4v4. Rewards not published."],["Guild wars","Exists (Prydwen), rules not published."],["Radiant Stars","Named by BlueStacks as a currency to save; what it buys is not explained."],["Real-money prices","No guide lists prices; they vary by region."]]},"builds":[{"src":["prydwen-mage"],"cls":"Mage","label":"Single target (premium)","mode":"boss","tech":["Water Assault","Flame Jet","Tempest Sphere","Wind's Delight"],"charm":["Unstable Aura","Gale Shield","Water to Ice","Mana Surge"],"note":"","updated":"01/September/2026","line":"mage","tier":1,"warn":[],"id":"b0"},{"src":["prydwen-mage"],"cls":"Mage","label":"AoE (premium)","mode":"explore","tech":["Water Assault","Fireball","Blazing Fire Ring","Wind's Delight"],"charm":["Unstable Aura","Gale Shield","Water to Ice","Mana Surge"],"note":"","updated":"01/September/2026","line":"mage","tier":1,"warn":[],"id":"b1"},{"src":["prydwen-sorcerer"],"cls":"Sorcerer","label":"General / AoE","mode":"explore","tech":["Water Assault","Frosty Nova","Light of Dawn","Lightning Chain"],"charm":["Lightning Mystery","Void Bubble","Mana Surge","Water to Ice"],"note":"You can replace Void Bubble with any other offensive Charm if you’re doing content where you’re not afraid of dying (Dragon, Dungeons, etc.).","updated":"01/September/2026","line":"sorcerer","tier":2,"warn":[],"id":"b2"},{"src":["prydwen-sorcerer","allclash-sorcerer"],"cls":"Sorcerer","label":"Single target","mode":"boss","tech":["Water Assault","Light of Dawn","Tempest Sphere","Wind's Delight"],"charm":["Lightning Mystery","Void Bubble","Mana Surge","Water to Ice"],"note":"You can replace Void Bubble with any other offensive or utility Charm if you’re doing content where you’re not afraid of dying (Dragon, Dungeons, etc.). For example, with Wind's Shadow that works on co-op bosses, especially those who are Wind-weak. This Charm only triggers when you deal Wind damage using Tech, so with a lot of Sorcerers who spam Wind Tech, the boss moves will be delayed by a lot, making the turn longer (a turn means everyone must do their actions, but since the Boss’s action is delayed, it technically prolongs the turn).","updated":"01/September/2026","line":"sorcerer","tier":2,"warn":[],"also":["Single target / bosses"],"id":"b3"},{"src":["prydwen-sage"],"cls":"Sage","label":"Generalist damage","mode":"explore","tech":["Flame Wolf Summon","Weakening Hex","Dark Bullet","Shadow Impact"],"charm":["Gale Shield","Mana Surge","Shadow Erosion","Soul Impact"],"note":"Use this build whenever you need a damage-focused build, and there are enemies present who can quickly kill any Treantlings you summon. If you’re against an enemy who won’t kill summoned Treantlings too fast, the damage it outputs is incredibly high and definitely worth running so long as it can stay alive.","updated":"01/September/2026","line":"sage","tier":2,"warn":[],"id":"b4"},{"src":["prydwen-sage"],"cls":"Sage","label":"Situational damage (Treantling)","mode":"general","tech":["Flame Wolf Summon","Treantling Summon","Dark Bullet","Shadow Impact"],"charm":["Gale Shield","Mana Surge","Shadow Erosion","Soul Impact"],"note":"As stated in the Generalist build, this is the build you use against enemies who cannot kill Treantlings fast.","updated":"01/September/2026","line":"sage","tier":2,"warn":[],"id":"b5"},{"src":["prydwen-sage"],"cls":"Sage","label":"Healer","mode":"heal","tech":["Void Blessing","Healing Touch","Radiant Restoration","FLEX"],"charm":["Resurrection","Healing Mastery","FLEX","FLEX"],"note":"In dungeons, when you’re responsible for the healing role, you’ll need to run this healing build. You can choose to slot in either more survivability abilities into the flex slots or your choice of damage or debuff abilities. If you feel like your team doesn’t need much healing, it is possible to cut back further on the amount of healing abilities you can use to run even more damage, survival, or debuffing abilities. Pushing this to the extreme, it’s possible to drop Healing Touch , Resurrection , and Void Blessing . In encounters where only group healing is needed, like the Guild Boss, this can be a viable consideration.","updated":"01/September/2026","line":"sage","tier":2,"warn":[],"id":"b6"},{"src":["prydwen-duelist","bs-builds"],"cls":"Duelist","label":"Safe damage + defense","mode":"explore","tech":["Flame Aura","Whirlwind Slash","Sunset Sword","Flash Dash"],"charm":["Block Awareness","Indomitable Will","Blade of Lament","Counter Blade"],"note":"A safe option featuring both damage and defense. In case you are fighting against a mixed group (Boss + Minions), just replace Whirlwind Slash with Heavy Impact . Still, when you push higher, you will need to go even more ham, which means replacing some defense tools with attack tools.","updated":"01/September/2026","line":"duelist","tier":2,"warn":[],"also":["AoE"],"id":"b7"},{"src":["prydwen-duelist","bs-builds"],"cls":"Duelist","label":"Single target (also PvP)","mode":"boss","tech":["Leap Attack","Flame Aura","Heavy Impact","Flash Dash"],"charm":["Block Awareness","Indomitable Will","Blade of Lament","Insightful Eye"],"note":"The Flash Dash can be replaced with either Lion Combo or Edge Strike ; do your math. This works in PVP too.","updated":"01/September/2026","line":"duelist","tier":2,"warn":[],"also":["Single target"],"id":"b8"},{"src":["prydwen-duelist"],"cls":"Duelist","label":"Co-op boss (hit and run)","mode":"boss","tech":["Leap Attack","Flame Aura","Diving Gale","Phantom Assault"],"charm":["Blazing Clash","Strength Rules","Crit Mastery","Insightful Eye"],"note":"As a Melee character, you will block or be blocked by other Melee players from dealing damage to the Boss. This means you need to deal damage from afar or go in and out quickly. Forget our words if you fight the Boss solo, it’s a different case. Darkness Descends is an alternative option for Leap Attack if there are 4+ players that bring it.","updated":"01/September/2026","line":"duelist","tier":2,"warn":[],"id":"b9"},{"src":["prydwen-knight","bs-builds"],"cls":"Knight","label":"Dungeon tank","mode":"group","tech":["Valor Surge","Heart of Challenge","Luminous Shield","Guardian Ring"],"charm":["Iron Fortress","Block Awareness","Rebound","Ripple Impact"],"note":"Your job is to soak up damage and keep your team alive. Most of your damage here comes from counters. You can replace Guardian Ring with an AOE skill like Mountain Collapse. If you are acting too slowly, consider replacing ripple impact with Feline Dance.","updated":"01/September/2026","line":"knight","tier":2,"warn":[],"also":["General dungeon"],"id":"b10"},{"src":["prydwen-knight"],"cls":"Knight","label":"Glass cannon (bosses + adds)","mode":"boss","tech":["Guardian Ring","Frostbite Blossom","Heart of Challenge","Ricocheting Shield"],"charm":["Ripple Impact","Defensive Assault","Pursuit of Victory","Rebound"],"note":"This build works best with Aegiswing, but is workable with Armopi. It is best at stages with bosses and adds. Overall its more of a Glass Cannon build that can suffer without proper investment","updated":"01/September/2026","line":"knight","tier":2,"warn":[],"id":"b11"},{"src":["prydwen-knight"],"cls":"Knight","label":"Story push / many enemies","mode":"explore","tech":["Guardian Ring","Luminous Shield","Whirlwind Slash","Mountain Collapse"],"charm":["Rebound","Counter Blade","Block Awareness","Iron Fortress"],"note":"This build works best with Aegiswing, but is workable with Armopi. It's good for pushing story and stages with lots of enemies.","updated":"01/September/2026","line":"knight","tier":2,"warn":[],"id":"b12"},{"src":["prydwen-archmage","bs-builds"],"cls":"Archmage","label":"AoE + mixed groups","mode":"explore","tech":["Divine Wrath","Howling Hurricane","Meteoric Flames","Lightning Chain"],"charm":["Rapid Cast","Void Bubble","Mana Surge","Radiant Sear"],"note":"This setup should deliver the best outcome for AoE cleaning, and against mix groups too (Boss - Minions). For the charm, consider replacing Mana Surge with either Repelling Wind , Lightning Mystery , or Elemental Harmony . Just find out which charm works the best for you.","updated":"01/September/2026","line":"sorcerer","tier":3,"warn":[],"also":["AoE"],"id":"b13"},{"src":["prydwen-archmage","bs-builds"],"cls":"Archmage","label":"Single target (also PvP without Divine Wrath)","mode":"boss","tech":["Divine Wrath","Howling Hurricane","Meteoric Flames","Wind's Delight"],"charm":["Rapid Cast","Void Bubble","Mana Surge","Radiant Sear"],"note":"It doesn’t change much compared to the AoE build, but you can replace Divine Wrath with Tempest Sphere to trigger Radiant Sear more. You can also use this setup (without Divine Wrath ) in PVP, though you don't have much to bring there.","updated":"01/September/2026","line":"sorcerer","tier":3,"warn":[],"also":["Single target"],"id":"b14"},{"src":["prydwen-arcanist","allclash-arcanist","bs-builds"],"cls":"Arcanist","label":"Single target","mode":"boss","tech":["Mana Blast","Dark Bullet","Abyssal Hand","Shadow of Termination"],"charm":["Shadow Vengeance","Night's Blessing","Shadow Erosion","Linked Misfortune"],"note":"","updated":"01/September/2026","line":"sage","tier":3,"warn":[],"also":["Bosses","Single target"],"id":"b15"},{"src":["prydwen-arcanist","allclash-arcanist"],"cls":"Arcanist","label":"AoE","mode":"explore","tech":["Mana Blast","Dark Bullet","Abyssal Hand","Shadow Impact"],"charm":["Shadow Vengeance","Night's Blessing","Shadow Erosion","Linked Misfortune"],"note":"","updated":"01/September/2026","line":"sage","tier":3,"warn":[],"also":["AoE"],"id":"b16"},{"src":["prydwen-arcanist"],"cls":"Arcanist","label":"Healer","mode":"heal","tech":["Void Blessing","Waterling Summon","Radiant Restoration","Frenzy Totem"],"charm":["Resurrection","Healing Mastery","Overhealing","FLEX"],"note":"","updated":"01/September/2026","line":"sage","tier":3,"warn":[],"id":"b17"},{"src":["prydwen-berserker"],"cls":"Berserker","label":"Build 1","mode":"general","tech":["Hunter's Judgment","Sunset Sword","Eclipse Slash","Lion Combo"],"charm":["Insightful Eye","Blade of Judgment","Blade Siphon","Indomitable Will"],"note":"You can use Blade of Lament instead of Blade Siphon if your Crit Rate isn’t good enough to trigger it consistently. Also, if you’re not worried about dying, you can replace Indomitable Will with a more offensive Charm.","updated":"01/September/2026","line":"duelist","tier":3,"warn":[],"id":"b18"},{"src":["prydwen-berserker"],"cls":"Berserker","label":"Build 2","mode":"general","tech":["Flame Aura","Sunset Sword","Eclipse Slash","Lion Combo"],"charm":["Insightful Eye","Blade of Judgment","Blazing Clash","Crit Mastery"],"note":"","updated":"01/September/2026","line":"duelist","tier":3,"warn":[],"id":"b19"},{"src":["prydwen-berserker"],"cls":"Berserker","label":"Build 3 (PvP swap noted)","mode":"pvp","tech":["Darkness Descends","Lion Combo","Eclipse Slash","Sunset Sword"],"charm":["Insightful Eye","Blade of Judgment","Frame of Battles","Indomitable Will"],"note":"For 2vs2 and 4vs4 PVP, you can replace Lion Combo with Hunter's Judgment to group enemies and get them closer.","updated":"01/September/2026","line":"duelist","tier":3,"warn":[],"id":"b20"},{"src":["prydwen-paladin"],"cls":"Paladin","label":"Party support tank","mode":"group","tech":["Valor Surge","Heart of Challenge","Luminous Shield","Desperate Protection"],"charm":["Iron Fortress","Block Mastery","Block Awareness","Stone Skin"],"note":"Some changes from our Knight build, we replace a more ‘selfish’ skill with extra party safety. If your survival is not an issue, replace Luminous Shield with Lunarwater Threads for extra damage and utility. Overall, unless you are carrying a lower-level Dungeon, you are not gonna contribute as much to damage, so it’s fine to maximize your defense with charms: if your team dies, it’s your fault, and dead party members won’t contribute to damage!","updated":"01/September/2026","line":"knight","tier":3,"warn":[],"id":"b21"},{"src":["prydwen-paladin"],"cls":"Paladin","label":"Water damage","mode":"general","tech":["Guardian Ring","Lunarwater Threads","Frostbite Blossom","Heart of Challenge"],"charm":["Ripple Impact","Defensive Assault","Pursuit of Victory","Insightful Eye"],"note":"Compared to our Knight days, we now have a wide skill that also deals Water damage, so Ricocheting Shield can be dropped. However, it can be used in stages with single-target bosses. Insightful Eye is great for adding some consistency to the damage we deal. If you die too much, consider running a reflect build or adding a more defensive option like Potential Rebirth .","updated":"01/September/2026","line":"knight","tier":3,"warn":[],"id":"b22"},{"src":["prydwen-paladin"],"cls":"Paladin","label":"Star Shattering Slash","mode":"boss","tech":["Luminous Shield","Forceful Charge","Star Shattering Slash","Heart of Challenge"],"charm":["Rebound","Counter Blade","Block Mastery","Block Awareness"],"note":"Armopi can work better than Aegiswing here. Can and should replace Luminous Shield with Valor Surge to increase damage as soon as surviving becomes less of a concern. In AoE-heavy stages, Star Shattering Slash can be replaced with another AoE. Forceful Charge helps push enemies away if you have to kite, Lunarwater Threads helps pull enemies if they tend to hit with ranged skills.","updated":"01/September/2026","line":"knight","tier":3,"warn":[],"id":"b23"},{"src":["prydwen-destroyer","allclash-destroyer"],"cls":"Destroyer","label":"Boss + mobs (core)","mode":"explore","tech":["Formation Breaker","Howling Hurricane","Meteoric Flames","Wind Blade Spiral"],"charm":["Rapid Cast","Void Bubble","Cyclone Lament","Radiant Sear"],"note":"The core of Destroyer is still Radiant Sear , but you can pair it with Cyclone Lament for the extra damage, considering you use 2 Wind techs here and Laceration can stack. This setup does just fine when you meet the boss + some mobs are set up too. Formation Breaker may look underwhelming against low-defense enemies, but this tech is actually the goat when you fight high-deficit enemies. It should be used in every build, even in later tiers. Note for strong players: Since you tend to overpower the challenge, you can drop Void Bubble or any defense tool and go for more offensive charms.","updated":"01/September/2026","line":"sorcerer","tier":4,"warn":[],"also":["Season 2 entry build"],"id":"b24"},{"src":["prydwen-destroyer","allclash-destroyer"],"cls":"Destroyer","label":"Boss","mode":"boss","tech":["Formation Breaker","Divine Wrath","Wind Blade Spiral","Thunder of Judgment"],"charm":["Rapid Cast","Void Bubble","Mana Surge","Radiant Sear"],"note":"Wind Blade Spiral can be replaced with Tempest Sphere . For any boss that’s smaller than 3x3 size, you can consider dropping Divine Wrath for Meteoric Flames . Mana Surge can be replaced with Overload Protection for some extra protection. Sometimes you only need a bit more to push ahead.","updated":"01/September/2026","line":"sorcerer","tier":4,"warn":[],"also":["Bosses"],"id":"b25"},{"src":["prydwen-destroyer","allclash-destroyer"],"cls":"Destroyer","label":"Fire horde","mode":"explore","tech":["Formation Breaker","Fiery Star Trail","Fireball","Meteoric Flames"],"charm":["Rapid Cast","Void Bubble","Explosive Spirit","Fiery Burst"],"note":"This setup works best when you fight a horde of mobs. The core damage is Fiery Burst ; all 4 tech just exist to trigger or support it.","updated":"01/September/2026","line":"sorcerer","tier":4,"warn":[],"also":["Mob waves"],"id":"b26"},{"src":["prydwen-destroyer"],"cls":"Destroyer","label":"Water freeze (weaker)","mode":"general","tech":["Flowing Doom","Water Assault","Frosty Nova","Ice Spike"],"charm":["Rapid Cast","Void Bubble","Shattering Ice","Water to Ice"],"note":"It may do something when you fight a moderate size of mobs (because horde size nothing beats Fire build). Also, you can replace Ice Spike with Aqua Vortex and put it in the first slot to increase the chance to freeze enemies. This build is weaker on bosses because bosses can only be frozen once their white gauge has been worn out.","updated":"01/September/2026","line":"sorcerer","tier":4,"warn":[],"id":"b27"},{"src":["prydwen-dominator","allclash-dominator"],"cls":"Dominator","label":"Erosion / single target","mode":"boss","tech":["Dark Bullet","Dark Starburst","Chaos Rune","Shadow of Termination"],"charm":["Shadow Vengeance","Night's Blessing","Shadow Erosion","Linked Misfortune"],"note":"Dark Starburst and Chaos Rune deal good damage without having to rely on Erosion stacks, which makes the damage output less RNG and also makes the lack of Effect Hit Rate a bit more forgiving, at the cost of lowering the damage ceiling you can achieve. Conversely, if you can reach High Effect Hit Rate, you can swap the Chaos Rune for another Erosion skill like Mana Blast . You can also add in the Frenzy Totem and use the Soul Pact Resonance instead of Shadow Vengeance or Night's Blessing , depending on the rarity of your skills and your overall stats.","updated":"01/September/2026","line":"sage","tier":4,"warn":[],"also":["Erosion"],"id":"b28"},{"src":["prydwen-dominator"],"cls":"Dominator","label":"AoE (Tier 3 build)","mode":"explore","tech":["Mana Blast","Dark Bullet","Abyssal Hand","Shadow Impact"],"charm":["Shadow Vengeance","Night's Blessing","Shadow Erosion","Linked Misfortune"],"note":"Dominator doesn’t get any new AoE Technique or Charm, so you have no choice but to use your old AoE build for the entirety of T4.","updated":"01/September/2026","line":"sage","tier":4,"warn":[],"id":"b29"},{"src":["prydwen-dominator"],"cls":"Dominator","label":"Healer","mode":"heal","tech":["Waterling Summon","Rejuvenating Rain","Radiant Restoration","Frenzy Totem"],"charm":["Phantom Light","Healing Mastery","Overhealing","FLEX"],"note":"Use Healing Touch instead of the Frenzy Totem if you need more Healing. Last Charm slot depends on your experience: If you die early in the fights, use Shadow Vengeance . If your allies die quickly, use Resurrection instead. If you don’t need any extra survival tools, Mantra of Blessings is the way to go. If you die early in the fights, use Shadow Vengeance . If your allies die quickly, use Resurrection instead. If you don’t need any extra survival tools, Mantra of Blessings is the way to go.","updated":"01/September/2026","line":"sage","tier":4,"warn":[],"id":"b30"},{"src":["prydwen-conqueror","allclash-conqueror","bs-builds"],"cls":"Conqueror","label":"Balanced","mode":"general","tech":["Flash Fire","Flame Aura","Flickering Blade","Blade Storm"],"charm":["Insightful Eye","Piercing Assault","Tactical Adaptation","Indomitable Will"],"note":"Flame Aura can be replaced by Darkness Descends if you want more mobility and need the Dispel - also a better option in PVP. Once you get enough Crit Rate from the new gear, you can drop Insightful Eye and replace it with a more offensive Charm - for example, with Soul Breaker . This will happen quite soon because S2 gear offers much higher Crit Rate values than S1 gear. Just keep in mind that S2 enemies have 18% Crit Res by default, so you need to reach 118% Crit Rate if you want to have 100% Crit Rate in PVE content. This will happen quite soon because S2 gear offers much higher Crit Rate values than S1 gear. Just keep in mind that S2 enemies have 18% Crit Res by default, so you need to reach 118% Crit Rate if you want to have 100% Crit Rate in PVE content. If you’re strong enough and not dying on the stage/dungeon, replace Indomitable Will with another offensive Charm. For this spot, Soul Splash works really well thanks to Flickering Blade . Always keep Indomitable Will for PVP.","updated":"01/September/2026","line":"duelist","tier":4,"warn":[],"also":["Balanced","General"],"id":"b31"},{"src":["prydwen-conqueror","allclash-conqueror"],"cls":"Conqueror","label":"High crit","mode":"general","tech":["Flame Aura","Blade Storm","Flash Fire","Flickering Blade"],"charm":["Insightful Eye","Piercing Assault","Tactical Adaptation","Blazing Clash"],"note":"Once you get enough Crit Rate from the new gear, you can drop Insightful Eye and replace it with a more offensive Charm - with the best option being Crit Mastery for the Dragon . This will happen quite soon because S2 gear offers much higher Crit Rate values than S1 gear. Just keep in mind that S2 enemies have 18% Crit Res by default, so you need to reach 118% Crit Rate if you want to have 100% Crit Rate in PVE content. This will happen quite soon because S2 gear offers much higher Crit Rate values than S1 gear. Just keep in mind that S2 enemies have 18% Crit Res by default, so you need to reach 118% Crit Rate if you want to have 100% Crit Rate in PVE content.","updated":"01/September/2026","line":"duelist","tier":4,"warn":[],"also":["High crit (aim 118% Crit Rate)"],"id":"b32"},{"src":["prydwen-guardian","allclash-guardian","bs-builds"],"cls":"Guardian","label":"Support tank","mode":"group","tech":["Valor Surge","Heart of Challenge","Luminous Shield","Desperate Protection"],"charm":["Iron Will","Holy Aegis","Block Awareness","Soul Protection"],"note":"This is a more support-oriented build, aiming to keep your team alive more. If you find yourself needing more Taunting power, remove Valor Surge for Hamper Strike . If your team still dies, maybe try slotting in Iron Fortress , but it remains mostly a PvP charm, like Oath of Vigil . Mix and match with damage-oriented builds if you think you need some extra damage, depending on your gear, power, and stage. For example, you can replace Desperate Protection with Swirling Blade if you want more damage or Star Shattering Slash .","updated":"01/September/2026","line":"knight","tier":4,"warn":[],"also":["Keep the team alive","Support dungeon"],"id":"b33"},{"src":["prydwen-guardian","allclash-guardian","bs-builds"],"cls":"Guardian","label":"Water AoE","mode":"explore","tech":["Swirling Blade","Lunarwater Threads","Seismic Tide","Raging Maelstrom"],"charm":["Frigid Aura","Defensive Assault","Frigid Glint","Potential Rebirth"],"note":"Our water-based build is finally more offensive, allowing us to get faster cold stacking on the enemy. This is mostly for AoE fights, but it has decent ST damage. As this build is more offensive, charms may be repurposed depending on the goal. Potential Rebirth gives a second chance, a highly invested Blade of Lament could provide strong lifesteal, Pursuit of Victory can still be helpful, and so on. As you get more crit from companions, gear, and everything else, Insightful Eye starts to fade away.","updated":"01/September/2026","line":"knight","tier":4,"warn":[],"also":["AoE","Offensive Water"],"id":"b34"},{"src":["prydwen-guardian","allclash-guardian"],"cls":"Guardian","label":"All-purpose support (Dragon, Chaos, Guild Boss)","mode":"group","tech":["Valor Surge","Leap Attack","Holy Purification","Lunarwater Threads"],"charm":["Frigid Aura","Frigid Glint","Iron Fortress","Oath of Vigil"],"note":"An all-purpose support build that can work in Dragon, Chaos, and Guild Bosses. Tinker with it as you see fit, adding more survival charms or more damage. For example, if no dispel is needed, you can remove Holy Purification . Lunarwater Threads can be replaced with Seismic Tide for more consistent Cold stacking. Make sure you are also changing your pet to support your team. Kels (with Manifestation) is an amazing Def Down + Dispel choice, Chomusuke still works, Nyxarchon remains solid to Amplify damage, and for the Guild Boss, you can also bring Terragon if the team needs more DMG Reduction.","updated":"01/September/2026","line":"knight","tier":4,"warn":[],"also":["Boss damage"],"id":"b35"},{"src":["prydwen-guardian","allclash-guardian"],"cls":"Guardian","label":"Tank and spank","mode":"general","tech":["Desperate Protection","Luminous Shield","Forceful Charge","Star Shattering Slash"],"charm":["Rebound","Holy Aegis","Block Mastery","Block Awareness"],"note":"Our good old ‘Tank&Spank’ from S1. This build is actually the most flexible out there since you can remove Luminous Shield for Guardian Ring for more shielding, add Valor Surge for more damage, and so on. If you think your block is enough, you can replace Block Awareness with more offensive options like Eye for an Eye . If you just need to live a bit longer, a higher ascension Potential Rebirth can be clutch. If you run Pandarial , this build can change a lot. You can drop Luminous Shield for Light Sword Array and play more aggressively, but make sure to replace some of your charms to get more defense there.","updated":"01/September/2026","line":"knight","tier":4,"warn":[],"also":["Reflect tank"],"id":"b36"},{"src":["prydwen-magister","bs-builds"],"cls":"Magister","label":"Wind AoE","mode":"explore","tech":["Formation Breaker","Wind Blade Spiral","Storm Rhapsody","Howling Hurricane"],"charm":["Radiant Warp","Thunder Judgment","Cyclone Lament","Radiant Sear"],"note":"For Magister, Radiant Sear is no longer the top 1 damage contributor anymore but it still provides too much to drop off. If somehow you need extra protection with Overload Protection or Vital Rhythm , please swap it with Thunder Judgment . Formation Breaker may look underwhelming against low-defense enemies, but this tech is actually the goat when you fight high-deficit enemies. It should be used in every build, even in later tiers.","updated":"01/September/2026","line":"sorcerer","tier":5,"warn":[],"also":["Wind AoE"],"id":"b37"},{"src":["prydwen-magister"],"cls":"Magister","label":"Single target","mode":"boss","tech":["Formation Breaker","Divine Wrath","Twin Gale","Thunder of Judgment"],"charm":["Radiant Warp","Thunderbolt Mark","Mana Surge","Radiant Sear"],"note":"There’s not much improvement in ST for T5 Mage. A few modifications you can try are: Meteoric Flames instead of Divine Wrath or Twin Gale (against high Wind res enemies or boss never move). Fire Blast instead of Twin Gale (Fire Blast is stronger than Twin Gale if it’s 1 rarity higher. Same rarity always goes Twin Gale). Cyclone Lament instead of Thunderbolt Mark . This is when you run a lot of Wind tech.","updated":"01/September/2026","line":"sorcerer","tier":5,"warn":[],"id":"b38"},{"src":["prydwen-magister","bs-builds"],"cls":"Magister","label":"Fire AoE","mode":"explore","tech":["Formation Breaker","Fiery Star Trail","Crimson Whirl","Meteoric Flames"],"charm":["Radiant Warp","Ember Flare","Explosive Spirit","Fiery Burst"],"note":"In case you already have a high Crit Chance from Gear, Relics etc. Consider dropping Explosive Spirit for Raging Wildfire (Tier 2 Sorcerer), and dropping Meteoric Flames for Blast Spirit .","updated":"01/September/2026","line":"sorcerer","tier":5,"warn":[],"also":["Fire AoE"],"id":"b39"},{"src":["prydwen-magister"],"cls":"Magister","label":"Single target kiting","mode":"boss","tech":["Formation Breaker","Wind Blade Spiral","Twin Gale","Thunder of Judgment"],"charm":["Radiant Warp","Thunder Judgment","Vital Rhythm","Cyclone Lament"],"note":"This build focuses a lot on high single-target damage and kiting with Twin Gale + Radiant Warp . Vital Rhythm is pretty cool because it will give you 5 stacks of Cheating Death, which will be further enhanced if you run Panda (it heals). Just move around while waiting for the enemy to be damaged by Laceration and Thunder Judgment .","updated":"01/September/2026","line":"sorcerer","tier":5,"warn":[],"id":"b40"},{"src":["prydwen-prophet"],"cls":"Prophet","label":"Single target (summon)","mode":"boss","tech":["Thalasson Summon","Desperate Shadow","Hexed Blast","Soul Reap"],"charm":["Shadowy Current","Shadow Vengeance","Mana Surge","Soul Pact Resonance"],"note":"Fairly expensive to get going with all the T5 skills; if your Summon doesn’t get popped very early in fights, this will be your typical ST setup. You can replace the Thalasson Summon with the Frenzy Totem ; it will survive better, but you’ll lose a bit of damage output. The other 3 Techniques are core to the build. Shadow Vengeance is still a must-have for any player who can’t survive without it. You may replace it with Ring of Omen if you don’t need extra survivability. Shadowy Current is a better Night's Blessing , but which to use is on a case-by-case basis, depending on your account. Pick the one with the higher buff value for ST. In PVP, you’ll want the Frenzy Totem by default, and your goal will be to maximize your damage during the Shadow Vengeance window. Can also replace Mana Surge by Ring of Omen if your targets have high Eff Res. Kill before you die, simple enough.","updated":"04/September/2026","line":"sage","tier":5,"warn":[],"id":"b41"},{"src":["prydwen-prophet"],"cls":"Prophet","label":"Erosion (long fights)","mode":"boss","tech":["Desperate Shadow","Dark Starburst","Hexed Blast","Shadow of Termination"],"charm":["Ring of Omen","Mana Surge","Linked Misfortune","Shadow Erosion"],"note":"Erosion is still a viable build for the longer fights, namely Hieromon and the Chaos Boss. Its use in Conquest compared to Direct Damage depends on your own account, how long you survive, the buffs you receive, etc. All the Techniques here are core to the build, with Desperate Shadow having more wiggle room (it is used for the debuffs it applies, synergizing with Blast but also improving overall damage if lucky). Ring of Omen , Linked Misfortune and Shadow Erosion are all core Charms; removing them is not recommended. This leaves only 1 flex slot. Either use Mana Surge or your best damage buff if you’re satisfied with your Crit, or look for the usual survival tools if you need them (you shouldn’t need them in the content this build is designed for, but don’t forget those charms exist for a reason).","updated":"04/September/2026","line":"sage","tier":5,"warn":[],"id":"b42"},{"src":["prydwen-prophet"],"cls":"Prophet","label":"AoE","mode":"explore","tech":["Thalasson Summon","Abyssal Hand","Desperate Shadow","Hexed Blast"],"charm":["Soul Pact Resonance","Night's Blessing","Shadowy Current","Mana Surge"],"note":"Compared to the old AoE build, we only keep Abyssal Hand for its direct damage and debuff potential. The rest are our new AoEs and the best DPS summon we can use to benefit from Soul Pact Resonance . Alternatively, the summon can be changed to any other summon depending on your needs at the time (more ATK, healing, tanking, etc.). Shadow Vengeance can be used instead of Night's Blessing or Mana Surge (depends on your own stats).","updated":"04/September/2026","line":"sage","tier":5,"warn":[],"id":"b43"},{"src":["prydwen-prophet"],"cls":"Prophet","label":"Healer","mode":"heal","tech":["Rejuvenating Rain","Radiant Rhythm","Radiant Restoration","Waterling Summon"],"charm":["Phantom Light","Healing Mastery","Overhealing","FLEX"],"note":"Slot in Void Blessing as your First Technique if your max HP is high (mostly for spenders). Frenzy Totem can still be used; it’s up to you to determine which skill is the least useful in your current situation (if you need Burst healing, Rejuvenating Rain isn’t that useful; if your Waterling Summon dies very fast, you can replace it, etc.). If you can’t reliably use the Radiant Rhythm + Overhealing combo for whatever reason, you may replace both with any other Heal or Buff Technique and any Survival Charm listed below, or even Ring of Omen if your team has any Debuff-reliant builds, or simply for the Vulnerability if your team takes too long to clear. The last Charm slot depends on your experience: If you die early in the fights, use Shadow Vengeance . If your allies die quickly, use Resurrection instead. If you don’t need any extra survival tools, Mantra of Blessings is the way to go.","updated":"04/September/2026","line":"sage","tier":5,"warn":[],"id":"b44"},{"src":["prydwen-ravager"],"cls":"Ravager","label":"Build 1","mode":"general","tech":["Night Curse","Solaris Storm","Soul Piercer","Flickering Blade"],"charm":["Piercing Assault","Tactical Adaptation","Blade of Lament","Indomitable Will"],"note":"If you aren’t close to dying, replace Indomitable Will with Soulfire Protection or Insightful Eye (only if you need the Crit Rate).","updated":"04/September/2026","line":"duelist","tier":5,"warn":[],"id":"b45"},{"src":["prydwen-ravager"],"cls":"Ravager","label":"Build 2","mode":"general","tech":["Flame Aura","Solaris Storm","Eclipse Slash","Flickering Blade"],"charm":["Piercing Assault","Tactical Adaptation","Blade of Judgment","Insightful Eye"],"note":"Replace Insightful Eye with Crit Mastery if you have enough Crit Rate from other places already. Flame Aura can be replaced with Sunset Sword - it depends on which is higher rarity that does better, but test both just to be sure. If you do, move Sunset Sword to the end of the list.","updated":"04/September/2026","line":"duelist","tier":5,"warn":[],"id":"b46"},{"src":["prydwen-ravager"],"cls":"Ravager","label":"Build 3","mode":"general","tech":["Shattering Dance","Sunset Sword","Flickering Blade","Blade Storm"],"charm":["Piercing Assault","Tactical Adaptation","Soulfire Protection","Indomitable Will"],"note":"","updated":"04/September/2026","line":"duelist","tier":5,"warn":[],"id":"b47"},{"src":["prydwen-templar"],"cls":"Templar","label":"Pandarial tank","mode":"group","tech":["Valor Surge","Heart of Challenge","Lunarwater Threads","Hamper Strike"],"charm":["Iron Will","Block Mastery","Block Awareness","Soul Protection"],"note":"This is a build using our friend Pandarial that we hope you picked up! You can drop Block Awareness if you have enough Block Rate and add Rebound for some damage, Oath of Vigil for more damage soaking or anything that fits your current build and stats.","updated":"10/September/2026","line":"knight","tier":5,"warn":[],"id":"b48"},{"src":["prydwen-templar"],"cls":"Templar","label":"Water (Chaos Invasion, solo)","mode":"general","tech":["Swirling Blade","Lunarwater Threads","Seismic Tide","Raging Maelstrom"],"charm":["Frigid Aura","Defensive Assault","Frigid Glint","Sacred Rhythm"],"note":"This is a strong build for Chaos Invasion and solo content, capitalizing on the extra damage from being shielded and quick cold stacking. For AoE content, you can run Lunarwater Threads and remove Sacred Rhythm for Blade of Lament (more sustain) or Pursuit of Victory . For chaos, you can replace Lunarwater Threads with Frostbite Blossom .","updated":"10/September/2026","line":"knight","tier":5,"warn":[],"id":"b49"},{"src":["prydwen-templar"],"cls":"Templar","label":"Flexible","mode":"general","tech":["Valor Surge","Swirling Blade","Star Shattering Slash","Iron Slashes"],"charm":["Defensive Assault","Block Mastery","Block Awareness","Soul Protection"],"note":"The build is very flexible and will depend mostly on your investment on gear and current skills. If your crit rate is high enough you can switch Valor Surge for Boiling Bloodlust . If your Block Rate is fine (always check Block Rate vs enemy Accuracy), you can drop Block Awareness for Sacred Rhythm or Physical Mastery (if running Iron Slashes and Star Shattering Slash ) if you want more damage or rebound. If your Iron Slashes is low, consider replacing it with Light Sword Array .","updated":"10/September/2026","line":"knight","tier":5,"warn":[],"id":"b50"},{"src":["prydwen-templar"],"cls":"Templar","label":"Light AoE","mode":"explore","tech":["Light Sword Array","Phantom Blade","Dawnburst","Sacred Shine"],"charm":["Soul Protection","Defensive Assault","Holy Restoration","Healing Shift"],"note":"Light build offers good AoE damage but lacks the sustain Water build brings. Will not really shine until T6, but it’s fun to test around a new playstyle, especially as you get more dupes on the newer skills. Highly flexible depending on stage needs - can drop Sacred Shine for example to add in Hamper Strike and remove one of the charms for Iron Will to enjoy a dmg reduction effect.","updated":"10/September/2026","line":"knight","tier":5,"warn":[],"id":"b51"},{"src":["mobi-mage","allclash-mage"],"cls":"Mage","label":"Single target / bosses","mode":"boss","tech":["Wind's Delight","Tempest Sphere","Flame Jet","Water Shot"],"charm":["Elemental Mystery","Unstable Aura","Mana Surge","Gale Shield"],"note":"mobi.gg's boss build.","updated":"","line":"mage","tier":1,"warn":[],"also":["Single target"],"id":"b52"},{"src":["mobi-mage"],"cls":"Mage","label":"AoE / exploration","mode":"explore","tech":["Cyclone","Water Assault","Blazing Fire Ring","Fireball"],"charm":["Elemental Mystery","Unstable Aura","Mana Surge","Gale Shield"],"note":"mobi.gg's exploration build.","updated":"","line":"mage","tier":1,"warn":[],"id":"b53"},{"src":["mobi-mage"],"cls":"Mage","label":"Beginner (AoE and single target)","mode":"general","tech":["Cyclone","Ice Spike","Fireball","Iron Thorn"],"charm":["Unstable Aura","Elemental Mystery","Elemental Body","Tough Soul"],"note":"Tough Soul for survival; the other three boost magic damage.","updated":"","line":"mage","tier":1,"warn":[],"id":"b54"},{"src":["mobi-mage"],"cls":"Mage","label":"Healing (co-op)","mode":"heal","tech":["Stonechief Summon","Void Blessing","Iron Thorn","Healing Touch"],"charm":["Flaming Path","Tough Soul","Elemental Body","Gale Shield"],"note":"Co-op healer; Stonechief limits damage taken.","updated":"","line":"mage","tier":1,"warn":[],"id":"b55"},{"src":["mobi-sage","allclash-sage"],"cls":"Sage","label":"PvE AoE (Erosion)","mode":"explore","tech":["Flame Wolf Summon","Weakening Hex","Dark Bullet","Shadow Impact"],"charm":["Insight","Elemental Mystery","Shadow Erosion","Soul Impact"],"note":"","updated":"","line":"sage","tier":2,"warn":[],"also":["AoE"],"id":"b56"},{"src":["mobi-sage","allclash-sage"],"cls":"Sage","label":"Healer (co-op)","mode":"heal","tech":["Void Blessing","Healing Touch","Radiant Restoration","Iron Thorn"],"charm":["Resurrection","Healing Mastery","Tough Soul","Gale Shield"],"note":"","updated":"","line":"sage","tier":2,"warn":[],"also":["Healer"],"id":"b57"},{"src":["mobi-sage"],"cls":"Sage","label":"PvP (healer)","mode":"pvp","tech":["Void Blessing","Healing Touch","Radiant Restoration","Dark Bullet"],"charm":["Unstable Aura","Tough Soul","Healing Mastery","Resurrection"],"note":"","updated":"","line":"sage","tier":2,"warn":[],"id":"b58"},{"src":["mobi-sage"],"cls":"Sage","label":"Erosion","mode":"boss","tech":["Weakening Hex","Dark Bullet","Shadow Impact","Treantling Summon"],"charm":["Curse Resonance","Shadow Erosion","Elemental Mystery","Insight"],"note":"Curse Resonance adds damage per debuff on the target.","updated":"","line":"sage","tier":2,"warn":[],"id":"b59"},{"src":["mobi-duelist"],"cls":"Duelist","label":"Single target / bosses","mode":"boss","tech":["Heavy Impact","Edge Strike","Lion Combo","Phantom Assault"],"charm":["Block Awareness","Counter Blade","Indomitable Will","Strength Rules"],"note":"","updated":"","line":"duelist","tier":2,"warn":[],"id":"b60"},{"src":["mobi-duelist"],"cls":"Duelist","label":"AoE / exploration","mode":"explore","tech":["Flame Aura","Whirlwind Slash","Mountain Collapse","Sunset Sword"],"charm":["Block Awareness","Counter Blade","Indomitable Will","Strength Rules"],"note":"","updated":"","line":"duelist","tier":2,"warn":[],"id":"b61"},{"src":["mobi-duelist"],"cls":"Duelist","label":"PvP","mode":"pvp","tech":["Flame Aura","Leap Attack","Darkness Descends","Insightful Eye"],"charm":["Counter Blade","Frame of Battles","Insightful Eye","Indomitable Will"],"note":"mobi.gg lists Insightful Eye in both a technique and a charm slot.","updated":"","line":"duelist","tier":2,"warn":["Insightful Eye is listed in a technique slot here, but Prydwen's database calls it a Charm."],"id":"b62"},{"src":["mobi-warrior"],"cls":"Warrior","label":"Single target / bosses","mode":"boss","tech":["Boiling Bloodlust","Quadrant Slash","Lion Combo","Heavy Impact"],"charm":["Insightful Eye","Warrior's Essence","Strength Rules","Feline Dance"],"note":"F2P: Counter Blade instead of Insightful Eye.","updated":"","line":"warrior","tier":1,"warn":[],"id":"b63"},{"src":["mobi-warrior"],"cls":"Warrior","label":"AoE / exploration","mode":"explore","tech":["Gravity Pull","Mountain Collapse","Leap Attack","Whirlwind Slash"],"charm":["Blade Tempest","Warrior's Essence","Pure Protection","Blade of Lament"],"note":"","updated":"","line":"warrior","tier":1,"warn":[],"id":"b64"},{"src":["mobi-warrior"],"cls":"Warrior","label":"Beginner","mode":"general","tech":["Leap Attack","Quadrant Slash","Wind Blade Slash","Diving Gale"],"charm":["Blade Tempest","Warrior's Essence","Feline Dance","Life Blessing"],"note":"","updated":"","line":"warrior","tier":1,"warn":[],"id":"b65"},{"src":["prydwen-warrior"],"cls":"Warrior","label":"AoE","mode":"explore","tech":["Leap Attack","Whirlwind Slash","Quadrant Slash","Mountain Collapse"],"charm":["Block Awareness","Counter Blade","Blade of Lament","Strength Rules"],"note":"Mountain Collapse last (its knockback spoils the others).","updated":"","line":"warrior","tier":1,"warn":[],"id":"b66"},{"src":["prydwen-warrior"],"cls":"Warrior","label":"Single target","mode":"boss","tech":["Heavy Impact","Edge Strike","Lion Combo","Phantom Assault"],"charm":["Block Awareness","Counter Blade","Blade of Lament","Strength Rules"],"note":"Against a ranged boss, swap Phantom Assault for Leap Attack and put it first.","updated":"","line":"warrior","tier":1,"warn":[],"id":"b67"},{"src":["allclash-mage"],"cls":"Mage","label":"Glass cannon (highest damage in most situations)","mode":"general","tech":["Water Assault","Wind's Delight","Water Shot","Fireball"],"charm":["Water to Ice","Mana Surge","Unstable Aura","Elemental Mystery"],"note":"","updated":"","line":"mage","tier":1,"warn":[],"id":"b68"},{"src":["allclash-mage"],"cls":"Mage","label":"Freeze (swap in vs hard bosses)","mode":"boss","tech":["Water Assault","Water Shot","Ice Spike","Tempest Sphere"],"charm":["Unstable Aura","Mana Surge","Dew's Blessing","Water to Ice"],"note":"Freeze can make a boss skip a turn.","updated":"","line":"mage","tier":1,"warn":[],"id":"b69"},{"src":["allclash-sorcerer"],"cls":"Sorcerer","label":"All content except heavy single target","mode":"explore","tech":["Water Assault","Frosty Nova","Light of Dawn","Lightning Chain"],"charm":["Lightning Mastery","Void Bubble","Mana Surge","Water to Ice"],"note":"AllClash writes Lightning Mastery; Prydwen's Sorcerer builds use Lightning Mystery.","updated":"","line":"sorcerer","tier":2,"warn":["Lightning Mastery is not in Prydwen's skill database."],"id":"b70"},{"src":["allclash-warrior"],"cls":"Warrior","label":"Multiple enemies","mode":"explore","tech":["Leap Attack","Mountain Collapse","Gravity Pull","Whirlwind Slash"],"charm":["Blade of Lament","Insightful Eye","Block Awareness","Blade Tempest function md(t){ // **bold**, [[Skill]] links
  return esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\[\[(.+?)\]\]/g,(m,n)=>{n=n.replace(/&#39;/g,"'");return skLink(n)});
}
function skLink(n){
  if(SK[n])return `<a class="sk" href="#skill/${encodeURIComponent(n)}" data-sk="${esc(n)}">${esc(n)}</a>`;
  if(PETS[n])return `<a class="sk" href="#pet/${encodeURIComponent(n)}" data-pet="${esc(n)}">${esc(n)}</a>`;
  return esc(n);
}
function chips(src){
  if(!src||!src.length)return '';
  return '<span class="chips">'+src.map(id=>{const s=SRC[id];if(!s)return '';const low=s.trust==='low';
    return `<a class="src${low?' low':''}" href="${esc(s.url)}" target="_blank" rel="noopener" title="${esc(s.name)}${low?' (lower-trust site)':''}${s.via&&s.via.includes('webfetch')?' (read via WebFetch summary)':''}">${esc(short(s))}</a>`}).join('')+'</span>';
}
function short(s){const n=s.name;const m=n.match(/^(Prydwen|BlueStacks|mobi\.gg|AllClash|Pocket Tactics|EOG\.GG|Inven Global|Narcosis|allthings\.how|Roonby|Beatcop|Packsify|Topuplist)/);
  if(!m)return n; const rest=n.slice(m[0].length).replace(/^[:\s]+/,'').replace(/ build$| guide$/i,'');return rest?`${m[0]} · ${rest}`:m[0];}
function line(f){
  return md(f.t)+(f.own?'<span class="own" title="This guide\'s reasoning from the cited sources">Guide\'s pick</span>':'')+chips(f.src)+(f.warn?`<span class="warn">Unverified: ${esc(f.warn)}</span>`:'');
}
const lines=a=>'<ul class="lines">'+a.map(f=>`<li>${line(f)}</li>`).join('')+'</ul>';
const steps=a=>'<ol class="steps">'+a.map(f=>`<li>${line(f)}</li>`).join('')+'</ol>';
function table(cols,rows,cls=''){

}
