<style>
:root{

}
*{box-sizing:border-box}
html{background:var(--ink)}
body{margin:0;background:radial-gradient(1100px 600px at 85% -10%,rgba(160,143,208,.13),transparent 60%),var(--ink);color:var(--paper);font:15.5px/1.6 var(--sans)}
a{color:var(--ai)}

button{font:inherit;color:inherit;cursor:pointer}
.shell{display:grid;grid-template-columns:270px minmax(0,1fr);min-height:100vh}
aside{position:sticky;top:0;height:100vh;overflow:auto;background:var(--well);border-right:1px solid var(--line);padding:18px 14px 40px}

.checked{font-size:.74rem;color:var(--muted);margin:10px 0 12px;line-height:1.45}
.search{position:relative}
.search input{width:100%;padding:10px 12px 10px 34px;border-radius:10px;border:1px solid var(--line2);background:var(--panel);color:var(--paper);font:inherit;outline:none}
.search input:focus{border-color:var(--acc)}
.search svg{position:absolute;left:10px;top:12px;opacity:.6}
.results{position:absolute;left:0;right:0;top:44px;z-index:30;background:var(--panel-2);border:1px solid var(--line2);border-radius:10px;max-height:60vh;overflow:auto;box-shadow:0 12px 30px rgba(0,0,0,.45)}

nav{margin-top:12px;display:flex;flex-direction:column;gap:1px}

main{min-width:0;padding:26px clamp(16px,3.2vw,52px) 90px}
.topbar{display:none}
.hero{border-radius:18px;padding:clamp(20px,4vw,40px);margin-bottom:20px;border:1px solid var(--line2);
  background:linear-gradient(135deg,rgba(160,143,208,.22),transparent 60%),linear-gradient(315deg,rgba(124,155,224,.12),transparent 55%),var(--panel)}
.hero .k{color:var(--acc);letter-spacing:.2em;font-size:.72rem;text-transform:uppercase;font-weight:700}
.hero h1{font-size:clamp(2.1rem,5.4vw,3.4rem);margin:.15em 0 .25em}
.hero p{max-width:760px;color:#d8d2c8;font-size:1.04rem;margin:.4em 0}
.lastcheck{display:inline-block;margin-top:8px;padding:6px 10px;border-radius:8px;background:rgba(0,0,0,.25);border:1px solid var(--line2);font-size:.8rem;color:#d8d2c8}
p{max-width:110ch}
.lines{list-style:none;padding:0;margin:.4em 0 1em;display:flex;flex-direction:column;gap:8px;max-width:110ch}
.lines li{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 13px}
ol.steps{padding-left:0;list-style:none;counter-reset:s;max-width:110ch;margin:.4em 0 1.2em}
ol.steps li{counter-increment:s;position:relative;padding:9px 13px 9px 46px;background:var(--panel);border:1px solid var(--line);border-radius:10px;margin:7px 0}
ol.steps li::before{content:counter(s);position:absolute;left:11px;top:9px;width:24px;height:24px;border-radius:50%;background:var(--acc);color:var(--acc-ink);display:grid;place-items:center;font-weight:700;font-size:.82rem}
.need{color:var(--muted);font-style:italic;margin:.2em 0 .8em}
.chips{display:inline-flex;flex-wrap:wrap;gap:4px;margin-left:6px;vertical-align:baseline}
.src{font-size:.68rem;padding:1px 7px;border-radius:999px;border:1px solid rgba(124,155,224,.45);color:var(--ai);text-decoration:none;white-space:nowrap}
.src.low{border-color:rgba(227,179,92,.45);color:var(--gold)}
.own{font-size:.68rem;padding:1px 7px;border-radius:999px;background:rgba(143,191,138,.16);color:var(--matcha);border:1px solid rgba(143,191,138,.4);white-space:nowrap;margin-left:6px}
.warn{display:block;margin-top:5px;font-size:.8rem;color:var(--gold)}
.box{border-radius:12px;padding:12px 15px;margin:12px 0;border:1px solid var(--line2);background:var(--panel-2);max-width:110ch}
.box.conflict{border-color:rgba(227,179,92,.5);background:rgba(227,179,92,.07)}
.box.conflict>b:first-child{color:var(--gold)}
.box.open{border-color:rgba(224,107,90,.45);background:rgba(224,107,90,.07)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);margin:10px 0 16px;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--panel-2);font-weight:600;white-space:nowrap;position:sticky;top:0}
tr:hover td{background:rgba(255,255,255,.02)}
td .src{font-size:.64rem}
.tier{display:inline-grid;place-items:center;min-width:30px;height:22px;padding:0 6px;border-radius:6px;font-weight:700;font-size:.78rem;color:#151515;background:#777}
.tSSS,.tSS{background:#f0a9c0}.tS{background:#e06b5a}.tA{background:#e3b35c}.tB{background:#8fbf8a}.tC{background:#7c9be0}
.tT0{background:#f0a9c0}.tT05{background:#e06b5a}.tT1{background:#e3b35c}.tT2{background:#8fbf8a}.tT3{background:#7c9be0}.tT4{background:#8a8f99}
.sk{color:var(--sakura);text-decoration:none;border-bottom:1px dotted rgba(240,169,192,.5);cursor:pointer}
.sk:hover{color:#fff}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr))}

.slots{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0}

.mode{font-size:.66rem;padding:2px 8px;border-radius:999px;background:var(--well);border:1px solid var(--line2);color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0 14px}
.filters input,.filters select{background:var(--well);color:var(--paper);border:1px solid var(--line2);border-radius:8px;padding:7px 10px;font:inherit;font-size:.88rem}
.btn{background:var(--panel-2);border:1px solid var(--line2);border-radius:999px;padding:7px 14px;font-size:.88rem}
.btn:hover{border-color:var(--acc)}
.btn.pri{background:var(--acc);color:var(--acc-ink);border-color:var(--acc);font-weight:600}
.owned{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:6px;margin:6px 0 14px}

.owned input{accent-color:var(--acc);width:17px;height:17px}
.owned .r{margin-left:auto;font-size:.7rem;color:var(--muted)}
.result{background:linear-gradient(135deg,rgba(160,143,208,.14),transparent 70%),var(--panel);border:1px solid rgba(160,143,208,.4);border-radius:14px;padding:14px 16px}
.result ol{margin:6px 0 0;padding-left:22px}
.result li{margin:4px 0}
.result .why{display:block;font-size:.78rem;color:var(--muted)}
.check{list-style:none;padding:0;margin:6px 0 14px;max-width:110ch}
.check li{display:flex;gap:10px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin:6px 0}
.check input{accent-color:var(--matcha);width:19px;height:19px;margin-top:2px;flex:none}
.check li.done{opacity:.55}
.check li.done span.t{text-decoration:line-through}
.progress{height:8px;border-radius:999px;background:var(--well);overflow:hidden;margin:6px 0 4px;max-width:520px}
.progress i{display:block;height:100%;background:var(--matcha);width:0;transition:width .25s}
dialog{border:1px solid var(--line2);border-radius:16px;background:var(--panel);color:var(--paper);max-width:min(640px,94vw);width:100%;padding:0}
dialog::backdrop{background:rgba(8,10,14,.7)}
dialog .in{padding:18px 20px 20px}
dialog .x{position:absolute;right:10px;top:8px;background:none;border:0;font-size:1.5rem;color:var(--muted)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:.88rem;margin:10px 0}
.kv b{color:var(--muted);font-weight:500}
.foot{margin-top:40px;color:var(--muted);font-size:.78rem;max-width:110ch}
.cards-nav{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));margin:14px 0}
.cards-nav a{display:block;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-decoration:none;color:var(--paper)}
.cards-nav a:hover{border-color:var(--acc)}
.cards-nav a small{display:block;color:var(--muted);font-size:.8rem;margin-top:3px}
.stage{border-left:3px solid var(--acc);padding-left:14px;margin:22px 0}
@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  aside{position:fixed;inset:0 auto 0 0;width:min(86vw,320px);transform:translateX(-102%);transition:transform .2s;z-index:50;box-shadow:0 0 40px rgba(0,0,0,.6)}
  body.menu aside{transform:none}
  .topbar{display:flex;gap:10px;align-items:center;position:sticky;top:0;z-index:40;background:rgba(22,28,38,.96);border-bottom:1px solid var(--line);padding:10px 16px}
  .topbar b{font-family:var(--serif)}
  main{padding:16px 16px 80px}
  table{font-size:.82rem}
  .tablewrap table{min-width:600px}
  #sTable td:last-child{min-width:240px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

]},{"t":"**Claim AFK rewards twice a day.** The idle reward cap is roughly 12 to 16 hours; hours past it are lost (one lower-trust source).","src":["narcosis-progress"],"q":["AFK reward cap: roughly 12 to 16 hours"]}],"how":[{"t":"New player: read How to start, then Save and spend, then the Mage line (or your class). Use the rest as reference.","src":[],"q":[],"own":true},{"t":"Every line shows its sources as small tags. Click a tag to open the page it came from. Lines marked **Guide's pick** are this guide's own reasoning from those sources.","src":[],"q":[],"own":true},{"t":"Where sources disagree, the guide shows each claim side by side instead of picking one silently. Check the in-game rates screen for anything about pulls.","src":[],"q":[],"own":true},{"t":"Balance changes with every new tier and season (roughly every 2 to 3 months), so recheck builds after each one.","src":["prydwen-classes-and-roles"],"q":["Roughly every 2-3 months, a new Tier is added to the game together with a new Season"]}]},"start":{"need":"You'll need: the game installed, about an hour for day 1, and a server your friends are on.","day1":[{"t":"Pick the server your friends or guild use before you start. Guilds are per server, servers close at 5,000 players, and a reroll can land you on another server.","src":["prydwen-tips-and-tricks"],"q":["Guilds are per Server","Servers have a 5000 player cap"]},{"t":"Pick Mage or Warrior. Mage clears stages slightly faster early thanks to its AoE but is squishy; Warrior is the more forgiving start. You can change class later, so pick the playstyle you enjoy.","src":["prydwen-classes-and-roles","bs-beginner"],"q":["Mages do progress slightly faster","The Warrior path utilizing the Sword is highly recommended for beginners"]},{"t":"Finish the tutorial. After losing to the Bear you unlock 2x battle speed: turn it on.","src":["prydwen-reroll-guide"],"q":["After losing to the Bear, you unlock x2 battle speed"]},{"t":"Claim every event tab, the mail, the daily login and the gift codes. Prydwen counts about 45 pulls plus the 10 forced tutorial pulls before codes.","src":["prydwen-reroll-guide"],"q":["you’ll get around 45 pulls + 10 pulls forcefully spent during the tutorial"]},{"t":"Redeem gift codes: tap the box icon, then **User Centre**, then **Gift Codes** (current list in Events and codes).","src":["mobi-codes"],"q":["Now click on the box-shaped icon","Select “User Centre”","Now, select “Gift Codes”"]},{"t":"Do 10-pulls on the Standard skill banner. Never single pulls.","src":["narcosis-progress"],"q":["Pulling singles instead of saving for 10-pulls"]},{"t":"Equip the best skills you own with the My loadout picker, and save separate loadouts for exploration and bosses (you get up to 7).","src":["prydwen-classes-and-roles"],"q":["up to seven different loadouts"]},{"t":"Push the campaign, clear map fog and activate every Goddess Statue you find. Statues permanently raise idle income, EXP and combat stats.","src":["bs-tips"],"q":["Map progression is your true level in this game","permanent multiplier boosts to your offline idle income, experience gains, and base combat statistics"]},{"t":"Level skill **slots** and gear **slots**, not single skills: a new skill or item inherits the slot level, and leveling slots evenly gives the most power early.","src":["prydwen-tips-and-tricks","bs-beginner"],"q":["Level Skill and Gear slots equally","it instantly inherits that slot level"]},{"t":"Spend Stamina on Rolla early: it buys raw resources and daily-shop refreshes.","src":["prydwen-tips-and-tricks"],"q":["The best way to use Stamina early on is on Rolla"]}],"week1":[{"t":"Level 15: join an active guild the moment it unlocks.","src":["prydwen-tips-and-tricks","bs-tips"],"q":["Level 15 - Join a Guild as soon as you unlock it"]},{"t":"Level 18: the Vendor Booth opens. Refresh it a few times and buy every material.","src":["prydwen-tips-and-tricks"],"q":["Vendor Booth unlocks at level 18"]},{"t":"Keep pulling until your Tier awnium = 1 Stellatie).","Spend some daily on the efficient sinks in Save and spend. Do not dump it into Standard pulls.",["prydwen-beginner-guide","prydwen-gacha"],["Dawnium, on the other hand, is the main currency of the game","at a rate of 100 Dawnium for 1 Stellatie"]],["Stellatie","Blue pull tickets for the Standard skill banner, from logins, events and gameplay.","Spend on 10-pulls, especially on Tier 1 to level your class.",["prydwen-gacha"],["Stellatie, the Blue “Pull Tickets”, are frequently awarded through logins, events, gameplay"]],["Covenite","Premium skill banner currency. Cannot be bought with Dawnium; comes from events and Standard-banner mileage.","Save for the Premium banner.",["prydwen-gacha"],["Covenite cannot be exchanged for using Dawnium or any other resource","These Mileage rewards mostly grant Covenite, the currency used for the Premium Gacha"]],["Luminium","Conflict: Prydwen calls it paid currency used at the Trading/Auction House; Narcosis says it pulls on the Relic gacha.","Hold until Cinder Ridge (BlueStacks).",["prydwen-beginner-guide","narcosis-gacha","bs-tips"],["they usually cost Paid Currency (Luminium)","Relic Gacha: uses Luminium","save every single bit of your Luminium"]],["Radiant Stars","Named by BlueStacks as a pull resource to hoard. No source says exactly what it buys.","Hold until Cinder Ridge.",["bs-tips"],["Luminium, Radiant Stars, and Skill Shard Vouchers"]],["Skill Shard Vouchers","Free summons. The weekly Guild Boss drops them.","Hold until Cinder Ridge.",["bs-tips","packsify"],["Defeating the weekly Guild Boss provides rare Skill Shard Vouchers, giving you free summons","Skill Shard Vouchers that drop with every completed run"]],["Auroral Cards (relic pull cards)","Relic gacha currency, Rare (blue) to Mythic (gold). 10 cards = 1 pull, 100 = a 10-pull.","Stay on each region's relic banner until 50-70% of its relics are owned once.",["prydwen-gacha"],["The currency to summon on these banners is called “Auroral Cards”","Y ","#1: \"Monthly Card first\"","Best ongoing value"],["Growth Fund / Month Fund","Growth packs: strong but prices climb fast; pick one or two","#2 Growth Fund (Dawnium, Auroral Badges, Destiny Fruit)","#2 Month Fund","Second if you'll keep playing"],["Official website voucher bonus","Extra rewards (cosmetics, helmets, skins) during voucher events","Not ranked","Not ranked","Only if you were buying anyway"],["Temporal Crystal packs","\"Usually worth watching\"; Temporal Crystals are hard to get","Not ranked","Not ranked","Good pop-up value"],["Battle Pass","Great only if you log in daily and finish it","Not ranked","Not ranked","Only if you play daily"],["Weekly pack / card","Not ranked","#4 (A tier)","#3 Weekly Card","Optional"],["$1-5 event and pop-up packs","Relics, tickets, Withering Potions, drill and dungeon keys","Limited event bundles: C tier","Last, only when you need the contents","Cheap ones only"],["Big summon packs, selector bundles, 7-Day Prayer, random chests","Avoid: poor value; 7-Day Prayer gets very expensive","Random chests: \"the worst value in the entire shop\"","Not ranked","Skip"]],"src":["roonby-packs","beatcop-packs","packsify"],"q":["The $1 Starter Pack is the Best Early Purchase","Monthly Card Gives the Best Long-Term Value","even help until the second island","Growth Packs Are Strong but Can Get Expensive Fast","Temporal Crystal Packs Are Usually Worth Watching","Battle Pass is Great if You Play Regularly","Buying Through the Official Website Can Give Extra Rewards","Packs Light Spenders Should Usually Avoid","the 7-Day Prayer","1 Monthly Card","2 Growth Fund","3 New Player Pack","4 Weekly Pack","the worst value in the entire shop","Monthly Card first, Month Fund second, Weekly Card third","Limited Event Bundles"],"note":{"t":"Packsify sells top-ups and writes for $500+/month spenders; Roonby and Beatcop are affiliate sites. None list exact prices, which vary by region: check the in-game shop.","src":["packsify"],"q":["already spending $500+ per month"]},"free":[{"t":"Auction House: selling well-rolled gear is a big F2P income; Prydwen saw 20-40 pulls' worth of currency for one good piece.","src":["prydwen-beginner-guide"],"q":["Sometimes you can even get 20-40 skill pulls worth of currency for a single, well-rolled gear piece"]},{"t":"Arena: an early-week push earns daily Dawnium from your rank for the rest of the week (Packsify).","src":["packsify"],"q":["earns free daily Dawnium rewards for the rest of the week"]},{"t":"Gift codes give Dawnium, Fruit of Destiny and Auroral Insignias (list in Events and codes).","src":["mobi-codes"],"q":["SXSDCTHANKS | 40 Rare Auroral Insignias, 3 Fruits of Destiny, 180 Dawnium"]}]},"classtree":[["Sorcerer line","Mage","Sorcerer","Archmage","Destroyer","Magister","Ranged AoE damage; very squishy","Accuracy; CRIT Rate > Accuracy > CRIT DMG"],["Sage line","Mage","Sage","Arcanist","Dominator","Prophet","Healer, summoner or damage-over-time (Dark)","Higher base stats; Effect Hit Rate >= Accuracy > CRIT Rate > CRIT DMG"],["Duelist line","Warrior","Duelist","Berserker","Conqueror","Ravager","Melee damage with lifesteal","CRIT Rate; CRIT Rate > CRIT DMG > Accuracy > Block"],["Knight line","Warrior","Knight","Paladin","Guardian","Templar","Tank: taunt, shields, counters","Block; Block >>> Accuracy > CRIT Rate"]],"classnotes":[{"t":"Tier 5 lines: Prydwen's Magister guide calls it \"T5 Mage\". Prophet, Ravager and Templar are placed on the Sage, Duelist and Knight lines from the skills their Prydwen builds share with the Tier 4 class (for example, Ravager keeps Flickering Blade from Conqueror).","src":["prydwen-magister","prydwen-ravager"],"q":["T5 Mage further enhances 2 builds","Night Curse | Solaris Storm | Soul Piercer | Flickering Blade"],"warn":"Line placement for Prophet, Ravager and Templar is inferred from shared skills."},{"t":"Timeline from server creation, not from when you start: Tier 1 day 1-4, Tier 2 day 4-12, Tier 3 day 12-47, Tier 4 from day 47 (Season 2).","src":["prydwen-classes-and-roles","bs-class"],"q":["Tier 1: Day 1 > Day 4","Tier 2: Day 4 > Day 12","Tier 3: Day 12 > Day 47","Tier 4: Day 47 onwards","Promotions unlock on a fixed schedule based on when your server was created"]},{"t":"Tiers 1-3 pass quickly. Prydwen says the real game starts with Season 2 and Tier 4, so don't stress over early class strength.","src":["prydwen-classes-and-roles"],"q":["The ‘real’ game begins when Season 2 starts, as it introduces Tier 4 classes"]},{"t":"Changing class: the plain switch restarts the new class at level 1 with no skills (avoid it). The conversion turns all your pulled skills into the new class's, lets you pick one of three loadouts and keeps your level. It needs level 100 and works once a week for free (Dawnium for more).","src":["prydwen-classes-and-roles","bs-class"],"q":["The new class you switched to will start at level 1","all previously pulled skills are converted into skills used by your new class","you need to reach level 100 before you can actually use it"]},{"t":"Sorcerer line: the most consistent class across tiers and the king of Tier 2 dungeons, but it dies easily and often replays story stages for good RNG.","src":["prydwen-classes-and-roles"],"q":["Very consistent class across all Tiers","At Tier 2, Sorcerers are the kings of Dungeons","you often have to repeat stages a lot to get the right RNG to pass it"]},{"t":"Duelist line: the most popular class (often 50-70% of a server) and the best at pushing story, but it swings between top and bottom from tier to tier. Prydwen calls Tier 4 \"the Duelist Tier\" and says everyone else is better at Tier 5.","src":["prydwen-classes-and-roles","prydwen-ravager"],"q":["usually, Duelists take more than 50-70% of the whole server’s population","Tier 4 is generally known as the Duelist Tier","at T5 everyone else is better than you"]},{"t":"Knight line: a must-have in Dungeons and Raids and strong in PvP, but the least F2P-friendly class because it needs heavy Block investment.","src":["prydwen-classes-and-roles","bs-class"],"q":["A must-have in any party content (Dungeons/Raids)","Knights struggle the most when you’re a pure F2P","Knight is the least free to play friendly class in the game"]},{"t":"Sage line: every party needs one (the only class that heals and revives), but it struggles solo because damage over time is slow. Tier 3's Shadow Termination makes it a PvP threat.","src":["prydwen-classes-and-roles"],"q":["Every party needs a Sage in Dungeons/Raids","Struggles to progress in stages due to the nature of delayed damage via DoT","they become a PVP menace for the first time"]},{"t":"Prydwen notes the Chinese version is already at Tier 7, so more tiers will come to Global.","src":["prydwen-classes-and-roles"],"q":["the current Tier available in the Chinese version of the game is Tier 7"]}],"tiers":{"cols":["Class","Pocket Tactics F2P","Pocket Tactics spender","BlueStacks","allthings.how F2P","allthings.how paid"],"rows":[["Destroyer","SS","SSS","S","",""],["Dominator","SS","SSS","S","",""],["Conqueror","SS","SSS","A","",""],["Archmage","S","S","A","",""],["Berserker","S","S","S","",""],["Arcanist","A","S","S","",""],["Paladin","S","not listed","B","",""],["Duelist","A","A","A","S","A"],["Guardian","A","A","B","",""],["Sorcerer","B","B","S","B","A"],["Knight","B","B","B","A","B"],["Sage","C","A","A","C","S"],["Mage","C","C","A","C","C"],["Warrior","C","C","A","C","C"]],"src":["pockettactics-tier","bs-tier","allthings-tier"],"q":["SS | Conqueror, Dominator, Destroyer","S | Archmage, Berserker, Paladin","A | Duelist, Arcanist, Guardian","B | Knight, Sorcerer","C | Mage, Warrior, Sage","SSS | Conqueror, Dominator, Destroyer","S | Archmage, Arcanist, Berserker","A | Sage, Duelist, Guardian","C | Mage, Warrior","| Sorcerer | Magic","| Berserker | Physical","| Arcanist | Magic","| Destroyer | Physical","| Dominator | Physical","| Mage | Magical","| Warrior | Physical","| Sage | Magical","| Duelist | Physical","| Archmage | Magical","| Conqueror | Physical","| Knight | Physical","| Paladin | Physical","| Guardian | Physical","F2P classes: S Duelist; A Knight; B Sorcerer; C Mage, Warrior, Sage","Paid classes: S Sage; A Sorcerer, Duelist; B Knight; C Mage, Warrior"],"notes":[{"t":"Pocket Tactics (updated Sep 12, 2026) puts Destroyer, Dominator and Conqueror on top for both F2P and spenders. It notes generally that some classes benefit from heavy investment in gear and prayers; it gives no reason for any single class.","src":["pockettactics-tier"],"q":["Updated: Sep 12, 2026","some classes that benefit from heavy investment into specific gear and prayers"]},{"t":"BlueStacks (Sep 1, 2026) calls Sorcerer \"the strongest Tier 2 class in the game\" and says Sage \"becomes effectively mandatory in party content\".","src":["bs-tier"],"q":["Sorcerer is the strongest Tier 2 class in the game","It becomes effectively mandatory in party content"]},{"t":"mobi.gg and BlueStacks both name Duelist the best F2P class; BlueStacks adds that Sorcerer is \"perfectly viable\" for F2P thanks to its consistency.","src":["mobi-tier","bs-class"],"q":["We’re talking about the Duelist","Duelist is the strongest free to play pick overall","Sorcerer is also perfectly viable for F2P players"]},{"t":"AllClash: the Duelist path performs best with low investment; Sage/Arcanist is best when fully built, which needs spending.","src":["allclash-all"],"q":["the Duelist path is the best performing with low investment and the Sage/Arcanist is the best when having all well-built"]},{"t":"allthings.how's list (May 2026) is from before Tier 3 and only rates Tier 1-2 classes.","src":["allthings-tier"],"q":["Sword x Staff tier list (May 2026)"],"own":true}],"pick":[{"t":"**Mage players on F2P: take Sorcerer at Tier 2.** It is the consistent damage line, the best Tier 2 dungeon class, and its Tier 4 form (Destroyer) tops Pocket Tactics' F2P list.","src":["prydwen-classes-and-roles","bs-tier","pockettactics-tier"],"q":["Very consistent class across all Tiers","Sorcerer is the strongest Tier 2 class in the game","SS | Conqueror, Dominator, Destroyer"],"own":true},{"t":"Take Sage instead if you will be your guild's healer or plan to spend. Every party needs one, and Pocket Tactics rates Sage C for F2P but A for spenders.","src":["prydwen-classes-and-roles","pockettactics-tier"],"q":["Every party needs a Sage in Dungeons/Raids","A | Sage, Duelist, Guardian"],"own":true}]},"mage":[{"id":"t1","title":"Mage (Tier 1): level 1 to Cinder Ridge","gate":{"t":"From the start until your class is level 18 and Cinder Ridge (level 44, server day 4) opens.","src":["prydwen-tips-and-tricks","prydwen-classes-and-roles"],"q":["you need to reach level 18 of the T1 class","Once you reach Cinder Ridge at level 44"]},"lines":[{"t":"Mage Tier 1 damage comes from multi-hit spells plus [[Unstable Aura]]: every hit can trigger an extra hit, so for single targets more hits per cast is better.","src":["prydwen-mage"],"q":["Mage’s T1 spells all rely on multi-hit components plus the Unstable Aura to be effective","when evaluating single-target abilities, the more hits the better"]},{"t":"AoE skills: [[Cyclone]] (groups enemies, low damage), [[Fireball]] (F2P average nuke), [[Blazing Fire Ring]] (the better Fireball, but you must walk into range).","src":["prydwen-mage"],"q":["Cyclone : Deals lower than average damage but gathers enemies on use","Fireball : A F2P average damage","Blazing Fire Ring : The better Fireball"]},{"t":"Single-target skills: [[Flame Jet]] (3 hits), [[Tempest Sphere]] (5 hits, out-damages Flame Jet once Unstable Aura procs count), [[Wind's Delight]] (7 hits, also AoE), [[Water Assault]] (hits large enemies 3 times and medium ones twice; also strong AoE).","src":["prydwen-mage"],"q":["hits 3 times in a line-based AoE","hits 5 times instead of 3","hits 7 times instead of 5","large enemies are hit by it 3 times and medium enemies are hit 2 times"]},{"t":"Situational: [[Iron Thorn]] (chance to root melee enemies) and [[Stonechief Summon]] (terrible damage, but draws hits away from you). Try them when stuck.","src":["prydwen-mage"],"q":["has a chance to Root targets","This skill deals terrible damage"]},{"t":"Charms: [[Unstable Aura]] is the go-to enabler; [[Mana Surge]] gives Crit Rate; [[Gale Shield]] is a must-have defensive tool; [[Elemental Mystery]] gives Elemental Mastery. [[Water to Ice]] is worth it only with Water Assault. [[Wind's Whisper]] (better) or [[Heart of Flame]] stand in for a missing Mana Surge or Gale Shield.","src":["prydwen-mage"],"q":["Unstable Aura : The go-to enabler for Mage at T1","Mana Surge : Provides tons of Crit Rate","Gale Shield : One of Mage’s best defensive tools in T1 and a must-have","Elemental Mystery : Provides a good chunk of Elemental Mastery","This Charm is usually only worth using if you have Water Assault","is usually the better choice in most cases over Heart of Flame"]},{"t":"Gear in the first two regions: picking by higher Total Power is fine (Prydwen); gear is replaced fast. BlueStacks says to judge by secondary stats rather than Power; that matters more later.","src":["prydwen-beginner-guide","bs-builds"],"q":["In the first 2 Regions, however, it’s okay to pick the Equipment that gives you the higher Total Power (TP)","Do not blindly replace a piece of gear just because it has a lower Power score"]},{"t":"No Fantomon yet (they unlock at level 50-51). mobi.gg says to skip pet and companion investment while you are a Tier 1 Mage.","src":["mobi-mage"],"q":["We can't recommend Fantomon or Companions for the Sword x Staff Mage build"]}]},{"id":"t2","title":"Sorcerer (Tier 2): Cinder Ridge to Aqualis","gate":{"t":"Cinder Ridge, level 44, server day 4.","src":["prydwen-classes-and-roles"],"q":["Once you reach Cinder Ridge at level 44 (Day 4 after server creation)"]},"lines":[{"t":"You deal damage with all four elements and trigger extra damage with [[Lightning Mystery]] and [[Unstable Aura]]; Sorcerers shine in Dungeons. Cherry-pick the best skills of every element rather than going mono-element.","src":["prydwen-sorcerer"],"q":["triggering additional damage via Charms - Lightning Mystery and Unstable Aura","cherry-picking the best skills out of all elements"]},{"t":"Key new skills: [[Light of Dawn]] (\"Best T2 Tech\"), [[Lightning Chain]] (low damage but usable every turn and moves you), [[Frosty Nova]] (3x3 with a Freeze chance), [[Fiery Star Trail]] (two hits; pair with Flaming Path). [[Void Bubble]] replaces Gale Shield.","src":["prydwen-sorcerer"],"q":["Best T2 Tech","you can use this Tech every turn, and it moves you around a lot","Mediocre damage but decent AoE (3x3)","Better version of Gale Shield"]},{"t":"Stats at Tier 2: Elemental Mastery and ATK% first. Crit is not worth investing in yet because gear crit values are too low.","src":["prydwen-classes-and-roles","bs-class"],"q":["focus on generic Elemental Mastery and ATK% early on. CRIT at this tier isn’t honestly worth investing in","Crit stats are not worth heavy investment yet"]},{"t":"Pull on the Premium banner for the Tier 2 skills in the builds below. Light of Dawn and Void Bubble are Prydwen's top-rated (T0) Sorcerer technique and charm.","src":["prydwen-tierlist-db"],"q":["TIER 2|Sorcerer|T0|Light of Dawn|Void Bubble"]},{"t":"Gear upgrade order for Sorcerers: Weapon > Off-hand > Shoes > Armor/Helmet, in +5/+10 steps.","src":["prydwen-beginner-guide"],"q":["Duelists and Sorcerers = Weapon > Off-hand > Shoes > Armor/Helmet"]},{"t":"Pets from level 50: [[Armopi]] early for survival; [[Zeioletus]] or [[Sylvaerie]] where you won't die (Dragon, Guild Raids, Dungeons); save 60 crystals for [[Nyxarchon]].","src":["prydwen-sorcerer"],"q":["Armopi : It gives you a bit of DEF","Zeioletus : Provides you with additional damage burst every turn","Sylvaerie : Gives you basically a permanent ATK and SPD buff","Nyxarchon : The Dark Fantomon that debuffs enemies with max -30% def"]},{"t":"Relic elements for the Sorcerer line: Light is a must, then Fire, then Wind > Water > Dark.","src":["prydwen-sorcerer"],"q":["Light : Must","Other elements can be prioritized as Wind > Water > Dark"]}]},{"id":"t3","title":"Archmage (Tier 3): Aqualis to Loong Haven","gate":{"t":"Aqualis, level 82, server day 12.","src":["prydwen-classes-and-roles"],"q":["Once you reach Aqualis at level 82 (day 12 after server creation)"]},"lines":[{"t":"[[Rapid Cast]] lets your techniques fire one turn sooner, which matters a lot for a squishy Mage; Prydwen calls it very hard to replace up to Tier 4.","src":["prydwen-archmage","bs-builds"],"q":["Very hard to replace this charm, at least up to tier 4","allows your first Technique to be used one turn earlier"]},{"t":"[[Radiant Sear]] is the strongest damage charm at this tier (and the next); [[Divine Wrath]] is the best single-target skill against giant bosses but unreliable on small groups; [[Howling Hurricane]] has a huge AoE; [[Meteoric Flames]] replaces Flaming Path.","src":["prydwen-archmage"],"q":["The strongest charm in terms of damage at this tier","It’s definitely the strongest single-target skill against giant bosses","It deals very good damage, and has a super big AoE","It’s about time we forget the Flaming Path completely"]},{"t":"Stats from here: Staff and Codex Elemental Mastery > ATK > Crit > Speed > Effect Hit Rate; Boots Elemental Mastery > ATK > Speed; Helmet and Chest DEF first. Best substats: Speed, Crit Rate%, Crit Damage%.","src":["prydwen-archmage"],"q":["Elemental Mastery > ATK > Crit > Speed > Effect Hit Rate","Elemental Mastery > ATK > Speed","DEF >= Physical Res = Elemental Res > HP"]},{"t":"BlueStacks lists the same Archmage stats (Elemental Mastery, ATK, Crit, Speed) without an order.","src":["bs-builds"],"q":["Archmage prioritizes Elemental Mastery, ATK, Crit, and Speed"]}]},{"id":"t4","title":"Destroyer (Tier 4): Loong Haven, Season 2","gate":{"t":"Loong Haven, level 106, server day 47. Season 2 starts with it.","src":["prydwen-classes-and-roles","bs-class"],"q":["Once you reach Loong Haven at level 106","Season 2 begins around day 47 alongside Tier 4"]},"lines":[{"t":"[[Formation Breaker]] buffs allies' ATK and can advance their turns; Prydwen calls it \"the goat\" against high-deficit enemies and says to use it in every build from here on.","src":["prydwen-destroyer"],"q":["this tech is actually the goat when you fight high-deficit enemies. It should be used in every build, even in later tiers"]},{"t":"[[Wind Blade Spiral]] is a faster-cooldown Howling Hurricane; [[Thunder of Judgment]] is Destroyer's highest single-target damage; the Fire build lives on [[Fiery Burst]] + [[Explosive Spirit]]. The Water/Freeze build is \"kinda lackluster\".","src":["prydwen-destroyer"],"q":["It’s technically a smaller Howling Hurricane, but cooldown faster","Highest single target damage of Destroyer","One of the two core charms for the Fire build","kinda lackluster"]},{"t":"AllClash agrees freeze \"is not reliable anymore\" in Season 2 and calls its Destroyer setup the entry-level Season 2 build.","src":["allclash-destroyer"],"q":["freeze is not reliable anymore","this is probably the entry-level S2 build"]},{"t":"Stats shift: Staff and Codex Elemental Mastery > Crit > ATK; Boots Elemental Mastery > Speed > ATK. %ATK, %Speed, %HP and %DEF become \"extremely underwhelming\" because they scale on a small base.","src":["prydwen-destroyer"],"q":["Elemental Mastery > Crit > ATK > Speed > Effect Hit Rate","Elemental Mastery > Speed > ATK","This makes all %ATK, %Spd, %HP and %Def extremely underwhelming"]},{"t":"Gems open in Season 2: two per gear piece at gear level 130. Obsidian (damage buff) and Amethyst (Crit Rate) lead; Mages work toward at least 120% Crit Rate to guarantee crits against stronger enemies.","src":["prydwen-destroyer"],"q":["you can infuse 2 Gems per gear once your gear reaches level 130","Obsidian: ATK doesn’t matter, but the damage buff is great","at least 120% crit to guarantee 100% crit"]},{"t":"From Season 2 you can transfer good gear substats to a new seasonal piece (the old piece is destroyed). Lock pieces with great substats.","src":["prydwen-destroyer"],"q":["Starting S2, it will be possible to transfer gear substats"]}]},{"id":"t5","title":"Magister (Tier 5): Season 3","gate":{"t":"Gate not published in the sources checked. Prydwen's Tier 5 guides are dated September 2026.","src":["prydwen-magister"],"q":["Last updated: 01/September/2026"],"warn":"Tier 5 unlock level and day are not published."},"lines":[{"t":"Two builds get stronger: Wind (ranged, kites better, superior) and Fire (carries if you are far ahead). Single target stays weak.","src":["prydwen-magister"],"q":["with Wind becoming way more superior due to being ranged","you still suck at Single Target"]},{"t":"[[Radiant Warp]] replaces Void Bubble: 50% chance to teleport away when hit. [[Thunder Judgment]] (a charm, not the Tier 4 technique) hits enemies near you whenever they cast.","src":["prydwen-magister"],"q":["Say goodbye to Void Bubble or Overload Protection because you will use this charm instead","In case you feel deja vu with the T4 skill, it’s not"]},{"t":"BlueStacks lists the same Wind and Fire Magister builds (single source each besides Prydwen).","src":["bs-builds"],"q":["For a Wind AoE Magister build"]},{"t":"Pet: Prydwen recommends [[Pandarial]] most of the time; [[Nyxarchon]] stays strong; [[Aegiswing]] is lowest priority for a Mage.","src":["prydwen-magister"],"q":["We recommend Pandarial most of the time","This one is the lowest in priority"]}]}],"stats":{"sources":[["Prydwen class guide","Sorcerer stat focus: CRIT Rate > Accuracy > CRIT DMG. At Tier 2, Elemental Mastery and ATK% first; crit not worth it yet.",["prydwen-classes-and-roles"],["Stat Focus: CRIT Rate > Accuracy > CRIT DMG","focus on generic Elemental Mastery and ATK% early on"]],["Prydwen Sorcerer/Archmage","Staff and Codex: Elemental Mastery > ATK > Crit > Speed > Effect Hit Rate. Best substats Speed, Crit Rate%, Crit Damage%. Mages have high Crit by nature.",["prydwen-sorcerer","prydwen-archmage"],["Elemental Mastery > ATK > Crit > Speed > Effect Hit Rate","For Mage, they have high Crit in nature"]],["Prydwen Destroyer/Magister","Staff and Codex: Elemental Mastery > Crit > ATK. Work toward 120% Crit Rate.",["prydwen-destroyer","prydwen-magister"],["Elemental Mastery > Crit > ATK > Speed > Effect Hit Rate","at least 120% crit to guarantee 100% crit"]],["BlueStacks class guide","Sorcerer: Crit Rate, then Accuracy, then Crit Damage. Tier 2: Elemental Mastery and ATK% on Mage classes; crit values on gear too low.",["bs-class"],["with a priority of Crit Rate, then Accuracy, then Crit Damage","generic Elemental Mastery and Attack percentage on Mage classes"]],["BlueStacks builds","Archmage: Elemental Mastery, ATK, Crit and Speed (no order given).",["bs-builds"],["Archmage prioritizes Elemental Mastery, ATK, Crit, and Speed"]],["Narcosis Sorcerer (lower trust)","Crit Rate targets 40-50% early, 60-70% Sorcerer, 75-85% Archmage. Below ~40% Crit Rate, ATK beats Crit DMG; above ~50%, Crit DMG beats ATK. Gems: Amethyst (Crit Rate) first, then Obsidian (Crit DMG).",["narcosis-sorcerer"],["mid (Sorcerer) 60-70%","below about 40% Crit Rate, ATK contributes more than Crit DMG","Socket Crit Rate gems first, then Crit DMG"]]],"rule":[{"t":"**Tier 1-2 gear:** take Elemental Mastery and ATK%. Crit rolls on gear are too small to matter yet (Prydwen, BlueStacks).","src":["prydwen-classes-and-roles","bs-class"],"q":["CRIT at this tier isn’t honestly worth investing in","Crit stats are not worth heavy investment yet"],"own":true},{"t":"**Tier 3 gear:** Staff and Codex Elemental Mastery > ATK > Crit; substats Speed, Crit Rate%, Crit DMG% (Prydwen).","src":["prydwen-archmage"],"q":["Elemental Mastery > ATK > Crit > Speed > Effect Hit Rate"],"own":true},{"t":"**Tier 4+ gear and gems:** Crit moves above ATK; aim for 120% Crit Rate; gems Obsidian then Amethyst (Prydwen).","src":["prydwen-destroyer"],"q":["Elemental Mastery > Crit > ATK > Speed > Effect Hit Rate","at least 120% crit to guarantee 100% crit"],"own":true},{"t":"Why the crit advice differs: Narcosis compares ATK with **Crit DMG** (not Crit Rate). Crit DMG is weak until your Crit Rate is high, which matches Prydwen putting Crit later on gear. Prydwen adds that Mages have high Crit by nature, so a Crit focus works better for them than for other classes; it is just scarce on early gear.","src":["prydwen-sorcerer"],"q":["For Mage, they have high Crit in nature"],"own":true},{"t":"Gems do not exist until Season 2 (two sockets per piece at gear level 130), so the Narcosis gem order only applies from Tier 4. Prydwen's order there is Obsidian (damage buff) before Amethyst (Crit Rate).","src":["prydwen-destroyer","narcosis-sorcerer"],"q":["in season 2, you can infuse 2 Gems per gear once your gear reaches level 130","T10 Amethyst = Crit Rate"],"own":true}],"relics":[{"t":"Relics are collection-based: every relic you own gives its stats even unequipped, and full sets give bonuses. Equipping adds a small bonus.","src":["prydwen-beginner-guide"],"q":["Relics’ buffs and sets are collection-based"]},{"t":"Relic slot levels are shared per element: unequipped relics use the lowest slot level of their element, so level your main element's slots evenly.","src":["prydwen-beginner-guide"],"q":["The levels of unequipped Relics are also adjusted to be the same as the lowest Slot level of the corresponding Elemen"]},{"t":"Elemental Affinity (from relics of an element) raises that element's damage: focus your class's element first.","src":["prydwen-beginner-guide","prydwen-tips-and-tricks"],"q":["Elemental Affinity is improved by getting/upgrading Relics of each Element","should match the element of your class"]},{"t":"Narcosis (lower trust): collecting 50% of a region's relics unlocks milestone rewards; duplicates turn into shards that upgrade the relic.","src":["narcosis-gacha"],"q":["collecting 50% of a region's relics unlocks milestone rewards","duplicates become shards"]},{"t":"Upgrade a core of four to six Purple or Gold relics instead of many (BlueStacks, Packsify).","src":["bs-beginner","packsify"],"q":["focus on upgrading a small core of four to six Purple or Gold relics","Focus relic upgrades on four to six Purple or Gold relics"]},{"t":"Relic slots above +10 drop back to +10 at each new season.","src":["prydwen-beginner-guide"],"q":["any Relic Slot upgraded beyond +10 eventually goes back down to +10"]},{"t":"Mage-line showcase relics (Prydwen, up to Aqualis): Light — Luminous Edict, Crown of Unbinding, Thunder Wraith; Fire — Everburn Throne (Mythic), Crimson Agate; Wind — Fate's Grand Banner, Wind Pouch (Mythic); Water — Mirror of Reflection, Nymph's Swordhilt (Mythic). Destiny Fruit in the listed map section raises each one's drop rate.","src":["prydwen-archmage"],"q":["Luminous Edict (SPD - Legendary - Light Affinity)","Everburn Throne (ATK - Mythic - Fire Affinity)","Fate’s Grand Banner (Elemental Mastery - Legendary - Wind Affinity)","Nymph’s Swordhilt (%Crit - Mythic - Water Affinity)"]}],"gear":[{"t":"Upgrading gear upgrades the **slot**, so a new item keeps the level. Slots need Raw Ore and Rolla, plus Refined Ore every 5 levels.","src":["prydwen-beginner-guide"],"q":["When you “upgrade” an Equipment, what you’re actually upgrading is the Slot it belongs to","Refined Ore for every 5 levels"]},{"t":"Daily Dungeons are the main gear source. Your end-chest rank depends on how far you get, not which nodes you pick, so path toward the boss.","src":["prydwen-daily-dungeons"],"q":["Daily Dungeons are the main source of Gear and Gear Shards","is determined by how far you reach in the dungeon, not which nodes you choose"]},{"t":"100 dungeon shards craft a gear piece of your choice; equip the Lucky Statue relic (Grand Treasure Hunt) before dungeon runs for 2x rating rewards.","src":["prydwen-daily-dungeons"],"q":["To craft Gear items of your choice, you need 100 shards","It provides 2x rating rewards"]}]},"pets":{"rows":[["Pandarial","S","","","Cuts every technique's cooldown by 1 turn at battle start and boosts damage all fight (BlueStacks)."],["Nyxarchon","S","S","","After damaging techniques, Dark AoE damage plus a 10% DEF-down stack (up to 30%) (BlueStacks)."],["Aegiswing","S","S","","Guardian Angel for 3 turns at battle start; when it ends you restore 50% of lost HP (BlueStacks)."],["Kels","A","B","A","Water damage that strips an enemy buff; only from the Arena shop (BlueStacks)."],["Zeioletus","A","B","S","Light AoE after techniques, knocks airborne, +20% vs large targets (BlueStacks)."],["Sylvaerie","A","","A","ATK and Speed buff after your turn; only 18 Summon Crystals (BlueStacks)."],["Terragon","A","A","A","Physical hit with a 50% chance to cut enemy ATK by 25% (BlueStacks)."],["Armopi","B","A","S","DEF-up stacks that convert into a shield (BlueStacks)."],["Chomusuke","B","","","Extra Physical AoE with a chance to cut DEF by 15% (BlueStacks)."],["Mandragora","B","B","","Heals whenever you use a technique on allies (BlueStacks)."],["Herbote","B","A","B","Heals when you start a turn below 80% HP; may cleanse (BlueStacks)."],["Boaro","B","B","","Shield each time you lose 15% max HP, up to 5 times (BlueStacks)."],["Falko","B","C","","Physical AoE after damaging techniques (BlueStacks)."],["Forestry","","B","","Attack and attack-speed pet (mobi.gg)."]],"src":["bs-fantomon","mobi-fantomon","allthings-tier"],"q":["S | Pandarial, Nyxarchon, Aegiswing","A | Kels, Zeioletus, Sylvaerie, Terragon","B | Armopi, Chomusuke, Mandragora, Herbote, Boaro, Falko","Pets: S Zeioletus, Armopi; A Kels, Sylvaerie, Terragon; B Herbote","cuts the cooldown of every Technique by one turn","applying a 10% Defense Reduction stack","your character restores 50% of lost HP","It is only available through the Arena shop","deals 20% extra damage against large targets","available for just 18 Summon Crystals","50% base chance to reduce enemy Attack by 25%","converts three of them
