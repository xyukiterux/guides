<!DOCTYPE html>
<html lang="en">
<head><meta name="robots" content="noai, noimageai, noarchive"><meta name="googlebot" content="noarchive">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>League of Legends Guide</title>
<meta name="description" content="League of Legends guide: every champion with builds, runes and skill order from two stats sites, a tier list per role, every item and rune, how to play well, and what changed in 2026.">
<meta name="theme-color" content="#010a13">
<meta property="og:title" content="League of Legends Guide">
<meta property="og:description" content="Builds, runes and tier lists checked against two stats sites, every item and rune, wave management, objectives and how to climb. Works offline.">
<meta property="og:image" content="card.jpg">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<style>
@font-face{font-family:"Cinzel";src:url("assets/fonts/Cinzel.ttf") format("truetype");font-weight:400 900;font-display:swap}
:root{
  --bg:#010a13;--navy:#091428;--panel:#0a1a2b;--panel2:#0f2236;--well:#050f1a;
  --line:rgba(200,170,110,.16);--line2:rgba(200,170,110,.34);
  --gold:#c8aa6e;--gold-l:#f0e6d2;--gold-b:#c89b3c;--gold-d:#785a28;
  --hex:#0ac8b9;--hex-d:#005a82;--blue:#0397ab;--paper:#f0e6d2;--text:#e8e2d4;--muted:#a09b8c;--dim:#7d7868;
  --red:#e84057;--green:#4fd18b;
  --tS:#f0c35c;--tA:#0ac8b9;--tB:#7fa8d9;--tC:#a09b8c;--tD:#b35a5a;
  --head:"Cinzel","Trajan Pro","Palatino Linotype","Book Antiqua",Georgia,serif;
  --body:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;min-height:100vh;color:var(--text);font:16px/1.6 var(--body);
  background:radial-gradient(1200px 700px at 100% -10%,rgba(10,200,185,.07),transparent 60%),radial-gradient(1000px 700px at -10% 110%,rgba(200,155,60,.07),transparent 60%),
  linear-gradient(180deg,#010a13,#020d18 40%,#010a13);background-attachment:fixed}
a{color:var(--gold)}
a:hover{color:var(--gold-l)}
button{font:inherit;color:inherit}
img{max-width:100%}
h1,h2,h3,h4{font-family:var(--head);font-weight:700;margin:0 0 .45em;line-height:1.2;color:var(--gold-l);letter-spacing:.02em}
h2{font-size:1.7rem}
h3{font-size:1.12rem}
.shell{display:grid;grid-template-columns:272px minmax(0,1fr);min-height:100vh}
aside{position:sticky;top:0;height:100vh;overflow:auto;padding:18px 14px 40px;border-right:1px solid var(--line2);
  background:linear-gradient(180deg,rgba(9,20,40,.96),rgba(1,10,19,.96))}
.brand{display:flex;gap:12px;align-items:center;text-decoration:none;color:var(--paper)}
.brand .mk{width:40px;height:40px;flex:none;position:relative;display:grid;place-items:center}
.brand .mk::before{content:"";position:absolute;inset:0;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:linear-gradient(160deg,var(--gold-l),var(--gold-b) 45%,var(--gold-d))}
.brand .mk::after{content:"";position:absolute;inset:4px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:radial-gradient(circle at 50% 45%,#1de9d9,#0397ab 45%,#011a2a 75%)}
.brand b{display:block;font-family:var(--head);font-size:1.12rem;letter-spacing:.06em;color:var(--gold-l)}
.brand small{color:var(--gold);letter-spacing:.2em;font-size:.8rem;text-transform:uppercase}
#checked{font-size:.9rem;color:var(--muted);margin:12px 2px;line-height:1.45}
#checked a{color:var(--hex)}
.search{position:relative}
.search input,.filters input,.filters select,.bigsearch input{width:100%;padding:10px 12px 10px 36px;border:1px solid var(--line2);background:rgba(1,10,19,.8);color:var(--paper);font:inherit;outline:none;border-radius:2px}
.search input:focus,.filters input:focus,.bigsearch input:focus{border-color:var(--hex);box-shadow:0 0 0 2px rgba(10,200,185,.25)}
.search svg,.bigsearch svg{position:absolute;left:12px;top:13px;opacity:.7;color:var(--gold)}
.results{position:absolute;left:0;right:0;top:46px;background:#06131f;border:1px solid var(--line2);max-height:62vh;overflow:auto;z-index:40;display:none;box-shadow:0 18px 40px rgba(0,0,0,.6)}
.results.on{display:block}
.results div{padding:8px 12px;cursor:pointer;font-size:.92rem;display:flex;align-items:center;gap:8px}
.results div img{width:24px;height:24px;object-fit:cover}
.results div i{margin-left:auto;font-style:normal;color:var(--dim);font-size:.8rem;white-space:nowrap}
.results div:hover,.results div.sel{background:rgba(10,200,185,.1)}
.results .none{color:var(--muted);cursor:default}
nav{margin-top:10px;display:flex;flex-direction:column;gap:1px}
nav .grp{font-size:.8rem;letter-spacing:.22em;color:var(--gold);opacity:.85;margin:16px 8px 4px;text-transform:uppercase;font-family:var(--head)}
nav a{display:flex;gap:10px;align-items:center;padding:7px 10px;color:var(--text);text-decoration:none;font-size:.95rem;border-left:2px solid transparent}
nav a:hover{background:rgba(200,170,110,.07);color:var(--gold-l)}
nav a.on{background:linear-gradient(90deg,rgba(10,200,185,.16),transparent);border-left-color:var(--hex);color:var(--gold-l)}
nav a .n{margin-left:auto;font-size:.8rem;color:var(--dim)}
main{min-width:0;padding:26px clamp(16px,2.4vw,40px) 90px}
.topbar{display:none}
/* frames */
.card,.tile,.ccard,.stat,.trow,.tablewrap,.vid{background:linear-gradient(180deg,rgba(15,34,54,.92),rgba(9,22,37,.92));border:1px solid var(--line2);position:relative}
.card{padding:16px 18px;min-width:0}
.card::before{content:"";position:absolute;left:-1px;right:-1px;top:-1px;height:2px;background:linear-gradient(90deg,transparent,var(--gold) 20%,var(--gold-l) 50%,var(--gold) 80%,transparent);opacity:.55}
.card p{margin:.35em 0}
.hero{position:relative;z-index:5;padding:clamp(22px,4vw,48px);margin-bottom:22px;isolation:isolate;min-height:300px;display:flex;flex-direction:column;justify-content:flex-end;border:1px solid var(--gold-d)}
.hero img.bg{position:absolute;inset:0;max-width:100%;width:100%;height:100%;object-fit:cover;object-position:center 20%;z-index:-2}
.hero::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(0deg,rgba(1,10,19,.98) 6%,rgba(1,10,19,.55) 55%,rgba(1,10,19,.2)),linear-gradient(90deg,rgba(1,10,19,.9),transparent 75%)}
.hero::before{content:"";position:absolute;inset:8px;border:1px solid rgba(200,170,110,.3);pointer-events:none}
.hero .k{color:var(--hex);font-size:.8rem;letter-spacing:.24em;text-transform:uppercase;font-weight:700}
.hero h1{font-size:clamp(2.2rem,5.6vw,4.4rem);margin:.1em 0 .15em;background:linear-gradient(180deg,#fff8e6,var(--gold) 70%,var(--gold-d));-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;letter-spacing:.04em}
.hero p{max-width:860px;color:var(--text);font-size:1.06rem;margin:0}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr))}
.grid.wide{grid-template-columns:repeat(auto-fill,minmax(min(100%,360px),1fr))}
.grid.two{grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr))}
.grid.three{grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.sec{margin:30px 0 12px}
.sec h2{display:flex;align-items:center;gap:14px;text-transform:uppercase;font-size:1.45rem;letter-spacing:.06em}
.sec h2::before{content:"";width:10px;height:10px;transform:rotate(45deg);border:2px solid var(--gold);flex:none}
.sec h2::after{content:"";flex:1;height:1px;min-width:30px;background:linear-gradient(90deg,var(--gold-d),transparent)}
.sec p{margin:.25em 0 0;color:var(--muted)}
.muted{color:var(--muted)}.small{font-size:.9rem}.tiny{font-size:.8rem}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;font-size:.8rem;border:1px solid var(--line2);background:rgba(1,10,19,.6);color:var(--text);white-space:nowrap}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.pill.gold{background:linear-gradient(180deg,var(--gold),var(--gold-d));color:#0b0f14;border-color:var(--gold);font-weight:700}
.pill.hex{color:var(--hex);border-color:rgba(10,200,185,.5)}
.pill.warn{color:#ffb4a8;border-color:rgba(232,64,87,.6)}
.note{border-left:3px solid var(--hex);background:rgba(10,200,185,.07);padding:10px 14px;color:var(--text);margin:12px 0}
.note.warn{border-left-color:var(--red);background:rgba(232,64,87,.08)}
.tier{display:inline-grid;place-items:center;min-width:30px;height:30px;font:700 1rem var(--head);color:#06121c;flex:none;padding:0 6px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.tS{background:var(--tS)}.tA{background:var(--tA)}.tB{background:var(--tB)}.tC{background:var(--tC)}.tD{background:var(--tD)}.tX{background:#3a4656;color:var(--paper)}
/* champion tiles */
.cgrid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(128px,1fr))}
.ccard{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 8px 10px;cursor:pointer;text-decoration:none;color:var(--text);text-align:center;transition:border-color .15s,box-shadow .15s}
.ccard:hover{border-color:var(--hex);box-shadow:0 0 16px rgba(10,200,185,.25)}
.ccard img{width:64px;height:64px;border:2px solid var(--gold-d);object-fit:cover}
.ccard b{font-family:var(--head);font-size:.92rem;line-height:1.2;color:var(--gold-l)}
.ccard .tier{position:absolute;top:6px;right:6px;min-width:24px;height:24px;font-size:.8rem}
.ccard .rl{font-size:.8rem;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:8px;padding:4px 10px 4px 4px;background:rgba(1,10,19,.6);border:1px solid var(--line);cursor:pointer;font-size:.9rem;text-decoration:none;color:var(--text)}
.chip:hover{border-color:var(--hex);color:var(--gold-l)}
.chip img{width:34px;height:34px;object-fit:cover;border:1px solid var(--gold-d)}
.chip i{font-style:normal;font-size:.8rem;color:var(--muted)}
.chip i.niche{color:#e0b062}
.chip i.chg{color:#f0a37a}
.chip.rare{border-style:dashed;opacity:.8}
@media (min-width:601px){.nw{white-space:nowrap}}
.gtier{display:inline-flex;align-items:center;gap:6px;vertical-align:middle}.gtier small{font:600 .72rem var(--body);color:var(--muted);letter-spacing:0;text-transform:none}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 14px}
.tabs button{padding:7px 14px;border:1px solid var(--line2);background:rgba(9,20,40,.8);cursor:pointer;font-size:.9rem;color:var(--text)}
.tabs button:hover{border-color:var(--gold)}
.tabs button.on{background:linear-gradient(180deg,#123049,#0a1a2b);border-color:var(--hex);color:var(--gold-l);box-shadow:inset 0 -2px 0 var(--hex)}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:6px 0 14px}
.filters .fi{position:relative;flex:1 1 260px;max-width:460px}
.filters select{padding:9px 10px;width:auto;flex:0 0 auto}
.tablewrap{overflow-x:auto}
/* below 600 px a reference table becomes one card per row: the first cell is its heading, the others are "label: value" lines */
@media (max-width:600px){.tablewrap.stack{background:none;border:0}.tablewrap.stack table,.tablewrap.stack tbody,.tablewrap.stack tr,.tablewrap.stack td{display:block;width:auto}
.tablewrap.stack thead{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.tablewrap.stack tr{background:linear-gradient(180deg,rgba(15,34,54,.92),rgba(9,22,37,.92));border:1px solid var(--line2);margin:0 0 8px;padding:8px 12px}
.tablewrap.stack td{border:0;padding:3px 0}.tablewrap.stack td:empty{display:none}.tablewrap.stack td:first-child{font-weight:700;color:var(--gold)}
.tablewrap.stack td:not(:first-child)::before{content:attr(data-label) ": ";color:var(--muted,#9fb0c0);font-weight:600}}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{padding:8px 11px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{background:rgba(9,20,40,.95);font-family:var(--head);font-weight:600;white-space:nowrap;position:sticky;top:0;color:var(--gold);font-size:.8rem;letter-spacing:.06em;text-transform:uppercase}
td.l{cursor:pointer;color:var(--gold-l)}td.l:hover{color:var(--hex)}
tr:hover td{background:rgba(10,200,185,.03)}
td .tier{min-width:24px;height:24px;font-size:.8rem}
/* items */
.igrid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(118px,1fr))}
.tile{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 8px 10px;cursor:pointer;text-align:center;font-size:.86rem;line-height:1.25}
.tile:hover{border-color:var(--hex);box-shadow:0 0 14px rgba(10,200,185,.2)}
.tile img{width:48px;height:48px;border:1px solid var(--gold-d)}
.tile .cost{color:var(--gold);font-size:.8rem}
.ic{display:inline-flex;align-items:center;gap:8px;padding:5px 8px 5px 5px;border:1px solid var(--line);background:rgba(1,10,19,.55);cursor:pointer;font-size:.9rem;color:var(--text);min-width:0}
.ic:hover{border-color:var(--hex)}
.ic img{width:36px;height:36px;border:1px solid var(--gold-d);flex:none}
.ic.sm img{width:30px;height:30px}
.ic small{display:block;font-size:.8rem;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.arrow{color:var(--gold);font-size:1.1rem}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:3px 14px;font-size:.92rem;margin:8px 0}
.kv dt{color:var(--muted)}.kv dd{margin:0}
.kv.lv{border-top:1px solid var(--line2);padding-top:6px}.kv.lv dt{max-width:11em}
@media (max-width:480px){.kv.lv{grid-template-columns:1fr;gap:0}.kv.lv dd{margin-bottom:6px}}
.steps{counter-reset:s;list-style:none;padding:0;margin:10px 0;display:flex;flex-direction:column;gap:8px}
.steps li{position:relative;padding:12px 14px 12px 58px}
.steps li::before{counter-increment:s;content:counter(s);position:absolute;left:14px;top:11px;width:30px;height:30px;display:grid;place-items:center;font:700 .95rem var(--head);color:#06121c;background:linear-gradient(180deg,var(--gold-l),var(--gold));clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.src{font-size:.8rem;color:var(--dim)}
.src.adv{color:#d9b97a}.src.adv b{color:#f0c35c;font-weight:700}
.hero .chk{font-size:.86rem;color:var(--muted);margin-top:8px}.hero .chk a{color:var(--hex)}
.tablewrap.scrolls{background-image:linear-gradient(90deg,transparent calc(100% - 28px),rgba(10,200,185,.18))}
.scrollhint{font-size:.8rem;color:var(--hex);margin:4px 0 0}
.mgrid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr))}
.mon{display:grid;grid-template-columns:72px minmax(0,1fr);gap:14px}
.mon img{width:72px;height:72px;border:2px solid var(--gold-d)}
.gloss{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(min(100%,380px),1fr))}
.src a{color:var(--dim)}
details.quote{display:inline-block;margin-left:6px;font-size:.8rem;color:var(--muted)}
details.quote>summary{cursor:pointer;color:var(--hex);list-style:none;display:inline}
details.quote>summary::-webkit-details-marker{display:none}
details.quote>summary::after{content:" +"}
details.quote[open]{display:block;margin:4px 0 0;padding:6px 10px;border-left:2px solid var(--hex);background:rgba(10,200,185,.06)}
details.quote[open]>summary::after{content:" \2212"}
details.quote q{color:var(--text);font-style:italic}
.hhead{display:grid;grid-template-columns:200px 1fr;gap:22px;align-items:start}
.hhead img.art{width:100%;border:1px solid var(--gold-d);box-shadow:0 18px 40px rgba(0,0,0,.5)}
.statrow{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0}
.stat{padding:10px 14px;min-width:120px}
.stat b{display:block;font:700 1.35rem var(--head);color:var(--gold-l)}
.stat span{font-size:.8rem;color:var(--muted)}
.modal{position:fixed;inset:0;background:rgba(1,6,12,.78);display:none;align-items:center;justify-content:center;z-index:60;padding:14px}
.modal.on{display:flex}
.modal .box{background:linear-gradient(180deg,#0f2236,#07131f);border:1px solid var(--gold-d);max-width:680px;width:100%;max-height:90vh;overflow:auto;padding:22px;position:relative;box-shadow:0 30px 70px rgba(0,0,0,.7)}
.modal .box::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:linear-gradient(90deg,transparent,var(--gold-l),transparent)}
.modal .box.wide{max-width:980px}
.modal .x{position:absolute;right:10px;top:6px;background:none;border:0;font-size:1.8rem;cursor:pointer;color:var(--muted);line-height:1}
.ic-head{display:flex;gap:14px;align-items:center;margin-bottom:8px;padding-right:34px}
.ic-head img{width:64px;height:64px;border:2px solid var(--gold-d);flex:none}
.isec{border-top:1px solid var(--line);padding-top:10px;margin-top:10px}
.isec h4{font-family:var(--body);font-size:.8rem;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin:0 0 4px}
.lk{color:var(--gold);cursor:pointer;text-decoration:underline;text-decoration-color:rgba(200,170,110,.4)}
.lk:hover{color:var(--hex)}
.st{display:block}.pv,.ac{color:var(--gold-l)}.md{color:#7fb8ff}.pd{color:#ff9e7a}.td{color:#fff}.hp{color:var(--green)}.sh{color:#c9d6e0}
.trow{display:grid;grid-template-columns:78px 1fr;margin-bottom:10px}
.trow .lab{display:flex;flex-direction:column;align-items:center;justify-content:center;font:700 2rem var(--head);color:#06121c;padding:6px}
.trow .lab small{font:600 .66rem var(--body);letter-spacing:.02em;text-align:center}
.trow .its{display:flex;flex-wrap:wrap;gap:8px;padding:10px}
.agree{color:var(--green)}.differ{color:#ffb4a8}.vold{color:#f0c674}
.skillgrid{display:grid;gap:3px;overflow-x:auto;padding-bottom:4px}
.skillgrid .an{display:flex;align-items:center;gap:6px;font-size:.82rem;white-space:nowrap;padding-right:6px}
.skillgrid .an img{width:26px;height:26px;border:1px solid var(--gold-d)}
.skillgrid .c{height:26px;min-width:24px;background:rgba(255,255,255,.04);display:grid;place-items:center;font-size:.8rem;font-weight:700}
.skillgrid .c.on{background:linear-gradient(180deg,#14a39a,#0a6f74);color:#fff}
.skillgrid .c.r{background:linear-gradient(180deg,var(--gold),var(--gold-d));color:#06121c}
.skillgrid .hd{font-size:.8rem;color:var(--dim);text-align:center}
.skillgrid.sg-half{display:none}.skillgrid.sg-half+.skillgrid.sg-half{margin-top:8px}
@media (max-width:600px){.skillgrid.sg-wide{display:none}.skillgrid.sg-half{display:grid}}
.abil{display:grid;grid-template-columns:56px 1fr;gap:12px}
.abil img{width:56px;height:56px;border:2px solid var(--gold-d)}
.abil .key{display:inline-grid;place-items:center;width:24px;height:24px;font:700 .8rem var(--head);background:rgba(10,200,185,.18);color:var(--hex);margin-right:6px}
.vid{display:flex;gap:12px;align-items:center;padding:12px;cursor:pointer;text-decoration:none;color:var(--text)}
.vid:hover{border-color:var(--hex)}
.vidwrap{display:flex;flex-direction:column;gap:4px;min-width:0}.vchap{margin:0 0 0 4px}.vchap ol{margin:6px 0 0;padding-left:22px}
.vid .play{flex:none;width:50px;height:50px;display:grid;place-items:center;position:relative;background:var(--hex);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.vid .play::before{content:"";position:absolute;inset:1.5px;background:linear-gradient(180deg,#123049,#0a1a2b);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.vid .play svg{position:relative}
.vid b{display:block;font-size:.94rem;line-height:1.3}
details.more>summary{cursor:pointer;color:var(--gold);list-style:none;display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border:1px solid var(--line2);background:rgba(9,20,40,.8);font-size:.9rem}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary::before{content:"+";font-weight:700;color:var(--hex)}
details.more[open]>summary::before{content:"\2212"}
details.more[open]>summary{margin-bottom:10px}
.tree{display:grid;gap:8px}
.tree .slot{display:grid;gap:8px;grid-template-columns:repeat(var(--n,3),minmax(0,92px))}
@media (max-width:480px){.tree .slot{grid-template-columns:repeat(var(--n,3),minmax(0,1fr))}.sec h2::after{display:none}}
.rn{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0;overflow-wrap:anywhere;text-align:center;font-size:.8rem;cursor:pointer;padding:6px 2px;border:1px solid transparent}
.rn:hover{border-color:var(--line2);background:rgba(10,200,185,.06)}
.rn img{width:42px;height:42px}
.rn.ks img{width:54px;height:54px}
.bigsearch{position:relative;max-width:640px;margin:14px 0 0}
.bigsearch .results{top:48px}
footer{margin-top:40px;color:var(--dim);font-size:.82rem;border-top:1px solid var(--line);padding-top:12px}
::selection{background:var(--hex);color:#06121c}
*{scrollbar-color:rgba(200,170,110,.45) transparent}
@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  aside{position:fixed;inset:0 auto 0 0;width:min(300px,86vw);z-index:50;transform:translateX(-102%);transition:transform .2s}
  aside.open{transform:none;box-shadow:20px 0 50px rgba(0,0,0,.6)}
  .topbar{display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:30;padding:10px 14px;background:rgba(1,10,19,.95);border-bottom:1px solid var(--line2)}
  .topbar button{background:rgba(9,20,40,.9);border:1px solid var(--line2);padding:6px 12px;cursor:pointer;color:var(--gold-l)}
  .topbar b{font-family:var(--head);color:var(--gold-l);font-size:.98rem}
  main{padding:16px 14px 80px}
  .hhead{grid-template-columns:92px minmax(0,1fr);gap:12px}
  .hhead img.art{max-width:92px}
  .hhead h2{font-size:1.8rem!important}
  .stat{min-width:0;flex:1 1 40%;padding:8px 10px}.stat b{font-size:1.1rem}
  .cgrid{grid-template-columns:repeat(auto-fill,minmax(96px,1fr))}
  .ccard img{width:52px;height:52px}
  .igrid{grid-template-columns:repeat(auto-fill,minmax(96px,1fr))}
  table{font-size:.84rem}
  th,td{padding:7px 8px}
  .trow{grid-template-columns:48px 1fr}.trow .lab{font-size:1.4rem;justify-content:flex-start;padding-top:14px}.trow .lab small{display:none}.trow .its{gap:6px;padding:8px}
  .chip{font-size:.84rem;padding:3px 8px 3px 3px;gap:6px}.chip img{width:28px;height:28px}
  .hero{min-height:240px}

}
@media (max-width:480px){
  .hhead{grid-template-columns:76px minmax(0,1fr);column-gap:12px;row-gap:0;align-items:start}

  .hhead>div{display:contents}
  .hhead>div>*{grid-column:1/-1}
  .hhead>div>.pills,.hhead>div>h2,.hhead>div>h2+p{grid-column:2}
  .hhead .statrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .hhead .stat{min-width:0}
  .hhead .stat:last-child:nth-child(odd){grid-column:1/-1}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<body>
<div class="topbar"><button id="menuBtn" aria-label="Open sections" aria-controls="side">Menu</button><b>League of Legends Guide</b></div>
<div class="shell">
<aside id="side">
  <a class="brand" href="#home"><span class="mk" aria-hidden="true"></span><span><b>League of Legends</b><small>Player's Guide</small></span></a>
  <div id="checked"></div>
  <div class="search">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="Search champions, items, runes..." autocomplete="off" aria-label="Search the guide">
    <div class="results" id="res" role="listbox"></div>
  </div>
  <nav id="nav" aria-label="Sections"></nav>
</aside>
<main id="main"><p class="muted">Loading the guide...</p></main>
</div>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-label="Details"><div class="box"><button class="x" aria-label="Close">&times;</button><div id="mbody"></div></div></div>
<noscript><p style="padding:20px">This guide needs JavaScript.</p></noscript>
<script src="data/lol.js?v=2026-11-18-415572"></script>
<script>
(function(){
'use strict';
const D=window.LOL||{champions:[],items:[],trees:[],runes:{},shards:{},summs:{},tiers:{},learn:{},changes:[],howto:{sections:[],tables:[],roles:[]},videos:{},meta:{},sources:[]};
const $=s=>document.querySelector(s), main=$('#main');
const chargeRows=ch=>{const wl=ch.wiki?`https://wiki.leagueoflegends.com/en-us/Template:Data_${ch.wiki.replace(/ /g,'_')}`:'https://wiki.leagueoflegends.com/';
  return `${ch.n?`<dt>Charges</dt><dd>${esc(ch.n)}</dd>`:''}<dt>Recharge</dt><dd>${ch.rec?`${esc(ch.rec)} s <span class="tiny muted">(League Wiki, edited <span style="white-space:nowrap">${esc(ch.src.rev)}</span>)</span>`:`not checked: <a href="${esc(wl)}" target="_blank" rel="noopener">see the League Wiki</a>`}</dd>${ch.lock?`<dt>Between casts</dt><dd>${esc(ch.lock)} s</dd>`:''}`;};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const checkedOn=()=>M.checked_to&&M.checked_to!==M.pulled?`${esc(M.pulled)} to ${esc(M.checked_to)}`:esc(M.pulled);
const pct=(x,d=1)=>x==null?'-':(+x).toFixed(d)+'%';
const n0=x=>x==null?'-':Math.round(x).toLocaleString('en-US');
const sgn=x=>(x>=0?'+':'')+x.toFixed(1);
const M=D.meta||{};
const dict=pairs=>Object.assign(Object.create(null),Object.fromEntries(pairs)); // no prototype keys: '#champ/constructor' is just "not found"
const CB=dict(D.champions.map(c=>[c.id,c])), CS=dict(D.champions.map(c=>[c.slug,c])), CN=dict(D.champions.map(c=>[c.name,c])), CK=dict(D.champions.map(c=>[c.key,c]));
const IB=dict(D.items.map(i=>[i.id,i])), IN=dict(D.items.map(i=>[i.name,i])), IS=dict(D.items.map(i=>[i.slug,i]));
const RB=dict(Object.values(D.runes).map(r=>[r.id,r])), RN=dict(Object.values(D.runes).map(r=>[r.name,r]));
const SB=dict(Object.values(D.shards).map(s=>[s.id,s]));
const SPB=dict(Object.values(D.summs).map(s=>[s.id,s])), SPN=dict(Object.values(D.summs).map(s=>[s.name,s]));
const TR=dict(D.trees.map(t=>[t.id,t]));
const ROLES=['top','jungle','mid','adc','support'];
const RNAME={top:'Top',jungle:'Jungle',mid:'Mid',adc:'Bottom',support:'Support'};
const KIND={support:'Support item chain',starter:'Starter',basic:'Basic',epic:'Epic',legendary:'Legendary',boots:'Boots',consumable:'Consumable and trinket'};
const costLabel=i=>i.quest?(i.from.length?'quest reward':n0(i.cost)+' gold, support only'):n0(i.cost)+' gold';
const CAT={attack:'Attack',magic:'Magic',defense:'Defense',haste:'Ability haste',speed:'Movement',utility:'Utility'};
const HIDE="this.style.visibility='hidden'";
const img=(src,cls='',alt='')=>`<img class="${cls}" src="${esc(src)}" alt="${esc(alt)}" loading="lazy" onerror="${HIDE}">`;
const tierB=t=>t?`<span class="tier t${t}" title="Guide tier ${t}">${t}</span>`:'';
const howtos=(D.howto&&D.howto.sections)||[];
const HS=dict(howtos.map(s=>[s.id,s]));
const P=M.cur_patch||{}, SPI=M.stats_patch_info||{};
const champLink=c=>c?`<a class="lk" href="#champ/${c.slug}">${esc(c.name)}</a>`:'';
const itemLink=id=>{const i=IB[id];return i?`<span class="lk" data-item="${i.id}" role="button" tabindex="0">${esc(i.name)}</span>`:'';};

$('#checked').innerHTML=`Game version <b>${esc(M.game_patch)}</b> (Data Dragon ${esc(M.ddragon)}). Stats from patch ${esc(M.stats_game_patch)}, ${esc(M.bracket)}. Last checked against <a href="https://ddragon.leagueoflegends.com/api/versions.json" target="_blank" rel="noopener">Riot Data Dragon</a>, <a href="https://u.gg/lol/tier-list" target="_blank" rel="noopener">u.gg</a>, <a href="https://lolalytics.com/lol/tierlist/" target="_blank" rel="noopener">LoLalytics</a> and the <a href="https://wiki.leagueoflegends.com/en-us/" target="_blank" rel="noopener">League Wiki</a> on ${checkedOn()}.`;

// ---------- navigation
const NAV=[
 ['Start',[['home','Home'],['start','Come back after a break'],['changes','What changed in 2026'],['roles','Roles and who to learn'],['glossary','Glossary']]],
 ['How to play',[['about','About a match']].concat(howtos.filter(s=>s.id.startsWith('howto-')).map(s=>[s.id,s.title.replace(/^How to /,'').replace(/^./,c=>c.toUpperCase())])).concat([['ref','Timers and tables']])],
 ['Champions',[['tiers','Tier list'],['champions','All champions',D.champions.length]]],
 ['Reference',[['items','Items',D.items.length],['runes','Runes',Object.keys(D.runes).length],['spells','Summoner spells',Object.keys(D.summs).length],['monsters','Epic monsters',(D.monsters||[]).length]]],
 ['More',[['videos','Videos'],['sources','Sources and method']]],
];
function navHtml(cur){return NAV.map(([g,l])=>`<div class="grp">${g}</div>`+l.map(([id,t,n])=>`<a href="#${id}" class="${cur===id?'on':''}"${cur===id?' aria-current="page"':''}>${esc(t)}${n?`<span class="n">${n}</span>`:''}</a>`).join('')).join('');}

// ---------- prose: [[Name]], [[Name|label]], [[#route|label]], **UI label**
const WIKI='https://wiki.leagueoflegends.com/en-us/';
function prose(t){return esc(t).replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/\[\[([^\]]+)\]\]/g,(m,inner)=>{
 const [target,label]=inner.replace(/&#39;/g,"'").split('|');const lab=esc(label||target);
 if(target[0]==='#')return `<a class="lk" href="${esc(target)}">${lab}</a>`;
 const c=CN[target];if(c)return `<a class="lk" href="#champ/${c.slug}">${lab}</a>`;
 const i=IN[target];if(i)return `<span class="lk" data-item="${i.id}" role="button" tabindex="0">${lab}</span>`;
 const r=RN[target];if(r)return `<span class="lk" data-rune="${r.id}" role="button" tabindex="0">${lab}</span>`;
 if(SPN[target])return `<a class="lk" href="#spells">${lab}</a>`;
 return `<a class="lk" href="${WIKI}${encodeURIComponent(target.replace(/ /g,'_'))}" target="_blank" rel="noopener">${lab}</a>`;});}
const wikiLinks=src=>(src||[]).map(s=>`<a href="${WIKI}${encodeURIComponent(s.title.replace(/ /g,'_'))}" target="_blank" rel="noopener">${esc(s.title)}</a>`).join(', ');
// p = a step, paragraph, role or card: sourced (src + q quotes), advice, or nav (a step inside this guide)
function srcLine(src,p){p=p||{};
 if(p.nav)return `<span class="src">Step in this guide</span>`;
 if(p.advice)return `<span class="src adv"><b>Common coaching advice</b> (not from a measured source)${(src||[]).length?`; facts in it from ${wikiLinks(src)} (League of Legends Wiki)`:''}</span>${quoteBox(p)}`;
 return `<span class="src">Source: ${wikiLinks(src)} (League of Legends Wiki)</span>${quoteBox(p)}`;}
// the quoted page text, behind a tap/keyboard toggle (a hover title does not work on phones)
function quoteBox(p){const Q=(p&&p.q)||[],RW=(p&&p.rows)||[];return Q.length||RW.length?`<details class="quote"><summary>What the page says</summary>${Q.map(x=>`<q>${esc(x)}</q>`).join(' … ')}${RW.map(r=>`${Q.length?' … ':''}table "${esc(r.table)}", row: ${r.cols.map((c,i)=>`${esc(c)} <q>${esc(r.cells[i])}</q>`).join(' · ')}`).join('')}</details>`:'';}

// ---------- videos
// brief rule: "recent" means within 60 days of the last check; an older video stays (its topic changed little since 26.01) but says so
const vidOld=v=>{const a=Date.parse(v.date),b=Date.parse(M.checked_to||M.pulled);return a&&b&&(b-a)/864e5>60;};
function vidCard(v){return `<div class="vid" data-vid="${esc(v.videoId)}" data-title="${esc(v.title)}" role="button" tabindex="0"><span class="play"><svg width="18" height="18" viewBox="0 0 24 24" fill="#0ac8b9" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg></span><span><b>${esc(v.title)}</b><span class="tiny muted">${esc(v.channel)} · ${esc(v.date)}${v.duration?' · '+Math.round(v.duration/60)+' min':''}${vidOld(v)?' · <span class="vold">older than 60 days</span>':''}</span></span></div>`;}
function vidItem(v){return `<div class="vidwrap">${vidCard(v)}${(v.chapters||[]).length?`<details class="quote vchap"><summary>What it covers (the video's own chapters)</summary><ol class="tiny">${v.chapters.map(c=>`<li>${esc(c)}</li>`).join('')}</ol></details>`:''}</div>`;}
const ymd=d=>d?d.slice(0,4)+'-'+d.slice(4,6)+'-'+d.slice(6):'';
function vids(topic,label){const L=(D.videos||{})[topic]||[];const since=(M.videos_topic_min||{})[topic]||M.videos_min;if(!L.length)return `<p class="small muted">No recent video passed the search rule for this topic${since?' (a guide for every role, uploaded since '+esc(ymd(since))+')':''}.</p>`;
 return `<div class="grid wide">${L.map(vidItem).join('')}</div>`;}
const HOWTO_VID={'howto-farm':'farming','howto-waves':'waves','howto-trade':'laning','howto-vision':'vision','howto-objectives':'objectives','howto-jungle':'jungle','howto-climb':'climb','howto-turrets':'objectives','howto-midgame':'teamfight','start':'climb'};

// ---------- pages
const R=Object.create(null);
const niche=e=>Math.min(e.u.pr,e.l.pr)<(M.niche_pr||0);
const LOLA_STRONG=['S+','S','S-','A+','A','A-'];   // "Highest win rates now" also needs LoLalytics' own letter (it weighs pick and ban rate) at A- or better
const strong=e=>(e.tier==='S'||e.tier==='A')&&!niche(e)&&LOLA_STRONG.includes(e.l.tier);
function bestNow(role,n){const T=(D.tiers[role]||{}).rows||[];return T.filter(strong).slice(0,n).map(e=>CB[e.id]).filter(Boolean);}
function champChip(c,sub,cls){return `<a class="chip${cls?' '+cls:''}" href="#champ/${c.slug}">${img(c.img,'',c.name)}<span>${esc(c.name)}${sub?`<br><i>${sub}</i>`:''}${c.changed?`<br><i class="chg" title="Changed in patch ${esc(M.game_patch)}; the stats are from ${esc(M.stats_game_patch)}">changed in ${esc(M.game_patch)}</i>`:''}</span></a>`;}
R.home=()=>{
 const card=(r,t,s)=>`<a class="card" href="#${r}" style="text-decoration:none;color:inherit;display:block"><h3>${t}</h3><p class="muted small">${s}</p><span class="lk small">Open</span></a>`;
 return `<section class="hero"><img class="bg" src="assets/banner.webp" alt="" onerror="${HIDE}">
 <span class="k">Patch ${esc(M.game_patch)} · updated ${esc(M.checked_to||M.pulled)}</span><h1>League of Legends</h1>
 <p>Every champion with a build, runes and skill order from two stats sites, a tier list for each role, all ${D.items.length} items and ${Object.keys(D.runes).length} runes, and step-by-step guides to waves, objectives and climbing.</p>
 <p class="chk">Stats from patch ${esc(M.stats_game_patch)}, ${esc(M.bracket)}. Last checked against Riot Data Dragon, u.gg, LoLalytics and the League Wiki on ${checkedOn()}. <a href="#sources">Sources</a></p>
 <div class="bigsearch"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q2" type="search" placeholder="Search a champion, item, rune or topic" autocomplete="off" aria-label="Search the guide"><div class="results" id="res2" role="listbox"></div></div></section>
 <div class="grid">
 ${card('start','Come back after a break',`${(HS.start&&HS.start.steps||[]).length} steps to get back into the game, from what changed to your first ranked game.`)}
 ${card('changes','What changed in 2026','Role Quests, Faelights, new turret rules, no Atakhan and no Feats of Strength, plus every new champion and item since you last played.')}
 ${card('roles','Roles and who to learn','What each position does, its Role Quest reward, and the easiest champions that also win.')}
 ${card('howto-waves','Wave management','Freeze, slow push and fast push, step by step.')}
 ${card('howto-objectives','Objectives and timers','Drakes, Voidgrubs, Rift Herald and Baron: when they spawn and how to take them.')}
 ${card('howto-midgame','After laning','Grouping, side lanes and teamfights: who does what once the first turret falls.')}
 ${card('monsters','Epic monsters','Every drake type, the Elder Dragon, Voidgrubs, Rift Herald and Baron: spawn times and what each one gives.')}
 ${card('howto-climb','How to climb','LP, Aegis of Valor, demotion shields and decay.')}
 ${card('tiers','Tier list',`Per role, from ${esc(M.bracket)} games on u.gg and LoLalytics; a letter only when both sites give the same band.`)}
 ${card('champions','All champions',`${D.champions.length} champions: abilities, build, runes, skill order, matchups and Riot's own tips.`)}
 ${card('items','Items and runes',`${D.items.length} items you can buy on Summoner's Rift, ${Object.keys(D.runes).length} runes and ${Object.keys(D.summs).length} summoner spells.`)}
 </div>
 <div class="sec"><h2>Highest win rates right now</h2><p>Guide tier S or A, LoLalytics' own letter A- or better, and picked in ${M.niche_pr}%+ of games on both sites (${esc(M.bracket)}, patch ${esc(M.stats_game_patch)}). <a href="#tiers">Full tier list</a></p></div>
 <div class="grid three">${ROLES.map(r=>`<div class="card"><h3>${RNAME[r]}</h3><div class="row">${bestNow(r,4).map(c=>champChip(c,tierLetter(c,r))).join('')||'<span class="muted small">No champion passes all three tests in this role.</span>'}</div></div>`).join('')}</div>`;};
function tierLetter(c,r){const x=((D.tiers[r]||{}).rows||[]).find(e=>e.id===c.id);return x&&x.tier?'Tier '+x.tier:'';}

function howtoPage(s){
 let h=`<div class="sec"><span class="pill hex">${esc(s.kind)}</span><h2 style="margin-top:8px">${esc(s.title)}</h2>${s.intro?`<p>${prose(s.intro)}</p>`:''}</div>`;
 if(s.need)h+=`<p class="note">${prose(s.need)}</p>`;
 if(s.paras)h+=s.paras.map(p=>`<div class="card" style="margin-bottom:10px"><p>${prose(p.t)}</p>${srcLine(p.src,p)}</div>`).join('');
 if(s.steps)h+=`<ol class="steps">${s.steps.map(p=>`<li class="card">${prose(p.t)}<br>${srcLine(p.src,p)}</li>`).join('')}</ol>`;
 if(s.check)h+=`<p class="note"><b>Check:</b> ${prose(s.check)}${s.check_advice?' <span class="src adv"><b>Common coaching advice</b> (a target, not from a measured source)</span>':''}</p>`;
 if(s.id==='changes')h+=changesBlock();
 const v=HOWTO_VID[s.id];if(v)h+=`<div class="sec"><h2>Videos</h2><p>Recent YouTube guides on this topic, found by search; they play here when you are online.</p></div>${vids(v)}`;
 return h;}
howtos.forEach(s=>{R[s.id]=()=>howtoPage(s);});

let CHV=null;
function changesBlock(){const C=D.changes||[];if(!C.length)return '';if(!CHV)CHV=C[0].version;const c=C.find(x=>x.version===CHV)||C[0];
 const cur=M.cur_patch||{},sp=M.stats_patch_info||{};
 return `<div class="sec"><h2>New since you last played</h2><p>Pick the patch you last played. Lists compare Riot's Data Dragon for that patch with ${esc(M.ddragon)}.</p></div>
 <div class="tabs" data-set="CHV">${C.map(x=>`<button data-v="${esc(x.version)}" class="${x.version===c.version?'on':''}">Patch ${esc(x.patch)}${x.date?' · '+esc(x.date):''}</button>`).join('')}</div>
 <div class="grid two"><div class="card"><h3>New champions (${c.new_champs.length})</h3><div class="row">${c.new_champs.map(n=>CN[n]?champChip(CN[n]):esc(n)).join('')||'<span class="muted">None</span>'}</div></div>
 <div class="card"><h3>New items (${c.new_items.length})</h3><div class="row">${c.new_items.map(n=>IN[n]?`<span class="ic sm" data-item="${IN[n].id}" role="button" tabindex="0">${img(IN[n].img)}${esc(n)}</span>`:esc(n)).join('')||'<span class="muted">None</span>'}</div></div>
 <div class="card"><h3>Items gone (${c.gone_items.length})</h3><p class="small muted">No longer in the Summoner's Rift shop.</p><p class="small">${c.gone_items.map(esc).join(', ')||'None'}</p></div></div>
 <div class="sec"><h2>The current patches</h2></div>
 <div class="grid two">${[cur,sp].filter(x=>x&&x.title).map(x=>`<div class="card"><h3>Patch ${esc(x.title.slice(1))} <span class="tiny muted">${esc(x.date||'')}</span></h3>
 <p class="small"><b>Champions changed (${x.champions.length}):</b> ${x.champions.map(n=>CN[n]?champLink(CN[n]):esc(n)).join(', ')||'none'}</p>
 <p class="small"><b>Items changed (${x.items.length}):</b> ${x.items.map(i=>(IN[i.name]?itemLink(IN[i.name].id):esc(i.name))+(i.note?` <span class="muted">(${esc(i.note)})</span>`:'')).join(', ')||'none'}</p>
 ${x.notes_url?`<p class="small"><a href="${esc(x.notes_url)}" target="_blank" rel="noopener">Official patch notes</a> · <a href="${WIKI}${esc(x.title)}" target="_blank" rel="noopener">wiki page</a></p>`:''}</div>`).join('')}</div>
 <p class="note small">Stats in this guide come from patch ${esc(M.stats_game_patch)} because ${esc(M.game_patch)} went live on ${esc(cur.date||'?')}, the day of the pull. Champions changed in ${esc(M.game_patch)} carry a warning on their page.</p>`;}

R.roles=()=>{const RL=(D.howto.roles||[]);
 return `<div class="sec"><h2>Roles and who to learn</h2><p>What each position does, from the wiki; the Role Quest reward as it is now (introduced in 26.01, changed in later 2026 patches); and the easiest champions to learn that also win, picked by a rule (below).</p></div>

 <div class="grid two" style="margin-top:14px"><div class="card"><h3>Counts</h3><dl class="kv"><dt>Champions</dt><dd>${D.champions.length}</dd><dt>Champion role builds</dt><dd>${D.champions.reduce((a,c)=>a+c.roles.length,0)}</dd><dt>Items (Summoner's Rift)</dt><dd>${D.items.length}</dd><dt>Runes</dt><dd>${Object.keys(D.runes).length} + ${Object.keys(D.shards).length} shards</dd><dt>Summoner spells</dt><dd>${Object.keys(D.summs).length}</dd><dt>Tier entries</dt><dd>${T.reduce((a,t)=>a+t.rows.length,0)} with a letter, ${T.reduce((a,t)=>a+t.split.length,0)} split</dd><dt>How-to guides</dt><dd>${howtos.filter(s=>s.steps).length} (${howtos.reduce((a,s)=>a+(s.steps||[]).length,0)} steps)</dd><dt>Videos</dt><dd>${Object.values(D.videos||{}).reduce((a,l)=>a+l.length,0)}</dd><dt>Cached requests</dt><dd>${n0(M.requests_ok)}</dd></dl></div>
 <div class="card"><h3>How the numbers are made</h3><ul class="small">
 <li><b>Stats window:</b> patch ${esc(M.stats_game_patch)} (${esc(SPI.date||'')} to ${esc(P.date||'')}), ranked solo/duo, ${esc(M.bracket)}. u.gg: world. LoLalytics: all regions. Patch ${esc(M.game_patch)} is not used for stats because it went live on the pull date.</li>
 <li><b>Guide tier:</b> for each site, win rate minus that site's average: u.gg's average for the role, LoLalytics' one overall average for all roles (its tier files give the same figure for every lane; it counts each player's own rank, so it is above 50%). Bands: S +2.0 or more, A +0.75 to +2.0, B -0.75 to +0.75, C -2.0 to -0.75, D below. Letter = the band both sites give; it is given only when the two bands are the same (otherwise the entry is listed as "Sources differ" with the letter each site's win rate would get) and both have ${n0(M.min_games)}+ games and a ${M.min_pr}%+ pick rate in the role.</li>
 <li><b>Builds:</b> u.gg's recommended runes, spells, starting items, 3 core items and skill order for that role (u.gg's own pick, which is not always the most played one). Next to each part is LoLalytics' most picked choice (keystone, each other rune row, stat shards, spell pair, starting set, 1st/2nd/3rd item and level-15 skill order) with a check of whether they agree; where they do not, the page says "Sources differ" and shows LoLalytics' pick and how often each choice is played. A spell pair or starting set played in under half the games on both sites is marked as such.</li>
 <li><b>Matchups:</b> enemy in the same lane, ${n0(M.mu_min_games)}+ games on each site, and on each site the matchup win rate is ${M.mu_gap}+ points and ${M.mu_z}+ standard errors away from the champion's own average, on the same side.</li>
 <li><b>How-to steps:</b> each step is one of three kinds. A sourced step cites a wiki page and quotes it; the build fails if the quote is not on that page or if a number in the step is not inside the quote (open "What the page says" under a step to read the quote). A step marked <b>Common coaching advice</b> is standard practice that no measured source states. A "Step in this guide" just moves you around this guide. Every name must be a champion, item, rune, spell or wiki page in the pulled data.</li>
 <li><b>Rule changes after 26.01:</b> the patch pages ${esc((M.patch_review||{}).pages?M.patch_review.pages[0]+' to '+M.patch_review.pages[M.patch_review.pages.length-1]:'')} are cached. The build lists every rule block on them that touches a topic in this guide (${n0((M.patch_review||{}).blocks)} blocks) and fails unless each has a reviewed verdict; ${n0((M.patch_review||{}).changed)} of them led to a change here (Role Quests and Aegis of Valor, plus a quote added to the Victorious step), and those lines quote the patch page. Champion and item balance changes are not part of this check: champion pages flag ${esc(M.game_patch)} changes, and item cards come from the current Data Dragon.</li>
 <li><b>Epic monsters and the support item chain:</b> from the cached wiki pages (Dragon Slayer, Dragon pit, Elder Dragon, Hand of Baron, World Atlas, Runic Compass, Bounty of Worlds and others), checked the same way.</li>
 <li><b>Item one-liners:</b> Riot's one-line item text is hidden when it claims a stat the item does not have (${(M.plain_dropped||[]).length} items: ${esc((M.plain_dropped||[]).join(', '))}).</li></ul></div></div>
 <div class="card" style="margin-top:14px"><h3>What is not verified or not covered</h3><ul class="small">
 <li>Stats are one patch behind the game data (see above); ${esc(M.game_patch)} changes are flagged on champion pages, not reflected in the numbers.</li>
 <li>The LoLalytics build numbers are read from the state embedded in its public build pages (no official API); if the page format changes, a refresh can miss them and the build will say so.</li>
 <li>u.gg's build is u.gg's recommendation, not proven best and not always the most played (each part shows LoLalytics' most picked choice). Win rates of builds are not adjusted for player skill.</li>
 <li>Data Dragon no longer carries per-rank ability numbers. They come from the League Wiki and are shown for ${n0((M.abil_stat||{}).shown)} of ${n0(Object.values(M.abil_stat||{}).reduce((a,b)=>a+b,0))} abilities, only where the wiki's cooldowns equal Data Dragon's; the others are left out (${esc(Object.entries(M.abil_stat||{}).filter(([k])=>k!=='shown').map(([k,v])=>k+' '+v).join(', '))}).</li>
 <li>Modes other than Summoner's Rift ranked (ARAM, Arena, Swiftplay) are not covered.</li>
 <li>Videos are picked by a search rule, not watched. Champion guide videos were searched only for the ${n0(Object.keys(D.champ_videos||{}).length)} champions shown as "Easy to learn" or "Highest win rates now" (${n0(Object.values(D.champ_videos||{}).filter(l=>l.length).length)} have one); other champion pages show the role's guides and a YouTube search link.</li>
 <li>The Victorious skin rule (15 ranked wins per season) is from the League Wiki's Rank page and is restated in patch 26.15; that Solo/Duo and Flex wins count together is from the Rank page only.</li>
 <li>Later patch pages are checked for rule changes by topic words (Role Quest, turret, Smite, minion, LP and others); a rule change worded without one of those words would be missed.</li></ul></div>
 <p class="small muted">Fan-made and not endorsed by Riot Games. League of Legends and all images belong to Riot Games (used under Riot's "Legal Jibber Jabber" fan-content policy); list of image sources in assets/manifest.json. Heading font: Cinzel (SIL Open Font License).</p>`;};

// ---------- search
const IDX=[];
D.champions.forEach(c=>{IDX.push({t:c.name,k:'Champion · '+(c.roles.map(r=>RNAME[r.role]).join(', ')||c.tags.join(', ')),go:'champ/'+c.slug,img:c.img,x:c.title+' '+c.tags.join(' ')});(c.ab||[]).forEach((a,i)=>IDX.push({t:a,k:'Ability · '+c.name,go:'champ/'+c.slug,img:c.img,x:''}));});
D.items.forEach(i=>IDX.push({t:i.name,k:'Item · '+costLabel(i),item:i.id,img:i.img,x:i.stats.join(' ')}));
(D.monsters||[]).forEach(m=>IDX.push({t:m.name,k:'Epic monster',go:'monsters',img:m.img,x:(m.buff||'')+' '+m.gives}));
((D.howto&&D.howto.glossary)||[]).forEach(g=>{const w=(g.t.match(/\*\*([^*]+)\*\*/)||[])[1];if(w)IDX.push({t:w,k:'Glossary',go:'glossary',x:g.t});});
Object.values(D.runes).forEach(r=>IDX.push({t:r.name,k:'Rune · '+((TR[r.tree]||{}).name||''),rune:r.id,img:r.img,x:''}));
Object.values(D.summs).forEach(s=>IDX.push({t:s.name,k:'Summoner spell',go:'spells',img:s.img,x:''}));
NAV.forEach(([g,l])=>l.forEach(([id,t])=>IDX.push({t,k:'Section',go:id,x:g})));
howtos.forEach(s=>IDX.push({t:s.title,k:'Guide',go:s.id,x:(s.steps||s.paras||[]).map(p=>p.t).join(' ')}));
(D.howto.tables||[]).forEach(t=>IDX.push({t:t.title,k:'Table',go:'ref',x:t.rows.map(r=>r.join(' ')).join(' ')}));
(D.howto.roles||[]).forEach(r=>IDX.push({t:r.name+' role',k:'Role',go:'roles',x:r.t}));
const norm=s=>String(s).toLowerCase().normalize('NFKD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9 ]/g,'');
function makeSearch(inp,res){let hits=[],sel=0;
 function run(q){q=norm(q).trim();if(!q){res.classList.remove('on');return;}const words=q.split(/\s+/);
  hits=IDX.map(e=>{const t=norm(e.t),x=norm(e.x);let sc=0;if(t===q)sc=100;else if(t.startsWith(q))sc=60;else if(t.includes(q))sc=40;else if(words.every(w=>t.includes(w)||x.includes(w)))sc=10;return [sc,e];}).filter(a=>a[0]>0).sort((a,b)=>b[0]-a[0]||a[1].t.localeCompare(b[1].t)).slice(0,14).map(a=>a[1]);
  sel=0;res.innerHTML=hits.length?hits.map((e,i)=>`<div class="${i===0?'sel':''}" data-i="${i}" role="option">${e.img?img(e.img):''}<span>${esc(e.t)}</span><i>${esc(e.k)}</i></div>`).join(''):'<div class="none">No match. Try a champion, item, rune or topic.</div>';res.classList.add('on');}
 function go(e){if(!e)return;res.classList.remove('on');inp.value='';inp.blur();$('#side').classList.remove('open');if(e.item)openItem(e.item);else if(e.rune)openRune(e.rune);else location.hash=e.go;}
 inp.addEventListener('input',e=>run(e.target.value));
 inp.addEventListener('keydown',e=>{if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();if(!hits.length)return;sel=(sel+(e.key==='ArrowDown'?1:hits.length-1))%hits.length;[...res.children].forEach((c,i)=>c.classList.toggle('sel',i===sel));}else if(e.key==='Enter'){go(hits[sel]);}else if(e.key==='Escape'){res.classList.remove('on');}});
 res.addEventListener('mousedown',e=>{const d=e.target.closest('[data-i]');if(d){e.preventDefault();go(hits[+d.dataset.i]);}});}
makeSearch($('#q'),$('#res'));
document.addEventListener('click',e=>{if(!e.target.closest('.search,.bigsearch'))document.querySelectorAll('.results').forEach(r=>r.classList.remove('on'));});

// ---------- modal
let lastFocus=null;
function openModal(html,wide){lastFocus=document.activeElement;$('#mbody').innerHTML=html;$('#modal .box').classList.toggle('wide',!!wide);$('#modal').classList.add('on');$('#modal .box').scrollTop=0;$('#modal .x').focus();}
function closeModal(){if(!$('#modal').classList.contains('on'))return;$('#modal').classList.remove('on');$('#mbody').innerHTML='';if(lastFocus&&lastFocus.focus)lastFocus.focus();}
// item effects, one-liners and "who builds it" are in data/items.js, loaded the first time an item card or the items page opens
let ILOADED=false;const IQUEUE=[];
function loadItems(cb){if(ILOADED){cb();return;}IQUEUE.push(cb);if(IQUEUE.length>1)return;const s=document.createElement('script');s.src='data/items.js?v=2026-11-18-415572';
 s.onload=()=>{Object.entries(window.LOLI||{}).forEach(([id,x])=>{if(IB[id])Object.assign(IB[id],x);});ILOADED=true;IQUEUE.splice(0).forEach(f=>f());};
 s.onerror=()=>{IQUEUE.length=0;main.insertAdjacentHTML('afterbegin','<p class="note warn">Could not load the item data file.</p>');};document.head.appendChild(s);}
function openItem(id){if(ILOADED){openModal(itemCard(+id));return;}openModal('<p class="muted">Loading item...</p>');loadItems(()=>{if($('#modal').classList.contains('on'))$('#mbody').innerHTML=itemCard(+id);});}
function openRune(id){openModal(runeCard(+id));}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal'||e.target.closest('.x'))closeModal();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('[role=button][data-item],[role=button][data-rune],[role=button][data-vid]')){e.preventDefault();e.target.click();}});
// YouTube refuses to play an embed on a page opened from file:// (no referrer: "Error 153"), so there the modal links out instead
function playVideo(id,title){if(location.protocol==='file:'){openModal(`<h3 style="margin-right:30px">${esc(title)}</h3><p class="small vid-file">Videos cannot play inside a guide opened as a file on this device (YouTube blocks the embed there). <a href="https://www.youtube.com/watch?v=${encodeURIComponent(id)}" target="_blank" rel="noopener">Watch it on YouTube</a> <span class="muted">(needs internet)</span>, or open the guide from its web address to play it here.</p>`,true);return;}
 openModal(`<h3 style="margin-right:30px">${esc(title)}</h3><div style="position:relative;aspect-ratio:16/9;overflow:hidden;background:#000"><iframe src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(id)}?autoplay=1&rel=0" title="${esc(title)}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen style="position:absolute;inset:0;width:100%;height:100%;border:0"></iframe></div><p class="small"><a href="https://www.youtube.com/watch?v=${encodeURIComponent(id)}" target="_blank" rel="noopener">Open on YouTube</a> <span class="muted">(needs internet)</span></p>`,true);}

// ---------- clicks + routing
document.addEventListener('click',e=>{
 const it=e.target.closest('[data-item]');if(it){e.preventDefault();openItem(it.dataset.item);return;}
 const ru=e.target.closest('[data-rune]');if(ru){e.preventDefault();openRune(ru.dataset.rune);return;}
 const v=e.target.closest('[data-vid]');if(v){playVideo(v.dataset.vid,v.dataset.title);return;}
 const g=e.target.closest('[data-go]');if(g){location.hash=g.dataset.go;return;}
 const b=e.target.closest('.tabs[data-set] button');if(b){const set=b.parentNode.dataset.set,val=b.dataset.v;
  if(set==='TROLE')TROLE=val;else if(set==='CROLE')CROLE=val;else if(set==='IKIND')IKIND=val;else if(set==='ICAT')ICAT=val;else if(set==='CHV')CHV=val;else if(set==='CRL')CRL[b.parentNode.dataset.c]=val;render(false);}
});
main.addEventListener('input',e=>{const id=e.target.id;if(id==='iq'||id==='cq'){if(id==='iq')IQ=e.target.value;else CQ=e.target.value;const pos=e.target.selectionStart;render(false);const n=$('#'+id);if(n){n.focus();n.setSelectionRange(pos,pos);}}});
main.addEventListener('change',e=>{if(e.target.id==='ctag'){CTAG=e.target.value;render(false);}});
$('#menuBtn').addEventListener('click',()=>$('#side').classList.toggle('open'));
$('#nav').addEventListener('click',e=>{if(e.target.closest('a'))$('#side').classList.remove('open');});

function render(top=true){let h='home';try{h=decodeURIComponent(location.hash.slice(1))||'home';}catch(err){h='home';}const parts=h.split('/');const r=parts[0],arg=parts[1];
 if(r==='item'){main.innerHTML=R.items()+footer();$('#nav').innerHTML=navHtml('items');const i=IS[arg];if(i)openItem(i.id);return;}
 const own=Object.prototype.hasOwnProperty.call(R,r)&&typeof R[r]==='function';const lost=!own&&h!=='home';const f=own?R[r]:lost?R.lost:R.home;const cur=own?r:'home';
 try{main.innerHTML=f(arg)+footer();}
 catch(err){main.innerHTML=`<p class="note warn">This section failed to draw: ${esc(err.message)}. <a href="#home">Home</a></p>`;console.error(err);}
 const navCur=r==='champ'?'champions':r==='learn'?'roles':cur;$('#nav').innerHTML=navHtml(navCur);
 if($('#q2'))makeSearch($('#q2'),$('#res2'));
 main.querySelectorAll('.tablewrap').forEach(w=>{if(w.scrollWidth>w.clientWidth+2&&!w.classList.contains('scrolls')){w.classList.add('scrolls');w.insertAdjacentHTML('afterend','<p class="scrollhint">Scroll the table sideways for more columns &rarr;</p>');}});
 if(top)window.scrollTo(0,0);
 document.title=(r==='champ'&&CS[arg]?CS[arg].name+' · ':'')+'League of Legends Guide';}
function footer(){return `<footer>${$('#checked').innerHTML}<br>Fan-made guide, not endorsed by Riot Games · <a href="#sources">sources and method</a></footer>`;}
window.addEventListener('hashchange',()=>{closeModal();render();});
render();
if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(()=>{});}
})();
</script>
