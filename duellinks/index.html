.deck:hover{border-color:var(--gold)}

.t1{background:linear-gradient(135deg,#ffe28a,#e8b64a)}.t2{background:linear-gradient(135deg,#d7e7ff,#8fb4e6)}.t3{background:linear-gradient(135deg,#cfa27a,#a8703d)}.t0{background:#3a4560;color:#dfe6f7}
.bar{height:7px;border-radius:4px;background:var(--well);overflow:hidden;margin-top:5px}

.tw{overflow-x:auto;max-width:100%}
table{border-collapse:collapse;width:100%;font-size:.94rem}

ol.steps{counter-reset:s;list-style:none;padding:0;margin:12px 0;max-width:1100px}

  background:linear-gradient(135deg,var(--gold2),var(--gold));color:#1a1205;font:800 .95rem var(--body);transform:rotate(45deg) scale(.82)}

.src{font-size:.78rem;color:var(--dim);margin-top:3px}
.src a{color:var(--dim)}
.need{color:var(--muted);font-style:italic}

.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0}

/* character + skill tiles */
.chgrid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}

<script>
"use strict";
const D = window.DL || null;
let C = window.DLC || null;
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const own = (o, k) => o != null && Object.prototype.hasOwnProperty.call(o, k);
const pct = x => (x * 100).toFixed(x < 0.1 ? 1 : 0) + "%";
const num = n => n == null ? "?" : Number(n).toLocaleString("en-US");
const slug = s => String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "x";

/* ---------- lazy card database ---------- */
let cardWait = [];
function needCards(cb) {
  if (C) { cb(); return; }
  cardWait.push(cb);
  if (cardWait.length > 1) return;
  const s = document.createElement("script");
  s.src = "data/cards.js?v=2026-11-19-49810-1032-96280";
  s.onload = () => { C = window.DLC; const w = cardWait; cardWait = []; w.forEach(f => f()); buildIndex(); };
  s.onerror = () => { const m = $("#main"); if (m) m.insertAdjacentHTML("afterbegin", '<p class="note">The card database (data/cards.js) did not load.</p>'); };
  document.head.appendChild(s);
}
/* ---------- lazy skills and characters (data/ref.js) ---------- */
let R = window.DLR || null, refWait = [];
if (D) { D.skills = R ? R.skills : []; D.chars = R ? R.chars : []; }
function needRef(cb) {
  if (R) { cb(); return; }
  refWait.push(cb);
  if (refWait.length > 1) return;
  const s = document.createElement("script");
  s.src = "data/ref.js?v=2026-11-19-49810-1032-96280";
  s.onload = () => { R = window.DLR; D.skills = R.skills; D.chars = R.chars; const w = refWait; refWait = []; buildIndex(); w.forEach(f => f()); };
  s.onerror = () => { const m = $("#main"); if (m) m.insertAdjacentHTML("afterbegin", '<p class="note">The skill and character data (data/ref.js) did not load.</p>'); };
  document.head.appendChild(s);
}
/* a reprint is stored as {same: main id}: it shows its own picture but the main entry's data */
const card = id => { if (!C || !own(C, id)) return null; const c = C[id]; return c.same && own(C, c.same) ? C[c.same] : c; };
const mainIds = () => Object.keys(C).filter(id => !C[id].same);
function frame(c) {
  if (!c) return "";
  if (c.t === "Spell") return "fr-spell";
  if (c.t === "Trap") return "fr-trap";
  const m = c.mt || [];
  for (const k of ["Link", "Xyz", "Synchro", "Fusion", "Ritual"]) if (m.includes(k)) return "fr-" + k.toLowerCase();
  return m.includes("Normal") ? "fr-normal" : "fr-effect";
}
const img = id => "assets/cards/" + encodeURIComponent(id) + ".webp";
function yc(id, opts) {
  opts = opts || {};
  const c = card(id);
  const nm = c ? c.n : "Card";
  const ban = c && c.ban ? `<span class="bn">${esc(c.ban)}</span>` : "";
  return `<button class="yc ${frame(c)}" data-card="${esc(id)}" title="${esc(nm)}"><img loading="lazy" src="${img(id)}" alt="${esc(nm)}">`
    + (opts.count ? `<span class="ct">x${esc(opts.count)}</span>` : "") + (opts.pc != null ? `<span class="pc">${esc(opts.pc)}</span>` : "")
    + ban + `<span class="nm">${esc(nm)}</span></button>`;
}
const rar = r => r ? `<span class="rar ${esc(r)}">${esc(r)}</span>` : "";
const charImg = n => { const c = D.chars.find(x => x.name === n); return c ? c.img : "icon-192.png"; };

/* ---------- inline links in prose: **bold**, [[kind:Name|label]] ---------- */
function prose(t) {
  let h = esc(t).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
  return h.replace(/\[\[(\w+):([^\]|]+)(?:\|([^\]]*))?\]\]/g, (m, kind, ref, lab) => {
    const label = esc(lab || ref);
    if (kind === "page") return `<a href="#${esc(ref)}">${label}</a>`;
    if (kind === "deck") return `<a href="#deck/${esc(deckFmt(ref))}/${esc(slug(ref))}">${label}</a>`;
    if (kind === "char") return `<a href="#" data-char="${esc(ref)}">${label}</a>`;
    if (kind === "skill") return `<a href="#" data-skill="${esc(ref)}">${label}</a>`;
    if (kind === "card") return `<a href="#" data-cardname="${esc(ref)}">${label}</a>`;
    return label;
  });
}
function deckFmt(n) { return D.rush.some(d => d.name === n) && !D.speed.some(d => d.name === n) ? "rush" : "speed"; }
function srcLinks(keys, quotes) {
  if (!keys || !keys.length) return "";
  return '<div class="src">Source: ' + keys.map(k => { const s = own(D.src, k) ? D.src[k] : null;
    return s ? `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title)}</a> (${esc(s.date)})` : esc(k); }).join("; ")
    + (quotes && quotes.length ? `. It says: ${quotes.map(q => `<span class="quote">\u201c${esc(q)}\u201d</span>`).join(" ")}` : "") + "</div>";
}

/* ---------- navigation ---------- */
const HOW = Object.fromEntries(D ? D.howto.sections.map(s => [s.id, s]) : []);
const NAV = [
  ["Start here", [["home", "Home"], ["start", "Come back after a break"], ["about", "About Speed and Rush"]]],
  ["Meta", [["meta", "Speed meta decks"], ["rush", "Rush meta decks"], ["tiers", "Tier list"], ["staples", "Staple cards"]]],
  ["How to play well", [["ranked", "Climb Ranked Duels"], ["kccup", "Play the KC Cup"], ["deckbuild", "Build a meta deck"], ["unlock", "Unlock characters"]]],
  ["Free to play", [["gems", "Farm Gems"], ["spend", "Spend Gems"], ["boxes", "Box priority"], ["loop", "Monthly events loop"]]],
  ["Reference", [["cards", "All cards"], ["skills", "Skills"], ["chars", "Characters"], ["banlist", "Banlist"], ["events", "Events"]]],
  ["More", [["videos", "Videos"], ["sources", "Sources and method"]]],
];
function drawNav() {
  const counts = {meta: D.speed.length, rush: D.rush.length, cards: D.meta.counts.cards, skills: D.meta.counts.skills, chars: D.meta.counts.chars,
    boxes: D.boxes.length, staples: D.staples.speed.length + D.staples.rush.length};
  $("#nav").innerHTML = NAV.map(([g, items]) => `<div class="grp">${esc(g)}</div>` + items.map(([id, lab]) =>
    `<a href="#${id}" data-r="${id}">${esc(lab)}${counts[id] ? `<span class="n">${counts[id]}</span>` : ""}</a>`).join("")).join("");
}
function checkedLine() {
  const m = D.meta;
  return `Game version <b>${esc(m.version)}</b> (App Store, ${esc(m.version_date)}). Last checked against `
    + `<a href="https://www.duellinksmeta.com/tier-list/" target="_blank" rel="noopener">Duel Links Meta</a> and `
    + `<a href="https://yugipedia.com/wiki/Yu-Gi-Oh!_Duel_Links" target="_blank" rel="noopener">Yugipedia</a> on ${esc(m.pulled)}. `
    + `Meta window: ${esc(m.since)} to ${esc(m.pulled)}.`;
}

/* ---------- pages ---------- */
function sec(title, extra) { return `<div class="sec"><h2>${esc(title)}</h2></div>` + (extra || ""); }
function agreeTag(d) {
  if (d.fmt === "rush") return (d.agree === "both" ? '<span class="pill ok">Top in both result sets</span><span class="pill">Single source (Duel Links Meta results)</span>'
    : d.agree === "results" ? '<span class="pill">Top in one result set</span>' : '<span class="pill">Low data</span>') + rushCreator(d);
  const indep = (d.creator || []).length ? '<span class="pill gold">Named by a creator</span>' : '<span class="pill warn">No independent source</span>';
  if (d.agree === "both") return '<span class="pill ok">Tier list + results</span><span class="pill">One publisher</span>' + indep;
  if (d.agree === "tier") return '<span class="pill warn">Tier list only, few results</span>' + indep;
  if (d.agree === "results") return '<span class="pill">Results only</span>';
  return '<span class="pill">Low data</span>';
}
function rushCreator(d) {
  const c = (d.creator || [])[0];
  return c ? `<span class="pill gold">Creator: ${esc(c.rating)}</span>` : (D.rush_rating || []).length ? '<span class="pill">No creator rating</span>' : "";
}
function rushRatingBox() {
  return (D.rush_rating || []).map(r => `<details class="more"><summary>Creator tier list: ${esc(r.channel)}, ${esc(r.date)}</summary>`
    + `<p class="small"><a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.title)}</a>, ${esc(r.channel)}, uploaded ${esc(r.date)}. This guide reads the tiers from the video's chapter titles as YouTube shows them (pulled ${esc(r.fetched)}); the video was not watched, and chapter titles written from speech can mishear names.${r.description_links_dlm ? " The description points viewers to the tournament results on Duel Links Meta, so this rating may rest on the same data as the results." : ""}</p>`
    + `<div class="tw"><table class="stack"><tr><th>Chapter</th><th>Rating</th><th>Duel Links Meta deck type</th></tr>${r.rows.map(x => `<tr><td data-l="Chapter">${esc(x.chapter)}</td><td data-l="Rating">${esc(x.rating)}</td><td data-l="Deck type">${x.deck ? linkDeck(x.deck) + (x.why ? ` <span class="muted small">(${esc(x.why)})</span>` : "") : '<span class="muted">No matching deck type in the results</span>'}</td></tr>`).join("")}</table></div>`
    + `<p class="small muted">Not named in any chapter: ${D.rush.filter(d => !(d.creator || []).length).map(d => linkDeck(d.name)).join(", ") || "none"}.</p></details>`).join("");
}
function tierBadge(d) {
  if (d.fmt === "rush") return `<span class="tierb t0">#${d.pos}</span>`;
  return d.tier ? `<span class="tierb t${d.tier}">Tier ${d.tier}</span>` : '<span class="tierb t0">Untiered</span>';
}
function deckIcon(d) { const id = (d.core[0] || {}).id || ((d.lists[0] || {}).main || [[null]])[0][0]; return id ? img(id) : "icon-192.png"; }
function deckTile(d, total) {
  return `<a class="panel deck" href="#deck/${d.fmt}/${esc(d.slug)}"><img loading="lazy" src="${deckIcon(d)}" alt="">`
    + `<div><h3>${esc(d.name)}</h3><div class="pills">${tierBadge(d)}${agreeTag(d)}</div>`
    + `<div class="small muted">${d.n60} lists in ${D.meta.window} days (${pct(d.share)}) · ${d.n30} in the last 30</div>`
    + `<div class="bar"><i style="width:${Math.min(100, d.share * 100 / (total || 1) * 4).toFixed(1)}%"></i></div></div></a>`;
}

function pHome() {
  const m = D.meta;
  const both = D.speed.filter(d => d.agree === "both");
  const rboth = D.rush.filter(d => d.agree === "both");
  const tiles = [["meta", "Speed meta", D.speed.length + " decks", "Tier list plus 60 days of results, full lists."],
    ["rush", "Rush meta", D.rush.length + " decks", "No Duel Links Meta tier list: King of Games and tournament results compared" + ((D.rush_rating || []).length ? ", plus one creator rating." : ".")],
    ["start", "Come back after a break", HOW.start.steps.length + " steps", "The shortest path back into ranked."],
    ["cards", "All cards", num(m.counts.cards), "Every card in a meta list, a banlist or a level reward."],
    ["skills", "Skills", num(m.counts.skills), "Who has each skill and how often it wins."],
    ["chars", "Characters", num(m.counts.chars), "Unlock missions and level rewards."],
    ["boxes", "Box priority", "Speed + Rush", "Which box covers the most meta cards."],
    ["gems", "Farm Gems", num((D.gems[0] || {}).total) + " last month", "Every Gem source from the latest Gems Report" + ((D.gems[0] || {}).oneoff ? ` (includes a one-off ${num(D.gems[0].oneoff)} Thank-You gift).` : ".")]];
  return `<div class="hero"><img class="bg" src="assets/keyart.webp" alt=""><div class="k">Yu-Gi-Oh! Duel Links · Speed and Rush</div>`
    + `<h1>Duel Links Field Guide</h1><p>The current meta for both formats with full deck lists and dated sources, every card that matters, skills, characters, box priority for free players, gem farming, the banlist, ranked and the KC Cup. Updated ${esc(m.pulled)}.</p>`
    + `<div class="chips"><a class="btn on" href="#start">Start here</a><a class="btn" href="#meta">Speed meta</a><a class="btn" href="#rush">Rush meta</a><a class="btn" href="#gems">Farm Gems</a></div></div>`
    + `<div class="note blue"><b>Right now (${esc(m.pulled)}):</b> Tier 1 on the Duel Links Meta council list (${esc(m.tier_date)}) is ${D.speed.filter(d => d.tier === 1).map(d => `<a href="#deck/speed/${esc(d.slug)}">${esc(d.name)}</a>`).join(" and ") || "empty"}. In Speed, ${both.map(d => `<a href="#deck/speed/${esc(d.slug)}">${esc(d.name)}</a>`).join(", ") || "no deck"} are on the Duel Links Meta tier list (${esc(m.tier_date)}) and near the top of the last ${m.window} days of results (both published by Duel Links Meta). In Rush, ${rboth.map(d => `<a href="#deck/rush/${esc(d.slug)}">${esc(d.name)}</a>`).join(", ") || "no deck"} are in the top ${m.rush_top} of both King of Games lists and tournament top cuts (one source: the Duel Links Meta results database).</div>`
    + sec("What is in this guide") + `<div class="grid">` + tiles.map(([r, t, n, p]) => `<a class="panel tile" href="#${r}"><div><div class="num">${esc(n)}</div><h3>${esc(t)}</h3><p class="small muted">${esc(p)}</p></div></a>`).join("") + `</div>`
    + sec("Search") + `<p class="lead">The search box on the left finds cards, decks, skills, characters, boxes and pages. Press <b>/</b> to jump to it.</p>`
    + sec(`Tier 1 on the council list (${m.tier_date})`) + `<p class="small muted">The Duel Links Meta Top Player Council's top group, whatever its share of results. <a href="#tiers">Open the tier list</a>.</p><div class="decks">${D.speed.filter(d => d.tier === 1).map(d => deckTile(d, 1)).join("") || '<p class="muted">No Tier 1 deck in the data.</p>'}</div>`
    + sec("Top Speed decks: tier list + results") + `<div class="decks">${both.map(d => deckTile(d, 1)).join("")}</div>`;
}

function pHowto(id) {
  const s = HOW[id];
  if (!s) return pNotFound();
  let h = `<h1>${esc(s.title)}</h1><p class="need">${esc(s.need || "")}</p><ol class="steps">`
    + s.steps.map(st => `<li>${prose(st.t)}${srcLinks(st.src, st.q)}</li>`).join("") + `</ol>`;
  if (s.check) h += `<p class="note">${prose(s.check)}</p>`;
  if (id === "ranked") h += tRanked();
  if (id === "kccup") h += tKcc();
  if (id === "gems") h += tGems();
  if (id === "loop") h += tLoop();
  if (id === "spend") h += `<p><a class="btn" href="#boxes">Open Box priority</a> <a class="btn" href="#staples">Open Staples</a></p>`;
  const v = {ranked: "topic:meta", kccup: "topic:kccup", gems: "topic:f2p", spend: "topic:f2p", start: "topic:return"}[id];
  if (v) h += topicVids(v, "Videos");
  return h;
}
function pAbout() {
  const a = D.howto.about;
  return `<h1>${esc(a.title)}</h1>` + a.paras.map(p => `<div class="panel" style="margin:10px 0;max-width:1100px"><p>${prose(p.t)}</p>${srcLinks(p.src, p.q)}</div>`).join("")
    + sec("Words this guide uses") + `<dl class="gloss">${(a.terms || []).map(g => `<dt>${esc(g.term)}</dt><dd>${prose(g.t)}${srcLinks(g.src, g.q)}</dd>`).join("")}</dl>`
    + topicVids("topic:rush", "Rush Duel videos");
}
function tRanked() {
  return sec("Rank-up rewards (once per month)") + `<p class="small muted">From Yugipedia, Ranked Duels (Duel Links).</p><div class="tw"><table><tr><th>Rank</th><th class="r">Gems</th></tr>`
    + D.rankup.map(r => `<tr><td>${esc(r[0])}</td><td class="r">${esc(r[1])}</td></tr>`).join("") + `</table></div>`
    + sec("Cumulative win rewards, November 2026") + `<details class="more"><summary>Show all ${D.ranked_cum.length} reward steps</summary><div class="tw"><table><tr><th class="r">Wins</th><th>Reward</th></tr>`
    + D.ranked_cum.map(r => `<tr><td class="r">${esc(r[0])}</td><td>${esc(r[1])}</td></tr>`).join("") + `</table></div></details>` + srcLinks(["art:news_november_2026_ranked_duels_rewards"]);
}
function tKcc() {
  const m = D.meta;
  return sec("Start level by last month's rank") + `<div class="tw"><table><tr><th>Rank</th><th>Starting DLv.</th></tr>` + D.kc_start.map(r => `<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td></tr>`).join("") + `</table></div>`
    + sec("Stage 1 DLv. rewards, November 2026") + `<div class="tw"><table><tr><th class="r">DLv.</th><th>Reward</th></tr>` + D.kc_dlv.map(r => `<tr><td class="r">${esc(r[0])}</td><td>${esc(r[1])}</td></tr>`).join("") + `</table></div>`
    + srcLinks(["art:tournaments_2026_nov_kc_cup"])
    + sec("Decks that reached DLv. Max, November 2026") + `<p class="small muted">${m.kcc_total} lists submitted to Duel Links Meta with the KC Cup DLv. Max tag since 2026-11-01.</p><div class="tw"><table><tr><th>Deck</th><th class="r">Lists</th><th class="r">Share</th></tr>`
    + m.kcc_month.map(([n, k]) => `<tr><td>${linkDeck(n)}</td><td class="r">${k}</td><td class="r">${pct(k / (m.kcc_total || 1))}</td></tr>`).join("") + `</table></div>`;
}
function linkDeck(n) { const d = D.speed.find(x => x.name === n) || D.rush.find(x => x.name === n); return d ? `<a href="#deck/${d.fmt}/${esc(d.slug)}">${esc(n)}</a>` : esc(n); }
function tGems() {
  return D.gems.map((g, i) => {
    const body = `<div class="grid two">${g.sections.map(s => `<div class="panel"><h3>${esc(s.name)}</h3><div class="tw"><table>${s.rows.map(r => `<tr><td>${esc(r[0])}</td><td class="r">+${num(r[1])}</td></tr>`).join("")}</table></div></div>`).join("")}</div>`
      + (g.extra.length ? `<p class="small muted">Also: ${g.extra.map(esc).join(", ")}.</p>` : "") + (g.box_cost.length ? `<p class="small"><b>Cost to Keep Up</b> (buying three runs of each new box, the report's price for the three UR copies usually needed): ${g.box_cost.map(([b, c]) => `${esc(b)}: <b>${esc(c)}</b>`).join("; ")}.</p>` : "");
    return sec(`${g.title}: ${num(g.total)} Gems`) + `<p class="small"><a href="${esc(g.url)}" target="_blank" rel="noopener">${esc(g.title)}</a>, Duel Links Meta, ${esc(g.date)}</p>`
      + (i === 0 ? body : `<details class="more"><summary>Show the breakdown</summary>${body}</details>`);
  }).join("");
}
function tLoop() {
  return sec("Recurring events and posts since " + D.meta.first_index) + `<p class="small muted">Counted from Duel Links Meta article titles; "Last" links the newest one.</p><div class="tw"><table class="stack"><tr><th>Type</th><th class="r">Times</th><th>Last</th></tr>`
    + D.loop.map(e => `<tr><td data-l="Type">${esc(e.type)}</td><td class="r" data-l="Times">${e.count}</td><td data-l="Last"><a href="${esc(e.url)}" target="_blank" rel="noopener">${esc(e.title)}</a> <span class="muted small">${esc(e.date)}</span></td></tr>`).join("") + `</table></div>`;
}

const KIND = {kog: "King of Games", kcc: "KC Cup DLv. Max", tournament: "tournament top cuts", spicy: "Spicy Win Streaks", other: "other tags"};
function kindsLine(k) { return Object.entries(k || {}).sort((a, b) => b[1] - a[1]).map(([x, n]) => `${num(n)} ${esc(KIND[x] || x)}`).join(", "); }
function metaIntro(fmt) {
  const m = D.meta;
  if (fmt === "speed") return `<p class="lead">A deck is marked <b>Tier list + results</b> when it is on the Duel Links Meta tier list (Top Player Council, <a href="${esc(m.tier_url)}" target="_blank" rel="noopener">${esc(m.tier_title)}, ${esc(m.tier_date)}</a>) <b>and</b> in the top ${m.result_top} by submitted results with at least ${pct(m.result_min_share)} of the ${num(m.total_speed)} lists from ${esc(m.since)} to ${esc(m.pulled)}: ${kindsLine(m.kinds_speed)}.</p>`
    + `<details class="more"><summary>One publisher: how independent are these sources?</summary><p class="small"><b>One publisher.</b> The tier list (the council's opinion) and the results (the raw lists) are both published by Duel Links Meta, so they are not two independent sources. No independent tier list dated in the window was found. <b>Source C</b> is outside Duel Links Meta: ${(D.video_checks || []).length} dated creator video${(D.video_checks || []).length === 1 ? "" : "s"} on the meta and the KC Cup, whose chapter titles and titles (and English captions where YouTube allowed it) this guide checked for deck names (<b>Named by a creator</b>). Naming a deck is weaker than rating it; open a deck's Sources to see what each video says.</p></details>`;
  const rr = (D.rush_rating || [])[0];
  return `<p class="lead">Duel Links Meta keeps no tier list for Rush. A deck is marked <b>Top in both result sets</b> when it is in the top ${m.rush_top} by King of Games lists <b>with at least ${m.rush_min_kog}</b> of them, <b>and</b> in the top ${m.rush_top} by community tournament top cuts <b>with at least ${m.rush_min_tour}</b>, from ${esc(m.since)} to ${esc(m.pulled)} (${num(m.total_rush)} lists). A deck that meets only one of the two is <b>Top in one result set</b>.${rr ? ` <b>Creator: Tier N</b> is the rating in one dated creator tier list (${esc(rr.channel)}, ${esc(rr.date)}).` : ""}</p>`
    + `<details class="more"><summary>Single source: how far to trust this</summary><p class="small"><b>Single source.</b> Both result sets come from the Duel Links Meta database, so they are one source, not two that agree. Rush data is thin: treat the order below the top few decks as rough.${rr ? ` The creator tier list is a second, dated opinion, but it does not always agree: its Tier 1 (${rr.rows.filter(x => x.rating === "Tier 1").map(x => esc(x.name)).join(", ")}) ${rr.rows.some(x => x.rating === "Tier 1" && x.deck) ? "" : "matches no deck type in the results, and "}the #1 deck by results, ${esc(D.rush[0].name)}, ${(D.rush[0].creator || []).length ? "is rated " + esc(D.rush[0].creator[0].rating) : "is not named in any chapter"}.` : ""}</p></details>` + rushRatingBox();
}
let metaFilter = "all";
function pMeta(fmt) {
  const list = D[fmt];
  const f = metaFilter;
  const shown = list.filter(d => f === "all" || d.agree === f);
  return `<h1>${fmt === "speed" ? "Speed" : "Rush"} meta decks</h1>` + metaIntro(fmt)
    + `<div class="tabs">${(fmt === "speed" ? [["all", "All"], ["both", "Tier list + results"], ["tier", "Tier list only"], ["results", "Results only"]] : [["all", "All"], ["both", "Top in both result sets"], ["results", "Top in one result set"]])
      .map(([k, l]) => `<button class="btn ${f === k ? "on" : ""}" data-mf="${k}">${l}</button>`).join("")}</div>`
    + `<div class="decks">${shown.map(d => deckTile(d, 1)).join("") || '<p class="muted">No deck in this group.</p>'}</div>`
    + (fmt === "rush" ? topicVids("topic:rush", "Rush videos") : "");
}

function pDeck(fmt, s) {
  if (fmt !== "speed" && fmt !== "rush") return pNotFound();
  const d = D[fmt].find(x => x.slug === s);
  if (!d) return pNotFound("Deck not found.");
  const m = D.meta;
  const srcA = fmt === "speed"
    ? `<li>Tier list: ${d.tier ? "Tier " + d.tier : "not on the tier list"}. <a href="${esc(m.tier_url)}" target="_blank" rel="noopener">${esc(m.tier_title)}</a>, Duel Links Meta Top Player Council, ${esc(m.tier_date)}.</li>`
    : `<li>King of Games lists: ${d.kog} (rank #${d.kog_pos} of ${D.rush.length}; needs the top ${m.rush_top} and at least ${m.rush_min_kog}), ${esc(m.since)} to ${esc(m.pulled)}. Duel Links Meta results database.</li>`;
  const srcB = fmt === "speed"
    ? `<li>Results: ${d.n60} lists (#${d.pos}, ${pct(d.share)}): ${d.kog} King of Games, ${d.kcc} KC Cup DLv. Max, ${d.tour} tournament top cuts (${d.tour_wins} ${d.tour_wins === 1 ? "win" : "wins"}), ${esc(m.since)} to ${esc(m.pulled)}, newest ${esc(d.last)}. <a href="${esc(d.dlm)}" target="_blank" rel="noopener">Deck type on Duel Links Meta</a>.</li>`
    : `<li>Community tournament top cuts: ${d.tour} (rank #${d.tour_pos}; needs the top ${m.rush_top} and at least ${m.rush_min_tour}), ${d.tour_wins} ${d.tour_wins === 1 ? "win" : "wins"}, newest ${esc(d.last)}. Same database, so Rush lines rest on a single source.</li>`;
  const srcC = (fmt === "speed" ? d.creator || [] : []).map(c => `<li><a href="${esc(c.url)}" target="_blank" rel="noopener">${esc(c.title)}</a>, ${esc(c.channel)}, ${esc(c.date)}: names ${esc(d.name)} in ${c.chapters.map(x => ({"(no chapters)": "its captions", "(video title)": "its title", "(description)": "its description"})[x] || "the chapter \u201c" + esc(x) + "\u201d").join(", ")}.</li>`).join("");
  const vids = (d.videos || []).map(v => `<li><a href="${esc(v.url)}" target="_blank" rel="noopener">${esc(v.title)}</a>, ${esc(v.channel)}, ${esc(v.date)}${v.lang_name && v.lang_name !== "English" ? ` (${esc(v.lang_name)})` : ""}</li>`).join("");
  let h = `<p class="small"><a href="#${fmt === "speed" ? "meta" : "rush"}">${fmt === "speed" ? "Speed" : "Rush"} meta</a> /</p>`
    + `<div class="panel"><div class="deck" style="cursor:default"><img src="${deckIcon(d)}" alt=""><div><h1 style="margin:0">${esc(d.name)}</h1><div class="pills">${tierBadge(d)}${agreeTag(d)}`
    + `<button class="btn" data-srcbox="sb-${esc(d.slug)}" aria-expanded="false">Sources (${fmt === "speed" ? 2 + (d.creator || []).length : 1 + (d.creator || []).length})</button></div></div></div>`
    + `<div class="srcbox" id="sb-${esc(d.slug)}"><b>Source A</b><ul>${srcA}</ul><b>Source B</b><ul>${srcB}</ul>`
    + (fmt === "speed" ? `<b>Source C: creator videos that name this deck</b>` + (srcC ? `<ul>${srcC}</ul>` : `<p class="small muted">None. No checked meta or KC Cup video (${(D.video_checks || []).length} so far) names this deck, so it has no source outside Duel Links Meta. The deck videos below were found by a search for the deck name and are not checked or counted.</p>`)
      : `<b>Source C: creator tier list</b>` + ((d.creator || []).length ? `<ul>${d.creator.map(c => `<li>${esc(c.rating)} in <a href="${esc(c.url)}" target="_blank" rel="noopener">${esc(c.title)}</a>, ${esc(c.channel)}, ${esc(c.date)}: chapter “${esc(c.chapter)}”${c.why ? ` (read as ${esc(d.name)}: ${esc(c.why)})` : ""}.</li>`).join("")}</ul>` : `<p class="small muted">None. ${(D.rush_rating || []).length ? "The dated creator tier list (" + esc(D.rush_rating[0].channel) + ", " + esc(D.rush_rating[0].date) + ") names this deck in no chapter." : "No dated creator rating was found."}</p>`))
    + (vids ? `<b>Deck videos (found by a search rule, not reviewed; not counted as a source)</b><ul>${vids}</ul>` : "") + `</div>`
    + `<div class="list-meta"><span><b>${d.n60}</b> lists in ${m.window} days</span><span><b>${d.n30}</b> in the last 30</span><span>Share <b>${pct(d.share)}</b></span>`
    + (d.gems_median ? `<span>Median price <b>${num(d.gems_median)}</b> Gems (Duel Links Meta estimate)</span>` : "") + `</div>`
    + `<p><b>Skill:</b> ${d.skills.map(([n, k]) => `<a href="#" data-skill="${esc(n)}">${esc(n)}</a> (${k} of ${d.n60})`).join(", ")}</p></div>`;
  if (d.core.length) h += sec("Core cards") + `<p class="small muted">Share of this deck's recent lists that play the card (Duel Links Meta deck breakdown), and the usual number of copies.</p><div class="cardgrid">`
    + d.core.map(c => yc(c.id, {count: c.at, pc: c.per + "%"})).join("") + `</div>`;
  h += sec("Full deck lists") + `<div class="tabs">${d.lists.map((l, i) => `<button class="btn ${i ? "" : "on"}" data-list="${i}">${esc(l.date)} · ${esc(l.kind === "kog" ? "King of Games" : l.kind === "kcc" ? "KC Cup DLv. Max" : l.kind === "tournament" ? "Tournament" : l.src)}${l.pre_ban ? " · before banlist" : ""}</button>`).join("")}</div>`
    + (d.lists.some(l => l.pre_ban) ? `<p class="note small">Lists marked <b>before banlist</b> were submitted before the Forbidden/Limited List changed on ${esc(m.ban_date)}. Check every card against the <a href="#banlist">Banlist</a> before you copy one.</p>` : "")
    + (d.illegal_lists ? `<p class="small muted">${d.illegal_lists} of this deck's ${d.n60} lists are flagged illegal under the current banlist by Duel Links Meta and are not shown.</p>` : "")
    + d.lists.map((l, i) => `<div class="dl" data-li="${i}" ${i ? "hidden" : ""}><div class="list-meta"><span>${esc(l.src)}</span><span>${esc(l.date)}</span>${l.pre_ban ? `<span class="pill warn">Before the ${esc(m.ban_date)} banlist</span>` : ""}<span>Skill: <a href="#" data-skill="${esc(l.skill)}">${esc(l.skill)}</a></span>`
      + (l.gems ? `<span>${num(l.gems)} Gems (Duel Links Meta estimate)</span>` : "") + (l.report ? `<a href="${esc(l.report)}" target="_blank" rel="noopener">Tournament report</a>` : "") + `</div>`
      + `<div class="sub">Main deck (${l.main.reduce((a, x) => a + x[1], 0)})</div><div class="cardgrid sm">${l.main.map(x => yc(x[0], {count: x[1]})).join("")}</div>`
      + (l.extra.length ? `<div class="sub">Extra deck (${l.extra.reduce((a, x) => a + x[1], 0)})</div><div class="cardgrid sm">${l.extra.map(x => yc(x[0], {count: x[1]})).join("")}</div>` : "")
      + (l.side.length ? `<details class="more"><summary>Side deck (${l.side.reduce((a, x) => a + x[1], 0)})</summary><div class="cardgrid sm">${l.side.map(x => yc(x[0], {count: x[1]})).join("")}</div></details>` : "")
      + `</div>`).join("");
  if ((d.videos || []).length) h += sec("Videos") + vidGrid(d.videos);
  else h += sec("Videos") + `<p class="muted">No guide video from the last ${m.window} days matched the search rule. <a href="https://www.youtube.com/results?search_query=${encodeURIComponent("duel links " + d.name + " deck")}" target="_blank" rel="noopener">Search YouTube</a>.</p>`;
  return h;
}

function pTiers() {
  const m = D.meta;
  const rows = [1, 2, 3].map(t => {
    const ds = D.speed.filter(d => d.tier === t);
    return `<div class="panel" style="display:grid;grid-template-columns:96px 1fr;gap:14px;margin:10px 0;align-items:center"><span class="tierb t${t}" style="height:44px;font-size:1rem">Tier ${t}</span><div class="chips">${ds.map(d => `<a class="btn" href="#deck/speed/${esc(d.slug)}">${esc(d.name)} <span class="muted small">${pct(d.share)}</span></a>`).join("") || '<span class="muted">none</span>'}</div></div>`;
  }).join("");
  return `<h1>Tier list</h1><p class="lead"><b>Whose rating:</b> the Duel Links Meta Top Player Council, <a href="${esc(m.tier_url)}" target="_blank" rel="noopener">${esc(m.tier_title)}</a> (${esc(m.tier_date)}). <b>What the numbers mean</b> (this guide's summary: the pulled Duel Links Meta pages give no written definition): the council sorts decks into numbered groups, Tier 1 first. ${prose(D.howto.notes.tiers.t)} The percentage beside each deck is its share of the ${num(m.total_speed)} result lists from ${esc(m.since)} to ${esc(m.pulled)} (this guide's count, not the council's).</p>`
    + srcLinks(D.howto.notes.tiers.src, D.howto.notes.tiers.q) + rows
    + sec("Rush: results ranking (no Duel Links Meta tier list)") + `<p class="lead">Order by number of lists from ${esc(m.since)} to ${esc(m.pulled)}. This is a count, not a rating.</p><div class="tw"><table class="stack"><tr><th class="r">#</th><th>Deck</th><th class="r">Lists</th><th class="r">King of Games</th><th class="r">Tournament tops</th><th>Creator rating</th><th>Sources</th></tr>`
    + D.rush.map(d => `<tr><td class="r" data-l="#">${d.pos}</td><td data-l="Deck"><a href="#deck/rush/${esc(d.slug)}">${esc(d.name)}</a></td><td class="r" data-l="Lists">${d.n60}</td><td class="r" data-l="King of Games">${d.kog}</td><td class="r" data-l="Top cuts">${d.tour}</td><td data-l="Rating">${(d.creator || []).length ? esc(d.creator[0].rating) : "-"}</td><td data-l="Sources">${agreeTag(d)}</td></tr>`).join("") + `</table></div>`
    + sec("Speed: results next to the tier list") + `<div class="tw"><table class="stack"><tr><th class="r">#</th><th>Deck</th><th>Tier</th><th class="r">Lists</th><th class="r">Share</th><th class="r">KC Cup Max</th><th class="r">Tour. wins</th><th>Sources</th></tr>`
    + D.speed.map(d => `<tr><td class="r" data-l="#">${d.pos}</td><td data-l="Deck"><a href="#deck/speed/${esc(d.slug)}">${esc(d.name)}</a></td><td data-l="Tier">${d.tier ? "Tier " + d.tier : "-"}</td><td class="r" data-l="Lists">${d.n60}</td><td class="r" data-l="Share">${pct(d.share)}</td><td class="r" data-l="KC Cup Max">${d.kcc}</td><td class="r" data-l="Tour. wins">${d.tour_wins}</td><td data-l="Sources">${agreeTag(d)}</td></tr>`).join("") + `</table></div>`
    + topicVids("topic:meta", "Tier list videos");
}

function pStaples() {
  const part = (fmt, title) => sec(title) + `<p class="small muted">Cards played in at least 4 different ${fmt === "speed" ? "Speed" : "Rush"} decks in the ${D.meta.window}-day lists. The number on the card is how many decks play it.</p>`
    + `<div class="cardgrid">${D.staples[fmt].map(s => yc(s.id, {pc: s.decks + " decks"})).join("")}</div>`;
  return `<h1>Staple cards</h1><p class="lead">Cards that the most different meta decks play, counted by this guide from the dated lists. This guide's view: a card that fits many decks keeps its use when the meta moves. Open a card to see where to get it.</p>` + part("speed", "Speed staples") + part("rush", "Rush staples");
}

let cf = {q: "", fmt: "all", type: "all", rar: "all", ban: "all", meta: "all", n: 120};
function pCards() {
  if (!C) { needCards(route); return "<h1>All cards</h1><p>Loading the card database…</p>"; }
  const ids = mainIds();
  const q = cf.q.trim().toLowerCase();
  const res = ids.filter(id => { const c = C[id];
    if (cf.fmt !== "all" && (cf.fmt === "rush") !== c.rush) return false;
    if (cf.type !== "all" && c.t !== cf.type) return false;
    if (cf.rar !== "all" && c.rar !== cf.rar) return false;
    if (cf.ban === "any" && !c.ban) return false;
    if (cf.ban !== "all" && cf.ban !== "any" && c.ban !== cf.ban) return false;
    if (cf.meta === "yes" && !c.used.length) return false;
    if (q && !(c.n.toLowerCase().includes(q) || (c.d || "").toLowerCase().includes(q))) return false;
    return true; }).sort((a, b) => (C[b].used.length - C[a].used.length) || C[a].n.localeCompare(C[b].n));
  const opt = (k, vals) => `<select data-cf="${k}" aria-label="${k}">${vals.map(([v, l]) => `<option value="${v}" ${cf[k] === v ? "selected" : ""}>${l}</option>`).join("")}</select>`;
  return `<h1>All cards</h1><p class="lead">${num(ids.length)} cards: every card in a ${D.meta.window}-day meta list (Speed and Rush), every deck's core cards, both banlists, box icons and every character level reward. Cards played in meta decks come first. A reprint is the same card, so each card is shown once.</p>`
    + `<div class="filters"><input type="search" data-cf="q" value="${esc(cf.q)}" placeholder="Filter by name or text" aria-label="Filter cards">`
    + opt("fmt", [["all", "Speed + Rush"], ["speed", "Speed"], ["rush", "Rush"]]) + opt("type", [["all", "All types"], ["Monster", "Monsters"], ["Spell", "Spells"], ["Trap", "Traps"]])
    + opt("rar", [["all", "All rarities"], ["UR", "UR"], ["SR", "SR"], ["R", "R"], ["N", "N"]])
    + opt("ban", [["all", "Any banlist status"], ["any", "On a banlist"], ["Forbidden", "Forbidden"], ["Limited 1", "Limited 1"], ["Limited 2", "Limited 2"], ["Limited 3", "Limited 3"]])
    + opt("meta", [["all", "All cards"], ["yes", "In a meta deck"]]) + `</div><p class="small muted" id="ccount">${num(res.length)} cards match.</p>`
    + `<div class="cardgrid">${res.slice(0, cf.n).map(id => yc(id)).join("")}</div>` + (res.length > cf.n ? `<button class="btn more-btn" data-more="1">Show 120 more</button>` : "");
}

let sf = {q: "", fmt: "all", use: "all", n: 90};
function pSkills() {
  const q = sf.q.trim().toLowerCase();
  const res = D.skills.filter(s => (sf.fmt === "all" || (sf.fmt === "rush") === s.rush) && (sf.use === "all" || s.use > 0) && (sf.use !== "live" || !s.archive)
    && (!q || s.name.toLowerCase().includes(q) || s.desc.toLowerCase().includes(q) || s.chars.some(c => c.name.toLowerCase().includes(q))));
  return `<h1>Skills</h1><p class="lead">${num(D.skills.length)} skills from the Duel Links Meta database. The number shows how many of the ${D.meta.window}-day result lists used the skill. Open a skill to see which characters get it and how.</p>`
    + `<div class="filters"><input type="search" data-sf="q" value="${esc(sf.q)}" placeholder="Filter by name, text or character" aria-label="Filter skills">`
    + `<select data-sf="fmt" aria-label="format">${[["all", "Speed + Rush"], ["speed", "Speed"], ["rush", "Rush"]].map(([v, l]) => `<option value="${v}" ${sf.fmt === v ? "selected" : ""}>${l}</option>`).join("")}</select>`
    + `<select data-sf="use" aria-label="use">${[["all", "All skills"], ["meta", "Used in meta lists"]].map(([v, l]) => `<option value="${v}" ${sf.use === v ? "selected" : ""}>${l}</option>`).join("")}</select></div>`
    + `<p class="small muted">${num(res.length)} skills match.</p><div class="grid">${res.slice(0, sf.n).map(skillTile).join("")}</div>` + (res.length > sf.n ? `<button class="btn more-btn" data-smore="1">Show 90 more</button>` : "");
}
function skillTile(s) {
  const ch = s.chars[0];
  return `<div class="panel sk" data-skill="${esc(s.name)}" tabindex="0" role="button"><img loading="lazy" src="${ch ? charImg(ch.name) : "icon-192.png"}" alt="">`
    + `<div><h3>${esc(s.name)}</h3><div class="pills"><span class="pill">${s.rush ? "Rush" : "Speed"}</span>${s.use ? `<span class="pill gold">${s.use} meta lists</span>` : ""}${s.archive ? '<span class="pill">Archived</span>' : ""}</div><p>${esc(s.desc)}</p></div></div>`;
}

let chf = {q: "", w: "all"};
const rewardNote = c => c.npc ? "NPC, no level rewards" : !c.rewards_known ? (c.base ? "Alt Style: level rewards not in source data" : "Level rewards: not in source data") : `${c.rewards.length} level-up cards`;
function pChars() {
  const worlds = [...new Set(D.chars.flatMap(c => c.world.split(", ")).filter(Boolean))];
  const q = chf.q.trim().toLowerCase();
  const res = D.chars.filter(c => (chf.w === "all" || c.world.split(", ").includes(chf.w)) && (!q || c.name.toLowerCase().includes(q)));
  return `<h1>Characters</h1><p class="lead">${D.chars.length} characters. Open one for its unlock missions, Gate key, level rewards (cards and skills) and skills.</p>`
    + `<div class="filters"><input type="search" data-chf="q" value="${esc(chf.q)}" placeholder="Filter by name" aria-label="Filter characters"><select data-chf="w" aria-label="world"><option value="all">All worlds</option>${worlds.map(w => `<option ${chf.w === w ? "selected" : ""}>${esc(w)}</option>`).join("")}</select></div>`
    + `<div class="chgrid">${res.map(c => `<div class="panel ch" data-char="${esc(c.name)}" tabindex="0" role="button"><img loading="lazy" src="${esc(c.img)}" alt=""><b>${esc(c.name)}</b><span class="tiny muted">${esc(c.world)} · ${rewardNote(c)}</span></div>`).join("")}</div>`;
}

let bf = {t: "all"};
const boxFlags = b => (b.paid ? ' <span class="pill warn">Paid Crystals</span>' : "") + (b.old ? ` <span class="pill">${b.release ? "Over " + D.meta.box_old_days + " days old" : "No release date"}: check the shop</span>` : "");
function pBoxes() {
  const pr = (fmt) => {
    const list = D.prio[fmt];
    if (!list.length) return '<p class="muted">No box holds a core UR/SR of a deck marked Tier list + results or Top in both result sets.</p>';
    return `<div class="tw"><table class="stack"><tr><th class="r">#</th><th>Box</th><th>Type</th><th>Released</th><th class="r">Score</th><th>Meta decks it feeds (core cards)</th></tr>`
      + list.map((p, i) => { const b = D.boxes.find(x => x.id === p.id) || {};
        return `<tr><td class="r" data-l="#">${i + 1}</td><td data-l="Box"><a href="#" data-box="${esc(p.id)}">${esc(b.name)}</a>${boxFlags(b)}</td><td data-l="Type">${esc(b.type)}</td><td class="nw" data-l="Released">${esc(b.release)}</td><td class="r" data-l="Score">${p.score.toFixed(2)}</td><td data-l="Feeds">${Object.entries(p.decks).map(([dn, ids]) => `${linkDeck(dn)} <span class="muted small">(${ids.length})</span>`).join(", ")}</td></tr>`; }).join("") + `</table></div>`;
  };
  const types = [...new Set(D.boxes.map(b => b.type))];
  const res = D.boxes.filter(b => bf.t === "all" || b.type === bf.t);
  return `<h1>Box priority</h1><p class="lead">A higher score means the box sells more of the UR and SR cards that the top decks play. This is this guide's own count, not an expert ranking. This guide's view: check the box's card list before buying, because a box can be worth it for one deck only.</p>`
    + `<details class="more"><summary>How the score is counted</summary><p>For every deck marked Tier list + results (Speed) or Top in both result sets (Rush), each UR or SR core card played in at least half of its lists adds (deck share × share of lists playing it × usual copies) to every box that sells it.</p></details>`
    + `<p class="note small">Whether a box is still sold is not in any data this guide pulls. <b>Paid Crystals</b> marks Selection Boxes: the September 2026 Gems Report says they are \u201cthe only content released that paywall cards needed to compete\u201d. <b>Check the shop</b> marks boxes released more than ${D.meta.box_old_days} days before ${esc(D.meta.pulled)} (this guide's rule), which may have left the shop.</p>`
    + sec("Speed: boxes that feed the current meta") + pr("speed") + sec("Rush: boxes that feed the current meta") + pr("rush")
    + topicVids("topic:box", "Box videos")
    + sec("All boxes") + `<div class="filters"><select data-bf="t" aria-label="box type"><option value="all">All types</option>${types.map(t => `<option ${bf.t === t ? "selected" : ""}>${esc(t)}</option>`).join("")}</select></div>`
    + `<div class="cardgrid">${res.map(b => b.icon ? `<button class="yc fr-link" data-box="${esc(b.id)}" title="${esc(b.name)}"><img loading="lazy" src="${img(b.icon)}" alt=""><span class="pc">${esc(b.release.slice(0, 7))}</span><span class="nm">${esc(b.name)}</span></button>` : "").join("")}</div>`;
}

let banFmt = "speed";
function pBan() {
  const B = D.ban[banFmt] || {};
  const order = ["Forbidden", "Limited 1", "Limited 2", "Limited 3"];
  const meaning = {"Forbidden": "cannot be used", "Limited 1": "1 card from this group per deck", "Limited 2": "2 cards from this group per deck", "Limited 3": "3 cards from this group per deck"};
  const ch = D.ban_changes.filter(c => c.fmt === banFmt);
  const lab = v => /^\d$/.test(v) ? (v === "0" ? "Forbidden" : "Limited " + v) : v;
  return `<h1>Banlist</h1><p class="lead">The Forbidden/Limited list as stored in the Duel Links Meta card database on ${esc(D.meta.pulled)}. In Duel Links a Limited group caps how many cards <b>from the whole group</b> one deck may hold. The last change was announced on ${esc(D.ban_article ? D.ban_article.date : "?")}.</p>`
    + `<div class="tabs"><button class="btn ${banFmt === "speed" ? "on" : ""}" data-ban="speed">Speed</button><button class="btn ${banFmt === "rush" ? "on" : ""}" data-ban="rush">Rush</button></div>`
    + order.filter(k => own(B, k)).map(k => sec(`${k} (${B[k].length})`) + `<p class="small muted">${meaning[k]}</p><div class="cardgrid sm">${B[k].map(id => yc(id)).join("")}</div>`).join("")
    + (ch.length ? sec("What changed on " + (D.ban_article ? D.ban_article.date : "")) + `<details class="more"><summary>Show the ${ch.length} ${banFmt === "speed" ? "Speed" : "Rush"} changes</summary><div class="tw"><table><tr><th>Card</th><th>From</th><th>To</th></tr>${ch.map(c => `<tr><td><a href="#" data-card="${esc(c.id)}">${esc((card(c.id) || {}).n || c.id)}</a></td><td>${esc(lab(c.from))}</td><td>${esc(lab(c.to))}</td></tr>`).join("")}</table></div></details>` + srcLinks(["art:news_balance_update_2026_september_28"]) : "")
    + (banFmt === "speed" && D.skill_changes.length ? sec("Skill changes in the same update") + `<ul>${D.skill_changes.map(s => `<li><a href="#" data-skill="${esc(s[0])}">${esc(s[0])}</a>: ${esc(s[1])}</li>`).join("")}</ul>` : "");
}

function closeModal() { $("#modal").classList.remove("on"); document.body.style.overflow = ""; $("#mbody").innerHTML = ""; }

      ["Level", c.lv], ["ATK / DEF", c.atk != null ? `${c.atk} / ${c.def != null ? c.def : "-"}` : null], ["Banlist", c.ban || "Unlimited"], ["Legend card", c.leg ? "Yes" : null]].filter(x => x[1] != null && x[1] !== "");

      + `<div class="sub">How to get it</div>${c.ob.length ? `<ul>${c.ob.map(o => `<li>${esc(o)}</li>`).join("")}</ul>` : '<p class="muted">No source listed in the data.</p>'}`

    + `<div class="sub">Characters and how they get it</div><div class="chgrid">${s.chars.map(c => `<div class="panel ch" data-char="${esc(c.name)}" tabindex="0" role="button"><img loading="lazy" src="${charImg(c.name)}" alt=""><b>${esc(c.name)}</b><span class="tiny muted">${esc(c.how || "")}</span></div>`).join("") || '<p class="muted">No character listed.</p>'}</div>`);

      + (c.missions.length ? `<div class="sub">Unlock missions</div><ol>${c.missions.map(n => `<li>${esc(n)}</li>`).join("")}</ol>` : "")
      + (c.lvl_skills.length ? `<div class="sub">Level-up skills</div><ul>${c.lvl_skills.map(s => `<li>${esc(s.how)}: <a href="#" data-skill="${esc(s.name)}">${esc(s.name)}</a> <span class="muted small">(${s.rush ? "Rush" : "Speed"})</span></li>`).join("")}</ul>` : "")
      + (!c.rewards_known ? `<div class="sub">Level rewards</div><p class="muted">Not in source data: the Duel Links Meta character record has no level rewards for ${esc(c.name)}.${c.base ? ` This is an Alt Style of <a href="#" data-char="${esc(c.base)}">${esc(c.base)}</a>, whose level rewards are listed on its own card.` : ""}</p>` : c.npc ? `<div class="sub">Level rewards</div><p class="muted">None: this is an NPC, not a playable character.</p>` : "")

function boxModal(id) {
  const b = D.boxes.find(x => x.id === id);
  if (!b) { openModal("<h2>Box not found</h2>"); return; }
  needCards(() => {
    const p = ["speed", "rush"].map(f => D.prio[f].findIndex(x => x.id === id) >= 0 ? `${f === "speed" ? "Speed" : "Rush"} priority #${D.prio[f].findIndex(x => x.id === id) + 1}` : "").filter(Boolean);
    openModal(`<h2>${esc(b.name)}</h2><div class="pills"><span class="pill">${esc(b.type)}</span><span class="pill">Released ${esc(b.release)}</span><span class="pill">${b.n} cards</span>${p.map(x => `<span class="pill gold">${x}</span>`).join("")}</div>`
      + `<div class="sub">UR cards (${b.ur.length})</div><div class="cardgrid sm">${b.ur.map(i => yc(i)).join("") || '<span class="muted">None in the data.</span>'}</div>`
      + `<p class="small muted">Only cards the guide tracks have pictures; the full box list is on <a href="${esc(b.url)}" target="_blank" rel="noopener">Duel Links Meta</a>.</p>`);

/* ---------- search ---------- */
let IDX = [];
function buildIndex() {
  IDX = [];
  NAV.forEach(([g, items]) => items.forEach(([id, l]) => IDX.push({t: l, k: "Page", go: "#" + id})));
  D.howto.sections.forEach(s => IDX.push({t: s.title, k: "How-to", go: "#" + s.id}));
  D.speed.forEach(d => IDX.push({t: d.name, k: "Speed deck", go: `#deck/speed/${d.slug}`, img: deckIcon(d)}));
  D.rush.forEach(d => IDX.push({t: d.name, k: "Rush deck", go: `#deck/rush/${d.slug}`, img: deckIcon(d)}));
  D.skills.forEach(s => IDX.push({t: s.name, k: "Skill", skill: s.name}));
  D.chars.forEach(c => IDX.push({t: c.name, k: "Character", char: c.name, img: c.img}));
  D.boxes.forEach(b => IDX.push({t: b.name, k: b.type || "Box", box: b.id, img: b.icon ? img(b.icon) : null}));
  if (C) for (const id of mainIds()) IDX.push({t: C[id].n, k: "Card" + (C[id].rush ? " (Rush)" : ""), card: id, img: img(id)});
  IDX.forEach(x => x.l = x.t.toLowerCase());
}
let sel = -1, hits = [];
function doSearch() {
  const q = $("#q").value.trim().toLowerCase();
  const box = $("#res");
  if (!q) { box.classList.remove("on"); return; }
  if (!C) needCards(doSearch);
  if (!R) needRef(doSearch);
  const words = q.split(/\s+/);
  hits = IDX.filter(x => words.every(w => x.l.includes(w))).sort((a, b) => (b.l.startsWith(q) - a.l.startsWith(q)) || (a.k === "Card") - (b.k === "Card") || a.t.length - b.t.length).slice(0, 40);
  sel = hits.length ? 0 : -1;
  box.innerHTML = hits.length ? hits.map((x, i) => `<div role="option" data-i="${i}" class="${i === sel ? "sel" : ""}">${x.img ? `<img src="${esc(x.img)}" alt="">` : ""}<span>${esc(x.t)}</span><i>${esc(x.k)}</i></div>`).join("") : `<div class="none"><span>Not in this guide's ${num(D.meta.counts.cards)} meta cards, decks, skills or pages. <a href="https://www.duellinksmeta.com/cards/" target="_blank" rel="noopener">Search the full Duel Links Meta card database.</a></span></div>`;
  box.classList.add("on");
}
function pick(x) {
  $("#res").classList.remove("on");
  $("#q").blur();
  $("#side").classList.remove("open");
  if (x.go) location.hash = x.go;
  else if (x.card) cardModal(x.card);
  else if (x.skill) skillModal(x.skill);
  else if (x.char) charModal(x.char);
  else if (x.box) boxModal(x.box);
}

/* ---------- router ---------- */
function route() {
  const h = decodeURIComponent(location.hash.replace(/^#/, "")) || "home";
  const [r, a, b] = h.split("/");
  const P = {home: pHome, about: pAbout, meta: () => pMeta("speed"), rush: () => pMeta("rush"), tiers: pTiers, staples: pStaples, cards: pCards, skills: pSkills,
    chars: pChars, boxes: pBoxes, banlist: pBan, events: pEvents, videos: pVideos, sources: pSources};
  let html;
  try {
    if (!R && ["skills", "chars"].includes(r)) { needRef(route); html = "<h1>Loading…</h1><p>Loading the skill and character data…</p>"; }
    else if (r === "deck") html = pDeck(a, b);
    else if (own(P, r)) html = P[r]();
    else if (own(HOW, r)) html = pHowto(r);
    else html = pNotFound();
  } catch (e) { html = `<h1>Something went wrong</h1><p>${esc(e.message)}</p>`; console.error(e); }
  const needs = ["staples", "banlist", "deck", "home", "boxes"].includes(r);
  if (needs && !C) { needCards(route); }
  $("#main").innerHTML = html + `<footer>${checkedLine()} Yu-Gi-Oh! Duel Links and all card art belong to Konami. Fan guide; not affiliated with Konami or Duel Links Meta.</footer>`;
  document.querySelectorAll("#nav a").forEach(x => x.classList.toggle("on", x.dataset.r === r || (r === "deck" && x.dataset.r === (a === "rush" ? "rush" : "meta"))));
  document.title = (r === "home" ? "" : ($("#main h1") ? $("#main h1").textContent + " | " : "")) + "Duel Links Field Guide";
}

/* ---------- events ---------- */
function bind() {
  document.addEventListener("click", e => {
    const t = e.target.closest("[data-card],[data-cardname],[data-skill],[data-char],[data-box],[data-mf],[data-list],[data-srcbox],[data-ban],[data-more],[data-smore],[data-yt],#mclose");
    if (!t) { if (e.target === $("#modal")) closeModal(); if (!e.target.closest(".search")) $("#res").classList.remove("on"); return; }
    if (t.id === "mclose") { closeModal(); return; }
    e.preventDefault();
    const ds = t.dataset;
    if (ds.card) cardModal(ds.card);
    else if (ds.cardname) needCards(() => { const id = Object.keys(C).find(k => C[k].n === ds.cardname); if (id) cardModal(id); });
    else if (ds.skill) skillModal(ds.skill);
    else if (ds.char) charModal(ds.char);
    else if (ds.box) boxModal(ds.box);
    else if (ds.mf) { metaFilter = ds.mf; route(); }
    else if (ds.ban) { banFmt = ds.ban; route(); }
    else if (ds.more) { cf.n += 120; route(); }
    else if (ds.smore) { sf.n += 90; route(); }
    else if (ds.list != null) { document.querySelectorAll("[data-list]").forEach(b => b.classList.toggle("on", b === t)); document.querySelectorAll(".dl").forEach(x => x.hidden = x.dataset.li !== ds.list); }
    else if (ds.srcbox) { const b = document.getElementById(ds.srcbox); if (b) { b.classList.toggle("on"); t.setAttribute("aria-expanded", b.classList.contains("on")); } }
    else if (ds.yt) { t.parentNode.innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(ds.yt)}?autoplay=1" title="YouTube video" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen loading="lazy"></iframe>`; }
  });
  document.addEventListener("keydown", e => {
    if (e.key === "Escape") { if ($("#modal").classList.contains("on")) closeModal(); $("#res").classList.remove("on"); $("#side").classList.remove("open"); }
    if (e.key === "/" && document.activeElement.tagName !== "INPUT") { e.preventDefault(); $("#q").focus(); }
    if ((e.key === "Enter" || e.key === " ") && e.target.matches("[role=button][data-skill],[role=button][data-char]")) { e.preventDefault(); e.target.click(); }
  });
  let deb;
  document.addEventListener("input", e => {
    const t = e.target;
    const re = (obj, k, cap) => { obj[k] = t.value; if (cap) obj.n = cap; clearTimeout(deb); deb = setTimeout(() => { const pos = t.selectionStart; route(); const n = document.querySelector(`[data-${t.dataset.cf != null ? "cf" : t.dataset.sf != null ? "sf" : "chf"}="${k}"]`); if (n && n.focus && n.type === "search") { n.focus(); try { n.setSelectionRange(pos, pos); } catch (x) {} } }, 160); };
    if (t.dataset.cf) re(cf, t.dataset.cf, 120);
    else if (t.dataset.sf) re(sf, t.dataset.sf, 90);
    else if (t.dataset.chf) re(chf, t.dataset.chf);
  });
  document.addEventListener("change", e => {
    const t = e.target;
    if (t.tagName !== "SELECT") return;
    if (t.dataset.cf) { cf[t.dataset.cf] = t.value; cf.n = 120; route(); }
    else if (t.dataset.sf) { sf[t.dataset.sf] = t.value; sf.n = 90; route(); }
    else if (t.dataset.chf) { chf[t.dataset.chf] = t.value; route(); }
    else if (t.dataset.bf) { bf[t.dataset.bf] = t.value; route(); }
  });
  const q = $("#q");
  q.addEventListener("input", doSearch);
  q.addEventListener("focus", () => { needRef(() => {}); needCards(() => {}); });
  q.addEventListener("keydown", e => {
    if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); if (!hits.length) return; sel = (sel + (e.key === "ArrowDown" ? 1 : hits.length - 1)) % hits.length;
      document.querySelectorAll("#res div[data-i]").forEach(d => d.classList.toggle("sel", +d.dataset.i === sel)); }
    if (e.key === "Enter" && sel >= 0 && hits[sel]) { e.preventDefault(); pick(hits[sel]); }
  });
  $("#res").addEventListener("click", e => { const d = e.target.closest("[data-i]"); if (d) pick(hits[+d.dataset.i]); });
  $("#menu").addEventListener("click", () => { const s = $("#side"); s.classList.toggle("open"); $("#menu").setAttribute("aria-expanded", s.classList.contains("open")); });
  $("#nav").addEventListener("click", () => $("#side").classList.remove("open"));
  window.addEventListener("hashchange", () => { closeModal(); route(); window.scrollTo(0, 0); });
}

if (!D) { $("#main").innerHTML = "<h1>Data missing</h1><p>data/dl.js did not load. Run <code>py build.py</code>.</p>"; }
else {
  $("#checked").innerHTML = checkedLine();
  drawNav(); buildIndex(); bind(); route();
  const later = () => { needRef(() => {}); needCards(() => {}); };
  if ("requestIdleCallback" in window) requestIdleCallback(later); else setTimeout(later, 1200);
  if ("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>
