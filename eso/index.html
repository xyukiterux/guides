function doSearch(q){const r=$('#res');q=norm(q).trim();if(!q){r.classList.remove('on');return;}
 const words=q.split(/\s+/);
 hits=IDX.map(e=>{const t=norm(e.t),x=norm(e.x);let sc=0;if(t===q)sc=100;else if(t.startsWith(q))sc=60;else if(t.includes(q))sc=40;else if(words.every(w=>t.includes(w)||x.includes(w)))sc=10;if(sc&&e.k==='Page')sc+=5;return [sc,e];}).filter(a=>a[0]>0).sort((a,b)=>b[0]-a[0]||a[1].t.length-b[1].t.length).slice(0,16).map(a=>a[1]);
 sel=0;r.innerHTML=hits.length?hits.map((e,i)=>`<div class="${i===0?'sel':''}" data-i="${i}" role="option">${e.img?`<img src="${esc(e.img)}" alt="" onerror="${IMGERR}">`:''}<span>${esc(e.t)}</span><i>${esc(e.k)}</i></div>`).join(''):'<div class="none">No match. Try a set, skill, dungeon or class name.</div>';r.classList.add('on');}
function goHit(e){if(!e)return;$('#res').classList.remove('on');$('#q').value='';$('#q').blur();closeMenu();
 if(e.set)openSet(e.set);else if(e.skill)openSkill(e.skill);else if(e.race)openRace(e.race);else if(e.place)openPlace(e.place);else if(e.zone)openZone(e.zone);else location.hash=e.go;}
$('#q').addEventListener('input',e=>doSearch(e.target.value));
$('#q').addEventListener('keydown',e=>{const r=$('#res');if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();if(!hits.length)return;sel=(sel+(e.key==='ArrowDown'?1:hits.length-1))%hits.length;[...r.children].forEach((c,i)=>c.classList.toggle('sel',i===sel));}else if(e.key==='Enter'){goHit(hits[sel]);}else if(e.key==='Escape'){r.classList.remove('on');}});
$('#res').addEventListener('mousedown',e=>{const d=e.target.closest('[data-i]');if(d){e.preventDefault();goHit(hits[+d.dataset.i]);}});
document.addEventListener('click',e=>{if(!e.target.closest('.search'))$('#res').classList.remove('on');});

// ---------- modal
let lastFocus=null;
function openModal(html,wide){lastFocus=document.activeElement;$('#mbody').innerHTML=html;$('#modal .box').classList.toggle('wide',!!wide);$('#modal').classList.add('on');$('#modal .box').scrollTop=0;$('#modal .x').focus();}
function closeModal(){if(!$('#modal').classList.contains('on'))return;$('#modal').classList.remove('on');$('#mbody').innerHTML='';if(lastFocus&&lastFocus.focus)lastFocus.focus();}
function failed(err){openModal(`<p class="note warn">Could not load this card: ${esc(err.message)}.</p>`);}
function openSet(sl){needSets().then(S=>{const s=S[sl];openModal(s?setCard(s):'<p>Set not found.</p>');}).catch(failed);}
function openSkill(sl,morph){needSkills().then(S=>{const s=S[sl];openModal(s?skillCard(s,morph):'<p>Skill not found.</p>');}).catch(failed);}
function openRace(sl){const r=RACE[sl];if(!r)return;raceCard(r).then(h=>openModal(h)).catch(failed);}
function openPlace(sl){const p=PL[sl];if(!p)return;placeCard(p).then(h=>openModal(h)).catch(failed);}
function openZone(sl){const z=ZO[sl];if(!z)return;zoneCard(z).then(h=>openModal(h)).catch(failed);}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal'||e.target.closest('.x'))closeModal();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();closeMenu();}
 if(e.key==='Tab'&&$('#modal').classList.contains('on')){const f=[...$('#modal .box').querySelectorAll('a,button,summary,input')];if(!f.length)return;const a=f[0],z=f[f.length-1];if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus();}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus();}}});
function playVideo(id,title){openModal(`<h3 style="margin-right:34px">${esc(title)}</h3><div style="position:relative;aspect-ratio:16/9;border-radius:4px;overflow:hidden;background:#000"><iframe src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(id)}?autoplay=1&rel=0" title="${esc(title)}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen style="position:absolute;inset:0;width:100%;height:100%;border:0"></iframe></div><p class="small"><a href="https://www.youtube.com/watch?v=${encodeURIComponent(id)}" target="_blank" rel="noopener">Open on YouTube</a> <span class="muted">(needs internet)</span></p>`,true);}

// ---------- clicks, menu, routing
function closeMenu(){$('#side').classList.remove('open');$('#menuBtn').setAttribute('aria-expanded','false');}
document.addEventListener('click',e=>{
 const t=e.target.closest('[data-set],[data-skill],[data-race],[data-place],[data-zone],[data-vid]');
 if(t&&!t.closest('.tabs')){e.preventDefault();const d=t.dataset;
  if(d.set)openSet(d.set);else if(d.skill)openSkill(d.skill,d.morph);else if(d.race)openRace(d.race);else if(d.place)openPlace(d.place);else if(d.zone)openZone(d.zone);else if(d.vid)playVideo(d.vid,d.title);return;}
 const b=e.target.closest('.tabs[data-set] button');if(b){const set=b.parentNode.dataset.set,val=b.dataset.v;
  if(set==='BROLE')BROLE=val;else if(set==='BCLASS')BCLASS=val;else if(set==='STYPE')STYPE=val;else if(set==='SWEIGHT')SWEIGHT=val;else if(set==='DSEC')DSEC=val;else if(set==='CPT')CPT=val;render(false);}
});
let ftimer=null;
main.addEventListener('input',e=>{const id=e.target.id;if(id!=='sq'&&id!=='skq')return;const v=e.target.value;if(id==='sq')SQ=v;else SKQ=v;clearTimeout(ftimer);
 ftimer=setTimeout(()=>{const pos=e.target.selectionStart;render(false).then(()=>{const n=document.getElementById(id);if(n){n.focus();n.setSelectionRange(pos,pos);}});},120);});
$('#menuBtn').addEventListener('click',()=>{const o=$('#side').classList.toggle('open');$('#menuBtn').setAttribute('aria-expanded',String(o));if(o)$('#q').focus();});
$('#nav').addEventListener('click',e=>{if(e.target.closest('a'))closeMenu();});

const OPEN=dict([["set",openSet],["skill",openSkill]]);
function render(top=true){let h='home';try{h=decodeURIComponent(location.hash.slice(1))||'home';}catch(err){h='home';}
 const [r,arg]=h.split('/');
 if(OPEN[r]){const page=r==='set'?'sets':'skills';return Promise.resolve(R[page]()).then(html=>{main.innerHTML=html+foot();$('#nav').innerHTML=navHtml(page);OPEN[r](arg);document.title=(r==='set'?((SETI[arg]||[])[0]||'Set'):((SKI[arg]||[])[0]||'Skill'))+' · ESO Field Guide';});}
 const own=typeof R[r]==='function';const f=own?R[r]:(()=>notFound(h));const cur=own?(r==='class'||r==='line'?'classes':r):'';
 return Promise.resolve().then(()=>f(arg)).then(html=>{main.innerHTML=html+foot();
  main.querySelectorAll('.tablewrap').forEach(w=>{if(w.scrollWidth>w.clientWidth+4)w.classList.add('scroll');});})
 .catch(err=>{main.innerHTML=`<p class="note warn">This section could not be drawn: ${esc(err.message)}. <a href="#home">Home</a></p>`;console.error(err);})
 .then(()=>{$('#nav').innerHTML=navHtml(cur);if(top)window.scrollTo(0,0);
  document.title=pageTitle(own,r,arg)+'ESO Field Guide';});}
const TITLES=dict(NAV.flatMap(([g,l])=>l.map(([id,t])=>[id,t])));
function pageTitle(own,r,arg){if(!own)return 'Page not found · ';if(r==='home')return '';
 const ca=String(arg||'').toLowerCase(),t=r==='class'?(CLS[ca]?CLS[ca].name:'Class not found'):r==='line'&&LN[arg]?LN[arg].name+' skill line':r==='builds'?'Builds: '+BROLE:SEC[r]?SEC[r].title:TITLES[r]||'';return t?t+' · ':'';}
function notFound(h){const near=D.howto.sections.filter(s=>h.length>=8&&s.id.startsWith(h.slice(0,8)));
 return `<div class="sec"><h2><span class="orn"></span>Page not found</h2></div><p>There is no page called "${esc(h)}" in this guide.${near.length?` Did you mean ${near.map(s=>`<a href="#${esc(s.id)}">${esc(s.title)}</a>`).join(' or ')}?`:''} Pick one from the menu, or go to <a href="#home">Home</a>, <a href="#start">Start here</a> or the <a href="#howto-return">returning-player checklist</a>.</p>`;}
function foot(){return `<footer>${checkedHtml}<br>Fan-made guide, not affiliated with ZeniMax Online Studios or Bethesda · <a href="#sources">sources and method</a></footer>`;}
window.addEventListener('hashchange',()=>{closeModal();render();});
render();
if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(()=>{});}
})();
</script>
</body>
</html>
